<meta name="description" content="หมีจด MheeJod — แอปจดรายรับรายจ่าย พิมพ์ พูด หรือถ่ายสลิปก็จดได้">

<style>
/* ============================ ฟอนต์และไอคอน ============================ */
@font-face{
  font-family:"FC Iconic";src:url("font/FCIconic-Light.ttf") format("truetype");
  font-weight:300;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"FC Iconic";src:url("font/FCIconic-Regular.ttf") format("truetype");
  font-weight:400 500;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"FC Iconic";src:url("font/FCIconic-Bold.ttf") format("truetype");
  font-weight:600 800;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"FA Light";src:url("font/fa-light-300.woff") format("woff");
  font-weight:300;font-style:normal;font-display:block;
}

/* ไอคอนทั้งเว็บใช้ Font Awesome Light */
.fa{
  font-family:"FA Light";font-weight:300;font-style:normal;line-height:1;
  display:inline-block;text-rendering:auto;-webkit-font-smoothing:antialiased
}
.fa-home::before{content:"\f015"}
.fa-list::before{content:"\f03a"}
.fa-receipt::before{content:"\f543"}
.fa-chart-pie::before{content:"\f200"}

.fa-keyboard::before{content:"\f11c"}

.fa-chev-r::before{content:"\f054"}

.fa-store::before{content:"\f54e"}
.fa-mobile::before{content:"\f3cd"}
.fa-boxes::before{content:"\f468"}

.fa-clock::before{content:"\f017"}
.fa-camera::before{content:"\f030"}
.fa-rotate::before{content:"\f2f1"}
.fa-signout::before{content:"\f2f5"}
.fa-download::before{content:"\f019"}
.fa-arrow-up::before{content:"\f062"}
.fa-arrow-down::before{content:"\f063"}
.fa-ellipsis::before{content:"\f141"}
.fa-filter::before{content:"\f0b0"}
.fa-eye::before{content:"\f06e"}
.fa-rightleft::before{content:"\f362"}

/* ===================================================================
   หมีจด MheeJod — Design system v2
   โทนเดิม: ครีม / น้ำผึ้ง / น้ำตาลหมี  •  มือถือมาก่อน  •  ใช้มือเดียวได้
   =================================================================== */
:root{
  /* สี */
  --honey:#F2B23E; --honey-l:#FFCB63; --honey-d:#E09A1E;
  --bear:#8B5E3C; --bear-d:#6B462B; --bear-l:#A87A55;
  --cream:#FFF9F2; --cream-2:#FDEFE0;
  --card:#FFFFFF; --card-2:#FFFDFA;
  --ink:#2C2622; --ink-2:#6E645C; --ink-3:#A2968C;
  --line:#F0E5D8; --line-2:#E6D8C6;
  --in:#2FA36B; --in-l:#5CC993; --out:#E3556F; --out-l:#F27D92; --warn:#E8952F;

  /* เงา (นุ่ม ซ้อนสองชั้นให้ดูลอย) */
  --sh-sm:0 1px 2px rgba(122,80,45,.06), 0 2px 8px rgba(122,80,45,.05);
  --sh:0 2px 4px rgba(122,80,45,.05), 0 8px 24px rgba(122,80,45,.09);
  --sh-lg:0 6px 12px rgba(122,80,45,.07), 0 20px 48px rgba(122,80,45,.16);
  --sh-honey:0 6px 18px rgba(242,178,62,.38);

  /* รูปทรง */
  --r-xs:12px; --r-sm:16px; --r:20px; --r-lg:26px; --r-xl:32px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  --tab-h:70px; --top-h:62px; --wrap:680px;

  /* จังหวะการเคลื่อนไหว */
  --ease:cubic-bezier(.22,.68,.32,1);
  --spring:cubic-bezier(.22,1.2,.36,1);
}
:root[data-theme="dark"]{
  --cream:#151210; --cream-2:#1C1714; --card:#221D19; --card-2:#282019;
  --ink:#F7F0E8; --ink-2:#C6B9AC; --ink-3:#8E8175;
  --line:#332920; --line-2:#3E3227;
  --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh:0 4px 18px rgba(0,0,0,.45);
  --sh-lg:0 12px 40px rgba(0,0,0,.6); --sh-honey:0 6px 18px rgba(242,178,62,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#151210; --cream-2:#1C1714; --card:#221D19; --card-2:#282019;
    --ink:#F7F0E8; --ink-2:#C6B9AC; --ink-3:#8E8175;
    --line:#332920; --line-2:#3E3227;
    --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh:0 4px 18px rgba(0,0,0,.45);
    --sh-lg:0 12px 40px rgba(0,0,0,.6); --sh-honey:0 6px 18px rgba(242,178,62,.28);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(760px 420px at 12% -8%, rgba(242,178,62,.16), transparent 62%),
    radial-gradient(680px 380px at 92% 4%, rgba(139,94,60,.10), transparent 60%),
    var(--cream);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"FC Iconic","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-.005em;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:var(--bear)}
::-webkit-scrollbar{width:0;height:0}

/* ============================ อนิเมชันกลาง ============================ */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.9) translateY(6px)}60%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes wobble{0%,100%{transform:rotate(-9deg) scale(1)}50%{transform:rotate(9deg) scale(1.1)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(227,85,111,.55)}70%{box-shadow:0 0 0 14px rgba(227,85,111,0)}100%{box-shadow:0 0 0 0 rgba(227,85,111,0)}}
@keyframes shimmer{0%{background-position:-450px 0}100%{background-position:450px 0}}
@keyframes drawArc{from{stroke-dashoffset:var(--arc-len)}}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================ ปุ่ม ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:var(--r-sm);font-weight:650;font-size:15px;
  transition:transform .16s var(--spring), box-shadow .2s var(--ease), filter .2s;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.965)}
.btn-primary{background:linear-gradient(135deg,var(--honey-l),var(--honey-d));color:#3A2A10;box-shadow:var(--sh-honey)}
.btn-primary:active{box-shadow:0 3px 10px rgba(242,178,62,.34)}
.btn-dark{background:linear-gradient(135deg,var(--bear-l),var(--bear-d));color:#fff;box-shadow:var(--sh)}
.btn-soft{background:var(--cream-2);color:var(--ink);box-shadow:var(--sh-sm)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-danger{background:rgba(227,85,111,.12);color:var(--out)}
.btn-block{width:100%}
.btn-sm{padding:9px 15px;border-radius:var(--r-xs);font-size:13.5px}
.icon-btn{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  font-size:19px;color:var(--ink-2);transition:background .2s,transform .16s var(--spring)
}
.icon-btn:active{background:var(--line);transform:scale(.9)}
.pill{
  padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-weight:650;font-size:13.5px;box-shadow:var(--sh-sm);transition:transform .16s var(--spring)
}
.pill:active{transform:scale(.95)}

/* ============================ ฟอร์ม ============================ */
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:7px;font-weight:650;letter-spacing:.01em}
.field input,.field select,.field textarea{
  width:100%;padding:14px 15px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--honey);box-shadow:0 0 0 4px rgba(242,178,62,.16)
}
.field input:disabled{background:var(--cream-2);color:var(--ink-3)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* แถบสลับ (มีแถบเลื่อนตามปุ่มที่เลือก) */
.seg{
  position:relative;display:flex;background:var(--cream-2);border-radius:var(--r-sm);
  padding:5px;margin-bottom:18px;box-shadow:inset 0 1px 3px rgba(122,80,45,.07);
  --seg-i:0; --seg-n:2;
}
.seg::before{
  content:"";position:absolute;top:5px;bottom:5px;left:5px;
  width:calc((100% - 10px)/var(--seg-n));
  border-radius:calc(var(--r-sm) - 5px);background:var(--card);box-shadow:var(--sh-sm);
  transform:translateX(calc(var(--seg-i) * 100%));
  transition:transform .38s var(--spring);
}
.seg-btn{
  position:relative;z-index:1;flex:1;padding:11px 4px;border-radius:calc(var(--r-sm) - 5px);
  font-weight:650;font-size:14px;color:var(--ink-3);transition:color .25s
}
.seg-btn.active{color:var(--ink)}

/* ============================ หน้าเข้าสู่ระบบ ============================ */
.auth-screen{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px calc(24px + var(--safe-b));animation:fadeIn .4s var(--ease)
}
.auth-card{
  width:100%;max-width:420px;background:var(--card);border-radius:var(--r-xl);
  padding:30px 24px;box-shadow:var(--sh-lg);border:1px solid var(--line);
  animation:popIn .5s var(--spring)
}
.auth-logo{font-size:60px;text-align:center;line-height:1;animation:bob 3.4s ease-in-out infinite}
.auth-title{text-align:center;font-size:29px;margin:10px 0 2px}
.auth-title span{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.32em;font-weight:700;margin-top:4px}
.auth-sub{text-align:center;color:var(--ink-2);font-size:14px;margin:10px 0 22px}
.auth-note{font-size:13px;color:var(--ink-2);text-align:center;margin:12px 0 0;min-height:20px}
.auth-note.err{color:var(--out)} .auth-note.ok{color:var(--in)}
.auth-footer{color:var(--ink-3);font-size:12px;margin-top:20px}
.auth-form .btn{margin-top:8px}

/* ============================ โครงแอป ============================ */
.app{
  min-height:100dvh;
  padding-top:calc(var(--top-h) + var(--safe-t));
  padding-bottom:calc(var(--tab-h) + var(--safe-b) + 14px);
}
body.chat-open .app{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 136px)}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  height:calc(var(--top-h) + var(--safe-t));padding-top:var(--safe-t);
  background:color-mix(in srgb,var(--cream) 82%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
}
.topbar-inner{
  max-width:var(--wrap);height:var(--top-h);margin:0 auto;padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.topbar-left{display:flex;align-items:center;gap:11px;min-width:0}
.topbar-logo{font-size:27px;animation:floaty 4s ease-in-out infinite}
.topbar-title{font-weight:700;font-size:17px;line-height:1.2}
.topbar-sub{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.topbar-right{display:flex;align-items:center;gap:1px}

.view{padding:16px 14px 8px;max-width:var(--wrap);margin:0 auto}
/* ลูกของ view โผล่ขึ้นมาไล่กันทีละชิ้น */
.view>*{animation:fadeUp .42s var(--ease) both}
.view>*:nth-child(1){animation-delay:.02s}
.view>*:nth-child(2){animation-delay:.06s}
.view>*:nth-child(3){animation-delay:.1s}
.view>*:nth-child(4){animation-delay:.14s}
.view>*:nth-child(5){animation-delay:.18s}
.view>*:nth-child(n+6){animation-delay:.22s}

/* แถบล่าง */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);
}
.tabbar-inner{
  max-width:var(--wrap);height:var(--tab-h);margin:0 auto;padding:0 6px;
  display:flex;align-items:center;justify-content:space-between
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);padding:8px 0 6px;position:relative;transition:color .25s
}
.tab span{font-size:21px;line-height:1;transition:transform .32s var(--spring)}
.tab em{font-style:normal;font-size:10.5px;font-weight:650}
.tab::after{
  content:"";position:absolute;top:2px;width:5px;height:5px;border-radius:99px;
  background:var(--honey-d);opacity:0;transform:scale(.4);transition:.3s var(--spring)
}
.tab.active{color:var(--bear)}
.tab.active span{transform:translateY(-2px) scale(1.16)}
.tab.active::after{opacity:1;transform:none}
:root[data-theme="dark"] .tab.active{color:var(--honey)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.active{color:var(--honey)}}
.fab{
  width:60px;height:60px;border-radius:24px;margin-top:-28px;flex:none;
  font-size:30px;font-weight:300;color:#3A2A10;
  background:linear-gradient(135deg,var(--honey-l),var(--honey-d));
  box-shadow:0 10px 26px rgba(242,178,62,.5);
  display:grid;place-items:center;transition:transform .2s var(--spring),box-shadow .2s
}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab.active{transform:rotate(45deg)}

/* ============================ การ์ด ============================ */
.card{
  background:var(--card);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);margin-bottom:14px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  transition:box-shadow .25s,transform .25s var(--ease)
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.card-head h3{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head .link{font-size:13px;color:var(--ink-2);font-weight:650;transition:color .2s}
.card-head .link:active{color:var(--honey-d)}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.empty{text-align:center;color:var(--ink-3);padding:28px 12px}
.empty .big{font-size:42px;display:block;margin-bottom:10px;animation:bob 3.4s ease-in-out infinite}

/* การ์ดยอดคงเหลือ */
.balance{
  position:relative;overflow:hidden;color:#FFF6E9;border-radius:var(--r-lg);padding:22px;
  background:linear-gradient(145deg,var(--bear-l),var(--bear-d) 70%);
  box-shadow:var(--sh-lg);margin-bottom:14px
}
.balance::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 200px at 88% -20%, rgba(255,203,99,.34), transparent 70%);
}
.balance::after{
  content:"🍯";position:absolute;right:-8px;bottom:-18px;font-size:96px;opacity:.14;transform:rotate(-12deg)
}
.balance>*{position:relative}
.balance .lbl{font-size:12.5px;opacity:.82;letter-spacing:.02em}
.balance .amt{font-size:clamp(28px,9vw,38px);font-weight:800;letter-spacing:-.03em;margin:4px 0 16px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.balance .box b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balance .grid{display:flex;gap:10px}
.balance .box{
  flex:1;background:rgba(255,255,255,.15);border-radius:var(--r-xs);padding:11px 13px;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.13)
}
.balance .box b{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.balance .box.in b{color:#B9F5D2} .balance .box.out b{color:#FFC7D2}

/* ============================ รายการ ============================ */
.tx{
  display:flex;align-items:center;gap:13px;padding:12px 4px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  transition:background .2s,transform .18s var(--ease);border-radius:12px
}
.tx:last-child{border-bottom:none}
.tx:active{background:var(--cream-2);transform:scale(.99)}
.tx-ico{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  font-size:20px;flex:none;transition:transform .25s var(--spring)
}
.tx:active .tx-ico{transform:scale(1.08) rotate(-6deg)}
.tx-main{flex:1;min-width:0;overflow:hidden}
.tx-title{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:750;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;margin-left:auto}
.tx-amt.in{color:var(--in)} .tx-amt.out{color:var(--out)}
.day-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:16px 4px 6px;font-size:12.5px;color:var(--ink-3);font-weight:650
}

/* ============================ งบประมาณ ============================ */
.bud{margin-bottom:16px}
.bud:last-child{margin-bottom:0}
.bud-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:7px;gap:8px}
.bud-top>span:last-child{white-space:nowrap;flex:none}
.bud-name{display:flex;align-items:center;gap:8px;font-weight:650;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{height:10px;border-radius:999px;background:var(--cream-2);overflow:hidden;position:relative}
.bar>i{
  display:block;height:100%;border-radius:999px;
  transition:width .9s var(--ease);position:relative;overflow:hidden
}
.bar>i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.45) 50%,transparent 80%);
  background-size:450px 100%;animation:shimmer 2.6s infinite linear
}

/* ------------------------------ วันที่/ตัวเลข ------------------------------ */
MJ.TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
MJ.TH_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
MJ.TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

MJ.fmtMoney = (n, digits) => {
  const v = Number(n || 0);
  const d = digits === undefined ? (Math.abs(v) % 1 === 0 ? 0 : 2) : digits;
  return v.toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
};
MJ.fmtBaht = (n, digits) => '฿' + MJ.fmtMoney(n, digits);
MJ.monthLabel = (d) => `${MJ.TH_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
MJ.monthLabelFull = (d) => `${MJ.TH_MONTHS_FULL[d.getMonth()]} ${d.getFullYear() + 543}`;

MJ.startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0);
MJ.endOfMonth   = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
MJ.isoDate = (d) => {
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
MJ.isoLocal = (d) => `${MJ.isoDate(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
MJ.sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

MJ.dayLabel = (dateStr) => {
  const d = new Date(dateStr), now = new Date();
  const yst = new Date(now); yst.setDate(now.getDate() - 1);
  if (MJ.sameDay(d, now)) return 'วันนี้';
  if (MJ.sameDay(d, yst)) return 'เมื่อวาน';
  return `${MJ.TH_DAYS[d.getDay()]} ${d.getDate()} ${MJ.TH_MONTHS[d.getMonth()]}`;
};
MJ.timeLabel = (dateStr) => {
  const d = new Date(dateStr);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
};

/* ------------------------------ DOM ------------------------------ */
MJ.$  = (sel, root) => (root || document).querySelector(sel);
MJ.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
/**
 * แก้ "สระลอย" — OCR มักแทรกช่องว่างหน้าสระ/วรรณยุกต์ ทำให้ตัวไทยแยกออกจากพยัญชนะ
 * เช่น "ล ิสซ ิ่ง" -> "ลิสซิ่ง"
 */
MJ.fixThai = (s) => String(s == null ? '' : s)
  .replace(/[\s\u200b]+([\u0E31\u0E33-\u0E3A\u0E47-\u0E4E])/g, '$1')
  .replace(/^[\u0E31\u0E33-\u0E3A\u0E47-\u0E4E]+/, '')
  .replace(/\s{2,}/g, ' ')
  .trim();

MJ.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
MJ.hex2rgba = (hex, a) => {
  const h = String(hex || '#F2B23E').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

/* ---------------------- แถบสลับที่มีตัวชี้เลื่อนตาม ---------------------- */
MJ.segInit = (segEl, onPick) => {
  if (!segEl) return;
  const btns = MJ.$$('.seg-btn', segEl);
  segEl.style.setProperty('--seg-n', btns.length);
  const move = (i) => segEl.style.setProperty('--seg-i', i);
  btns.forEach((b, i) => {
    if (b.classList.contains('active')) move(i);
    b.addEventListener('click', () => {
      btns.forEach((x) => x.classList.toggle('active', x === b));
      move(i);
      MJ.buzz(8);
      if (onPick) onPick(b, i);
    });
  });
};

/* ---------------------- ตัวเลขวิ่งขึ้น (ใช้กับยอดเงิน) ---------------------- */
MJ.countUp = (el, to, opts) => {
  if (!el) return;
  const o = Object.assign({ ms: 850, prefix: '฿', digits: undefined }, opts || {});
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = o.prefix + MJ.fmtMoney(to, o.digits); return;
  }
  const from = 0, start = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - start) / o.ms);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = o.prefix + MJ.fmtMoney(from + (to - from) * eased, t < 1 ? 0 : o.digits);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

/* ------------------------------ Feedback ------------------------------ */
let toastTimer;
MJ.toast = (msg, kind) => {
  const el = MJ.$('#toast');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
};
MJ.loading = (on, text) => {
  const el = MJ.$('#loading');
  MJ.$('#loadingText').textContent = text || 'กำลังโหลด…';
  el.classList.toggle('hidden', !on);
};
MJ.buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms || 12); } catch (e) {} };

/* ------------------------------ Bottom sheet ------------------------------ */
MJ.sheet = {
  open(title, html, onMount) {
    MJ.$('#sheetTitle').textContent = title;
    MJ.$('#sheetBody').innerHTML = html;
    MJ.$('#sheet').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if (onMount) onMount(MJ.$('#sheetBody'));
  },
  close() {
    MJ.$('#sheet').classList.add('hidden');
    MJ.$('#sheetBody').innerHTML = '';
    document.body.style.overflow = '';
  },
};

MJ.confirm = (title, message, okLabel) => new Promise((resolve) => {
  MJ.sheet.open(title, `
    <p class="muted mb">${MJ.esc(message)}</p>
    <button class="btn btn-danger btn-block" id="cfmOk">${MJ.esc(okLabel || 'ยืนยัน')}</button>
    <button class="btn btn-ghost btn-block" id="cfmNo">ยกเลิก</button>`, (body) => {
    MJ.$('#cfmOk', body).onclick = () => { MJ.sheet.close(); resolve(true); };
    MJ.$('#cfmNo', body).onclick = () => { MJ.sheet.close(); resolve(false); };
  });
});

/* ---------------------- ตัวเลือกเดือน (แผงปฏิทินย่อ) ---------------------- */
MJ.openMonthPicker = (onPick) => {
  let year = MJ.state.month.getFullYear();
  const now = new Date();

  const draw = (body) => {
    const grid = MJ.TH_MONTHS.map((m, i) => {
      const isSel = i === MJ.state.month.getMonth() && year === MJ.state.month.getFullYear();
      const isNow = i === now.getMonth() && year === now.getFullYear();
      const future = new Date(year, i, 1) > new Date(now.getFullYear(), now.getMonth(), 1);
      return `<button class="mp-cell ${isSel ? 'sel' : ''} ${isNow ? 'now' : ''}" data-m="${i}" ${future ? 'disabled' : ''}>
        ${m.replace('.', '')}</button>`;
    }).join('');
    body.innerHTML = `
      <div class="mp-year">
        <button class="icon-btn" data-y="-1"><i class="fa fa-chev-l"></i></button>
        <b>${year + 543}</b>
        <button class="icon-btn" data-y="1" ${year >= now.getFullYear() ? 'disabled style="opacity:.3"' : ''}>
          <i class="fa fa-chev-r"></i></button>
      </div>
      <div class="mp-grid">${grid}</div>
      <button class="btn btn-soft btn-block mt" id="mpNow"><i class="fa fa-calendar"></i> เดือนนี้</button>`;

    MJ.$$('[data-y]', body).forEach((b) => b.onclick = () => {
      const next = year + Number(b.dataset.y);
      if (next > now.getFullYear()) return;
      year = next; draw(body);
    });
    MJ.$$('.mp-cell', body).forEach((b) => b.onclick = () => {
      if (b.disabled) return;
      MJ.sheet.close();
      onPick(new Date(year, Number(b.dataset.m), 1));
    });
    MJ.$('#mpNow', body).onclick = () => { MJ.sheet.close(); onPick(new Date()); };
  };

  MJ.sheet.open('เลือกเดือน', '<div id="mpBody"></div>', (body) => draw(MJ.$('#mpBody', body)));
};

/* ------------------------------ Router ------------------------------ */
MJ.routes = {};
MJ.go = (route, params) => {
  MJ.state.route = route;
  MJ.state.routeParams = params || {};
  location.hash = '#' + route;
  MJ.render();
};
MJ.render = () => {
  const r = MJ.routes[MJ.state.route] || MJ.routes.dashboard;
  const view = MJ.$('#view');
  view.innerHTML = '';
  const titles = {
    dashboard: ['ภาพรวม', 'สรุปเงินเดือนนี้'],
    transactions: ['รายการ', 'ประวัติทั้งหมด'],
    add: ['จดรายการ', 'พิมพ์ พูด หรือถ่ายสลิป'],
    analysis: ['วิเคราะห์', 'เงินหายไปไหนบ้าง'],
    budget: ['หมวดหมู่และงบ', 'ตั้งงบรายเดือน'],
    settings: ['ตั้งค่า', MJ.state.profile?.display_name || ''],
  };
  const t = titles[MJ.state.route] || ['หมีจด', ''];
  MJ.$('#topTitle').textContent = t[0];
  MJ.$('#topSub').textContent = t[1];
  MJ.$$('.tab, .fab').forEach((el) => el.classList.toggle('active', el.dataset.route === MJ.state.route));
  // หน้าแชทมีแถบพิมพ์ตรึงล่าง ต้องเผื่อที่ว่างให้เนื้อหา
  const inChat = MJ.state.route === 'add' && MJ.add?.tab === 'chat';
  document.body.classList.toggle('chat-open', inChat);
  const dock = MJ.$('#composerDock');
  if (dock && !inChat) { dock.classList.add('hidden'); dock.innerHTML = ''; }
  r(view);
  if (window.scrollTo) window.scrollTo({ top: 0 });
};

</script>
<script>
/* ===== 10-auth.js ===== */
/* ===================================================================
   10-auth.js — สมัคร / เข้าสู่ระบบ / ลิงก์เวทมนตร์
   =================================================================== */
MJ.auth = {
  mode: 'signin',

  mount() {
    const note = MJ.$('#authNote');

    MJ.segInit(MJ.$('#authTabs'), (btn) => {
      {
        MJ.auth.mode = btn.dataset.mode;
        const up = MJ.auth.mode === 'signup';
        MJ.$('#nameField').hidden = !up;
        MJ.$('#authSubmit').textContent = up ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
        MJ.$('#authPassword').autocomplete = up ? 'new-password' : 'current-password';
        note.textContent = '';
      };
    });

    MJ.$('#authForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = MJ.$('#authEmail').value.trim();
      const password = MJ.$('#authPassword').value;
      const name = MJ.$('#authName').value.trim();
      note.className = 'auth-note';
      note.textContent = '';
      MJ.loading(true, MJ.auth.mode === 'signup' ? 'กำลังสมัคร…' : 'กำลังเข้าสู่ระบบ…');
      try {
        if (MJ.auth.mode === 'signup') {
          const { data, error } = await MJ.sb.auth.signUp({
            email, password,
            options: { data: { display_name: name || email.split('@')[0] } },
          });
          if (error) throw error;
          if (!data.session) {
            note.className = 'auth-note ok';
            note.textContent = 'สมัครเรียบร้อย! เช็กอีเมลเพื่อยืนยันก่อนเข้าใช้งานนะ 🐻';
          }
        } else {
          const { error } = await MJ.sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
      } catch (err) {
        note.className = 'auth-note err';
        note.textContent = MJ.auth.thaiError(err);
      } finally {
        MJ.loading(false);
      }
    };

    MJ.$('#authMagic').onclick = async () => {
      const email = MJ.$('#authEmail').value.trim();
      if (!email) { note.className = 'auth-note err'; note.textContent = 'ใส่อีเมลก่อนนะ'; return; }
      MJ.loading(true, 'กำลังส่งลิงก์…');
      const { error } = await MJ.sb.auth.signInWithOtp({
        email, options: { emailRedirectTo: location.href.split('#')[0] },
      });
      MJ.loading(false);
      note.className = 'auth-note ' + (error ? 'err' : 'ok');
      note.textContent = error ? MJ.auth.thaiError(error) : 'ส่งลิงก์ไปที่อีเมลแล้ว เปิดจากมือถือเครื่องนี้ได้เลย ✉️';
    };
  },

  thaiError(err) {
    const m = String(err?.message || err || '');
    if (/Invalid login credentials/i.test(m)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
    if (/already registered|User already/i.test(m)) return 'อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบดู';
    if (/Email not confirmed/i.test(m)) return 'ยังไม่ได้ยืนยันอีเมล เช็กกล่องจดหมายก่อนนะ';
    if (/Password should be at least/i.test(m)) return 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร';
    if (/rate limit|too many/i.test(m)) return 'ลองบ่อยเกินไป พักสักครู่แล้วลองใหม่';
    if (/Failed to fetch|network/i.test(m)) return 'เชื่อมต่อไม่ได้ เช็กอินเทอร์เน็ตก่อนนะ';
    return m || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
  },

  async signOut() {
    if (!(await MJ.confirm('ออกจากระบบ', 'ต้องการออกจากระบบใช่ไหม?', 'ออกจากระบบ'))) return;
    await MJ.sb.auth.signOut();
    location.reload();
  },
};

</script>
<script>
/* ===== 20-data.js ===== */
/* ===================================================================
   20-data.js — ชั้นข้อมูล: โหลด/บันทึก/ลบ + สรุปยอด + อัปโหลดสลิป
   =================================================================== */
MJ.data = {
  /* ---------------------- โหลดข้อมูลทั้งหมดของเดือน ---------------------- */
  async loadAll() {
    const uid = MJ.state.user.id;

    const [profile, cats] = await Promise.all([
      MJ.sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      MJ.sb.from('categories').select('*').eq('user_id', uid).eq('is_archived', false)
        .order('type').order('sort_order').order('name'),
    ]);

    if (profile.data) MJ.state.profile = profile.data;
    else {
      // เผื่อ trigger ไม่ทำงาน (เช่นผู้ใช้ที่มีอยู่ก่อน) สร้าง profile ให้เอง
      const { data } = await MJ.sb.from('profiles')
        .insert({ id: uid, email: MJ.state.user.email, display_name: MJ.state.user.email.split('@')[0] })
        .select().maybeSingle();
      MJ.state.profile = data || { id: uid, display_name: 'หมีน้อย', theme: 'auto' };
    }
    MJ.state.categories = cats.data || [];

    await Promise.all([this.loadMonth(), this.loadRecurring()]);
  },

  async loadMonth() {
    const from = MJ.startOfMonth(MJ.state.month), to = MJ.endOfMonth(MJ.state.month);
    const { data, error } = await MJ.sb.from('transactions')
      .select('*')
      .gte('transaction_date', from.toISOString())
      .lte('transaction_date', to.toISOString())
      .order('transaction_date', { ascending: false })
      .order('created_at', { ascending: false });
    if (error) { MJ.toast('โหลดรายการไม่สำเร็จ', 'err'); return; }
    MJ.state.transactions = data || [];
  },

  async loadRecurring() {
    const { data } = await MJ.sb.from('recurring_transactions').select('*').order('next_run_date');
    MJ.state.recurring = data || [];
  },

  /* ---------------------- ประมวลผลรายการประจำ ---------------------- */
  async runRecurring() {
    try {
      const { data, error } = await MJ.sb.rpc('process_recurring', { p_user: MJ.state.user.id });
      if (error) return 0;
      if (data > 0) {
        await this.loadMonth();
        MJ.toast(`บันทึกรายการประจำให้แล้ว ${data} รายการ 🐻`, 'ok');
      }
      return data || 0;
    } catch (e) { return 0; }
  },

  /* ---------------------- CRUD transactions ---------------------- */
  async addTransaction(tx) {
    const payload = {
      user_id: MJ.state.user.id,
      category_id: tx.category_id || null,
      amount: Number(tx.amount),
      type: tx.type,
      note: tx.note ? MJ.fixThai(tx.note) : null,
      transaction_date: (tx.transaction_date instanceof Date ? tx.transaction_date : new Date(tx.transaction_date || Date.now())).toISOString(),
      receipt_image_url: tx.receipt_image_url || null,
      slip_reference: tx.slip_reference || null,
      payee_name: tx.payee_name ? MJ.fixThai(tx.payee_name) : null,
      source: tx.source || 'manual',
      raw_input: tx.raw_input || null,
    };
    const { data, error } = await MJ.sb.from('transactions').insert(payload).select().maybeSingle();
    if (error) {
      if (/duplicate key|transactions_user_slip_key/i.test(error.message)) {
        const e = new Error('สลิปนี้ถูกบันทึกไปแล้ว');
        e.duplicate = true; throw e;
      }
      throw error;
    }
    // จำร้าน/ผู้รับโอน เพื่อเดาหมวดครั้งหน้า
    if (tx.payee_name && tx.category_id) this.rememberMerchant(tx.payee_name, tx.category_id);
    const d = new Date(data.transaction_date);
    if (d >= MJ.startOfMonth(MJ.state.month) && d <= MJ.endOfMonth(MJ.state.month)) {
      MJ.state.transactions.unshift(data);
      MJ.state.transactions.sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
    }
    return data;
  },

  async updateTransaction(id, patch) {
    const { data, error } = await MJ.sb.from('transactions').update(patch).eq('id', id).select().maybeSingle();
    if (error) throw error;
    const i = MJ.state.transactions.findIndex((t) => t.id === id);
    if (i > -1) MJ.state.transactions[i] = data;
    return data;
  },

  async deleteTransaction(id) {
    const { error } = await MJ.sb.from('transactions').delete().eq('id', id);
    if (error) throw error;
    MJ.state.transactions = MJ.state.transactions.filter((t) => t.id !== id);
  },

  /* ---------------------- CRUD categories ---------------------- */
  async saveCategory(cat) {
    const payload = {
      user_id: MJ.state.user.id,
      name: cat.name.trim(),
      type: cat.type,
      icon: cat.icon || '🐻',
      color: cat.color || '#F2B23E',
      budget_limit: cat.budget_limit === '' || cat.budget_limit == null ? null : Number(cat.budget_limit),
      keywords: cat.keywords || [],
    };
    const q = cat.id
      ? MJ.sb.from('categories').update(payload).eq('id', cat.id)
      : MJ.sb.from('categories').insert(payload);
    const { data, error } = await q.select().maybeSingle();
    if (error) throw error;
    const i = MJ.state.categories.findIndex((c) => c.id === data.id);
    if (i > -1) MJ.state.categories[i] = data; else MJ.state.categories.push(data);
    return data;
  },

  async archiveCategory(id) {
    const { error } = await MJ.sb.from('categories').update({ is_archived: true }).eq('id', id);
    if (error) throw error;
    MJ.state.categories = MJ.state.categories.filter((c) => c.id !== id);
  },

  /* ---------------------- CRUD recurring ---------------------- */
  async saveRecurring(r) {
    const payload = {
      user_id: MJ.state.user.id,
      category_id: r.category_id || null,
      amount: Number(r.amount),
      type: r.type,
      note: r.note || null,
      frequency: r.frequency,
      next_run_date: r.next_run_date,
      is_active: r.is_active !== false,
    };
    const q = r.id
      ? MJ.sb.from('recurring_transactions').update(payload).eq('id', r.id)
      : MJ.sb.from('recurring_transactions').insert(payload);
    const { error } = await q;
    if (error) throw error;
    await this.loadRecurring();
  },

  async deleteRecurring(id) {
    await MJ.sb.from('recurring_transactions').delete().eq('id', id);
    await this.loadRecurring();
  },

  /* ---------------------- profile ---------------------- */
  async saveProfile(patch) {
    const { data, error } = await MJ.sb.from('profiles').update(patch).eq('id', MJ.state.user.id).select().maybeSingle();
    if (error) throw error;
    MJ.state.profile = data;
    return data;
  },

  /* ---------------------- merchant rules ---------------------- */
  async rememberMerchant(payee, categoryId) {
    const key = String(payee).trim().toLowerCase().slice(0, 60);
    if (!key) return;
    try {
      await MJ.sb.from('merchant_rules')
        .upsert({ user_id: MJ.state.user.id, keyword: key, category_id: categoryId },
                { onConflict: 'user_id,keyword' });
    } catch (e) { /* ไม่สำคัญพอที่จะรบกวนผู้ใช้ */ }
  },

  async matchMerchant(payee) {
    if (!payee) return null;
    const key = String(payee).trim().toLowerCase();
    const { data } = await MJ.sb.from('merchant_rules').select('keyword, category_id');
    if (!data) return null;
    const hit = data.find((r) => key.includes(r.keyword) || r.keyword.includes(key));
    return hit ? hit.category_id : null;
  },

  /* ---------------------- ย่อรูปก่อนอัปโหลด ---------------------- */
  /**
   * อ่านสลิปเสร็จแล้วไม่ต้องเก็บภาพความละเอียดเต็ม — ย่อเหลือด้านยาว 1080px
   * คุณภาพ 0.72 พออ่านตัวเลขด้วยตาได้ ไฟล์เล็กลงราว 5-10 เท่า ประหยัดพื้นที่และเน็ต
   */
  async compressImage(file, maxSide, quality) {
    if (!file || !/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return file;
    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      URL.revokeObjectURL(url);

      const side = maxSide || 1080;
      const scale = Math.min(1, side / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 400 * 1024) return file;   // เล็กอยู่แล้ว

      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, cv.width, cv.height);

      const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', quality || 0.72));
      if (!blob || blob.size >= file.size) return file;
      return new File([blob], (file.name || 'slip').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (e) {
      return file;   // ย่อไม่ได้ก็อัปโหลดต้นฉบับ
    }
  },

  /* ---------------------- อัปโหลดสลิปขึ้น Storage ---------------------- */
  async uploadReceipt(rawFile) {
    const file = await this.compressImage(rawFile);
    const ext = (file.name?.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${MJ.state.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await MJ.sb.storage.from('receipts').upload(path, file, {
      contentType: file.type || 'image/jpeg', upsert: false,
    });
    if (error) throw error;
    return path;
  },

  async receiptUrl(path) {
    if (!path) return null;
    const { data } = await MJ.sb.storage.from('receipts').createSignedUrl(path, 3600);
    return data?.signedUrl || null;
  },

  /* ---------------------- สรุปยอด ---------------------- */
  summary(list) {
    const txs = list || MJ.state.transactions;
    let income = 0, expense = 0;
    txs.forEach((t) => { if (t.type === 'income') income += Number(t.amount); else expense += Number(t.amount); });
    return { income, expense, balance: income - expense, count: txs.length };
  },

  byCategory(type, list) {
    const txs = (list || MJ.state.transactions).filter((t) => t.type === type);
    const map = new Map();
    txs.forEach((t) => {
      const key = t.category_id || 'none';
      const cur = map.get(key) || { total: 0, count: 0 };
      cur.total += Number(t.amount); cur.count++;
      map.set(key, cur);
    });
    return Array.from(map.entries()).map(([id, v]) => {
      const c = MJ.state.categories.find((x) => x.id === id);
      return {
        id, total: v.total, count: v.count,
        name: c?.name || 'ไม่ระบุหมวด', icon: c?.icon || '❓', color: c?.color || '#9AA0A6',
        budget: c?.budget_limit ? Number(c.budget_limit) : null,
      };
    }).sort((a, b) => b.total - a.total);
  },

  dailySeries(type) {
    const days = MJ.endOfMonth(MJ.state.month).getDate();
    const arr = new Array(days).fill(0);
    MJ.state.transactions.filter((t) => t.type === type).forEach((t) => {
      const d = new Date(t.transaction_date);
      if (d.getMonth() === MJ.state.month.getMonth()) arr[d.getDate() - 1] += Number(t.amount);
    });
    return arr;
  },

  catById(id) { return MJ.state.categories.find((c) => c.id === id) || null; },
};

</script>
<script>
/* ===== 30-nlp.js ===== */
/* ===================================================================
   30-nlp.js — ตัวแยกข้อความภาษาไทยแบบ rule-based (ทำงานในเครื่อง ไม่ต้องมี API key)
   ตัวอย่างที่รองรับ:
     "กินกาแฟ 80"                  -> จ่าย 80 หมวดอาหาร
     "รับค่าขนม 100"                -> รับ 100 หมวดได้รับโอน
     "เมื่อวาน ค่าไฟ 1,250 บาท"      -> จ่าย 1250 เมื่อวาน หมวดบิล
     "เงินเดือนเข้า 25000"           -> รับ 25000 หมวดเงินเดือน
     "ค่าแท็กซี่ สองร้อยห้าสิบ"       -> จ่าย 250 หมวดเดินทาง
   =================================================================== */
MJ.nlp = (() => {
  const INCOME_WORDS = ['รับ','ได้รับ','ได้','เงินเข้า','โอนเข้า','เข้าบัญชี','เงินเดือน','salary','โบนัส','ขายได้','ขาย','รายรับ','คืนเงิน','refund','ดอกเบี้ย','ปันผล','อั่งเปา','ค่าจ้าง','ค่าคอม'];
  const EXPENSE_WORDS = ['จ่าย','ซื้อ','กิน','ค่า','เสีย','โอนให้','ผ่อน','เติม','ชอป','ช้อป','รายจ่าย','หมดไป','เติมเงิน'];

  const THAI_NUM = { 'ศูนย์':0,'หนึ่ง':1,'เอ็ด':1,'สอง':2,'ยี่':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9 };
  const THAI_UNIT = { 'สิบ':10,'ร้อย':100,'พัน':1000,'หมื่น':10000,'แสน':100000,'ล้าน':1000000 };

  /** แปลงเลขไทยเป็นตัวเลข เช่น "สองร้อยห้าสิบ" -> 250 */
  function thaiWordsToNumber(text) {
    const re = /(?:ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)+/g;
    const m = text.match(re);
    if (!m) return null;
    const chunk = m.sort((a, b) => b.length - a.length)[0];
    if (chunk.length < 3) return null;
    let total = 0, current = 0, i = 0;
    while (i < chunk.length) {
      let matched = false;
      for (const w of Object.keys(THAI_UNIT).sort((a, b) => b.length - a.length)) {
        if (chunk.startsWith(w, i)) {
          const u = THAI_UNIT[w];
          if (u === 1000000) { total = (total + (current || 1)) * u; current = 0; }
          else { current = (current || 1) * u; total += current; current = 0; }
          i += w.length; matched = true; break;
        }
      }
      if (matched) continue;
      for (const w of Object.keys(THAI_NUM).sort((a, b) => b.length - a.length)) {
        if (chunk.startsWith(w, i)) { current = THAI_NUM[w]; i += w.length; matched = true; break; }
      }
      if (!matched) { i++; continue; }
      // ถ้าตัวถัดไปไม่ใช่หน่วย ให้บวกทันที
      const rest = chunk.slice(i);
      const nextIsUnit = Object.keys(THAI_UNIT).some((u) => rest.startsWith(u));
      if (!nextIsUnit) { total += current; current = 0; }
    }
    total += current;
    return total > 0 ? total : null;
  }

  /** ดึงจำนวนเงิน */
  function extractAmount(text) {
    let t = text.replace(/,/g, '');
    // "50 บาท 25 สตางค์" / "1.5k" / "2พัน"
    const kMatch = t.match(/(\d+(?:\.\d+)?)\s*(k|K|พัน)\b/);
    if (kMatch) return { amount: parseFloat(kMatch[1]) * 1000, matched: kMatch[0] };
    const mMatch = t.match(/(\d+(?:\.\d+)?)\s*(หมื่น)/);
    if (mMatch) return { amount: parseFloat(mMatch[1]) * 10000, matched: mMatch[0] };
    const numbers = [...t.matchAll(/(\d+(?:\.\d{1,2})?)/g)];
    if (numbers.length) {
      // เลือกตัวที่ติดคำว่า "บาท" ก่อน ไม่งั้นเอาตัวที่ใหญ่สุด
      const withBaht = numbers.find((n) => /^\s*(บาท|฿|thb)/i.test(t.slice(n.index + n[0].length)));
      const pick = withBaht || numbers.sort((a, b) => parseFloat(b[1]) - parseFloat(a[1]))[0];
      return { amount: parseFloat(pick[1]), matched: pick[0] };
    }
    const th = thaiWordsToNumber(t);
    if (th) return { amount: th, matched: null };
    return { amount: null, matched: null };
  }

  /** เดาว่าเป็นรายรับหรือรายจ่าย */
  function detectType(text) {
    const t = text.toLowerCase();
    let score = 0;
    INCOME_WORDS.forEach((w) => { if (t.includes(w)) score += (w.length > 2 ? 2 : 1); });
    EXPENSE_WORDS.forEach((w) => { if (t.includes(w)) score -= (w.length > 2 ? 2 : 1); });
    // "รับ" นำหน้าประโยคน้ำหนักมาก, "ค่า..." มักเป็นรายจ่าย
    if (/^(รับ|ได้)/.test(text.trim())) score += 2;
    if (/^ค่า/.test(text.trim())) score -= 2;
    return score > 0 ? 'income' : 'expense';
  }

  /** เดาวันที่จากคำบอกเวลา */
  function detectDate(text) {
    const now = new Date();
    let d = new Date(now);
    let matched = null;

    if (/เมื่อวานซืน|วานซืน/.test(text)) { d.setDate(now.getDate() - 2); matched = 'เมื่อวานซืน'; }
    else if (/เมื่อวาน|มื้อวาน/.test(text)) { d.setDate(now.getDate() - 1); matched = 'เมื่อวาน'; }
    else if (/วันนี้/.test(text)) { matched = 'วันนี้'; }
    else if (/พรุ่งนี้/.test(text)) { d.setDate(now.getDate() + 1); matched = 'พรุ่งนี้'; }
    else {
      const ago = text.match(/(\d+)\s*วันก่อน/);
      if (ago) { d.setDate(now.getDate() - parseInt(ago[1], 10)); matched = ago[0]; }
      else {
        const dm = text.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
        if (dm) {
          let year = dm[3] ? parseInt(dm[3], 10) : now.getFullYear();
          if (year > 2400) year -= 543;
          if (year < 100) year += 2000;
          d = new Date(year, parseInt(dm[2], 10) - 1, parseInt(dm[1], 10), now.getHours(), now.getMinutes());
          matched = dm[0];
        }
      }
    }
    // เวลา เช่น "ตอน 18:30"
    const tm = text.match(/\b(\d{1,2})[:.](\d{2})\s*(น\.?)?/);
    if (tm && Number(tm[1]) < 24) { d.setHours(Number(tm[1]), Number(tm[2]), 0, 0); matched = (matched || '') + ' ' + tm[0]; }
    return { date: d, matched };
  }

  /** เดาหมวดจาก keywords ของหมวด + ชื่อหมวด */
  function detectCategory(text, type) {
    const t = text.toLowerCase();
    const cats = MJ.state.categories.filter((c) => c.type === type);
    let best = null, bestScore = 0;
    cats.forEach((c) => {
      let score = 0;
      if (t.includes(String(c.name).toLowerCase())) score += 5;
      (c.keywords || []).forEach((k) => {
        const kw = String(k).toLowerCase();
        if (kw && t.includes(kw)) score = Math.max(score, kw.length >= 4 ? 4 : 3);
      });
      if (score > bestScore) { bestScore = score; best = c; }
    });
    if (best) return best;
    return cats.find((c) => c.name === 'อื่น ๆ') || cats[0] || null;
  }

  /** ตัดคำที่ใช้แล้วออก เหลือเป็นโน้ต */
  function extractNote(text, amountMatched, dateMatched) {
    let s = ' ' + text + ' ';
    if (amountMatched) s = s.replace(amountMatched, ' ');
    if (dateMatched) dateMatched.split(' ').filter(Boolean).forEach((m) => { s = s.replace(m, ' '); });
    s = s.replace(/[\d,]+(\.\d+)?/g, ' ')
         .replace(/บาท|฿|thb|ตอน|เมื่อ|จำนวน|ราคา|ทั้งหมด|รวม/gi, ' ')
         .replace(/\s+/g, ' ').trim();
    return s || null;
  }

  return {
    /** วิเคราะห์ข้อความ -> ร่างรายการ */
    parse(text) {
      const raw = String(text || '').trim();
      if (!raw) return null;
      const { amount, matched } = extractAmount(raw);
      const type = detectType(raw);
      const { date, matched: dateMatched } = detectDate(raw);
      const cat = detectCategory(raw, type);
      const note = extractNote(raw, matched, dateMatched);
      return {
        amount,
        type,
        category_id: cat?.id || null,
        category: cat,
        note: note || (cat ? cat.name : null),
        transaction_date: date,
        source: 'text',
        raw_input: raw,
        confidence: amount ? (cat ? 'high' : 'medium') : 'low',
      };
    },

    /** สรุปเป็นประโยคให้ผู้ใช้ยืนยัน */
    describe(d) {
      if (!d) return '';
      const kind = d.type === 'income' ? 'รายรับ' : 'รายจ่าย';
      const when = MJ.sameDay(new Date(d.transaction_date), new Date())
        ? 'วันนี้' : MJ.dayLabel(d.transaction_date);
      return `${kind} ${MJ.fmtBaht(d.amount)} • ${d.category?.icon || ''} ${d.category?.name || 'ไม่ระบุหมวด'} • ${when}\n"${d.note || '-'}"`;
    },
    thaiWordsToNumber,
  };
})();

</script>
<script>
/* ===== 40-slip.js ===== */
/* ===================================================================
   40-slip.js — อ่านสลิป: QR ในเครื่อง -> OCR (Tesseract.js / PaddleOCR) -> เดาหมวด
   ลำดับการทำงาน
     1) สแกน Mini QR บนสลิป (jsQR) เอา "รหัสอ้างอิง" ไว้กันบันทึกซ้ำ
     2) OCR ข้อความบนสลิปเพื่อหา ยอดเงิน / วันที่ / ชื่อผู้รับ
        - ค่าเริ่มต้น: Tesseract.js (ทำงานในเบราว์เซอร์ ฟรี ไม่ต้องมี key)
        - ถ้าตั้ง PaddleOCR endpoint ไว้ในหน้าตั้งค่า จะเรียกใช้ตัวนั้นแทน (แม่นกว่า)
     3) รวมผล -> ร่างรายการให้ผู้ใช้ยืนยัน
   =================================================================== */
MJ.slip = (() => {

  /* ------------------------- โหลดรูปเข้า canvas ------------------------- */
  async function toImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.decoding = 'async';
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      return img;
    } finally { setTimeout(() => URL.revokeObjectURL(url), 30000); }
  }

  function drawScaled(img, maxSide) {
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    return { canvas: cv, ctx, w, h };
  }

  /**
   * เพิ่มคอนทราสต์ + ทำเป็นขาวดำก่อนส่งเข้า OCR
   * สลิปหลายธนาคารมีลายน้ำ/พื้นหลังอ่อน ทำให้ตัวเลขจม — ขั้นนี้ช่วยให้อ่านยอดได้ขึ้นชัดเจน
   */
  function boostContrast(canvas, ctx) {
    const im = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const c = Math.max(0, Math.min(255, (v - 128) * 1.9 + 128));
      d[i] = d[i + 1] = d[i + 2] = c;
    }
    ctx.putImageData(im, 0, 0);
    return canvas;
  }

  /* ------------------------- 1) สแกน QR ------------------------- */
  async function scanQR(img) {
    const tries = [1400, 900, 2000];
    for (const size of tries) {
      const { ctx, w, h } = drawScaled(img, size);
      const data = ctx.getImageData(0, 0, w, h);
      const code = window.jsQR ? window.jsQR(data.data, w, h, { inversionAttempts: 'attemptBoth' }) : null;
      if (code?.data) return code.data;

      // ลองเฉพาะครึ่งล่าง (Mini QR มักอยู่มุมล่าง)
      const halfH = Math.floor(h / 2);
      const half = ctx.getImageData(0, halfH, w, h - halfH);
      const code2 = window.jsQR ? window.jsQR(half.data, w, h - halfH, { inversionAttempts: 'attemptBoth' }) : null;
      if (code2?.data) return code2.data;
    }
    return null;
  }

  /* ------------------------- ถอด EMVCo TLV ------------------------- */
  function parseTLV(payload) {
    const out = {};
    let i = 0;
    while (i + 4 <= payload.length) {
      const tag = payload.slice(i, i + 2);
      const len = parseInt(payload.slice(i + 2, i + 4), 10);
      if (!/^\d{2}$/.test(tag) || Number.isNaN(len)) break;
      const value = payload.slice(i + 4, i + 4 + len);
      if (value.length < len) break;
      out[tag] = value;
      i += 4 + len;
    }
    return out;
  }

  /**
   * ดึงข้อมูลจาก payload ของ Mini QR บนสลิปไทย
   * โครงสร้างจริง (EMVCo TLV ซ้อนกัน) เช่น
   *   0046 00[06]000001 01[03]014 02[25]202608012vWAeIOheGunNmdz2  51[02]TH  91[04]3E89
   *        └─ tag 00 = กลุ่มข้อมูลสลิป: 00=เวอร์ชัน, 01=รหัสธนาคารผู้ส่ง, 02=เลขอ้างอิงรายการ
   * ใช้เลขอ้างอิงเป็นกุญแจกันบันทึกซ้ำ ถ้าถอดไม่ได้ค่อยใช้ payload ดิบ
   */
  function parseSlipPayload(payload) {
    const raw = String(payload || '').trim();
    const res = { raw, reference: raw, fields: {}, inner: {}, bank: null, bankCode: null, version: null };
    if (!/^\d{4}/.test(raw)) return res;

    const tlv = parseTLV(raw);
    res.fields = tlv;

    const inner = parseTLV(tlv['00'] || '');
    res.inner = inner;
    res.version = inner['00'] || null;
    res.bankCode = inner['01'] || null;
    res.bank = res.bankCode ? (BANKS[res.bankCode] || null) : null;

    if (inner['02'] && /^[A-Za-z0-9]{6,}$/.test(inner['02'])) {
      res.reference = inner['02'];
    } else {
      const candidates = Object.values(tlv).concat(Object.values(inner))
        .filter((v) => /^[A-Za-z0-9]{12,40}$/.test(v));
      if (candidates.length) res.reference = candidates.sort((a, b) => b.length - a.length)[0];
    }
    return res;
  }

  const BANKS = {
    '002':'ธ.กรุงเทพ','004':'ธ.กสิกรไทย','006':'ธ.กรุงไทย','011':'ธ.ทหารไทยธนชาต','014':'ธ.ไทยพาณิชย์',
    '017':'ธ.ซิตี้แบงก์','018':'ธ.ซูมิโตโม','020':'ธ.สแตนดาร์ดชาร์เตอร์ด','022':'ธ.ซีไอเอ็มบี',
    '024':'ธ.ยูโอบี','025':'ธ.กรุงศรีอยุธยา','026':'ธ.เมกะสากลพาณิชย์','030':'ธ.ออมสิน',
    '031':'ธ.เอชเอสบีซี','032':'ธ.ดอยซ์แบงก์','033':'ธ.อาคารสงเคราะห์','034':'ธ.ก.ส.',
    '039':'ธ.มิซูโฮ','045':'ธ.บีเอ็นพี พารีบาส์','052':'ธ.แห่งประเทศจีน','066':'ธ.อิสลาม',
    '067':'ธ.ทิสโก้','069':'ธ.เกียรตินาคินภัทร','070':'ธ.ไอซีบีซี','071':'ธ.ไทยเครดิต',
    '073':'ธ.แลนด์ แอนด์ เฮ้าส์','098':'ธ.พัฒนาวิสาหกิจ','099':'ธ.เพื่อการส่งออกและนำเข้า',
  };

  /* ------------------------- 2) OCR ------------------------- */
  let tesseractWorker = null;

  async function ensureTesseract(onProgress) {
    if (tesseractWorker) return tesseractWorker;
    if (!window.Tesseract) {
      onProgress && onProgress('กำลังโหลดตัวอ่านข้อความ…');
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = res; s.onerror = () => rej(new Error('โหลดตัวอ่านข้อความไม่สำเร็จ'));
        document.head.appendChild(s);
      });
    }
    onProgress && onProgress('กำลังเตรียมภาษาไทย… (ครั้งแรกใช้เวลาสักครู่)');
    tesseractWorker = await window.Tesseract.createWorker(['tha', 'eng'], 1, {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0',
      langPath: 'https://tessdata.projectnaptha.com/4.0.0',
    });
    return tesseractWorker;
  }

  async function ocrLocal(img, onProgress, opts) {
    const worker = await ensureTesseract(onProgress);
    onProgress && onProgress(opts?.second ? 'กำลังอ่านซ้ำอีกรอบให้ชัวร์…' : 'กำลังอ่านตัวหนังสือบนสลิป…');
    const { canvas, ctx } = drawScaled(img, 1600);
    if (opts?.boost !== false) boostContrast(canvas, ctx);
    const { data } = await worker.recognize(canvas);
    return data?.text || '';
  }

  /**
   * ส่งรูปให้ PaddleOCR service
   * เซิร์ฟเวอร์ฟรี (เช่น Hugging Face Space) จะหลับเมื่อไม่มีคนใช้
   * ถ้าเจอ 502/503/504 จะรอแล้วลองใหม่ ระหว่างนั้นบอกผู้ใช้ว่ากำลังปลุกเซิร์ฟเวอร์
   */
  async function ocrRemote(endpoint, file, onProgress) {
    const url = endpoint.replace(/\/$/, '') + '/ocr';
    const attempts = 8;
    for (let i = 0; i < attempts; i++) {
      onProgress && onProgress(i === 0 ? 'กำลังส่งสลิปให้ PaddleOCR…'
        : `กำลังปลุกเซิร์ฟเวอร์ OCR… (${i}/${attempts - 1})`);
      let res;
      try {
        const fd = new FormData();
        fd.append('file', file, file.name || 'slip.jpg');
        res = await fetch(url, { method: 'POST', body: fd });
      } catch (err) {
        if (i === attempts - 1) throw new Error('ต่อเซิร์ฟเวอร์ OCR ไม่ได้');
        await new Promise((r) => setTimeout(r, 8000));
        continue;
      }
      if (res.ok) {
        const json = await res.json();
        if (typeof json.text === 'string') return json.text;
        if (Array.isArray(json.lines)) return json.lines.map((l) => (typeof l === 'string' ? l : l.text)).join('\n');
        return JSON.stringify(json);
      }
      // กำลังตื่น/บูตอยู่ — รอแล้วลองใหม่
      if ([408, 429, 500, 502, 503, 504].includes(res.status) && i < attempts - 1) {
        await new Promise((r) => setTimeout(r, 8000));
        continue;
      }
      throw new Error('PaddleOCR ตอบกลับผิดพลาด (' + res.status + ')');
    }
    throw new Error('เซิร์ฟเวอร์ OCR ไม่ตอบสนอง');
  }

  /* ------------------------- แกะข้อมูลจากข้อความ OCR ------------------------- */
  /* ---------- เดือนไทย/อังกฤษ ทั้งแบบย่อและเต็ม ---------- */
  const THAI_MONTHS = [
    ['มกราคม', 'มค'], ['กุมภาพันธ์', 'กพ'], ['มีนาคม', 'มีค'], ['เมษายน', 'เมย'],
    ['พฤษภาคม', 'พค'], ['มิถุนายน', 'มิย'], ['กรกฎาคม', 'กค'], ['สิงหาคม', 'สค'],
    ['กันยายน', 'กย'], ['ตุลาคม', 'ตค'], ['พฤศจิกายน', 'พย'], ['ธันวาคม', 'ธค'],
  ];
  const EN_MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

  /** แปลงปีให้เป็น ค.ศ. (รับได้ทั้ง 68 / 2568 / 25 / 2025) */
  function normalizeYear(y) {
    y = parseInt(y, 10);
    if (Number.isNaN(y)) return null;
    if (y < 100) y += (y >= 50 ? 2500 : 2000);   // 68 -> 2568, 25 -> 2025
    if (y > 2400) y -= 543;                       // พ.ศ. -> ค.ศ.
    return y;
  }

  /** หาเดือนจากคำ (ไทยเต็ม/ไทยย่อ/อังกฤษ) */
  function monthFromWord(word) {
    const w = String(word).replace(/[.\s]/g, '').toLowerCase();
    for (let i = 0; i < THAI_MONTHS.length; i++) {
      const [full, abbr] = THAI_MONTHS[i];
      if (w === full || w === abbr || full.startsWith(w) && w.length >= 3) return i;
    }
    const en = EN_MONTHS.indexOf(w.slice(0, 3));
    if (en > -1) return en;
    return null;
  }

  /**
   * อ่านวันที่จากข้อความสลิป รองรับ
   *   12 ส.ค. 68 / 12 สิงหาคม 2568 / 12 Aug 2025 / 12/08/2568 / 2025-08-12 / 12-08-68
   * และเวลา 14:35 / 14.35 น. / 14:35:02
   */
  function parseDateFromText(flat) {
    let d = null;

    // 1) วัน + ชื่อเดือน + ปี(อาจไม่มี)
    const named = flat.match(/(\d{1,2})\s*(ม\.?ค\.?|มกราคม|ก\.?พ\.?|กุมภาพันธ์|มี\.?ค\.?|มีนาคม|เม\.?ย\.?|เมษายน|พ\.?ค\.?|พฤษภาคม|มิ\.?ย\.?|มิถุนายน|ก\.?ค\.?|กรกฎาคม|ส\.?ค\.?|สิงหาคม|ก\.?ย\.?|กันยายน|ต\.?ค\.?|ตุลาคม|พ\.?ย\.?|พฤศจิกายน|ธ\.?ค\.?|ธันวาคม|jan\w*|feb\w*|mar\w*|apr\w*|may|jun\w*|jul\w*|aug\w*|sep\w*|oct\w*|nov\w*|dec\w*)\.?\s*(\d{2,4})?/i);
    if (named) {
      const mon = monthFromWord(named[2]);
      const year = named[3] ? normalizeYear(named[3]) : new Date().getFullYear();
      if (mon != null && year) d = new Date(year, mon, parseInt(named[1], 10));
    }

    // 2) รูปแบบ ปี-เดือน-วัน (2025-08-12 / 2568/08/12)
    if (!d) {
      const ymd = flat.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
      if (ymd) {
        const year = normalizeYear(ymd[1]);
        d = new Date(year, parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10));
      }
    }

    // 3) รูปแบบ วัน/เดือน/ปี (12/08/68, 12-08-2568)
    if (!d) {
      const dmy = flat.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
      if (dmy) {
        const year = normalizeYear(dmy[3]);
        let day = parseInt(dmy[1], 10), mon = parseInt(dmy[2], 10);
        if (mon > 12 && day <= 12) { const t = day; day = mon; mon = t; }  // เผื่อสลับ MM/DD
        d = new Date(year, mon - 1, day);
      }
    }

    if (!d || isNaN(d.getTime())) return null;
    // ถ้าวันที่ไม่มีจริง (เช่น 30 ก.พ.) JS จะเลื่อนเดือนให้ — ถือว่าอ่านผิด
    const dayWanted = parseInt((named || flat.match(/(\d{1,2})[\/\-.]/) || [])[1], 10);
    if (dayWanted && d.getDate() !== dayWanted && !flat.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)) return null;

    // เวลา: เอาตัวที่ติดคำว่า "น." ก่อน ไม่งั้นเอาแบบ hh:mm ทั่วไป
    const tWithNa = flat.match(/(\d{1,2})[:.](\d{2})(?::(\d{2}))?\s*น\.?/);
    const tPlain  = flat.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::(\d{2}))?(?=\s|$)/);
    const tm = tWithNa || tPlain;
    if (tm && Number(tm[1]) < 24 && Number(tm[2]) < 60) {
      d.setHours(Number(tm[1]), Number(tm[2]), Number(tm[3] || 0), 0);
    } else {
      d.setHours(12, 0, 0, 0);   // ไม่รู้เวลา ใช้เที่ยงกันเพี้ยนข้ามวันจาก timezone
    }

    // สลิปไม่ควรเป็นอนาคตเกิน 1 วัน — ถ้าเพี้ยนให้ถือว่าอ่านผิด
    if (d.getTime() > Date.now() + 86400000) return null;
    return d;
  }

  /**
   * ถอดวันที่จากรหัสอ้างอิงสลิป รองรับ 2 แบบที่เจอจริง
   *   ก) ฝังวันที่เต็ม   เช่น SCB "202608012vWAeIOheGunNmdz2" -> 2026-08-01
   *   ข) วันที่ N ของปี + เวลา เช่น กสิกร "016225114146BPM01937"
   *      016 | 225 (วันที่ 225 ของปี = 13 ส.ค.) | 114146 (11:41:46)
   */
  function parseDateFromRef(ref) {
    if (!ref) return null;
    const s = String(ref);

    // ก) YYYYMMDD
    const full = s.match(/(20\d{2}|2[45]\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])/);
    if (full) {
      const d = new Date(normalizeYear(full[1]), parseInt(full[2], 10) - 1, parseInt(full[3], 10), 12, 0, 0);
      if (!isNaN(d.getTime()) && d.getTime() <= Date.now() + 86400000) return d;
    }

    const now = new Date();
    const buildDoy = (day, hh, mm, ss) => {
      if (!(day >= 1 && day <= 366)) return null;
      let d = new Date(now.getFullYear(), 0, day, hh || 12, mm || 0, ss || 0);
      if (d.getTime() > now.getTime() + 86400000) d = new Date(now.getFullYear() - 1, 0, day, hh || 12, mm || 0, ss || 0);
      return isNaN(d.getTime()) ? null : d;
    };

    // ข) กสิกร K PLUS: 016 + DDD(วันที่ N ของปี) + HHMMSS + ตัวอักษร
    const doyTime = s.match(/^0\d{2}(\d{3})(\d{2})(\d{2})(\d{2})/);
    if (doyTime && +doyTime[2] < 24 && +doyTime[3] < 60 && +doyTime[4] < 60) {
      const d = buildDoy(+doyTime[1], +doyTime[2], +doyTime[3], +doyTime[4]);
      if (d) return d;
    }

    // ค) MAKE by KBank: 046 + DDD แล้วตามด้วยตัวอักษรผสม (ไม่มีเวลา)
    const doyOnly = s.match(/^0\d{2}(\d{3})(?=[A-Za-z0-9])/);
    if (doyOnly) {
      const d = buildDoy(+doyOnly[1]);
      if (d) return d;
    }
    return null;
  }

  /** ทำความสะอาดข้อความจาก OCR ให้เทียบง่ายขึ้น */
  function normalizeText(text) {
    return String(text || '')
      .replace(/ํา/g, 'ำ')                 // "จํานวน" -> "จำนวน"
      .replace(/[๐-๙]/g, (d) => String(d.charCodeAt(0) - 0x0E50))  // เลขไทย -> อารบิก
      .replace(/[​-‍﻿]/g, '')
      .replace(/[ \t]+/g, ' ');
  }

  const FEE_RE = /(ค่าธรรมเนียม|ธรรมเนียม|fee|charge|คงเหลือ|ยอดคงเหลือ|balance)/i;
  const AMOUNT_LABEL_RE = /(จำนวนเงิน|จำนวน|ยอดเงิน|ยอดชำระ|ยอดรวม|ยอด|รวมทั้งสิ้น|amount|total)\s*:?/i;
  const NOT_PAYEE_RE = /(รหัส|เลขที่|หมายเลข|อ้างอิง|บัญชี|account|ref|xxx|สแกน|ตรวจสอบ|ธนาคาร|ธ\.|จำนวน|ค่าธรรมเนียม|บาท|สำเร็จ)/i;

  /** ตัวเลขที่ "หน้าตาเป็นจำนวนเงิน" จริง ๆ คือมีทศนิยม 2 ตำแหน่ง เช่น 160.00 / 49,999.00
   *  OCR มักอ่านลูกน้ำเป็นช่องว่าง ("49 999.00") จึงรับตัวคั่นได้ทั้งสองแบบ */
  function decimalsIn(line) {
    return [...line.matchAll(/(?:^|[^\d.,])(\d{1,3}(?:[,\s]\d{3})+|\d{1,7})\.(\d{2})(?!\d)/g)]
      .map((m) => parseFloat((m[1] + '.' + m[2]).replace(/[,\s]/g, '')))
      .filter((n) => n > 0 && n < 10000000);
  }

  /** เลขจำนวนเต็มที่ตามด้วยหน่วยเงิน เช่น "500 บาท" */
  function bahtIntIn(line) {
    return [...line.matchAll(/(?:^|[^\d.,])(\d{1,3}(?:,\d{3})*|\d{1,7})\s*(?:บาท|THB|฿)/gi)]
      .map((m) => parseFloat(m[1].replace(/,/g, '')))
      .filter((n) => n > 0 && n < 10000000);
  }

  function extractFromText(rawText) {
    const out = { amount: null, date: null, payee: null, reference: null, lines: [] };
    if (!rawText) return out;

    const text = normalizeText(rawText);
    const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
    out.lines = lines;
    const flat = lines.join(' ');

    /* ---------- ยอดเงิน ----------
       1) บรรทัดที่มีคำว่า "จำนวน/ยอด" (แต่ไม่ใช่ค่าธรรมเนียม) — ตัวเลขอาจอยู่บรรทัดถัดไป
       2) ถ้าไม่เจอ ใช้ตัวเลขทศนิยม 2 ตำแหน่งที่มากที่สุด โดยข้ามบรรทัดค่าธรรมเนียม/ยอดคงเหลือ  */
    for (let i = 0; i < lines.length && !out.amount; i++) {
      if (FEE_RE.test(lines[i]) || !AMOUNT_LABEL_RE.test(lines[i])) continue;
      const after = lines[i].replace(/^.*?(จำนวนเงิน|จำนวน|ยอดเงิน|ยอดชำระ|ยอดรวม|ยอด|amount|total)\s*:?/i, '');
      const here = decimalsIn(after).concat(bahtIntIn(after));
      if (here.length) { out.amount = Math.max(...here); break; }
      // สลิปหลายแบบวางตัวเลขไว้บรรทัดถัดไป (มองลงไปได้ 3 บรรทัด)
      for (let k = 1; k <= 3 && i + k < lines.length; k++) {
        if (FEE_RE.test(lines[i + k])) break;
        const next = decimalsIn(lines[i + k]).concat(bahtIntIn(lines[i + k]));
        if (next.length) { out.amount = Math.max(...next); break; }
      }
    }
    if (!out.amount) {
      const cands = [];
      lines.forEach((l) => { if (!FEE_RE.test(l)) cands.push(...decimalsIn(l)); });
      if (cands.length) out.amount = Math.max(...cands);
    }
    if (!out.amount) {
      const cands = [];
      lines.forEach((l) => { if (!FEE_RE.test(l)) cands.push(...bahtIntIn(l)); });
      if (cands.length) out.amount = Math.max(...cands);
    }
    // ทางสุดท้าย: เลขจำนวนเต็มบนบรรทัดที่มีคำว่า "จำนวน/ยอด" (รับเฉพาะ >= 10 กันเศษขยะจาก OCR)
    if (!out.amount) {
      for (let i = 0; i < lines.length && !out.amount; i++) {
        if (FEE_RE.test(lines[i]) || !AMOUNT_LABEL_RE.test(lines[i])) continue;
        for (let k = 0; k <= 2 && i + k < lines.length; k++) {
          const l = lines[i + k];
          if (k && FEE_RE.test(l)) break;
          const ints = [...l.matchAll(/(?:^|[^\d.,\-])(\d{1,3}(?:,\d{3})*|\d{2,7})(?![\d.,])/g)]
            .map((m) => parseFloat(m[1].replace(/,/g, '')))
            .filter((n) => n >= 10 && n < 10000000);
          if (ints.length) { out.amount = Math.max(...ints); break; }
        }
      }
    }

    /* ---------- วันที่และเวลา ---------- */
    out.date = parseDateFromText(flat);

    /* ---------- ชื่อผู้รับเงิน/ร้านค้า ---------- */
    const idxTo = lines.findIndex((l) => /(ไปยัง|ถึง|ผู้รับ(เงิน)?|to\b|received)/i.test(l));
    if (idxTo > -1) {
      const same = lines[idxTo].replace(/.*?(ไปยัง|ถึง|ผู้รับเงิน|ผู้รับ|to|received)\s*:?\s*/i, '').trim();
      out.payee = cleanPayee(same) || cleanPayee(lines[idxTo + 1] || '');
    }
    if (!out.payee) {
      const biz = lines.find((l) => /(บจก|บมจ|บริษัท|ห้างหุ้นส่วน|ร้าน(?!ค้า)|จำกัด|co\.,?\s*ltd|company|merchant|shop)/i.test(l)
        && !/รหัสร้านค้า/.test(l));
      if (biz) out.payee = cleanPayee(biz);
    }
    if (!out.payee) {
      /* สลิปกสิกร/MAKE ไม่มีคำว่า "ไปยัง" แต่เรียงเป็น
         ชื่อผู้โอน → ธนาคาร → เลขบัญชีปิดบัง(XXX-X-X9382-X) → ชื่อผู้รับ
         จึงหยิบบรรทัดถัดจากเลขบัญชีปิดบังอันแรก */
      const maskIdx = lines.findIndex((l) => /[Xx%*]{3}[-\s][\dXx%*-]{3,}/.test(l));
      if (maskIdx > -1) {
        for (let i = maskIdx + 1; i < Math.min(lines.length, maskIdx + 4); i++) {
          if (/^(ธ\.|ธนาคาร|prompt|พร้อมเพย์|bank)/i.test(lines[i].trim())) continue;
          const cand = cleanPayee(lines[i]);
          if (cand) { out.payee = cand; break; }
        }
      }
    }
    if (!out.payee) {
      // ชื่อร้านแบบตัวพิมพ์ใหญ่ล้วน เช่น ZENITHLINK / LINE PAY MERCHANT
      const caps = lines.find((l) => /^[A-Z][A-Z\s&.'()\-]{3,34}$/.test(l.trim()) && !/^X+$/i.test(l.trim()));
      if (caps) out.payee = cleanPayee(caps);
    }

    /* ---------- เลขอ้างอิงในข้อความ ---------- */
    const ref = flat.match(/(?:เลขที่รายการ|เลขที่อ้างอิง|รหัสอ้างอิง|อ้างอิง|ref(?:erence)?(?:\s*no)?)\s*:?\s*([A-Za-z0-9]{8,40})/i);
    if (ref) out.reference = ref[1];
    return out;
  }

  function cleanPayee(s) {
    let v = String(s || '')
      .replace(/^\S{1,2}\s+(?=\S{3,})/, '')   // ตัดเศษตัวอักษร/ตัวเลขที่ OCR หลุดมาหน้าแถว
      .replace(/\s{2,}\S{1,3}$/, '')          // และเศษที่หลุดมาท้ายแถว
      .replace(/^[\s:@\-–|>.©®]+/, '')
      .replace(/^(นาย|นาง|นางสาว|น\.ส\.|บจก\.|บมจ\.)\s*/i, (m) => m)   // คงคำนำหน้าไว้
      .replace(/\s{2,}/g, ' ')
      .trim();
    v = (typeof MJ !== 'undefined' && MJ.fixThai) ? MJ.fixThai(v) : v;
    if (v.length < 3 || v.length > 80) return null;
    if (NOT_PAYEE_RE.test(v) && !/(บจก|บมจ|บริษัท|จำกัด|co\.,?\s*ltd|company)/i.test(v)) return null;
    if (/^[A-F0-9]{12,}$/i.test(v)) return null;   // ดูเป็นรหัส ไม่ใช่ชื่อ
    return v;
  }

  /* ------------------------- 3) รวมผลเป็นร่างรายการ ------------------------- */
  async function analyze(file, onProgress) {
    const img = await toImage(file);

    onProgress && onProgress('กำลังสแกน QR บนสลิป…');
    let qr = null, slipInfo = null;
    try { qr = await scanQR(img); } catch (e) { /* ไม่มี QR ก็ไม่เป็นไร */ }
    if (qr) slipInfo = parseSlipPayload(qr);

    let text = '';
    const endpoint = MJ.state.profile?.ocr_endpoint;
    try {
      if (endpoint) text = await ocrRemote(endpoint, file, onProgress);
      else text = await ocrLocal(img, onProgress);
    } catch (err) {
      if (endpoint) {
        MJ.toast('PaddleOCR ใช้ไม่ได้ สลับไปอ่านในเครื่อง', 'err');
        try { text = await ocrLocal(img, onProgress); } catch (e2) { text = ''; }
      }
    }

    let info = extractFromText(text);

    // ยังขาดข้อมูลสำคัญ -> อ่านซ้ำจากภาพต้นฉบับ (ไม่เพิ่มคอนทราสต์) แล้วเติมช่องที่ว่าง
    if (!endpoint && (!info.amount || !info.date || !info.payee)) {
      try {
        const text2 = await ocrLocal(img, onProgress, { boost: false, second: true });
        const info2 = extractFromText(text2);
        info = {
          amount: info.amount || info2.amount,
          date: info.date || info2.date,
          payee: info.payee || info2.payee,
          reference: info.reference || info2.reference,
          lines: info.lines.concat(info2.lines),
        };
        text = text + '\n' + text2;
      } catch (e) { /* รอบสองล้มเหลวก็ใช้ผลรอบแรก */ }
    }
    const payee = info.payee || slipInfo?.bank || null;

    // วันที่: รวมสองแหล่ง — รหัสอ้างอิง (แม่นเพราะเป็นโครงสร้าง) กับข้อความ OCR (มีเวลา)
    const refDate = parseDateFromRef(slipInfo?.reference) || parseDateFromRef(info.reference);
    let slipDate = null;
    if (refDate && info.date) {
      const sameDay = refDate.getFullYear() === info.date.getFullYear()
        && refDate.getMonth() === info.date.getMonth()
        && refDate.getDate() === info.date.getDate();
      slipDate = sameDay ? info.date : refDate;   // วันตรงกัน ใช้เวลาจาก OCR
    } else {
      slipDate = refDate || info.date || null;
    }

    // เดาหมวดจากชื่อร้าน + ข้อความทั้งหมด
    let categoryId = payee ? await MJ.data.matchMerchant(payee) : null;
    let category = categoryId ? MJ.data.catById(categoryId) : null;
    if (!category) {
      const guess = MJ.nlp.parse(((payee || '') + ' ' + (info.lines.slice(0, 6).join(' ') || '')) + ' ' + (info.amount || ''));
      category = guess?.category || null;
    }

    return {
      amount: info.amount,
      type: 'expense',
      category_id: category?.id || null,
      category,
      note: payee ? `โอนให้ ${payee}` : 'จ่ายผ่านสลิป',
      payee_name: payee,
      transaction_date: slipDate || new Date(),
      dateFromSlip: !!slipDate,
      slip_reference: slipInfo?.reference || info.reference || null,
      source: 'slip',
      raw_input: (qr ? 'QR: ' + qr + '\n' : '') + text.slice(0, 2000),
      hasQR: !!qr,
      ocrText: text,
    };
  }

  return { analyze, scanQR, parseSlipPayload, extractFromText, parseTLV, ensureTesseract,
           parseDateFromText, parseDateFromRef };
})();

</script>
<script>
/* ===== 50-charts.js ===== */
/* ===================================================================
   50-charts.js — กราฟ SVG เขียนเอง (ไม่พึ่งไลบรารีภายนอก)
   =================================================================== */
MJ.charts = {
  /** โดนัทสัดส่วนตามหมวด */
  donut(items, opts) {
    const o = Object.assign({ size: 190, thickness: 26, centerTop: '', centerMain: '' }, opts || {});
    const total = items.reduce((s, i) => s + i.total, 0);
    const r = (o.size - o.thickness) / 2, cx = o.size / 2, cy = o.size / 2;
    const C = 2 * Math.PI * r;
    if (!total) {
      return `<svg class="chart-donut" viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}"
        style="max-width:100%">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${o.thickness}"/>
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" fill="var(--ink-3)" font-size="13">ยังไม่มีข้อมูล</text></svg>`;
    }
    let offset = 0;
    const arcs = items.map((i) => {
      const frac = i.total / total;
      const dash = `${(frac * C).toFixed(2)} ${(C - frac * C).toFixed(2)}`;
      const seg = `<circle class="seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i.color}"
        stroke-width="${o.thickness}" stroke-dasharray="${dash}" stroke-dashoffset="${(-offset * C).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"
        style="--arc-len:${C.toFixed(0)};animation-delay:${(offset * .5).toFixed(2)}s"><title>${MJ.esc(i.name)} ${MJ.fmtBaht(i.total)}</title></circle>`;
      offset += frac;
      return seg;
    }).join('');
    return `<svg class="chart-donut" viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}" style="max-width:100%">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${o.thickness}"/>
      ${arcs}
      <text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="var(--ink-3)" font-size="12">${MJ.esc(o.centerTop)}</text>
      <text x="${cx}" y="${cy + 16}" text-anchor="middle" fill="var(--ink)" font-size="19" font-weight="700">${MJ.esc(o.centerMain)}</text>
    </svg>`;
  },

  /** แท่งรายวัน (จ่าย/รับ) — ใช้พิกัดจริง ไม่ยืดภาพให้เพี้ยน */
  bars(expense, income, opts) {
    const o = Object.assign({ h: 150 }, opts || {});
    const n = expense.length;
    const max = Math.max(1, ...expense, ...(income || []));
    const W = 8, GAP = 2;                       // ความกว้างช่องต่อวัน
    const vw = n * (W + GAP), vh = 100;         // พื้นที่กราฟ (หน่วยเดียวกันทั้งแกน x/y)
    const today = new Date();
    const isThisMonth = today.getMonth() === MJ.state.month.getMonth()
      && today.getFullYear() === MJ.state.month.getFullYear();

    let bars = '';
    for (let i = 0; i < n; i++) {
      const x = i * (W + GAP);
      const eh = (expense[i] / max) * (vh - 16);
      const ih = income ? (income[i] / max) * (vh - 16) : 0;
      const isToday = isThisMonth && today.getDate() === i + 1;
      const both = ih > 0 && eh > 0;
      const delay = `animation-delay:${(i * .012).toFixed(3)}s`;
      if (ih > 0) bars += `<rect style="${delay}" x="${x}" y="${vh - 16 - ih}" width="${both ? W / 2 - .4 : W}"
        height="${ih}" rx="1.6" fill="var(--in)" opacity=".9"><title>${i + 1}: รับ ${MJ.fmtBaht(income[i])}</title></rect>`;
      if (eh > 0) bars += `<rect style="${delay}" x="${both ? x + W / 2 + .4 : x}" y="${vh - 16 - eh}"
        width="${both ? W / 2 - .4 : W}" height="${eh}" rx="1.6"
        fill="${isToday ? 'var(--honey-d)' : 'var(--out)'}"><title>${i + 1}: จ่าย ${MJ.fmtBaht(expense[i])}</title></rect>`;
    }
    const ticks = [1, Math.ceil(n / 2), n].map((d) =>
      `<text x="${(d - 1) * (W + GAP) + W / 2}" y="${vh - 3}" text-anchor="middle"
        fill="var(--ink-3)" font-size="7">${d}</text>`).join('');

    return `<div class="chart-scroll"><svg class="chart-bars" viewBox="0 0 ${vw} ${vh}"
      width="100%" height="${o.h}" preserveAspectRatio="xMidYMax meet">
      ${bars}
      <line x1="0" y1="${vh - 16}" x2="${vw}" y2="${vh - 16}" stroke="var(--line)" stroke-width=".5"/>
      ${ticks}
    </svg></div>`;
  },

  /** เส้นแนวโน้มยอดสะสม */
  line(values, color) {
    const n = values.length;
    if (!n) return '';
    let acc = 0;
    const cum = values.map((v) => (acc += v));
    const max = Math.max(1, ...cum);
    const pts = cum.map((v, i) => `${(i / (n - 1 || 1)) * 100},${100 - (v / max) * 92}`).join(' ');
    const area = `0,100 ${pts} 100,100`;
    const c = color || 'var(--honey)';
    return `<svg viewBox="0 0 100 100" width="100%" height="120" preserveAspectRatio="none">
      <polygon points="${area}" fill="${c}" opacity=".14"/>
      <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  },

  legend(items, total) {
    if (!items.length) return '<p class="empty tiny">ยังไม่มีรายการในเดือนนี้</p>';
    return `<div class="legend">${items.map((i) => `
      <div class="legend-row">
        <span class="legend-dot" style="background:${i.color}"></span>
        <span class="nm">${i.icon || ''} ${MJ.esc(i.name)}</span>
        <span class="vl">${MJ.fmtBaht(i.total)}</span>
        <span class="pc">${total ? Math.round((i.total / total) * 100) : 0}%</span>
      </div>`).join('')}</div>`;
  },

  /** แถบงบประมาณ */
  budgetBar(item) {
    const used = item.total, limit = item.budget;
    const pct = limit ? Math.min(100, (used / limit) * 100) : 0;
    const over = limit && used > limit;
    const color = over ? 'var(--out)' : (pct > 80 ? 'var(--warn)' : item.color);
    return `<div class="bud">
      <div class="bud-top">
        <span class="bud-name">${item.icon || ''} ${MJ.esc(item.name)}</span>
        <span class="${over ? 'tx-amt out' : ''}">${MJ.fmtBaht(used)}${limit ? ` <span class="muted tiny">/ ${MJ.fmtMoney(limit)}</span>` : ''}</span>
      </div>
      <div class="bar"><i style="width:${limit ? pct : 0}%;background:${color}"></i></div>
      <div class="bud-foot">
        <span>${limit ? (over ? `เกินงบ ${MJ.fmtBaht(used - limit)} 🐻💦` : `เหลือ ${MJ.fmtBaht(limit - used)}`) : 'ยังไม่ตั้งงบ'}</span>
        <span>${item.count} รายการ</span>
      </div>
    </div>`;
  },
};

</script>
