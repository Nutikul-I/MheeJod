/* ---------------------- รายการประจำ ---------------------- */
function openRecurSheet(r) {
  const isNew = !r;
  const v = r || { amount: '', type: 'expense', category_id: null, note: '', frequency: 'monthly',
                   next_run_date: MJ.isoDate(new Date()), is_active: true };
  const cats = MJ.state.categories;

  MJ.sheet.open(isNew ? 'เพิ่มรายการประจำ' : 'แก้ไขรายการประจำ', `
    <div class="seg" id="rType">
      <button class="seg-btn ${v.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
      <button class="seg-btn ${v.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
    </div>
    <label class="field"><span>ชื่อรายการ</span>
      <input type="text" id="rNote" value="${MJ.esc(v.note || '')}" placeholder="เช่น Netflix, ค่าเช่าห้อง"></label>
    <label class="field"><span>จำนวนเงิน</span>
      <input type="number" step="0.01" inputmode="decimal" id="rAmount" value="${v.amount}"></label>
    <label class="field"><span>หมวดหมู่</span><select id="rCat">
      ${cats.filter((c) => c.type === v.type).map((c) => `<option value="${c.id}" ${c.id === v.category_id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('')}
    </select></label>
    <div class="row">
      <label class="field"><span>ความถี่</span><select id="rFreq">
        <option value="daily" ${v.frequency === 'daily' ? 'selected' : ''}>ทุกวัน</option>
        <option value="weekly" ${v.frequency === 'weekly' ? 'selected' : ''}>ทุกสัปดาห์</option>
        <option value="monthly" ${v.frequency === 'monthly' ? 'selected' : ''}>ทุกเดือน</option>
        <option value="yearly" ${v.frequency === 'yearly' ? 'selected' : ''}>ทุกปี</option>
      </select></label>
      <label class="field"><span>ครั้งถัดไป</span>
        <input type="date" id="rDate" value="${String(v.next_run_date).slice(0, 10)}"></label>
    </div>
    <div class="list-item"><span class="ic"><i class="fa fa-check"></i></span><span class="tx2"><b>เปิดใช้งาน</b><small>ปิดไว้ถ้ายังไม่อยากให้จดอัตโนมัติ</small></span>
      <div class="switch ${v.is_active ? 'on' : ''}" id="rActive"><i></i></div></div>
    <button class="btn btn-primary btn-block mt" id="rSave">${isNew ? 'เพิ่มรายการ' : 'บันทึก'}</button>
    ${isNew ? '' : '<button class="btn btn-danger btn-block mt" id="rDel">ลบรายการประจำ</button>'}
  `, (body) => {
    let type = v.type, active = v.is_active !== false;
    MJ.segInit(MJ.$('#rType', body), (b) => {
      type = b.dataset.type;
      body.querySelectorAll('#rType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
      MJ.$('#rCat', body).innerHTML = cats.filter((c) => c.type === type)
        .map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('');
    });
    MJ.$('#rActive', body).onclick = (e) => { active = !active; e.currentTarget.classList.toggle('on', active); };

    MJ.$('#rSave', body).onclick = async () => {
      const amount = parseFloat(MJ.$('#rAmount', body).value);
      if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.data.saveRecurring({
          id: v.id, amount, type,
          category_id: MJ.$('#rCat', body).value || null,
          note: MJ.$('#rNote', body).value.trim() || null,
          frequency: MJ.$('#rFreq', body).value,
          next_run_date: MJ.$('#rDate', body).value,
          is_active: active,
        });
        MJ.sheet.close(); MJ.toast('บันทึกแล้ว 🐻', 'ok'); MJ.render();
      } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
    if (MJ.$('#rDel', body)) MJ.$('#rDel', body).onclick = async () => {
      if (!(await MJ.confirm('ลบรายการประจำ', 'รายการที่บันทึกไปแล้วจะยังอยู่ ยืนยันไหม?', 'ลบ'))) return;
      await MJ.data.deleteRecurring(v.id);
      MJ.sheet.close(); MJ.toast('ลบแล้ว', 'ok'); MJ.render();
    };
  });
}

/* ---------------------- ตั้งค่า OCR ---------------------- */
function openOcrSheet() {
  const cur = MJ.state.profile?.ocr_endpoint || '';
  MJ.sheet.open('ตั้งค่าการอ่านสลิป', `
    <p class="tiny muted mb">ค่าเริ่มต้นอ่านในเครื่องด้วย Tesseract.js (ฟรี ไม่ต้องตั้งค่า)
      ถ้าต้องการความแม่นยำสูงขึ้น รัน PaddleOCR เองแล้วใส่ URL ที่นี่
      (มีไฟล์ Docker ให้ในโฟลเดอร์ <code>ocr-service/</code> ของโปรเจกต์)</p>
    <label class="field"><span>PaddleOCR endpoint</span>
      <input type="url" id="oUrl" value="${MJ.esc(cur)}" placeholder="https://ocr.example.com"></label>
    <button class="btn btn-soft btn-block mb" id="oTest">ทดสอบการเชื่อมต่อ</button>
    <button class="btn btn-primary btn-block" id="oSave">บันทึก</button>
    <button class="btn btn-ghost btn-block" id="oClear">กลับไปใช้การอ่านในเครื่อง</button>`, (body) => {
    MJ.$('#oTest', body).onclick = async () => {
      const url = MJ.$('#oUrl', body).value.trim();
      if (!url) { MJ.toast('ใส่ URL ก่อนนะ', 'err'); return; }
      // เซิร์ฟเวอร์ฟรีอาจหลับอยู่ ให้เวลาปลุกสักหน่อย
      for (let i = 0; i < 8; i++) {
        MJ.loading(true, i === 0 ? 'กำลังทดสอบ…' : `กำลังปลุกเซิร์ฟเวอร์… (${i}/7)`);
        try {
          const res = await fetch(url.replace(/\/$/, '') + '/health');
          if (res.ok) {
            const info = await res.json().catch(() => ({}));
            MJ.loading(false);
            MJ.toast(`เชื่อมต่อได้ 👍 ${info.model || ''} ${info.lang ? '(' + info.lang + ')' : ''}`.trim(), 'ok');
            return;
          }
        } catch (e) { /* ยังไม่ตื่น ลองใหม่ */ }
        await new Promise((r) => setTimeout(r, 6000));
      }
      MJ.loading(false);
      MJ.toast('เชื่อมต่อไม่ได้ ลองเช็ก URL อีกครั้ง', 'err');
    };
    MJ.$('#oSave', body).onclick = async () => {
      await MJ.data.saveProfile({ ocr_endpoint: MJ.$('#oUrl', body).value.trim() || null });
      MJ.sheet.close(); MJ.toast('บันทึกแล้ว', 'ok'); MJ.render();
    };
    MJ.$('#oClear', body).onclick = async () => {
      await MJ.data.saveProfile({ ocr_endpoint: null });
      MJ.sheet.close(); MJ.toast('กลับไปใช้การอ่านในเครื่องแล้ว', 'ok'); MJ.render();
    };
  });
}

/* ---------------------- ตัวเตือนประจำวัน (ฝั่งเครื่อง) ---------------------- */
MJ.reminder = {
  timer: null,
  schedule() {
    clearTimeout(this.timer);
    const t = MJ.state.profile?.reminder_time;
    if (!t || !('Notification' in window) || Notification.permission !== 'granted') return;
    const [h, m] = String(t).split(':').map(Number);
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    this.timer = setTimeout(() => {
      const s = MJ.data.summary();
      new Notification('หมีจดเตือนแล้วนะ 🐻', {
        body: s.count ? `วันนี้จดไปแล้ว ${s.count} รายการ อย่าลืมจดที่เหลือน้า` : 'วันนี้ยังไม่ได้จดเลย มาจดกัน!',
        icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'mheejod-daily',
      });
      this.schedule();
    }, next - now);
  },
};

</script>
<script>
/* ===== 66-calendar.js ===== */
/* ===================================================================
   66-calendar.js — ปฏิทินรายเดือน + รายการล่วงหน้า (นัดจ่าย/นัดรับ)
   • เห็นทั้งเดือนว่าวันไหนใช้เท่าไหร่ วันไหนมีนัดจ่าย/นัดรับ
   • ถึงวันแล้วจะเด้งแจ้งเตือน + มีข้อความในแชท
   =================================================================== */
MJ.plan = {
  items: [],          // รายการล่วงหน้าของเดือนที่กำลังดู
  pending: [],        // ที่ถึงกำหนดแล้วแต่ยังไม่ได้ทำ

  async load() {
    const from = MJ.isoDate(MJ.startOfMonth(MJ.state.month));
    const to = MJ.isoDate(MJ.endOfMonth(MJ.state.month));
    const { data } = await MJ.sb.from('planned_items').select('*')
      .gte('due_date', from).lte('due_date', to).order('due_date');
    MJ.plan.items = data || [];
    return MJ.plan.items;
  },

  async save(item) {
    const payload = {
      user_id: MJ.state.user.id,
      title: (item.title || '').trim() || 'รายการล่วงหน้า',
      amount: Number(item.amount),
      type: item.type,
      category_id: item.category_id || null,
      due_date: item.due_date,
      note: item.note || null,
      repeat_freq: item.repeat_freq || 'none',
    };
    const q = item.id
      ? MJ.sb.from('planned_items').update(payload).eq('id', item.id)
      : MJ.sb.from('planned_items').insert(payload);
    const { error } = await q;
    if (error) throw error;
    await this.load();
  },

  async remove(id) {
    await MJ.sb.from('planned_items').delete().eq('id', id);
    await this.load();
  },

  /** บันทึกรายการล่วงหน้าเป็นรายการจริง แล้วปิดงาน */
  async confirm(item) {
    const tx = await MJ.data.addTransaction({
      amount: item.amount,
      type: item.type,
      category_id: item.category_id,
      note: item.title,
      transaction_date: new Date(item.due_date + 'T12:00:00'),
      source: 'manual',
    });
    await MJ.sb.from('planned_items')
      .update({ is_done: true, done_tx_id: tx.id }).eq('id', item.id);
    // ถ้าเป็นนัดซ้ำ สร้างรอบถัดไปให้อัตโนมัติ
    if (item.repeat_freq && item.repeat_freq !== 'none') {
      try { await MJ.sb.rpc('roll_planned', { p_item: item.id }); } catch (e) { /* ไม่สำเร็จก็ข้าม */ }
    }
    await this.load();
    return tx;
  },

  /** เช็กตอนเปิดแอป: มีอะไรถึงกำหนดไหม -> เด้งเตือน + ทักในแชท */
  async checkDue() {
    const today = MJ.isoDate(new Date());
    const { data } = await MJ.sb.from('planned_items').select('*')
      .eq('is_done', false).lte('due_date', today).order('due_date');
    MJ.plan.pending = data || [];
    if (!MJ.plan.pending.length) return 0;

    const total = MJ.plan.pending.reduce((a, i) =>
      a + (i.type === 'expense' ? Number(i.amount) : -Number(i.amount)), 0);
    const lines = MJ.plan.pending.slice(0, 4).map((i) =>
      `• ${i.type === 'income' ? 'รับ' : 'จ่าย'} ${MJ.esc(i.title)} ${MJ.fmtBaht(i.amount)}`
      + (i.due_date < today ? ` (เลยกำหนด ${MJ.dayLabel(i.due_date)})` : ''));

    const text = `⏰ ถึงกำหนดแล้ว ${MJ.plan.pending.length} รายการ\n${lines.join('\n')}`
      + (MJ.plan.pending.length > 4 ? `\n…และอีก ${MJ.plan.pending.length - 4} รายการ` : '')
      + (total > 0 ? `\nรวมต้องจ่าย ${MJ.fmtBaht(total)}` : '')
      + '\nแตะปฏิทินเพื่อกดยืนยันบันทึกได้เลย';

    // ทักในแชท (เก็บไว้ให้เห็นแม้ยังไม่ได้เปิดหน้าแชท)
    const last = MJ.add.chat[MJ.add.chat.length - 1];
    if (!last || last.text !== text) {
      const msg = { who: 'bot', text, at: Date.now() };
      MJ.add.chat.push(msg);
      MJ.add.persist(msg);
    }

    // เด้งแจ้งเตือนบนเครื่อง (ถ้าอนุญาตไว้)
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification('มีนัดต้องจ่าย/รับวันนี้ 🐻', {
          body: lines.join('\n').replace(/•\s/g, ''),
          icon: 'icons/icon-192.png', badge: 'icons/icon-192.png',
          tag: 'mheejod-planned', data: { url: './#calendar' },
        });
      } catch (e) { /* ไม่ได้ก็ยังมีข้อความในแชท */ }
    }
    MJ.toast(`มี ${MJ.plan.pending.length} รายการถึงกำหนดวันนี้`, 'err');
    return MJ.plan.pending.length;
  },
};

/* ============================ หน้าปฏิทิน ============================ */
MJ.calendar = { selected: null };

MJ.routes.calendar = (view) => {
  const month = MJ.state.month;
  const first = MJ.startOfMonth(month);
  const days = MJ.endOfMonth(month).getDate();
  const lead = first.getDay();                 // ช่องว่างก่อนวันที่ 1 (อา=0)

  // รวมยอดรายวัน
  const byDay = new Map();
  MJ.state.transactions.forEach((t) => {
    const d = new Date(t.transaction_date).getDate();
    const cur = byDay.get(d) || { income: 0, expense: 0, n: 0 };
    cur[t.type] += Number(t.amount); cur.n++;
    byDay.set(d, cur);
  });
  const plannedByDay = new Map();
  MJ.plan.items.forEach((i) => {
    const d = new Date(i.due_date + 'T12:00:00').getDate();
    if (!plannedByDay.has(d)) plannedByDay.set(d, []);
    plannedByDay.get(d).push(i);
  });

  const maxSpend = Math.max(1, ...Array.from(byDay.values()).map((v) => v.expense));
  const today = new Date();
  const isThisMonth = today.getMonth() === month.getMonth() && today.getFullYear() === month.getFullYear();
  const sel = MJ.calendar.selected;

  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const v = byDay.get(d);
    const plans = plannedByDay.get(d) || [];
    const isToday = isThisMonth && today.getDate() === d;
    const heat = v ? Math.min(1, v.expense / maxSpend) : 0;
    cells += `<button class="cal-cell ${isToday ? 'today' : ''} ${sel === d ? 'sel' : ''}" data-day="${d}">
      <span class="cal-num">${d}</span>
      ${v ? `<span class="cal-bar" style="opacity:${(0.25 + heat * 0.75).toFixed(2)}"></span>` : ''}
      ${v && v.income ? '<span class="cal-dot in"></span>' : ''}
      ${plans.length ? `<span class="cal-plan ${plans.some((p) => p.type === 'income') ? 'in' : ''}">${plans.length}</span>` : ''}
    </button>`;
  }

  const upcoming = MJ.plan.items.filter((i) => !i.is_done).slice(0, 6);

  view.innerHTML = `
    ${MJ.listTabs('calendar')}
    <div class="card">
      <div class="card-head">
        <h3>${MJ.monthLabelFull(month)}</h3>
        <button class="link" id="calAdd"><i class="fa fa-plus"></i> นัดล่วงหน้า</button>
      </div>
      <div class="cal-week">${['อา','จ','อ','พ','พฤ','ศ','ส'].map((w) => `<span>${w}</span>`).join('')}</div>
      <div class="cal-grid" id="calGrid">${cells}</div>
      <div class="cal-legend">
        <span><i class="cal-swatch spend"></i> รายจ่าย</span>
        <span><i class="cal-swatch income"></i> รายรับ</span>
        <span><i class="cal-swatch plan"></i> นัดล่วงหน้า</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>นัดที่ยังไม่ได้ทำ</h3>
        <span class="badge">${MJ.plan.items.filter((i) => !i.is_done).length} รายการ</span></div>
      ${upcoming.length ? upcoming.map((i) => planRow(i)).join('')
        : `<div class="empty"><span class="big">🗓️</span>ยังไม่มีนัดล่วงหน้าในเดือนนี้<br>
           <button class="btn btn-soft btn-sm mt" id="calAdd2">เพิ่มนัดจ่าย/นัดรับ</button></div>`}
    </div>`;

  MJ.bindListTabs(view);
  const openAdd = (date) => MJ.calendar.openPlanSheet(null, date);
  MJ.$('#calAdd', view).onclick = () => openAdd(MJ.isoDate(isThisMonth ? today : first));
  if (MJ.$('#calAdd2', view)) MJ.$('#calAdd2', view).onclick = () => openAdd(MJ.isoDate(isThisMonth ? today : first));

  view.querySelectorAll('[data-day]').forEach((b) => b.onclick = () => {
    MJ.calendar.selected = Number(b.dataset.day);
    MJ.calendar.openDaySheet(Number(b.dataset.day));
  });
  view.querySelectorAll('[data-plan]').forEach((el) => el.onclick = () => {
    const item = MJ.plan.items.find((x) => x.id === el.dataset.plan);
    if (item) MJ.calendar.openPlanSheet(item);
  });
};

function planRow(i) {
  const c = MJ.data.catById(i.category_id);
  const overdue = i.due_date < MJ.isoDate(new Date());
  return `<div class="list-item" data-plan="${i.id}">
    <span class="ic" style="background:${MJ.hex2rgba(c?.color || '#F2B23E', .18)}">${c?.icon || '🗓️'}</span>
    <span class="tx2"><b>${MJ.esc(MJ.fixThai(i.title))}</b>
      <small>${overdue ? '⚠️ เลยกำหนด ' : 'กำหนด '}${MJ.dayLabel(i.due_date)}</small></span>
    <span class="tx-amt ${i.type === 'income' ? 'in' : 'out'}">${i.type === 'income' ? '+' : '−'}${MJ.fmtMoney(i.amount)}</span>
  </div>`;
}

/* ---------------------- แผงของแต่ละวัน ---------------------- */
MJ.calendar.openDaySheet = function (day) {
  const date = new Date(MJ.state.month.getFullYear(), MJ.state.month.getMonth(), day);
  const iso = MJ.isoDate(date);
  const txs = MJ.state.transactions.filter((t) => MJ.isoDate(new Date(t.transaction_date)) === iso);
  const plans = MJ.plan.items.filter((i) => i.due_date === iso);
  const sum = MJ.data.summary(txs);

  MJ.sheet.open(MJ.dayLabel(iso), `
    <div class="stat-grid">
      <div class="stat"><div class="k">รายรับ</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(sum.income)}</div></div>
      <div class="stat"><div class="k">รายจ่าย</div><div class="v" style="color:var(--out)">${MJ.fmtBaht(sum.expense)}</div></div>
    </div>
    ${plans.length ? `<div class="card">
      <div class="card-head"><h3>นัดของวันนี้</h3></div>
      ${plans.map((i) => `<div class="plan-item ${i.is_done ? 'done' : ''}">
        <span class="tx2"><b>${MJ.esc(MJ.fixThai(i.title))}</b>
          <small>${i.is_done ? '✅ บันทึกแล้ว' : (i.type === 'income' ? 'รอรับเงิน' : 'รอจ่าย')}</small></span>
        <span class="tx-amt ${i.type === 'income' ? 'in' : 'out'}">${MJ.fmtMoney(i.amount)}</span>
        ${i.is_done ? '' : `<button class="btn btn-primary btn-sm" data-confirm="${i.id}">บันทึก</button>`}
        <button class="icon-btn" data-edit="${i.id}"><i class="fa fa-pen"></i></button>
      </div>`).join('')}
    </div>` : ''}
    <div class="card">
      <div class="card-head"><h3>รายการวันนี้</h3><span class="badge">${txs.length}</span></div>
      ${txs.length ? txs.map((t) => MJ.tx.row(t)).join('') : '<div class="empty tiny">ยังไม่มีรายการ</div>'}
    </div>
    <button class="btn btn-soft btn-block" id="dayAddPlan"><i class="fa fa-calendar"></i> เพิ่มนัดวันนี้</button>
  `, (body) => {
    MJ.tx.bindRows(body);
    MJ.$('#dayAddPlan', body).onclick = () => MJ.calendar.openPlanSheet(null, iso);
    body.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () =>
      MJ.calendar.openPlanSheet(MJ.plan.items.find((x) => x.id === b.dataset.edit)));
    body.querySelectorAll('[data-confirm]').forEach((b) => b.onclick = async () => {
      const item = MJ.plan.items.find((x) => x.id === b.dataset.confirm);
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.plan.confirm(item);
        MJ.buzz(30);
        MJ.sheet.close();
        MJ.toast('บันทึกเป็นรายการจริงแล้ว 🐻', 'ok');
        MJ.render();
      } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    });
  });
};

/* ---------------------- เพิ่ม/แก้ไขนัดล่วงหน้า ---------------------- */
MJ.calendar.openPlanSheet = function (item, defaultDate) {
  const isNew = !item;
  const v = item || {
    title: '', amount: '', type: 'expense', category_id: null,
    due_date: defaultDate || MJ.isoDate(new Date()), note: '',
  };
  const cats = MJ.state.categories;

  MJ.sheet.open(isNew ? 'เพิ่มนัดล่วงหน้า' : 'แก้ไขนัด', `
    <div class="seg" id="planType">
      <button class="seg-btn ${v.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> ต้องจ่าย</button>
      <button class="seg-btn ${v.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> จะได้รับ</button>
    </div>
    <label class="field"><span>เรื่องอะไร</span>
      <input type="text" id="plTitle" value="${MJ.esc(v.title)}" placeholder="เช่น ค่าบัตรเครดิต, เงินเดือนออก"></label>
    <div class="row">
      <label class="field"><span>จำนวนเงิน</span>
        <input type="number" step="0.01" inputmode="decimal" id="plAmount" value="${v.amount}"></label>
      <label class="field"><span>วันครบกำหนด</span>
        <input type="date" id="plDate" value="${String(v.due_date).slice(0, 10)}"></label>
    </div>
    <label class="field"><span>ทำซ้ำ</span><select id="plRepeat">
      ${[['none','ครั้งเดียว'],['weekly','ทุกสัปดาห์'],['monthly','ทุกเดือน'],['yearly','ทุกปี']]
        .map(([val, label]) => `<option value="${val}" ${(v.repeat_freq || 'none') === val ? 'selected' : ''}>${label}</option>`).join('')}
    </select></label>
    <label class="field"><span>หมวดหมู่</span><select id="plCat">
      ${cats.filter((c) => c.type === v.type).map((c) =>
        `<option value="${c.id}" ${c.id === v.category_id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('')}
    </select></label>
    <p class="tiny muted mb">ถึงวันแล้วหมีจะเด้งแจ้งเตือนและทักในแชทให้ 🐻 (นัดซ้ำจะสร้างรอบถัดไปอัตโนมัติเมื่อกดบันทึก)</p>
    <button class="btn btn-primary btn-block" id="plSave">${isNew ? 'เพิ่มนัด' : 'บันทึก'}</button>
    ${isNew ? '' : `<button class="btn btn-soft btn-block mt" id="plDone">บันทึกเป็นรายการจริงเลย</button>
      <button class="btn btn-danger btn-block mt" id="plDel">ลบนัดนี้</button>`}
  `, (body) => {
    let type = v.type;
    MJ.segInit(MJ.$('#planType', body), (b) => {
      type = b.dataset.type;
      MJ.$('#plCat', body).innerHTML = cats.filter((c) => c.type === type)
        .map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('');
    });

    MJ.$('#plSave', body).onclick = async () => {
      const amount = parseFloat(MJ.$('#plAmount', body).value);
      if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.plan.save({
          id: v.id, type, amount,
          title: MJ.$('#plTitle', body).value,
          category_id: MJ.$('#plCat', body).value || null,
          due_date: MJ.$('#plDate', body).value,
          repeat_freq: MJ.$('#plRepeat', body).value,
        });
        MJ.sheet.close(); MJ.toast('บันทึกนัดแล้ว 🗓️', 'ok'); MJ.render();
      } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };

    if (MJ.$('#plDone', body)) MJ.$('#plDone', body).onclick = async () => {
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.plan.confirm(v);
        MJ.sheet.close(); MJ.toast('บันทึกเป็นรายการจริงแล้ว', 'ok'); MJ.render();
      } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
    if (MJ.$('#plDel', body)) MJ.$('#plDel', body).onclick = async () => {
      if (!(await MJ.confirm('ลบนัด', 'ลบนัดนี้ใช่ไหม?', 'ลบ'))) return;
      await MJ.plan.remove(v.id);
      MJ.sheet.close(); MJ.toast('ลบแล้ว', 'ok'); MJ.render();
    };
  });
};

</script>
<script>
/* ===== 67-share.js ===== */
/* ===================================================================
   67-share.js — สร้างรูปสรุปประจำเดือนไว้แชร์อวดเพื่อน
   วาดด้วย canvas ทั้งหมด (ไม่ต้องพึ่งไลบรารีภายนอก) แล้วแชร์/ดาวน์โหลด
   =================================================================== */
MJ.share = {
  W: 1080,
  H: 1350,

  /** สร้างรูปสรุปของเดือนที่กำลังดู -> คืน canvas */
  async buildCanvas(opts) {
    const o = Object.assign({ hideAmounts: false }, opts || {});
    const cv = document.createElement('canvas');
    cv.width = this.W; cv.height = this.H;
    const g = cv.getContext('2d');
    const s = MJ.data.summary();
    const cats = MJ.data.byCategory('expense').slice(0, 5);
    const totalExpense = s.expense || 1;
    const days = MJ.endOfMonth(MJ.state.month).getDate();
    const series = MJ.data.dailySeries('expense');
    const noSpendDays = series.filter((v) => v === 0).length;

    try { await document.fonts.ready; } catch (e) { /* ใช้ฟอนต์สำรอง */ }
    const F = (size, weight) => `${weight || 400} ${size}px "FC Iconic", "Noto Sans Thai", sans-serif`;
    const money = (n) => o.hideAmounts ? '••••' : '฿' + MJ.fmtMoney(n);

    /* ---------- พื้นหลัง ---------- */
    const bg = g.createLinearGradient(0, 0, this.W, this.H);
    bg.addColorStop(0, '#FFF9F2');
    bg.addColorStop(1, '#FDEBD3');
    g.fillStyle = bg;
    g.fillRect(0, 0, this.W, this.H);

    // วงกลมน้ำผึ้งจาง ๆ
    g.globalAlpha = 0.5;
    [[900, 120, 220, '#F2B23E'], [120, 1180, 260, '#8B5E3C'], [980, 1000, 140, '#F2724A']]
      .forEach(([x, y, r, c]) => {
        const rad = g.createRadialGradient(x, y, 0, x, y, r);
        rad.addColorStop(0, c + '55'); rad.addColorStop(1, c + '00');
        g.fillStyle = rad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      });
    g.globalAlpha = 1;

    /* ---------- หัวเรื่อง ---------- */
    g.textAlign = 'left';
    g.font = '64px system-ui';
    g.fillText('🐻', 72, 132);
    g.fillStyle = '#2C2622';
    g.font = F(44, 700);
    g.fillText('หมีจด', 152, 118);
    g.fillStyle = '#A2968C';
    g.font = F(26, 400);
    g.fillText('สรุปการเงินของฉัน', 152, 152);

    g.textAlign = 'right';
    g.fillStyle = '#8B5E3C';
    g.font = F(34, 700);
    g.fillText(MJ.monthLabelFull(MJ.state.month), this.W - 72, 132);

    /* ---------- การ์ดยอดคงเหลือ ---------- */
    const cardY = 208, cardH = 300;
    const cg = g.createLinearGradient(72, cardY, this.W - 72, cardY + cardH);
    cg.addColorStop(0, '#A87A55'); cg.addColorStop(1, '#6B462B');
    this.roundRect(g, 72, cardY, this.W - 144, cardH, 48);
    g.fillStyle = cg; g.fill();

    g.textAlign = 'left';
    g.fillStyle = 'rgba(255,246,233,.8)';
    g.font = F(28, 400);
    g.fillText('คงเหลือเดือนนี้', 124, cardY + 78);

    g.fillStyle = '#FFF6E9';
    g.font = F(96, 800);
    g.fillText(money(s.balance), 124, cardY + 176);

    // กล่องรายรับ/รายจ่าย
    const boxW = (this.W - 144 - 52 - 52 - 24) / 2;
    [['รายรับ', s.income, '#B9F5D2'], ['รายจ่าย', s.expense, '#FFC7D2']].forEach(([label, val, color], i) => {
      const x = 124 + i * (boxW + 24);
      this.roundRect(g, x, cardY + 200, boxW, 72, 24);
      g.fillStyle = 'rgba(255,255,255,.16)'; g.fill();
      g.fillStyle = 'rgba(255,246,233,.75)';
      g.font = F(22, 400);
      g.fillText(label, x + 24, cardY + 230);
      g.fillStyle = color;
      g.font = F(32, 700);
      g.fillText(money(val), x + 24, cardY + 262);
    });

    /* ---------- หมวดที่ใช้มากสุด (ตำแหน่งคงที่ กันล้นขอบ) ---------- */
    const top = cats.slice(0, 4);
    g.fillStyle = '#2C2622';
    g.font = F(34, 700);
    g.fillText('ใช้ไปกับอะไรบ้าง', 72, 578);

    if (top.length) {
      top.forEach((c, i) => {
        const y = 640 + i * 74;
        const pct = Math.round((c.total / totalExpense) * 100);

        g.font = '32px system-ui';
        g.fillText(c.icon || '•', 74, y + 2);

        g.fillStyle = '#2C2622';
        g.font = F(28, 600);
        g.fillText(this.clip(g, c.name, 360), 126, y);

        g.textAlign = 'right';
        g.fillStyle = '#6E645C';
        g.font = F(26, 600);
        g.fillText(`${money(c.total)} · ${pct}%`, this.W - 72, y);
        g.textAlign = 'left';

        const barW = this.W - 144;
        this.roundRect(g, 72, y + 16, barW, 14, 7);
        g.fillStyle = '#EFE3D3'; g.fill();
        this.roundRect(g, 72, y + 16, Math.max(14, barW * (c.total / totalExpense)), 14, 7);
        g.fillStyle = c.color || '#F2B23E'; g.fill();
      });
    } else {
      g.fillStyle = '#A2968C'; g.font = F(28, 400);
      g.fillText('เดือนนี้ยังไม่มีรายจ่าย', 72, 650);
    }

    /* ---------- กราฟรายวัน ---------- */
    g.fillStyle = '#2C2622';
    g.font = F(34, 700);
    g.fillText('จ่ายรายวัน', 72, 972);

    const chartY = 1000, chartH = 130, chartW = this.W - 144;
    const maxV = Math.max(1, ...series);
    const bw = chartW / days;
    series.forEach((v, i) => {
      const h = (v / maxV) * chartH;
      if (h <= 0) return;
      this.roundRect(g, 72 + i * bw + bw * 0.18, chartY + chartH - h, bw * 0.64, h, Math.min(6, bw * 0.32));
      g.fillStyle = '#E3556F'; g.fill();
    });
    g.strokeStyle = '#E6D8C6'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(72, chartY + chartH); g.lineTo(this.W - 72, chartY + chartH); g.stroke();

    /* ---------- สถิติสนุก ๆ ---------- */
    const statY = 1178;
    const stats = [
      ['วันที่ไม่ได้ใช้เงิน', `${noSpendDays} วัน`],
      ['จำนวนรายการ', `${s.count} รายการ`],
      ['เฉลี่ยต่อวัน', money(Math.round(s.expense / days))],
    ];
    const sw = (this.W - 144 - 32) / 3;
    stats.forEach(([k, v], i) => {
      const x = 72 + i * (sw + 16);
      this.roundRect(g, x, statY, sw, 104, 28);
      g.fillStyle = '#FFFFFF'; g.fill();
      g.textAlign = 'center';
      g.fillStyle = '#A2968C'; g.font = F(21, 400);
      g.fillText(k, x + sw / 2, statY + 42);
      g.fillStyle = '#2C2622'; g.font = F(30, 700);
      g.fillText(v, x + sw / 2, statY + 80);
      g.textAlign = 'left';
    });

    /* ---------- ท้ายรูป ---------- */
    g.textAlign = 'center';
    g.fillStyle = '#A2968C';
    g.font = F(24, 400);
    g.fillText('จดด้วยหมีจด · nutikul-i.github.io/MheeJod', this.W / 2, this.H - 40);

    return cv;
  },

  /* ---------- ตัวช่วยวาด ---------- */
  roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  },
  clip(g, text, maxW) {
    let t = String(text);
    if (g.measureText(t).width <= maxW) return t;
    while (t.length > 3 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  },

  /* ---------- แผงแชร์ ---------- */
  open() {
    MJ.sheet.open('แชร์สรุปเดือนนี้', `
      <div class="share-preview"><canvas id="shareCanvas"></canvas></div>
      <div class="list-item">
        <span class="ic"><i class="fa fa-eye"></i></span>
        <span class="tx2"><b>ซ่อนจำนวนเงิน</b><small>อวดสัดส่วนได้โดยไม่บอกยอดจริง</small></span>
        <div class="switch" id="shHide"><i></i></div>
      </div>
      <button class="btn btn-primary btn-block mt" id="shShare"><i class="fa fa-send"></i> แชร์รูปนี้</button>
      <button class="btn btn-soft btn-block mt" id="shSave"><i class="fa fa-download"></i> บันทึกลงเครื่อง</button>
    `, async (body) => {
      let hide = false;
      const target = MJ.$('#shareCanvas', body);

      const draw = async () => {
        MJ.loading(true, 'กำลังวาดรูปสรุป…');
        const cv = await this.buildCanvas({ hideAmounts: hide });
        target.width = cv.width; target.height = cv.height;
        target.getContext('2d').drawImage(cv, 0, 0);
        MJ.loading(false);
        return cv;
      };
      await draw();

      MJ.$('#shHide', body).onclick = async (e) => {
        hide = !hide;
        e.currentTarget.classList.toggle('on', hide);
        await draw();
      };

      const toBlob = () => new Promise((res) => target.toBlob(res, 'image/png', 0.95));

      MJ.$('#shShare', body).onclick = async () => {
        const blob = await toBlob();
        const file = new File([blob], `หมีจด-${MJ.isoDate(MJ.state.month).slice(0, 7)}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'สรุปการเงินของฉัน',
              text: `สรุป ${MJ.monthLabelFull(MJ.state.month)} จากหมีจด 🐻`,
            });
          } catch (e) { /* ผู้ใช้กดยกเลิก */ }
        } else {
          this.download(blob);
          MJ.toast('เครื่องนี้แชร์ตรงไม่ได้ บันทึกรูปให้แทนแล้ว', 'ok');
        }
      };

      MJ.$('#shSave', body).onclick = async () => this.download(await toBlob());
    });
  },

  download(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `หมีจด-${MJ.isoDate(MJ.state.month).slice(0, 7)}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    MJ.toast('บันทึกรูปแล้ว 🖼️', 'ok');
  },
};

</script>
<script>
/* ===== 68-accounts.js ===== */
/* ===================================================================
   68-accounts.js — กระเป๋าเงิน/บัญชี + โอนระหว่างกระเป๋า
   =================================================================== */
MJ.accounts = {
  async save(a) {
    const payload = {
      user_id: MJ.state.user.id,
      name: (a.name || '').trim(),
      type: a.type || 'cash',
      icon: a.icon || '👛',
      color: a.color || '#8B5E3C',
      opening_balance: Number(a.opening_balance || 0),
      credit_limit: a.credit_limit === '' || a.credit_limit == null ? null : Number(a.credit_limit),
      sort_order: a.sort_order ?? (MJ.state.accounts.length + 1),
    };
    const q = a.id
      ? MJ.sb.from('accounts').update(payload).eq('id', a.id)
      : MJ.sb.from('accounts').insert(payload);
    const { error } = await q;
    if (error) throw error;
    await MJ.data.loadAllAccounts();
  },

  async archive(id) {
    const { error } = await MJ.sb.from('accounts').update({ is_archived: true }).eq('id', id);
    if (error) throw error;
    await MJ.data.loadAllAccounts();
  },

  async setDefault(id) {
    await MJ.sb.from('accounts').update({ is_default: false }).eq('user_id', MJ.state.user.id);
    await MJ.sb.from('accounts').update({ is_default: true }).eq('id', id);
    await MJ.data.loadAllAccounts();
  },

  /** โอนเงินระหว่างกระเป๋า — เก็บเป็นรายการชนิด transfer (ไม่นับเป็นรายรับ/จ่าย) */
  async transfer({ from, to, amount, note, date }) {
    if (from === to) throw new Error('เลือกกระเป๋าต้นทาง/ปลายทางให้ต่างกัน');
    const a = MJ.data.accountById(from), b = MJ.data.accountById(to);
    return MJ.data.addTransaction({
      amount: Number(amount),
      type: 'expense',
      kind: 'transfer',
      account_id: from,
      to_account_id: to,
      category_id: null,
      note: note || `โอน ${a?.name || ''} → ${b?.name || ''}`,
      transaction_date: date ? new Date(date) : new Date(),
      source: 'manual',
    });
  },
};

MJ.routes.accounts = (view) => {
  const list = MJ.state.accounts || [];
  const bal = MJ.state.balances || {};
  const total = list.reduce((sum, a) => sum + (bal[a.id] ?? Number(a.opening_balance)), 0);
  const TYPE_LABEL = { cash: 'เงินสด', bank: 'ธนาคาร', credit: 'บัตรเครดิต', ewallet: 'วอลเล็ต', savings: 'เงินออม' };

  view.innerHTML = `
    <div class="balance">
      <div class="lbl">เงินรวมทุกกระเป๋า</div>
      <div class="amt" id="accTotal">${MJ.fmtBaht(total)}</div>
      <div class="grid">
        <div class="box"><span class="tiny">จำนวนกระเป๋า</span><b>${list.length}</b></div>
        <div class="box"><span class="tiny">รายการเดือนนี้</span><b>${MJ.state.transactions.length}</b></div>
      </div>
    </div>

    <div class="chips">
      <button class="chip" id="accAdd"><i class="fa fa-plus"></i> เพิ่มกระเป๋า</button>
      <button class="chip" id="accTransfer"><i class="fa fa-rightleft"></i> โอนระหว่างกระเป๋า</button>
    </div>

    <div class="card">
      <div class="card-head"><h3>กระเป๋าของฉัน</h3></div>
      ${list.length ? list.map((a) => {
        const b = bal[a.id] ?? Number(a.opening_balance);
        const isCredit = a.type === 'credit';
        return `<div class="list-item" data-acc="${a.id}">
          <span class="ic" style="background:${MJ.hex2rgba(a.color, .18)}">${a.icon}</span>
          <span class="tx2"><b>${MJ.esc(a.name)}${a.is_default ? ' <span class="badge">หลัก</span>' : ''}</b>
            <small>${TYPE_LABEL[a.type] || a.type}${isCredit && a.credit_limit ? ` • วงเงิน ${MJ.fmtBaht(a.credit_limit)}` : ''}</small></span>
          <span class="tx-amt ${b < 0 ? 'out' : ''}">${MJ.fmtBaht(b)}</span>
        </div>`;
      }).join('') : '<div class="empty tiny">ยังไม่มีกระเป๋า</div>'}
    </div>

    <div class="card">
      <div class="card-head"><h3>โอนล่าสุด</h3></div>
      ${(() => {
        const tr = MJ.state.transactions.filter((t) => t.kind === 'transfer').slice(0, 5);
        return tr.length ? tr.map((t) => {
          const a = MJ.data.accountById(t.account_id), b = MJ.data.accountById(t.to_account_id);
          return `<div class="list-item">
            <span class="ic"><i class="fa fa-rightleft"></i></span>
            <span class="tx2"><b>${MJ.esc(a?.name || '-')} → ${MJ.esc(b?.name || '-')}</b>
              <small>${MJ.dayLabel(t.transaction_date)} ${MJ.timeLabel(t.transaction_date)}</small></span>
            <span class="tx-amt">${MJ.fmtBaht(t.amount)}</span>
          </div>`;
        }).join('') : '<div class="empty tiny">ยังไม่มีการโอนระหว่างกระเป๋า</div>';
      })()}
    </div>`;

  MJ.countUp(MJ.$('#accTotal', view), total);
  MJ.$('#accAdd', view).onclick = () => MJ.accounts.openSheet(null);
  MJ.$('#accTransfer', view).onclick = () => MJ.accounts.openTransferSheet();
  view.querySelectorAll('[data-acc]').forEach((el) => el.onclick = () =>
    MJ.accounts.openSheet(MJ.data.accountById(el.dataset.acc)));
};

MJ.accounts.openSheet = function (acc) {
  const isNew = !acc;
  const a = acc || { name: '', type: 'cash', icon: '👛', color: '#F2B23E', opening_balance: 0, credit_limit: '' };
  const ICONS = ['👛','🏦','💳','📱','🐷','💵','🏧','🎁'];
  const COLORS = ['#F2B23E','#4A9DF2','#E2607A','#3EA96B','#B36AE2','#8B5E3C','#5BC0A5','#F2724A'];
  const TYPES = [['cash','เงินสด'],['bank','ธนาคาร'],['credit','บัตรเครดิต'],['ewallet','วอลเล็ต'],['savings','เงินออม']];

  MJ.sheet.open(isNew ? 'เพิ่มกระเป๋า' : 'แก้ไขกระเป๋า', `
    <label class="field"><span>ชื่อกระเป๋า</span>
      <input type="text" id="acName" value="${MJ.esc(a.name)}" placeholder="เช่น กสิกร, เงินสด, บัตรเครดิต"></label>
    <label class="field"><span>ประเภท</span><select id="acType">
      ${TYPES.map(([v, l]) => `<option value="${v}" ${a.type === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select></label>
    <div class="field"><span>ไอคอน</span>
      <div class="chips" id="acIcons">${ICONS.map((i) =>
        `<button class="chip ${i === a.icon ? 'active' : ''}" data-icon="${i}" style="font-size:18px">${i}</button>`).join('')}</div>
    </div>
    <div class="field"><span>สี</span>
      <div class="chips" id="acColors">${COLORS.map((c) =>
        `<button class="chip" data-color="${c}" style="background:${c};width:32px;height:32px;padding:0;border-radius:11px;
          ${c === a.color ? 'outline:3px solid var(--ink);outline-offset:2px' : ''}"></button>`).join('')}</div>
    </div>
    <div class="row">
      <label class="field"><span>ยอดตั้งต้น</span>
        <input type="number" step="0.01" inputmode="decimal" id="acOpen" value="${a.opening_balance ?? 0}"></label>
      <label class="field"><span>วงเงิน (บัตรเครดิต)</span>
        <input type="number" step="1" inputmode="decimal" id="acLimit" value="${a.credit_limit ?? ''}"></label>
    </div>
    <button class="btn btn-primary btn-block" id="acSave">${isNew ? 'เพิ่มกระเป๋า' : 'บันทึก'}</button>
    ${isNew ? '' : `${a.is_default ? '' : '<button class="btn btn-soft btn-block mt" id="acDefault">ตั้งเป็นกระเป๋าหลัก</button>'}
      <button class="btn btn-danger btn-block mt" id="acDel">เก็บกระเป๋านี้เข้าคลัง</button>`}
  `, (body) => {
    let icon = a.icon, color = a.color;
    body.querySelectorAll('#acIcons .chip').forEach((b) => b.onclick = () => {
      icon = b.dataset.icon;
      body.querySelectorAll('#acIcons .chip').forEach((x) => x.classList.toggle('active', x === b));
    });
    body.querySelectorAll('#acColors .chip').forEach((b) => b.onclick = () => {
      color = b.dataset.color;
      body.querySelectorAll('#acColors .chip').forEach((x) => x.style.outline = x === b ? '3px solid var(--ink)' : '');
    });

    MJ.$('#acSave', body).onclick = async () => {
      const name = MJ.$('#acName', body).value.trim();
      if (!name) { MJ.toast('ตั้งชื่อกระเป๋าก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.accounts.save({
          id: a.id, name, icon, color,
          type: MJ.$('#acType', body).value,
          opening_balance: MJ.$('#acOpen', body).value || 0,
          credit_limit: MJ.$('#acLimit', body).value,
        });
        MJ.sheet.close(); MJ.toast('บันทึกแล้ว 👛', 'ok'); MJ.render();
      } catch (e) {
        MJ.toast(/duplicate/i.test(e.message) ? 'มีกระเป๋าชื่อนี้แล้ว' : 'บันทึกไม่สำเร็จ', 'err');
      } finally { MJ.loading(false); }
    };
    if (MJ.$('#acDefault', body)) MJ.$('#acDefault', body).onclick = async () => {
      await MJ.accounts.setDefault(a.id);
      MJ.sheet.close(); MJ.toast('ตั้งเป็นกระเป๋าหลักแล้ว', 'ok'); MJ.render();
    };
    if (MJ.$('#acDel', body)) MJ.$('#acDel', body).onclick = async () => {
      if (!(await MJ.confirm('เก็บกระเป๋า', 'รายการเดิมยังอยู่ แต่กระเป๋านี้จะไม่แสดงอีก', 'เก็บเข้าคลัง'))) return;
      await MJ.accounts.archive(a.id);
      MJ.sheet.close(); MJ.toast('เก็บแล้ว', 'ok'); MJ.render();
    };
  });
};

MJ.accounts.openTransferSheet = function () {
  const list = MJ.state.accounts || [];
  if (list.length < 2) { MJ.toast('ต้องมีอย่างน้อย 2 กระเป๋าถึงจะโอนได้', 'err'); return; }
  const opts = (sel) => list.map((a) =>
    `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${a.icon} ${MJ.esc(a.name)}</option>`).join('');

  MJ.sheet.open('โอนระหว่างกระเป๋า', `
    <label class="field"><span>จากกระเป๋า</span><select id="trFrom">${opts(list[0].id)}</select></label>
    <label class="field"><span>ไปกระเป๋า</span><select id="trTo">${opts(list[1].id)}</select></label>
    <div class="row">
      <label class="field"><span>จำนวนเงิน</span>
        <input type="number" step="0.01" inputmode="decimal" id="trAmount" placeholder="0.00"></label>
      <label class="field"><span>วันที่</span>
        <input type="datetime-local" id="trDate" value="${MJ.isoLocal(new Date())}"></label>
    </div>
    <label class="field"><span>บันทึกช่วยจำ</span><input type="text" id="trNote" placeholder="เช่น ถอนเงินสด"></label>
    <p class="tiny muted mb">การโอนไม่ถูกนับเป็นรายรับหรือรายจ่าย แค่ย้ายเงินระหว่างกระเป๋า</p>
    <button class="btn btn-primary btn-block" id="trSave">โอนเลย</button>
  `, (body) => {
    MJ.$('#trSave', body).onclick = async () => {
      const amount = parseFloat(MJ.$('#trAmount', body).value);
      if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังโอน…');
      try {
        await MJ.accounts.transfer({
          from: MJ.$('#trFrom', body).value,
          to: MJ.$('#trTo', body).value,
          amount,
          note: MJ.$('#trNote', body).value.trim(),
          date: MJ.$('#trDate', body).value,
        });
        await MJ.data.loadBalances();
        MJ.sheet.close(); MJ.buzz(30); MJ.toast('โอนเรียบร้อย 💸', 'ok'); MJ.render();
      } catch (e) { MJ.toast(e.message || 'โอนไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
  });
};

</script>
<script>
/* ===== 69-plans.js ===== */
/* ===================================================================
   69-plans.js — เป้าหมายเก็บเงิน + หนี้/ให้ยืม
   =================================================================== */
MJ.goals = {
  list: [],
  async load() {
    const { data } = await MJ.sb.from('goals').select('*').order('is_done').order('due_date', { nullsFirst: false });
    MJ.goals.list = data || [];
    return MJ.goals.list;
  },
  async save(g) {
    const payload = {
      user_id: MJ.state.user.id,
      title: (g.title || '').trim() || 'เป้าหมายใหม่',
      target_amount: Number(g.target_amount),
      saved_amount: Number(g.saved_amount || 0),
      icon: g.icon || '🎯',
      color: g.color || '#3EA96B',
      due_date: g.due_date || null,
    };
    const q = g.id ? MJ.sb.from('goals').update(payload).eq('id', g.id) : MJ.sb.from('goals').insert(payload);
    const { error } = await q;
    if (error) throw error;
    await this.load();
  },
  async addMoney(goal, amount) {
    const saved = Number(goal.saved_amount) + Number(amount);
    await MJ.sb.from('goals').update({
      saved_amount: saved,
      is_done: saved >= Number(goal.target_amount),
    }).eq('id', goal.id);
    await this.load();
  },
  async remove(id) { await MJ.sb.from('goals').delete().eq('id', id); await this.load(); },
};

MJ.debts = {
  list: [],
  async load() {
    const { data } = await MJ.sb.from('debts').select('*').order('is_settled').order('due_date', { nullsFirst: false });
    MJ.debts.list = data || [];
    return MJ.debts.list;
  },
  async save(d) {
    const payload = {
      user_id: MJ.state.user.id,
      person: (d.person || '').trim() || 'ไม่ระบุชื่อ',
      direction: d.direction,
      amount: Number(d.amount),
      paid_amount: Number(d.paid_amount || 0),
      due_date: d.due_date || null,
      note: d.note || null,
    };
    const q = d.id ? MJ.sb.from('debts').update(payload).eq('id', d.id) : MJ.sb.from('debts').insert(payload);
    const { error } = await q;
    if (error) throw error;
    await this.load();
  },
  async pay(debt, amount, alsoRecord) {
    const paid = Number(debt.paid_amount) + Number(amount);
    await MJ.sb.from('debts').update({
      paid_amount: paid,
      is_settled: paid >= Number(debt.amount),
    }).eq('id', debt.id);

    if (alsoRecord) {
      await MJ.data.addTransaction({
        amount,
        type: debt.direction === 'i_owe' ? 'expense' : 'income',
        note: (debt.direction === 'i_owe' ? 'จ่ายคืน ' : 'ได้รับคืนจาก ') + debt.person,
        transaction_date: new Date(),
        source: 'manual',
      });
    }
    await this.load();
  },
  async remove(id) { await MJ.sb.from('debts').delete().eq('id', id); await this.load(); },
};

/* ============================ หน้าแผนการเงิน ============================ */
MJ.plans = { tab: 'goals' };

MJ.routes.plans = (view) => {
  const tab = MJ.plans.tab;
  view.innerHTML = `
    <div class="seg" id="planTabs">
      <button class="seg-btn ${tab === 'goals' ? 'active' : ''}" data-tab="goals"><i class="fa fa-piggy"></i> เป้าหมายเก็บเงิน</button>
      <button class="seg-btn ${tab === 'debts' ? 'active' : ''}" data-tab="debts"><i class="fa fa-rightleft"></i> หนี้/ให้ยืม</button>
    </div>
    <div id="plansBody"></div>`;
  MJ.segInit(MJ.$('#planTabs', view), (b) => { MJ.plans.tab = b.dataset.tab; MJ.render(); });
  const body = MJ.$('#plansBody', view);
  (tab === 'goals' ? renderGoals : renderDebts)(body);
};

function renderGoals(body) {
  const list = MJ.goals.list;
  const active = list.filter((g) => !g.is_done);
  const totalTarget = active.reduce((a, g) => a + Number(g.target_amount), 0);
  const totalSaved = active.reduce((a, g) => a + Number(g.saved_amount), 0);

  body.innerHTML = `
    ${active.length ? `<div class="stat-grid">
      <div class="stat"><div class="k">เก็บได้แล้ว</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(totalSaved)}</div></div>
      <div class="stat"><div class="k">เป้าหมายรวม</div><div class="v">${MJ.fmtBaht(totalTarget)}</div></div>
    </div>` : ''}
    <div class="card">
      <div class="card-head"><h3>เป้าหมายของฉัน</h3><button class="link" id="goalAdd"><i class="fa fa-plus"></i> เพิ่ม</button></div>
      ${list.length ? list.map((g) => {
        const pct = Math.min(100, (Number(g.saved_amount) / Number(g.target_amount)) * 100);
        return `<div class="bud" data-goal="${g.id}">
          <div class="bud-top">
            <span class="bud-name">${g.icon} ${MJ.esc(g.title)}${g.is_done ? ' ✅' : ''}</span>
            <span>${MJ.fmtBaht(g.saved_amount)} <span class="muted tiny">/ ${MJ.fmtMoney(g.target_amount)}</span></span>
          </div>
          <div class="bar"><i style="width:${pct}%;background:${g.color}"></i></div>
          <div class="bud-foot">
            <span>${g.is_done ? 'ถึงเป้าแล้ว! 🎉' : `เหลืออีก ${MJ.fmtBaht(Number(g.target_amount) - Number(g.saved_amount))}`}</span>
            <span>${g.due_date ? 'ภายใน ' + MJ.dayLabel(g.due_date) : Math.round(pct) + '%'}</span>
          </div>
        </div>`;
      }).join('') : `<div class="empty"><span class="big">🎯</span>ยังไม่มีเป้าหมาย<br>
        <button class="btn btn-soft btn-sm mt" id="goalAdd2">ตั้งเป้าหมายแรก</button></div>`}
    </div>`;

  const add = () => MJ.plans.openGoalSheet(null);
  MJ.$('#goalAdd', body).onclick = add;
  if (MJ.$('#goalAdd2', body)) MJ.$('#goalAdd2', body).onclick = add;
  body.querySelectorAll('[data-goal]').forEach((el) => el.onclick = () =>
    MJ.plans.openGoalSheet(MJ.goals.list.find((g) => g.id === el.dataset.goal)));
}

function renderDebts(body) {
  const list = MJ.debts.list;
  const owedToMe = list.filter((d) => d.direction === 'owed_to_me' && !d.is_settled)
    .reduce((a, d) => a + (Number(d.amount) - Number(d.paid_amount)), 0);
  const iOwe = list.filter((d) => d.direction === 'i_owe' && !d.is_settled)
    .reduce((a, d) => a + (Number(d.amount) - Number(d.paid_amount)), 0);

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="k">คนอื่นติดเรา</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(owedToMe)}</div></div>
      <div class="stat"><div class="k">เราติดคนอื่น</div><div class="v" style="color:var(--out)">${MJ.fmtBaht(iOwe)}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>รายการหนี้</h3><button class="link" id="debtAdd"><i class="fa fa-plus"></i> เพิ่ม</button></div>
      ${list.length ? list.map((d) => {
        const left = Number(d.amount) - Number(d.paid_amount);
        return `<div class="list-item ${d.is_settled ? 'muted' : ''}" data-debt="${d.id}">
          <span class="ic" style="background:${MJ.hex2rgba(d.direction === 'i_owe' ? '#E3556F' : '#2FA36B', .16)}">
            <i class="fa ${d.direction === 'i_owe' ? 'fa-arrow-up' : 'fa-arrow-down'}"></i></span>
          <span class="tx2"><b>${MJ.esc(MJ.fixThai(d.person))}${d.is_settled ? ' ✅' : ''}</b>
            <small>${d.direction === 'i_owe' ? 'เราติดเขา' : 'เขาติดเรา'}${d.due_date ? ' • ครบ ' + MJ.dayLabel(d.due_date) : ''}</small></span>
          <span class="tx-amt ${d.direction === 'i_owe' ? 'out' : 'in'}">${MJ.fmtBaht(d.is_settled ? d.amount : left)}</span>
        </div>`;
      }).join('') : `<div class="empty"><span class="big">🤝</span>ยังไม่มีรายการหนี้<br>
        <button class="btn btn-soft btn-sm mt" id="debtAdd2">บันทึกหนี้/ให้ยืม</button></div>`}

    MJ.plans.openDebtSheet(MJ.debts.list.find((d) => d.id === el.dataset.debt)));
}

MJ.plans.openGoalSheet = function (goal) {
  const isNew = !goal;
  const g = goal || { title: '', target_amount: '', saved_amount: 0, icon: '🎯', color: '#3EA96B', due_date: '' };
  const ICONS = ['🎯','✈️','💻','🏠','🚗','📱','🎓','💍','🐻'];

  MJ.sheet.open(isNew ? 'ตั้งเป้าหมายใหม่' : 'แก้ไขเป้าหมาย', `
    <label class="field"><span>อยากเก็บเงินไปทำอะไร</span>
      <input type="text" id="glTitle" value="${MJ.esc(g.title)}" placeholder="เช่น เที่ยวญี่ปุ่น, ซื้อโน้ตบุ๊ก"></label>
    <div class="field"><span>ไอคอน</span>
      <div class="chips" id="glIcons">${ICONS.map((i) =>
        `<button class="chip ${i === g.icon ? 'active' : ''}" data-icon="${i}" style="font-size:18px">${i}</button>`).join('')}</div>
    </div>
    <div class="row">
      <label class="field"><span>เป้าหมาย (บาท)</span>
        <input type="number" step="1" inputmode="decimal" id="glTarget" value="${g.target_amount}"></label>
      <label class="field"><span>ภายในวันที่</span>
        <input type="date" id="glDue" value="${g.due_date ? String(g.due_date).slice(0, 10) : ''}"></label>
    </div>
    ${isNew ? '' : `<label class="field"><span>เก็บได้แล้ว</span>
      <input type="number" step="1" inputmode="decimal" id="glSaved" value="${g.saved_amount}"></label>`}
    <button class="btn btn-primary btn-block" id="glSave">${isNew ? 'ตั้งเป้าหมาย' : 'บันทึก'}</button>
    ${isNew ? '' : `<button class="btn btn-soft btn-block mt" id="glAdd"><i class="fa fa-plus"></i> หยอดกระปุกเพิ่ม</button>
      <button class="btn btn-danger btn-block mt" id="glDel">ลบเป้าหมาย</button>`}
  `, (body) => {
    let icon = g.icon;
    body.querySelectorAll('#glIcons .chip').forEach((b) => b.onclick = () => {
      icon = b.dataset.icon;
      body.querySelectorAll('#glIcons .chip').forEach((x) => x.classList.toggle('active', x === b));
    });

    MJ.$('#glSave', body).onclick = async () => {
      const target = parseFloat(MJ.$('#glTarget', body).value);
      if (!target || target <= 0) { MJ.toast('ใส่จำนวนเงินเป้าหมายก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.goals.save({
          id: g.id, icon,
          title: MJ.$('#glTitle', body).value,
          target_amount: target,
          saved_amount: MJ.$('#glSaved', body)?.value ?? g.saved_amount,
          due_date: MJ.$('#glDue', body).value || null,
        });
        MJ.sheet.close(); MJ.toast('บันทึกแล้ว 🎯', 'ok'); MJ.render();
      } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
    if (MJ.$('#glAdd', body)) MJ.$('#glAdd', body).onclick = () => {
      MJ.sheet.open('หยอดกระปุก', `
        <label class="field"><span>หยอดเพิ่มเท่าไหร่</span>
          <input type="number" step="1" inputmode="decimal" id="glAmt" placeholder="0"></label>
        <button class="btn btn-primary btn-block" id="glAmtOk">หยอดเลย</button>`, (b2) => {
        MJ.$('#glAmtOk', b2).onclick = async () => {
          const amt = parseFloat(MJ.$('#glAmt', b2).value);
          if (!amt) return;
          await MJ.goals.addMoney(g, amt);
          MJ.sheet.close(); MJ.buzz(30); MJ.toast('หยอดกระปุกแล้ว 🐷', 'ok'); MJ.render();
        };
      });
    };
    if (MJ.$('#glDel', body)) MJ.$('#glDel', body).onclick = async () => {
      if (!(await MJ.confirm('ลบเป้าหมาย', 'ลบเป้าหมายนี้ใช่ไหม?', 'ลบ'))) return;
      await MJ.goals.remove(g.id);
      MJ.sheet.close(); MJ.toast('ลบแล้ว', 'ok'); MJ.render();
    };
  });
};

MJ.plans.openDebtSheet = function (debt) {

  const d = debt || { person: '', direction: 'owed_to_me', amount: '', paid_amount: 0, due_date: '', note: '' };

  MJ.sheet.open(isNew ? 'บันทึกหนี้/ให้ยืม' : 'แก้ไขรายการหนี้', `
    <div class="seg" id="dbDir">
      <button class="seg-btn ${d.direction === 'owed_to_me' ? 'active' : ''}" data-dir="owed_to_me">เขาติดเรา</button>
      <button class="seg-btn ${d.direction === 'i_owe' ? 'active' : ''}" data-dir="i_owe">เราติดเขา</button>
    </div>
    <label class="field"><span>ใคร</span>
      <input type="text" id="dbPerson" value="${MJ.esc(d.person)}" placeholder="ชื่อคน/ร้าน"></label>
    <div class="row">
      <label class="field"><span>จำนวนเงิน</span>
        <input type="number" step="0.01" inputmode="decimal" id="dbAmount" value="${d.amount}"></label>
      <label class="field"><span>ครบกำหนด</span>
        <input type="date" id="dbDue" value="${d.due_date ? String(d.due_date).slice(0, 10) : ''}"></label>
    </div>
    <label class="field"><span>บันทึกช่วยจำ</span>
      <input type="text" id="dbNote" value="${MJ.esc(d.note || '')}"></label>
    ${isNew ? '' : `<p class="tiny muted">คืนแล้ว ${MJ.fmtBaht(d.paid_amount)} จาก ${MJ.fmtBaht(d.amount)}</p>`}
    <button class="btn btn-primary btn-block mt" id="dbSave">${isNew ? 'บันทึก' : 'บันทึกการแก้ไข'}</button>
    ${isNew ? '' : `<button class="btn btn-soft btn-block mt" id="dbPay">บันทึกการจ่ายคืน</button>
      <button class="btn btn-danger btn-block mt" id="dbDel">ลบรายการ</button>`}
  `, (body) => {
    let dir = d.direction;
    MJ.segInit(MJ.$('#dbDir', body), (b) => { dir = b.dataset.dir; });

    MJ.$('#dbSave', body).onclick = async () => {
      const amount = parseFloat(MJ.$('#dbAmount', body).value);
      if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.debts.save({
          id: d.id, direction: dir, amount,
          person: MJ.$('#dbPerson', body).value,
          due_date: MJ.$('#dbDue', body).value || null,
          note: MJ.$('#dbNote', body).value.trim() || null,
          paid_amount: d.paid_amount,
        });
        MJ.sheet.close(); MJ.toast('บันทึกแล้ว 🤝', 'ok'); MJ.render();
      } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
    if (MJ.$('#dbPay', body)) MJ.$('#dbPay', body).onclick = () => {
      const left = Number(d.amount) - Number(d.paid_amount);
      MJ.sheet.open('บันทึกการจ่ายคืน', `
        <label class="field"><span>จ่ายคืนเท่าไหร่ (เหลือ ${MJ.fmtBaht(left)})</span>
          <input type="number" step="0.01" inputmode="decimal" id="dbPayAmt" value="${left}"></label>
        <div class="list-item"><span class="ic"><i class="fa fa-check"></i></span>
          <span class="tx2"><b>บันทึกเป็นรายการด้วย</b><small>ให้ยอดเงินในแอปตรงกับความจริง</small></span>
          <div class="switch on" id="dbPayRec"><i></i></div></div>
        <button class="btn btn-primary btn-block mt" id="dbPayOk">บันทึก</button>`, (b2) => {
        let rec = true;
        MJ.$('#dbPayRec', b2).onclick = (e) => { rec = !rec; e.currentTarget.classList.toggle('on', rec); };
        MJ.$('#dbPayOk', b2).onclick = async () => {
          const amt = parseFloat(MJ.$('#dbPayAmt', b2).value);
          if (!amt) return;
          MJ.loading(true, 'กำลังบันทึก…');
          try {
            await MJ.debts.pay(d, amt, rec);
            MJ.sheet.close(); MJ.buzz(30); MJ.toast('บันทึกแล้ว', 'ok'); MJ.render();
          } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
          finally { MJ.loading(false); }
        };
      });
    };
    if (MJ.$('#dbDel', body)) MJ.$('#dbDel', body).onclick = async () => {
      if (!(await MJ.confirm('ลบรายการหนี้', 'ลบรายการนี้ใช่ไหม?', 'ลบ'))) return;
      await MJ.debts.remove(d.id);
      MJ.sheet.close(); MJ.toast('ลบแล้ว', 'ok'); MJ.render();
    };
  });
};

<script>
/* ===== 70-push.js ===== */
/* ===================================================================
   70-push.js — แจ้งเตือนแบบ Push (Web Push + VAPID)
   ทำงานแม้ปิดแอปอยู่ ต่างจากตัวเตือนเดิมที่ทำงานเฉพาะตอนเปิดแอปค้างไว้
   บน iPhone ต้อง "เพิ่มไปยังหน้าจอโฮม" ก่อน แล้วเปิดจากไอคอนแอป (iOS 16.4+)
   =================================================================== */
MJ.push = {
  VAPID_PUBLIC: 'BN4QfLrxWTUlBsqqhMMqY99IrqPZLFzx4GdRFhyMi15CNRgdxV-nYvrahxI10DCHZKeaqDNSnTESIP8eVt0e1ow',

  /** เบราว์เซอร์นี้รองรับ push ไหม */
  supported() {
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  },

  /** ต้องติดตั้งลงหน้าจอโฮมก่อนไหม (เฉพาะ iOS) */
  needsInstall() {
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    return iOS && !standalone;
  },

  async status() {
    if (!this.supported()) return 'unsupported';
    if (Notification.permission === 'denied') return 'denied';
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      return sub ? 'on' : 'off';
    } catch (e) { return 'off'; }
  },

  urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  },

  /** เปิดการแจ้งเตือน: ขอสิทธิ์ -> สมัครกับเบราว์เซอร์ -> เก็บลง Supabase */
  async enable() {
    if (!this.supported()) {
      MJ.toast('เบราว์เซอร์นี้ยังไม่รองรับการแจ้งเตือน', 'err');
      return false;
    }
    if (this.needsInstall()) {
      MJ.toast('บน iPhone ต้องเพิ่มลงหน้าจอโฮมก่อนนะ', 'err');
      return false;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      MJ.toast(perm === 'denied' ? 'ถูกปิดไว้ในตั้งค่าเบราว์เซอร์' : 'ยังไม่ได้รับอนุญาต', 'err');
      return false;
    }

    MJ.loading(true, 'กำลังเปิดการแจ้งเตือน…');
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: this.urlBase64ToUint8Array(this.VAPID_PUBLIC),
        });
      }
      const json = sub.toJSON();
      const { error } = await MJ.sb.from('push_subscriptions').upsert({
        user_id: MJ.state.user.id,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
        user_agent: navigator.userAgent.slice(0, 200),
        fail_count: 0,
      }, { onConflict: 'endpoint' });
      if (error) throw error;

      MJ.toast('เปิดแจ้งเตือนแล้ว 🔔', 'ok');
      return true;
    } catch (err) {
      MJ.toast('เปิดแจ้งเตือนไม่สำเร็จ: ' + (err.message || err), 'err');
      return false;
    } finally { MJ.loading(false); }
  },

  /** ปิดการแจ้งเตือนสำหรับอุปกรณ์นี้ */
  async disable() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await MJ.sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
        await sub.unsubscribe();
      }
      MJ.toast('ปิดแจ้งเตือนของเครื่องนี้แล้ว', 'ok');
      return true;
    } catch (err) {
      MJ.toast('ปิดไม่สำเร็จ: ' + (err.message || err), 'err');
      return false;
    }
  },

  /** ยิงแจ้งเตือนทดสอบมาที่เครื่องนี้ (ผ่าน Edge Function) */
  async test() {
    MJ.loading(true, 'กำลังส่งแจ้งเตือนทดสอบ…');
    try {
      // ให้แน่ใจว่าอุปกรณ์นี้ลงทะเบียนไว้แล้วก่อนยิงทดสอบ
      await this.sync();
      const { data: { session } } = await MJ.sb.auth.getSession();
      const res = await fetch(MJ.CONFIG.SUPABASE_URL + '/functions/v1/notify', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: MJ.CONFIG.SUPABASE_KEY,
          Authorization: 'Bearer ' + (session?.access_token || MJ.CONFIG.SUPABASE_KEY),
        },
        body: JSON.stringify({ test: true }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      MJ.toast(data?.sent ? 'ส่งแล้ว รอสัก 2-3 วินาที 🔔'
        : (data?.note || 'ยังไม่มีอุปกรณ์ที่เปิดแจ้งเตือน'), data?.sent ? 'ok' : 'err');
    } catch (err) {
      MJ.toast('ส่งไม่สำเร็จ: ' + (err.message || err), 'err');
    } finally { MJ.loading(false); }
  },

  /** เช็กตอนเปิดแอป: ถ้าเคยเปิดไว้ ให้ sync ข้อมูล subscription ล่าสุดขึ้นฐานข้อมูล */
  async sync() {
    if (!this.supported() || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      const json = sub.toJSON();
      await MJ.sb.from('push_subscriptions').upsert({
        user_id: MJ.state.user.id,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
        user_agent: navigator.userAgent.slice(0, 200),
        fail_count: 0,
      }, { onConflict: 'endpoint' });
    } catch (e) { /* ไม่สำคัญพอที่จะรบกวนผู้ใช้ */ }
  },
};

</script>
<script>
/* ===== 71-import.js ===== */
/* ===================================================================
   71-import.js — นำเข้ารายการจากไฟล์ CSV / Excel
   รองรับไฟล์จากแอปอื่นหรือ statement ธนาคาร โดยให้ผู้ใช้จับคู่คอลัมน์เอง
   =================================================================== */
MJ.importer = {
  rows: [],
  headers: [],

  open() {
    MJ.sheet.open('นำเข้าข้อมูล', `
      <p class="tiny muted mb">รองรับไฟล์ .csv .xlsx .xls — ต้องมีอย่างน้อย <b>วันที่</b> กับ <b>จำนวนเงิน</b>
        ระบบจะให้จับคู่คอลัมน์เองในขั้นถัดไป</p>
      <button class="btn btn-primary btn-block" id="imPick"><i class="fa fa-download"></i> เลือกไฟล์</button>
      <input type="file" id="imFile" accept=".csv,.xlsx,.xls,text/csv" hidden>
      <div class="hr"></div>
      <p class="tiny muted">เคล็ดลับ: ส่งออกจากหมีจดเป็น Excel ก่อน แล้วเปิดดูหัวคอลัมน์ตัวอย่างได้</p>
    `, (body) => {
      const file = MJ.$('#imFile', body);
      MJ.$('#imPick', body).onclick = () => file.click();
      file.onchange = (e) => {
        const f = e.target.files?.[0];
        e.target.value = '';
        if (f) this.read(f);
      };
    });
  },

  async read(file) {
    MJ.loading(true, 'กำลังอ่านไฟล์…');
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
      if (!rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
      this.rows = rows;
      this.headers = Object.keys(rows[0]);
      MJ.loading(false);
      this.openMapping();
    } catch (err) {
      MJ.loading(false);
      MJ.toast('อ่านไฟล์ไม่สำเร็จ: ' + (err.message || err), 'err');
    }
  },

  guess(names) {
    return this.headers.find((h) => names.some((n) => h.toLowerCase().includes(n))) || '';
  },

  openMapping() {
    const opts = (sel) => `<option value="">— ไม่ใช้ —</option>` +
      this.headers.map((h) => `<option value="${MJ.esc(h)}" ${h === sel ? 'selected' : ''}>${MJ.esc(h)}</option>`).join('');
    const cats = MJ.state.categories;
    const accounts = MJ.state.accounts || [];

    MJ.sheet.open(`จับคู่คอลัมน์ (${this.rows.length} แถว)`, `
      <div class="row">
        <label class="field"><span>วันที่ *</span><select id="mpDate">${opts(this.guess(['วันที่', 'date', 'time']))}</select></label>
        <label class="field"><span>จำนวนเงิน *</span><select id="mpAmount">${opts(this.guess(['จำนวน', 'amount', 'ยอด', 'value']))}</select></label>
      </div>
      <div class="row">
        <label class="field"><span>รายละเอียด</span><select id="mpNote">${opts(this.guess(['รายละเอียด', 'note', 'desc', 'memo', 'ราย']))}</select></label>
        <label class="field"><span>หมวดหมู่</span><select id="mpCat">${opts(this.guess(['หมวด', 'category', 'type']))}</select></label>
      </div>
      <label class="field"><span>คอลัมน์บอกรายรับ/รายจ่าย (ถ้ามี)</span><select id="mpType">${opts(this.guess(['ประเภท', 'type', 'kind']))}</select></label>
      <p class="tiny muted mb">ถ้าไม่มีคอลัมน์ประเภท ระบบจะถือว่า <b>ยอดติดลบ = รายจ่าย</b> และ <b>ยอดบวก = รายรับ</b></p>
      <label class="field"><span>ลงกระเป๋า</span><select id="mpAcc">
        ${accounts.map((a) => `<option value="${a.id}">${a.icon} ${MJ.esc(a.name)}</option>`).join('')}
      </select></label>
      <label class="field"><span>หมวดสำรอง (ถ้าจับคู่หมวดไม่ได้)</span><select id="mpFallback">
        ${cats.filter((c) => c.type === 'expense').map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('')}
      </select></label>
      <div id="mpPreview" class="tiny muted mb"></div>
      <button class="btn btn-primary btn-block" id="mpGo">ตรวจตัวอย่างแล้วนำเข้า</button>
    `, (body) => {
      const preview = () => {
        const map = this.readMap(body);
        if (!map.date || !map.amount) {
          MJ.$('#mpPreview', body).innerHTML = '<b>ยังต้องเลือกคอลัมน์วันที่และจำนวนเงิน</b>';
          return null;
        }
        const parsed = this.parse(map).slice(0, 3);
        MJ.$('#mpPreview', body).innerHTML = '<b>ตัวอย่าง 3 แถวแรก</b><br>' + parsed.map((r) =>
          `${MJ.isoDate(r.transaction_date)} · ${r.type === 'income' ? 'รับ' : 'จ่าย'} ${MJ.fmtBaht(r.amount)} · ${MJ.esc(r.note || '-')}`
        ).join('<br>');
        return map;
      };
      body.querySelectorAll('select').forEach((sel) => sel.onchange = preview);
      preview();

      MJ.$('#mpGo', body).onclick = async () => {
        const map = preview();
        if (!map) { MJ.toast('เลือกคอลัมน์วันที่และจำนวนเงินก่อน', 'err'); return; }
        const items = this.parse(map);
        if (!items.length) { MJ.toast('ไม่พบแถวที่นำเข้าได้', 'err'); return; }
        if (!(await MJ.confirm('นำเข้าข้อมูล', `จะเพิ่ม ${items.length} รายการเข้าบัญชีของคุณ ยืนยันไหม?`, 'นำเข้าเลย'))) return;

        MJ.loading(true, 'กำลังนำเข้า…');
        let ok = 0, fail = 0;
        for (let i = 0; i < items.length; i += 100) {
          const chunk = items.slice(i, i + 100).map((r) => Object.assign({ user_id: MJ.state.user.id }, r, {
            transaction_date: r.transaction_date.toISOString(),
          }));
          MJ.loading(true, `กำลังนำเข้า ${Math.min(i + 100, items.length)}/${items.length}…`);
          const { error } = await MJ.sb.from('transactions').insert(chunk);
          if (error) fail += chunk.length; else ok += chunk.length;
        }
        await MJ.data.loadMonth();
        await MJ.data.loadBalances();
        MJ.loading(false);
        MJ.sheet.close();
        MJ.toast(`นำเข้าแล้ว ${ok} รายการ${fail ? ` (พลาด ${fail})` : ''} 🐻`, ok ? 'ok' : 'err');
        MJ.render();
      };
    });
  },

  readMap(body) {
    return {
      date: MJ.$('#mpDate', body).value,
      amount: MJ.$('#mpAmount', body).value,
      note: MJ.$('#mpNote', body).value,
      cat: MJ.$('#mpCat', body).value,
      type: MJ.$('#mpType', body).value,
      account: MJ.$('#mpAcc', body).value,
      fallback: MJ.$('#mpFallback', body).value,
    };
  },

  /** แปลงแถวในไฟล์เป็นรายการพร้อมบันทึก */
  parse(map) {
    const cats = MJ.state.categories;
    const out = [];
    for (const row of this.rows) {
      const rawDate = row[map.date];
      const d = this.toDate(rawDate);
      if (!d) continue;

      const rawAmt = String(row[map.amount] ?? '').replace(/[฿,\s]/g, '');
      let amount = parseFloat(rawAmt);
      if (!amount || Number.isNaN(amount)) continue;

      let type = amount < 0 ? 'expense' : 'income';
      if (map.type) {
        const v = String(row[map.type] || '').toLowerCase();
        if (/จ่าย|expense|debit|ออก|withdraw/.test(v)) type = 'expense';
        else if (/รับ|income|credit|เข้า|deposit/.test(v)) type = 'income';
      } else if (amount > 0 && !/รับ|income/.test(String(row[map.note] || ''))) {
        // ไม่มีคอลัมน์ประเภทและยอดเป็นบวก ให้ถือว่าเป็นรายจ่าย (พบบ่อยสุดในไฟล์ทั่วไป)
        type = 'expense';
      }
      amount = Math.abs(amount);

      const note = map.note ? MJ.fixThai(String(row[map.note] || '')) : null;
      let categoryId = map.fallback;
      if (map.cat) {
        const name = String(row[map.cat] || '').trim().toLowerCase();
        const hit = cats.find((c) => c.type === type && c.name.toLowerCase() === name)
          || cats.find((c) => c.type === type && name && c.name.toLowerCase().includes(name));
        if (hit) categoryId = hit.id;
        else {
          const guess = MJ.nlp.parse(`${note || ''} ${amount}`);
          if (guess?.category && guess.category.type === type) categoryId = guess.category.id;
        }
      }
      if (type === 'income') {
        const inc = cats.find((c) => c.id === categoryId && c.type === 'income');
        if (!inc) categoryId = cats.find((c) => c.type === 'income')?.id || null;
      }

      out.push({
        category_id: categoryId || null,
        account_id: map.account || null,
        amount, type,
        note: note || null,
        transaction_date: d,
        source: 'import',
        kind: 'normal',
      });
    }
    return out;
  },

  toDate(v) {
    if (!v) return null;
    if (v instanceof Date && !isNaN(v)) return v;
    const str = String(v).trim();
    // 2026-08-17 / 17/08/2569 / 17-08-26
    const iso = str.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (iso) return new Date(+iso[1] > 2400 ? +iso[1] - 543 : +iso[1], +iso[2] - 1, +iso[3], 12);
    const dmy = str.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
    if (dmy) {
      let y = +dmy[3];
      if (y < 100) y += y >= 50 ? 2500 : 2000;
      if (y > 2400) y -= 543;
      return new Date(y, +dmy[2] - 1, +dmy[1], 12);
    }
    const d = new Date(str);
    return isNaN(d) ? null : d;
  },
};

</script>
<script>
/* ===== 99-boot.js ===== */
/* ===================================================================
   99-boot.js — เริ่มระบบ: ธีม, auth, การนำทาง, service worker, share target
   =================================================================== */
MJ.applyTheme = (mode) => {
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
  else root.removeAttribute('data-theme');
};

MJ.boot = async function () {
  MJ.applyTheme(localStorage.getItem('mj-theme') || 'auto');
  MJ.queue.init();

  /* ---------- การนำทาง ---------- */
  document.querySelectorAll('.tab, .fab').forEach((el) => {
    el.onclick = () => { MJ.buzz(8); MJ.go(el.dataset.route); };
  });
  document.querySelectorAll('#sheet [data-close]').forEach((el) => el.onclick = () => MJ.sheet.close());
  window.addEventListener('hashchange', () => {
    const r = location.hash.replace('#', '') || 'dashboard';
    if (MJ.routes[r] && r !== MJ.state.route) { MJ.state.route = r; MJ.render(); }
  });

  /* ---------- เปลี่ยนเดือน ---------- */
  const shiftMonth = async (delta) => {
    MJ.state.month = new Date(MJ.state.month.getFullYear(), MJ.state.month.getMonth() + delta, 1);
    MJ.$('#btnMonth').textContent = MJ.monthLabel(MJ.state.month);
    MJ.loading(true, 'กำลังโหลดเดือน ' + MJ.monthLabel(MJ.state.month));
    await MJ.data.loadMonth();
    MJ.loading(false);
    MJ.render();
  };
  MJ.$('#btnMonthPrev').onclick = () => shiftMonth(-1);
  MJ.$('#btnMonthNext').onclick = () => shiftMonth(1);
  MJ.$('#btnMonth').onclick = () => MJ.openMonthPicker(shiftToMonth);

  /** ไปยังเดือนที่เลือกจากตัวเลือกเดือน */
  async function shiftToMonth(date) {
    MJ.state.month = new Date(date.getFullYear(), date.getMonth(), 1);
    MJ.$('#btnMonth').textContent = MJ.monthLabel(MJ.state.month);
    MJ.loading(true, 'กำลังโหลด ' + MJ.monthLabelFull(MJ.state.month));
    await MJ.data.loadMonth();
    MJ.loading(false);
    MJ.render();
  }

  /* ---------- Service worker + share target ---------- */
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js', { scope: './' });
    } catch (e) { /* ใช้งานต่อได้แม้ลงทะเบียนไม่สำเร็จ */ }
  }

  /* ---------- Auth ---------- */
  const { data: { session } } = await MJ.sb.auth.getSession();
  MJ.sb.auth.onAuthStateChange((event, sess) => {
    if (event === 'SIGNED_IN' && !MJ.state.user) MJ.start(sess.user);
    if (event === 'SIGNED_OUT') location.reload();
  });

  // กลับมาจากลิงก์ตั้งรหัสผ่านใหม่
  if (location.hash === '#reset' || location.hash.includes('type=recovery')) {
    history.replaceState({}, '', location.pathname);
    setTimeout(() => MJ.auth.promptNewPassword(), 600);
  }

  if (session?.user) await MJ.start(session.user);
  else {
    MJ.$('#authScreen').classList.remove('hidden');
    MJ.auth.mount();
  }
};

MJ.start = async function (user) {
  MJ.state.user = user;
  MJ.$('#authScreen').classList.add('hidden');

  // ล็อกแอปด้วย PIN (ถ้าตั้งไว้)
  if (MJ.lock.enabled()) await MJ.lock.ask();
  MJ.loading(true, 'กำลังเตรียมข้อมูล…');
  try {
    await MJ.data.loadAll();
  } catch (e) {
    MJ.toast('โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e), 'err');
  }
  MJ.loading(false);

  const theme = MJ.state.profile?.theme || 'auto';
  localStorage.setItem('mj-theme', theme);
  MJ.applyTheme(theme);

  MJ.$('#app').classList.remove('hidden');
  MJ.$('#btnMonth').textContent = MJ.monthLabel(MJ.state.month);
  const hash = location.hash.replace('#', '');
  MJ.state.route = MJ.routes[hash] ? hash : 'dashboard';
  MJ.render();

  MJ.reminder.schedule();
  MJ.push.sync();
  MJ.queue.flush();
  MJ.add.loadChat();
  MJ.add.syncChat();
  Promise.all([MJ.goals.load(), MJ.debts.load()]).then(() => MJ.render()).catch(() => {});
  handleQuickAdd();
  MJ.data.runRecurring().then((n) => { if (n) MJ.render(); });
  MJ.plan.checkDue().catch(() => {});
  handleSharedSlip();
};

/* ---------- จดเร็วผ่าน URL เช่น ?add=กาแฟ 80 (ใช้กับ iOS Shortcuts ได้) ---------- */
function handleQuickAdd() {
  const params = new URLSearchParams(location.search);
  const text = params.get('add') || params.get('text');
  if (!text) return;
  history.replaceState({}, '', location.pathname + location.hash);
  const draft = MJ.nlp.parse(text);
  if (!draft?.amount) { MJ.toast('ไม่เจอจำนวนเงินในข้อความที่ส่งมา', 'err'); return; }
  MJ.go('add', { tab: 'chat' });
  setTimeout(() => {
    MJ.add.pushBubble && MJ.add.pushBubble('me', text);
    MJ.add.pushBubble && MJ.add.pushBubble('bot', 'เข้าใจแล้ว!\n' + MJ.nlp.describe(draft));
    MJ.add.openDraftSheet(draft);
  }, 400);
}

/* ---------- รับรูปสลิปที่แชร์เข้ามาจากแอปอื่น (Web Share Target) ---------- */
async function handleSharedSlip() {
  const params = new URLSearchParams(location.search);
  if (!params.has('share')) return;
  history.replaceState({}, '', location.pathname + location.hash);
  try {
    const cache = await caches.open('mj-share');
    const res = await cache.match('shared-slip');
    if (!res) return;
    const blob = await res.blob();
    await cache.delete('shared-slip');
    const file = new File([blob], 'slip.jpg', { type: blob.type || 'image/jpeg' });
    MJ.go('add', { tab: 'slip' });
    MJ.add.processSlip(file);
  } catch (e) { /* ไม่มีไฟล์ก็ข้ามไป */ }
}

document.addEventListener('DOMContentLoaded', () => MJ.boot());

</script>
