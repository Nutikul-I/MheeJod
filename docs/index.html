<script>
/* ===== 61-add.js ===== */
/* ===================================================================
   61-add.js — หน้าจดรายการ 2 แท็บ
     1) แชท    — พิมพ์ + พูด + ส่งรูปสลิป รวมอยู่ในช่องเดียว
     2) กรอกเอง — แป้นตัวเลข + เลือกหมวด
   =================================================================== */
MJ.add = {
  tab: 'chat',
  chat: [],          // {who:'bot'|'me', text, img, imgs}
  recognizer: null,
  recording: false,
  form: { amount: '', type: 'expense', category_id: null, date: null, note: '' },
};

/* ---------------------- เก็บแชทย้อนหลังไว้ในเครื่อง ---------------------- */
MJ.add.CHAT_KEY = 'mj-chat';
MJ.add.loadChat = function () {
  try {
    const raw = localStorage.getItem(MJ.add.CHAT_KEY + ':' + (MJ.state.user?.id || 'guest'));
    if (raw) MJ.add.chat = JSON.parse(raw).slice(-60);
  } catch (e) { /* อ่านไม่ได้ก็เริ่มใหม่ */ }
};
MJ.add.saveChat = function () {
  try {
    // รูปเป็น blob: ที่หมดอายุเมื่อปิดหน้า จึงเก็บแค่ข้อความ
    const keep = MJ.add.chat.slice(-60).map((m) => ({
      who: m.who,
      text: m.text || (m.imgs?.length ? `🧾 ส่งสลิป ${m.imgs.length} ใบ` : (m.img ? '🧾 ส่งสลิป' : '')),
      at: m.at || Date.now(),
    })).filter((m) => m.text);
    localStorage.setItem(MJ.add.CHAT_KEY + ':' + (MJ.state.user?.id || 'guest'), JSON.stringify(keep));
  } catch (e) { /* เต็มก็ข้ามไป */ }
};

MJ.routes.add = (view) => {
  const p = MJ.state.routeParams || {};
  if (p.tab) MJ.add.tab = (p.tab === 'form' ? 'form' : 'chat');
  const action = p.action || null;      // 'voice' | 'slip'
  MJ.state.routeParams = {};

  if (!MJ.add.chat.length) MJ.add.loadChat();
  if (!MJ.add.chat.length) {
    MJ.add.chat = [{ who: 'bot', text: 'สวัสดี! บอกหมีได้เลย 🐻\n• พิมพ์ “กินกาแฟ 80”\n• กดไมค์แล้วพูด\n• หรือส่งรูปสลิปมาให้หมีอ่าน' }];
  }

  view.innerHTML = `
    <div class="tabs-dock">
      <div class="seg" id="addTabs">
        <button class="seg-btn" data-tab="chat"><i class="fa fa-comment"></i> แชท</button>
        <button class="seg-btn" data-tab="form"><i class="fa fa-keyboard"></i> กรอกเอง</button>
      </div>
    </div>
    <div id="addBody"></div>`;

  view.querySelectorAll('#addTabs .seg-btn').forEach((b) =>
    b.classList.toggle('active', b.dataset.tab === MJ.add.tab));
  MJ.segInit(MJ.$('#addTabs', view), (b) => { MJ.add.tab = b.dataset.tab; MJ.render(); });

  const body = MJ.$('#addBody', view);
  document.body.classList.toggle('chat-open', MJ.add.tab === 'chat');
  if (MJ.add.tab === 'form') {
    const dock = MJ.$('#composerDock');
    dock.classList.add('hidden'); dock.innerHTML = '';
    renderForm(body);
  } else {
    renderChat(body, action);
  }
};

/**
 * ปุ่มลัดในหน้าแชท — สร้างจากรายการที่ผู้ใช้จดบ่อยที่สุด (ชื่อ+ยอดเดิม)
 * ถ้ายังไม่มีข้อมูลพอ ค่อยเติมตัวอย่างมาตรฐาน
 */
MJ.add.quickChips = function () {
  const freq = new Map();
  MJ.state.transactions.forEach((t) => {
    const note = MJ.fixThai(t.note || MJ.data.catById(t.category_id)?.name || '');
    if (!note || note.length > 22) return;
    const amt = Math.round(Number(t.amount));
    if (!amt) return;
    const key = `${t.type}|${note}|${amt}`;
    const cur = freq.get(key) || { note, amt, type: t.type, n: 0, last: 0,
      icon: MJ.data.catById(t.category_id)?.icon || '' };
    cur.n++;
    cur.last = Math.max(cur.last, new Date(t.transaction_date).getTime());
    freq.set(key, cur);
  });

  const top = Array.from(freq.values())
    .sort((a, b) => (b.n - a.n) || (b.last - a.last))
    .slice(0, 8)
    .map((x) => ({
      icon: x.icon,
      label: `${x.note} ${MJ.fmtMoney(x.amt)}`,
      text: `${x.type === 'income' ? 'รับ ' : ''}${x.note} ${x.amt}`,
    }));

  if (top.length >= 4) return top;
  const defaults = [
    { icon: '🍜', label: 'ข้าวเที่ยง 60', text: 'ข้าวเที่ยง 60' },
    { icon: '☕', label: 'กาแฟ 60', text: 'กาแฟ 60' },
    { icon: '🚕', label: 'ค่าแท็กซี่ 120', text: 'ค่าแท็กซี่ 120' },
    { icon: '🛒', label: 'ของใช้ 200', text: 'ซื้อของใช้ 200' },
    { icon: '💰', label: 'รับเงินเดือน', text: 'รับเงินเดือน 25000' },
  ];
  const firstWord = (x) => x.label.split(' ')[0];
  return top.concat(defaults.filter((d) => !top.some((t) => firstWord(t) === firstWord(d)))).slice(0, 8);
};

/* ============================ แท็บแชท ============================ */
function renderChat(body, action) {
  // ข้อความอยู่ในหน้า ส่วนแถบพิมพ์ตรึงติดด้านล่างเหมือนแอปแชท
  body.innerHTML = `
    <div class="chat" id="chatBox">
      ${MJ.add.chat.map(bubbleHTML).join('')}
    </div>`;

  const dock = MJ.$('#composerDock');
  dock.classList.remove('hidden');
  dock.innerHTML = `
    <div class="chips scroll" id="samples">
      ${MJ.add.quickChips().map((c) => `<button class="chip mini" data-s="${MJ.esc(c.text)}">
        ${c.icon ? `<span class="ic">${c.icon}</span>` : ''}${MJ.esc(c.label)}</button>`).join('')}
    </div>
    <div class="composer">
      <button class="rnd" id="btnSlip" title="ส่งรูปสลิป"><i class="fa fa-images"></i></button>
      <textarea id="chatInput" rows="1" placeholder="พิมพ์ พูด หรือส่งสลิป…"></textarea>
      <button class="rnd" id="btnMic" title="พูด"><i class="fa fa-mic"></i></button>
      <button class="rnd send" id="btnSend" title="ส่ง"><i class="fa fa-send"></i></button>
    </div>
    <input type="file" id="slipFile" accept="image/*" hidden multiple>`;

  const box = MJ.$('#chatBox', body);
  const input = MJ.$('#chatInput', dock);
  const fileInput = MJ.$('#slipFile', dock);
  body = dock;   // ปุ่มทั้งหมดอยู่ใน dock

  input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(110, input.scrollHeight) + 'px'; };
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); } };
  MJ.$('#btnSend', body).onclick = submitText;
  MJ.$('#btnMic', body).onclick = () => MJ.add.toggleVoice(input);
  MJ.$('#btnSlip', body).onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length) MJ.add.processSlips(files);
  };
  body.querySelectorAll('#samples .chip').forEach((c) => c.onclick = () => { input.value = c.dataset.s; submitText(); });

  scrollChat(box);
  MJ.add.pushBubble = pushBubble;   // ให้ processSlip เรียกใช้ได้

  if (action === 'voice') setTimeout(() => MJ.add.toggleVoice(input), 350);
  if (action === 'slip') setTimeout(() => fileInput.click(), 250);

  function pushBubble(who, text, img, imgs) {
    const msg = { who, text, img: img || null, imgs: imgs || null, at: Date.now() };
    MJ.add.chat.push(msg);
    if (MJ.add.chat.length > 60) MJ.add.chat.splice(0, MJ.add.chat.length - 60);
    box.insertAdjacentHTML('beforeend', bubbleHTML(msg));
    scrollChat(box);
    MJ.add.saveChat();
    return msg;
  }

  function submitText() {
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';
    pushBubble('me', text);
    const draft = MJ.nlp.parse(text);
    if (!draft || !draft.amount) {
      pushBubble('bot', 'หมีหาจำนวนเงินไม่เจอ ลองใส่ตัวเลขด้วยนะ เช่น “กินข้าว 80” 🐻');
      return;
    }
    pushBubble('bot', 'เข้าใจแล้ว!\n' + MJ.nlp.describe(draft));
    MJ.add.openDraftSheet(draft);
  }
}

function bubbleHTML(m) {
  // รูปหลายใบ -> เรียงเป็นตารางในบับเบิลเดียว เหมือนส่งอัลบั้มในแชท
  if (m.imgs && m.imgs.length) {
    const cols = m.imgs.length === 1 ? 1 : (m.imgs.length === 2 ? 2 : 3);
    const grid = `<div class="img-grid" style="grid-template-columns:repeat(${cols},1fr)">
      ${m.imgs.map((u, i) => `<img src="${u}" alt="สลิปใบที่ ${i + 1}" loading="lazy">`).join('')}</div>`;
    return `<div class="bubble ${m.who} has-img">${grid}${m.text ? MJ.esc(m.text) : ''}</div>`;
  }
  const img = m.img ? `<img src="${m.img}" alt="สลิป" style="width:100%;border-radius:14px;margin-bottom:${m.text ? '7px' : '0'}">` : '';
  return `<div class="bubble ${m.who} ${m.img ? 'has-img' : ''}">${img}${m.text ? MJ.esc(m.text) : ''}</div>`;
}

function scrollChat(box) {
  box.scrollTop = box.scrollHeight;
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
}

/* ============================ พูด (ใช้ในแท็บแชท) ============================ */
MJ.add.toggleVoice = function (input) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { MJ.toast('เบราว์เซอร์นี้ยังไม่รองรับการพูด ลองพิมพ์แทนนะ', 'err'); return; }
  if (MJ.add.recording) { try { MJ.add.recognizer.stop(); } catch (e) {} return; }

  const rec = new SR();
  rec.lang = 'th-TH';
  rec.interimResults = true;
  rec.continuous = false;
  MJ.add.recognizer = rec;
  MJ.add.recording = true;
  MJ.buzz(20);
  MJ.$$('#btnMic').forEach((b) => b.classList.add('rec'));
  if (input) input.placeholder = 'กำลังฟัง… พูดได้เลย';

  rec.onresult = (e) => {
    const txt = Array.from(e.results).map((r) => r[0].transcript).join('');
    if (input) { input.value = txt; input.dispatchEvent(new Event('input')); }
  };
  rec.onerror = (e) => {
    MJ.toast(e.error === 'not-allowed' ? 'ไม่ได้รับอนุญาตให้ใช้ไมค์' : 'ฟังไม่ชัด ลองใหม่อีกที', 'err');
  };
  rec.onend = () => {
    MJ.add.recording = false;
    MJ.$$('#btnMic').forEach((b) => b.classList.remove('rec'));
    if (input) input.placeholder = 'พิมพ์ พูด หรือส่งสลิป…';
    const txt = input?.value.trim();
    if (!txt) return;
    input.value = ''; input.style.height = 'auto';
    MJ.add.pushBubble && MJ.add.pushBubble('me', '🎤 ' + txt);
    const draft = MJ.nlp.parse(txt);
    if (draft) draft.source = 'voice';
    if (draft?.amount) {
      MJ.add.pushBubble && MJ.add.pushBubble('bot', 'เข้าใจแล้ว!\n' + MJ.nlp.describe(draft));
      MJ.add.openDraftSheet(draft);
    } else {
      MJ.add.pushBubble && MJ.add.pushBubble('bot', 'ไม่เจอจำนวนเงิน ลองพูดใหม่พร้อมตัวเลขนะ 🐻');
    }
  };
  try { rec.start(); } catch (e) { MJ.add.recording = false; }
};

/* ============================ สลิปหลายใบพร้อมกัน ============================ */
/**
 * เลือกรูปได้ทีละหลายใบเหมือนแชท:
 *   - รูปขึ้นในแชททันทีทุกใบ
 *   - อ่านทีละใบพร้อมบอกความคืบหน้า
 *   - ใบเดียว -> เปิดหน้ายืนยันแบบเดิม, หลายใบ -> เปิดหน้ารวมให้ตรวจทีเดียวแล้วบันทึกรวด
 */
MJ.add.processSlips = async function (files) {
  if (files.length === 1) return MJ.add.processSlip(files[0]);

  const items = files.map((file) => ({ file, url: URL.createObjectURL(file) }));
  MJ.add.pushBubble && MJ.add.pushBubble('me', '', null, items.map((it) => it.url));
  MJ.add.pushBubble && MJ.add.pushBubble('bot', `ได้รับสลิป ${files.length} ใบ กำลังอ่านให้นะ… 🐻`);

  const drafts = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    MJ.loading(true, `กำลังอ่านสลิปใบที่ ${i + 1}/${items.length}…`);
    try {
      const draft = await MJ.slip.analyze(it.file, (msg) => MJ.loading(true, `(${i + 1}/${items.length}) ${msg}`));
      draft.file = it.file;
      draft.previewUrl = it.url;
      drafts.push(draft);
    } catch (err) {
      drafts.push({ file: it.file, previewUrl: it.url, error: err.message || String(err),
        amount: null, type: 'expense', transaction_date: new Date(), source: 'slip' });
    }
  }
  MJ.loading(false);

  // เช็กสลิปซ้ำทีเดียวทั้งชุด (รวมทั้งซ้ำกันเองในชุดนี้)
  const refs = drafts.map((d) => d.slip_reference).filter(Boolean);
  let existing = new Set();
  if (refs.length) {
    const { data } = await MJ.sb.from('transactions').select('slip_reference').in('slip_reference', refs);
    existing = new Set((data || []).map((r) => r.slip_reference));
  }
  const seen = new Set();
  drafts.forEach((d) => {
    d.duplicate = !!(d.slip_reference && (existing.has(d.slip_reference) || seen.has(d.slip_reference)));
    if (d.slip_reference) seen.add(d.slip_reference);
    d.include = !d.duplicate;
  });

  const dupCount = drafts.filter((d) => d.duplicate).length;
  const readOk = drafts.filter((d) => d.amount).length;
  MJ.add.pushBubble && MJ.add.pushBubble('bot',
    `อ่านเสร็จแล้ว! อ่านยอดได้ ${readOk}/${drafts.length} ใบ`
    + (dupCount ? `\n⚠️ มี ${dupCount} ใบที่เคยบันทึกแล้ว หมีติ๊กออกให้` : '')
    + '\nตรวจดูแล้วกดบันทึกรวดเดียวได้เลย');

  MJ.add.openBatchSheet(drafts);
};

MJ.add.openBatchSheet = function (drafts) {
  const cats = MJ.state.categories;
  const catOptions = (type, selected) => cats.filter((c) => c.type === type)
    .map((c) => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('');

  const rows = drafts.map((d, i) => `
    <div class="batch-row ${d.include ? '' : 'off'}" data-i="${i}">
      <div class="batch-head">
        <img src="${d.previewUrl}" alt="สลิป ${i + 1}">
        <div class="batch-sum">
          <b>ใบที่ ${i + 1}${d.payee_name ? ' • ' + MJ.esc(d.payee_name) : ''}</b>
          <small>${d.duplicate ? '⚠️ เคยบันทึกแล้ว'
            : (d.error ? '⚠️ อ่านไม่สำเร็จ'
            : `${d.hasQR ? '✅ มี QR' : '⚠️ ไม่พบ QR'} • ${d.dateFromSlip ? 'วันที่จากสลิป' : 'ใช้วันนี้'}`)}</small>
        </div>
        <div class="switch ${d.include ? 'on' : ''}" data-toggle="${i}"><i></i></div>
      </div>
      <div class="batch-fields">
        <div class="row">
          <label class="field"><span>จำนวนเงิน</span>
            <input type="number" step="0.01" inputmode="decimal" data-f="amount" value="${d.amount ?? ''}" placeholder="0.00"></label>
          <label class="field"><span>หมวดหมู่</span>
            <select data-f="category">${catOptions(d.type || 'expense', d.category_id)}</select></label>
        </div>
        <label class="field"><span>วันและเวลา</span>
          <input type="datetime-local" data-f="date" value="${MJ.isoLocal(new Date(d.transaction_date))}"></label>
      </div>
    </div>`).join('');

  MJ.sheet.open(`ตรวจสลิป ${drafts.length} ใบ`, `
    <div id="batchList">${rows}</div>
    <div class="batch-total card">
      <div class="card-head" style="margin:0">
        <h3>รวมที่จะบันทึก</h3>
        <span class="tx-amt out" id="batchTotal">฿0</span>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="batchSave">บันทึกทั้งหมด</button>
    <button class="btn btn-ghost btn-block" id="batchCancel">ยกเลิก</button>
  `, (body) => {
    const recalc = () => {
      let sum = 0, n = 0;
      drafts.forEach((d, i) => {
        const row = body.querySelector(`.batch-row[data-i="${i}"]`);
        const amt = parseFloat(MJ.$('[data-f="amount"]', row).value);
        if (d.include && amt > 0) { sum += amt; n++; }
      });
      MJ.$('#batchTotal', body).textContent = MJ.fmtBaht(sum);
      MJ.$('#batchSave', body).textContent = n ? `บันทึก ${n} รายการ • ${MJ.fmtBaht(sum)}` : 'ยังไม่ได้เลือกรายการ';
      MJ.$('#batchSave', body).disabled = !n;
      MJ.$('#batchSave', body).style.opacity = n ? '1' : '.5';
    };

    body.querySelectorAll('[data-toggle]').forEach((sw) => sw.onclick = () => {
      const i = +sw.dataset.toggle;
      drafts[i].include = !drafts[i].include;
      sw.classList.toggle('on', drafts[i].include);
      body.querySelector(`.batch-row[data-i="${i}"]`).classList.toggle('off', !drafts[i].include);
      MJ.buzz(8);
      recalc();
    });
    body.querySelectorAll('[data-f="amount"]').forEach((el) => el.oninput = recalc);
    recalc();

    MJ.$('#batchCancel', body).onclick = () => MJ.sheet.close();
    MJ.$('#batchSave', body).onclick = async () => {
      const chosen = drafts.map((d, i) => ({ d, i })).filter(({ d }) => d.include);
      let saved = 0, failed = 0, total = 0;
      for (let k = 0; k < chosen.length; k++) {
        const { d, i } = chosen[k];
        const row = body.querySelector(`.batch-row[data-i="${i}"]`);
        const amount = parseFloat(MJ.$('[data-f="amount"]', row).value);
        if (!amount || amount <= 0) { failed++; continue; }
        MJ.loading(true, `กำลังบันทึก ${k + 1}/${chosen.length}…`);
        try {
          let receiptPath = null;
          try { receiptPath = await MJ.data.uploadReceipt(d.file); } catch (e) { /* ไม่มีรูปก็ยังบันทึกได้ */ }
          await MJ.data.addTransaction({
            amount,
            type: d.type || 'expense',
            category_id: MJ.$('[data-f="category"]', row).value || null,
            note: d.note || (d.payee_name ? `โอนให้ ${d.payee_name}` : 'จ่ายผ่านสลิป'),
            payee_name: d.payee_name || null,
            transaction_date: new Date(MJ.$('[data-f="date"]', row).value),
            slip_reference: d.slip_reference || null,
            receipt_image_url: receiptPath,
            source: 'slip',
            raw_input: d.raw_input || null,
          });
          saved++; total += amount;
        } catch (err) { failed++; }
      }
      MJ.loading(false);
      MJ.sheet.close();
      MJ.buzz(30);
      drafts.forEach((d) => { try { URL.revokeObjectURL(d.previewUrl); } catch (e) {} });
      MJ.toast(`บันทึกแล้ว ${saved} รายการ 🐻`, saved ? 'ok' : 'err');
      MJ.add.chat.push({ who: 'bot',
        text: `บันทึกให้แล้ว ${saved} รายการ รวม ${MJ.fmtBaht(total)} 🍯` + (failed ? `\n(ข้าม ${failed} ใบที่ยอดยังว่างหรือบันทึกไม่สำเร็จ)` : '') });
      MJ.render();
    };
  });
};

/* ============================ สลิปใบเดียว ============================ */
MJ.add.processSlip = async function (file) {
  const url = URL.createObjectURL(file);
  if (MJ.add.pushBubble) MJ.add.pushBubble('me', '', url);
  MJ.loading(true, 'กำลังเปิดสลิป…');
  try {
    const draft = await MJ.slip.analyze(file, (msg) => MJ.loading(true, msg));
    draft.file = file;
    MJ.loading(false);

    if (draft.slip_reference) {
      const { data: dup } = await MJ.sb.from('transactions').select('id, amount, transaction_date')
        .eq('slip_reference', draft.slip_reference).maybeSingle();
      if (dup) {
        const msg = `สลิปนี้บันทึกไปแล้วเมื่อ ${MJ.dayLabel(dup.transaction_date)} (${MJ.fmtBaht(dup.amount)}) 🐻`;
        MJ.add.pushBubble && MJ.add.pushBubble('bot', msg);
        MJ.toast('สลิปซ้ำ ไม่บันทึกซ้ำให้นะ', 'err');
        return;
      }
    }

    const when = draft.dateFromSlip
      ? `${MJ.dayLabel(draft.transaction_date)} ${MJ.timeLabel(draft.transaction_date)} (จากสลิป)`
      : 'อ่านวันที่ไม่ได้ ใช้วันนี้ไปก่อน';
    const summary = draft.amount
      ? `อ่านสลิปได้แล้ว!\n${draft.hasQR ? '✅ มี QR — กันบันทึกซ้ำให้' : '⚠️ ไม่พบ QR บนสลิป'}\n`
        + `${draft.type === 'income' ? 'รายรับ' : 'รายจ่าย'} ${MJ.fmtBaht(draft.amount)}`
        + `${draft.payee_name ? ' • ' + draft.payee_name : ''}\n📅 ${when}`
      : `อ่านยอดเงินไม่ชัด ใส่เองได้เลยนะ 🐻\n📅 ${when}`;
    MJ.add.pushBubble && MJ.add.pushBubble('bot', summary);

    MJ.add.openDraftSheet(draft, { slip: true });
  } catch (err) {
    MJ.loading(false);
    MJ.add.pushBubble && MJ.add.pushBubble('bot', 'อ่านสลิปไม่สำเร็จ: ' + (err.message || err));
    MJ.toast('อ่านสลิปไม่สำเร็จ', 'err');
  }
};

/* ============================ แท็บกรอกเอง ============================ */
function renderForm(body) {
  const f = MJ.add.form;
  if (!f.date) f.date = new Date();
  if (!f.category_id) {
    const first = MJ.state.categories.find((c) => c.type === f.type);
    f.category_id = first?.id || null;
  }
  const cats = MJ.state.categories.filter((c) => c.type === f.type);

  body.innerHTML = `
    <div class="seg" id="typeSeg">
      <button class="seg-btn ${f.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
      <button class="seg-btn ${f.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
    </div>
    <div class="card">
      <div class="amount-display"><b id="amtView">${f.amount || '0'}</b><span>บาท</span></div>
      <div class="keypad" id="keypad">
        ${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map((k) => `<button data-k="${k}">${k}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>หมวดหมู่</h3><button class="link" data-go="budget">จัดการ ›</button></div>
      <div class="cat-grid" id="catGrid">
        ${cats.map((c) => `<button class="cat-pick ${c.id === f.category_id ? 'active' : ''}" data-cat="${c.id}">
          <span class="ic" style="background:${MJ.hex2rgba(c.color, .18)}">${c.icon}</span>${MJ.esc(c.name)}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <label class="field"><span>บันทึกช่วยจำ</span>
        <input type="text" id="fNote" value="${MJ.esc(f.note)}" placeholder="เช่น กาแฟร้านประจำ"></label>
      <label class="field"><span>วันและเวลา</span>
        <input type="datetime-local" id="fDate" value="${MJ.isoLocal(f.date)}"></label>
    </div>
    <button class="btn btn-primary btn-block" id="fSave">บันทึกรายการ</button>
    <div style="height:14px"></div>`;

  MJ.segInit(MJ.$('#typeSeg', body), (b) => {
    f.type = b.dataset.type; f.category_id = null; renderForm(body);
  });
  body.querySelectorAll('#keypad button').forEach((b) => b.onclick = () => {
    const k = b.dataset.k;
    MJ.buzz(8);
    if (k === '⌫') f.amount = f.amount.slice(0, -1);
    else if (k === '.') { if (!f.amount.includes('.')) f.amount = (f.amount || '0') + '.'; }
    else if (/\.\d\d$/.test(f.amount)) return;
    else f.amount = (f.amount === '0' ? '' : f.amount) + k;
    MJ.$('#amtView', body).textContent = f.amount || '0';
  });
  body.querySelectorAll('#catGrid .cat-pick').forEach((b) => b.onclick = () => {
    f.category_id = b.dataset.cat;
    body.querySelectorAll('#catGrid .cat-pick').forEach((x) => x.classList.toggle('active', x === b));
  });
  body.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => MJ.go(b.dataset.go));

  MJ.$('#fSave', body).onclick = async () => {
    const amount = parseFloat(f.amount);
    if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
    MJ.loading(true, 'กำลังบันทึก…');
    try {
      await MJ.data.addTransaction({
        amount, type: f.type, category_id: f.category_id,
        note: MJ.$('#fNote', body).value.trim() || null,
        transaction_date: new Date(MJ.$('#fDate', body).value),
        source: 'manual',
      });
      MJ.add.form = { amount: '', type: f.type, category_id: f.category_id, date: new Date(), note: '' };
      MJ.buzz(30);
      MJ.toast('บันทึกแล้ว 🐻', 'ok');
      MJ.go('dashboard');
    } catch (err) {
      MJ.toast('บันทึกไม่สำเร็จ: ' + (err.message || err), 'err');
    } finally { MJ.loading(false); }
  };
}

/* ============================ Sheet ยืนยันร่างรายการ ============================ */
MJ.add.openDraftSheet = function (draft, opts) {
  opts = opts || {};
  const cats = MJ.state.categories;
  const catOptions = (type) => cats.filter((c) => c.type === type)
    .map((c) => `<option value="${c.id}" ${c.id === draft.category_id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('');

  MJ.sheet.open(opts.slip ? 'ตรวจสอบสลิป' : 'ยืนยันรายการ', `
    ${draft.file ? '<img class="slip-preview" id="slipImg" alt="สลิป">' : ''}
    ${opts.slip ? `<p class="tiny muted mb">${draft.hasQR ? '✅ อ่าน QR สำเร็จ — กันบันทึกซ้ำให้แล้ว' : '⚠️ ไม่พบ QR บนสลิป ตรวจตัวเลขอีกครั้งนะ'}</p>` : ''}
    <div class="seg" id="dType">
      <button class="seg-btn ${draft.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
      <button class="seg-btn ${draft.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
    </div>
    <label class="field"><span>จำนวนเงิน (บาท)</span>
      <input type="number" inputmode="decimal" step="0.01" id="dAmount" value="${draft.amount ?? ''}" placeholder="0.00"></label>
    <label class="field"><span>หมวดหมู่</span>
      <select id="dCat">${catOptions(draft.type)}</select></label>
    <label class="field"><span>บันทึกช่วยจำ</span>
      <input type="text" id="dNote" value="${MJ.esc(draft.note || '')}"></label>
    ${draft.payee_name ? `<label class="field"><span>ผู้รับเงิน / ร้านค้า</span>
      <input type="text" id="dPayee" value="${MJ.esc(draft.payee_name)}"></label>` : ''}
    <label class="field"><span>วันและเวลา${opts.slip ? (draft.dateFromSlip ? ' <span class="badge in">อ่านจากสลิป</span>' : ' <span class="badge out">อ่านไม่ได้ ใช้วันนี้</span>') : ''}</span>
      <input type="datetime-local" id="dDate" value="${MJ.isoLocal(new Date(draft.transaction_date))}"></label>
    ${draft.ocrText ? `<details class="mb"><summary class="tiny muted">ดูข้อความที่อ่านได้จากสลิป</summary>
      <pre class="tiny muted" style="white-space:pre-wrap;max-height:150px;overflow:auto">${MJ.esc(draft.ocrText.slice(0, 1200))}</pre></details>` : ''}
    <button class="btn btn-primary btn-block" id="dSave">บันทึกเลย</button>
    <button class="btn btn-ghost btn-block" id="dCancel">ยกเลิก</button>
  `, (bodyEl) => {
    if (draft.file) MJ.$('#slipImg', bodyEl).src = URL.createObjectURL(draft.file);

    MJ.segInit(MJ.$('#dType', bodyEl), (b) => {
      draft.type = b.dataset.type;
      bodyEl.querySelectorAll('#dType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
      draft.category_id = null;
      MJ.$('#dCat', bodyEl).innerHTML = cats.filter((c) => c.type === draft.type)
        .map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('');
    });

    MJ.$('#dCancel', bodyEl).onclick = () => MJ.sheet.close();
    MJ.$('#dSave', bodyEl).onclick = async () => {
      const amount = parseFloat(MJ.$('#dAmount', bodyEl).value);
      if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        let receiptPath = null;
        if (draft.file) {
          try { receiptPath = await MJ.data.uploadReceipt(draft.file); }
          catch (e) { MJ.toast('อัปโหลดรูปสลิปไม่สำเร็จ แต่บันทึกรายการให้แล้ว', 'err'); }
        }
        await MJ.data.addTransaction({
          amount,
          type: draft.type,
          category_id: MJ.$('#dCat', bodyEl).value || null,
          note: MJ.$('#dNote', bodyEl).value.trim() || null,
          payee_name: MJ.$('#dPayee', bodyEl)?.value.trim() || draft.payee_name || null,
          transaction_date: new Date(MJ.$('#dDate', bodyEl).value),
          slip_reference: draft.slip_reference || null,
          receipt_image_url: receiptPath,
          source: draft.source || 'text',
          raw_input: draft.raw_input || null,
        });
        MJ.buzz(30);
        MJ.sheet.close();
        MJ.toast('บันทึกแล้ว 🐻', 'ok');
        MJ.add.chat.push({ who: 'bot', text: 'บันทึกให้แล้วนะ! 🍯 จดต่อได้เลย' });
        MJ.render();
      } catch (err) {
        MJ.toast(err.duplicate ? 'สลิปนี้ถูกบันทึกไปแล้ว' : ('บันทึกไม่สำเร็จ: ' + (err.message || err)), 'err');
      } finally { MJ.loading(false); }
    };
  });
};

</script>
<script>
/* ===== 62-transactions.js ===== */
/* ===================================================================
   62-transactions.js — รายการย้อนหลัง ค้นหา แก้ไข ลบ และส่งออก Excel
   =================================================================== */
MJ.tx = {
  filter: { type: 'all', q: '', category: 'all' },

  /** แถวรายการหนึ่งบรรทัด */
  row(t) {
    const c = MJ.data.catById(t.category_id);
    const color = c?.color || '#9AA0A6';
    const badges = [
      t.source === 'slip' ? '🧾' : '', t.source === 'voice' ? '🎤' : '',
      t.source === 'recurring' ? '🔁' : '', t.receipt_image_url ? '📎' : '',
    ].filter(Boolean).join(' ');
    return `<div class="tx" data-tx="${t.id}">
      <span class="tx-ico" style="background:${MJ.hex2rgba(color, .18)}">${c?.icon || '❓'}</span>
      <span class="tx-main">
        <span class="tx-title">${MJ.esc(MJ.fixThai(t.note || c?.name || 'รายการ'))}</span>
        <span class="tx-sub">${MJ.esc(c?.name || 'ไม่ระบุหมวด')} • ${MJ.timeLabel(t.transaction_date)} ${badges}</span>
      </span>
      <span class="tx-amt ${t.type === 'income' ? 'in' : 'out'}">${t.type === 'income' ? '+' : '−'}${MJ.fmtMoney(t.amount)}</span>
    </div>`;
  },

  bindRows(root) {
    root.querySelectorAll('[data-tx]').forEach((el) => {
      el.onclick = () => {
        const t = MJ.state.transactions.find((x) => x.id === el.dataset.tx);
        if (t) MJ.tx.openDetail(t);
      };
    });
  },

  /** จัดกลุ่มตามวัน */
  groupByDay(list) {
    const groups = new Map();
    list.forEach((t) => {
      const key = MJ.isoDate(new Date(t.transaction_date));
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });
    return Array.from(groups.entries());
  },

  filtered() {
    const f = MJ.tx.filter;
    const q = f.q.trim().toLowerCase();
    return MJ.state.transactions.filter((t) => {
      if (f.type !== 'all' && t.type !== f.type) return false;
      if (f.category !== 'all' && t.category_id !== f.category) return false;
      if (q) {
        const c = MJ.data.catById(t.category_id);
        const hay = MJ.fixThai(`${t.note || ''} ${t.payee_name || ''} ${c?.name || ''} ${t.amount}`).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  },

  /* ---------------------- Sheet รายละเอียด/แก้ไข ---------------------- */
  openDetail(t) {
    const c = MJ.data.catById(t.category_id);
    MJ.sheet.open('รายละเอียด', `
      <div class="center mb">
        <div class="tx-ico" style="margin:0 auto 8px;width:56px;height:56px;font-size:26px;border-radius:20px;background:${MJ.hex2rgba(c?.color || '#9AA0A6', .18)}">${c?.icon || '❓'}</div>
        <div class="tx-amt ${t.type === 'income' ? 'in' : 'out'}" style="font-size:30px">
          ${t.type === 'income' ? '+' : '−'}${MJ.fmtBaht(t.amount)}</div>
        <div class="muted tiny">${MJ.dayLabel(t.transaction_date)} ${MJ.timeLabel(t.transaction_date)}</div>
      </div>
      <div id="receiptBox"></div>
      <div class="card">
        <div class="list-item"><span class="ic"><i class="fa fa-tag"></i></span><span class="tx2"><b>${MJ.esc(c?.name || 'ไม่ระบุหมวด')}</b><small>หมวดหมู่</small></span></div>
        <div class="list-item"><span class="ic"><i class="fa fa-pen"></i></span><span class="tx2"><b>${MJ.esc(MJ.fixThai(t.note || '-'))}</b><small>บันทึกช่วยจำ</small></span></div>
        ${t.payee_name ? `<div class="list-item"><span class="ic"><i class="fa fa-store"></i></span><span class="tx2"><b>${MJ.esc(MJ.fixThai(t.payee_name))}</b><small>ผู้รับเงิน</small></span></div>` : ''}
        ${t.slip_reference ? `<div class="list-item"><span class="ic"><i class="fa fa-tag"></i></span><span class="tx2"><b style="word-break:break-all;font-size:12px">${MJ.esc(t.slip_reference.slice(0, 60))}</b><small>รหัสอ้างอิงสลิป</small></span></div>` : ''}
        <div class="list-item"><span class="ic"><i class="fa fa-download"></i></span><span class="tx2"><b>${({ manual:'กรอกเอง', text:'พิมพ์จด', voice:'พูดจด', slip:'สลิป', recurring:'รายการประจำ', import:'นำเข้า' })[t.source] || t.source}</b><small>ที่มา</small></span></div>
      </div>
      <button class="btn btn-soft btn-block" id="txEdit">แก้ไขรายการ</button>
      <button class="btn btn-danger btn-block mt" id="txDel">ลบรายการนี้</button>
    `, async (body) => {
      MJ.$('#txEdit', body).onclick = () => MJ.tx.openEdit(t);
      MJ.$('#txDel', body).onclick = async () => {
        if (!(await MJ.confirm('ลบรายการ', 'ลบรายการนี้ถาวรใช่ไหม?', 'ลบเลย'))) return;
        MJ.loading(true, 'กำลังลบ…');
        try { await MJ.data.deleteTransaction(t.id); MJ.toast('ลบแล้ว', 'ok'); MJ.sheet.close(); MJ.render(); }
        catch (e) { MJ.toast('ลบไม่สำเร็จ', 'err'); }
        finally { MJ.loading(false); }
      };
      if (t.receipt_image_url) {
        const url = await MJ.data.receiptUrl(t.receipt_image_url);
        if (url) MJ.$('#receiptBox', body).innerHTML = `<img class="slip-preview" src="${url}" alt="สลิป">`;
      }
    });
  },

  openEdit(t) {
    const cats = MJ.state.categories;
    MJ.sheet.open('แก้ไขรายการ', `
      <div class="seg" id="eType">
        <button class="seg-btn ${t.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
        <button class="seg-btn ${t.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
      </div>
      <label class="field"><span>จำนวนเงิน</span>
        <input type="number" step="0.01" inputmode="decimal" id="eAmount" value="${t.amount}"></label>
      <label class="field"><span>หมวดหมู่</span><select id="eCat">
        ${cats.filter((c) => c.type === t.type).map((c) => `<option value="${c.id}" ${c.id === t.category_id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('')}
      </select></label>
      <label class="field"><span>บันทึกช่วยจำ</span><input type="text" id="eNote" value="${MJ.esc(t.note || '')}"></label>
      <label class="field"><span>วันและเวลา</span><input type="datetime-local" id="eDate" value="${MJ.isoLocal(new Date(t.transaction_date))}"></label>
      <button class="btn btn-primary btn-block" id="eSave">บันทึกการแก้ไข</button>
    `, (body) => {
      let type = t.type;
      MJ.segInit(MJ.$('#eType', body), (b) => {
        type = b.dataset.type;
        body.querySelectorAll('#eType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
        MJ.$('#eCat', body).innerHTML = cats.filter((c) => c.type === type)
          .map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('');
      });
      MJ.$('#eSave', body).onclick = async () => {
        MJ.loading(true, 'กำลังบันทึก…');
        try {
          await MJ.data.updateTransaction(t.id, {
            amount: parseFloat(MJ.$('#eAmount', body).value),
            type,
            category_id: MJ.$('#eCat', body).value || null,
            note: MJ.$('#eNote', body).value.trim() || null,
            transaction_date: new Date(MJ.$('#eDate', body).value).toISOString(),
          });
          MJ.sheet.close(); MJ.toast('แก้ไขแล้ว', 'ok'); MJ.render();
        } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
        finally { MJ.loading(false); }
      };
    });
  },

  /* ---------------------- ส่งออก Excel ---------------------- */
  exportExcel(list, filename) {
    const rows = list.map((t) => {
      const c = MJ.data.catById(t.category_id);
      const d = new Date(t.transaction_date);
      return {
        'วันที่': MJ.isoDate(d),
        'เวลา': MJ.timeLabel(d).replace(' น.', ''),
        'ประเภท': t.type === 'income' ? 'รายรับ' : 'รายจ่าย',
        'หมวดหมู่': c?.name || 'ไม่ระบุ',
        'รายละเอียด': MJ.fixThai(t.note || ''),
        'ผู้รับเงิน/ร้านค้า': MJ.fixThai(t.payee_name || ''),
        'จำนวนเงิน': Number(t.amount),
        'ที่มา': ({ manual:'กรอกเอง', text:'พิมพ์', voice:'เสียง', slip:'สลิป', recurring:'รายการประจำ' })[t.source] || t.source,
        'รหัสอ้างอิงสลิป': t.slip_reference || '',
      };
    });
    const s = MJ.data.summary(list);
    rows.push({}, {
      'วันที่': 'สรุป', 'ประเภท': 'รายรับรวม', 'จำนวนเงิน': s.income,
    }, { 'ประเภท': 'รายจ่ายรวม', 'จำนวนเงิน': s.expense },
       { 'ประเภท': 'คงเหลือ', 'จำนวนเงิน': s.balance });

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 9 }, { wch: 18 }, { wch: 30 }, { wch: 24 }, { wch: 13 }, { wch: 12 }, { wch: 26 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'รายการ');
    XLSX.writeFile(wb, filename || `หมีจด-${MJ.isoDate(MJ.state.month).slice(0, 7)}.xlsx`);
    MJ.toast('ดาวน์โหลดไฟล์แล้ว 📄', 'ok');
  },
};

/* ============================ หน้าแสดงรายการ ============================ */
MJ.routes.transactions = (view) => {
  const f = MJ.tx.filter;
  const list = MJ.tx.filtered();
  const s = MJ.data.summary(list);
  const groups = MJ.tx.groupByDay(list);

  view.innerHTML = `
    <div class="search">
      <i class="fa fa-search muted"></i>
      <input id="txSearch" placeholder="ค้นหารายการ ร้านค้า หรือจำนวนเงิน" value="${MJ.esc(f.q)}">
      ${f.q ? '<button class="icon-btn" id="clearQ"><i class="fa fa-xmark"></i></button>' : ''}
    </div>
    <div class="chips">
      <button class="chip ${f.type === 'all' ? 'active' : ''}" data-f="all">ทั้งหมด</button>
      <button class="chip ${f.type === 'expense' ? 'active' : ''}" data-f="expense">รายจ่าย</button>
      <button class="chip ${f.type === 'income' ? 'active' : ''}" data-f="income">รายรับ</button>
      <button class="chip" id="btnExport"><i class="fa fa-excel"></i> Excel</button>
    </div>
    <div class="stat-grid mb">
      <div class="stat"><div class="k">รายรับ</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(s.income)}</div></div>
      <div class="stat"><div class="k">รายจ่าย</div><div class="v" style="color:var(--out)">${MJ.fmtBaht(s.expense)}</div></div>
    </div>
    <div class="card">
      ${groups.length ? groups.map(([day, items]) => {
        const dsum = items.reduce((a, t) => a + (t.type === 'income' ? Number(t.amount) : -Number(t.amount)), 0);
        return `<div class="day-head"><span>${MJ.dayLabel(day)}</span>
          <span class="${dsum >= 0 ? 'tx-amt in' : 'tx-amt out'}">${dsum >= 0 ? '+' : '−'}${MJ.fmtMoney(Math.abs(dsum))}</span></div>
          ${items.map((t) => MJ.tx.row(t)).join('')}`;
      }).join('') : `<div class="empty"><span class="big">🔍</span>ไม่พบรายการที่ค้นหา</div>`}
    </div>
    <p class="center tiny muted">ทั้งหมด ${list.length} รายการใน ${MJ.monthLabelFull(MJ.state.month)}</p>
    <div style="height:10px"></div>`;

  const input = MJ.$('#txSearch', view);
  let t0;
  input.oninput = () => { clearTimeout(t0); t0 = setTimeout(() => { MJ.tx.filter.q = input.value; MJ.render(); MJ.$('#txSearch').focus(); }, 350); };
  if (MJ.$('#clearQ', view)) MJ.$('#clearQ', view).onclick = () => { MJ.tx.filter.q = ''; MJ.render(); };
  view.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { MJ.tx.filter.type = b.dataset.f; MJ.render(); });
  MJ.$('#btnExport', view).onclick = () => MJ.tx.exportExcel(list);
  MJ.tx.bindRows(view);
};

</script>
<script>
/* ===== 63-analysis.js ===== */
/* ===================================================================
   63-analysis.js — หน้าวิเคราะห์: กราฟหมวด รายวัน แนวโน้ม เทียบเดือนก่อน
   =================================================================== */
MJ.analysis = { type: 'expense', prevCache: {} };

MJ.routes.analysis = (view) => {
  const type = MJ.analysis.type;
  const s = MJ.data.summary();
  const cats = MJ.data.byCategory(type);
  const total = type === 'expense' ? s.expense : s.income;
  const expSeries = MJ.data.dailySeries('expense');
  const incSeries = MJ.data.dailySeries('income');
  const days = expSeries.length;

  // วันที่ใช้จ่ายหนักสุด
  let maxDay = 0, maxVal = 0;
  expSeries.forEach((v, i) => { if (v > maxVal) { maxVal = v; maxDay = i + 1; } });

  // แยกตามวันในสัปดาห์
  const weekday = new Array(7).fill(0);
  MJ.state.transactions.filter((t) => t.type === 'expense')
    .forEach((t) => { weekday[new Date(t.transaction_date).getDay()] += Number(t.amount); });
  const wkMax = Math.max(1, ...weekday);

  // ร้าน/ผู้รับเงินยอดฮิต
  const payees = new Map();
  MJ.state.transactions.filter((t) => t.type === 'expense' && t.payee_name).forEach((t) => {
    const k = MJ.fixThai(t.payee_name);
    payees.set(k, (payees.get(k) || 0) + Number(t.amount));
  });
  const topPayees = Array.from(payees.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);

  view.innerHTML = `
    <div class="seg" id="anType">
      <button class="seg-btn ${type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
      <button class="seg-btn ${type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
    </div>

    <div class="card">
      <div class="card-head"><h3>สัดส่วนตามหมวด</h3><span class="badge">${cats.length} หมวด</span></div>
      ${MJ.charts.donut(cats, { centerTop: type === 'expense' ? 'จ่ายไป' : 'รับมา', centerMain: MJ.fmtBaht(total) })}
      ${MJ.charts.legend(cats, total)}
    </div>

    <div class="card">
      <div class="card-head"><h3>รายวันตลอดเดือน</h3>
        <span class="tiny muted">🟥 จ่าย 🟩 รับ</span></div>
      ${MJ.charts.bars(expSeries, incSeries, { h: 140 })}
      <div class="stat-grid mt">
        <div class="stat"><div class="k">จ่ายหนักสุดวันที่</div><div class="v">${maxVal ? `${maxDay} (${MJ.fmtBaht(maxVal)})` : '-'}</div></div>
        <div class="stat"><div class="k">วันที่ไม่ได้ใช้เงิน</div><div class="v">${expSeries.filter((v) => v === 0).length} วัน</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>ยอดสะสมทั้งเดือน</h3></div>
      ${MJ.charts.line(type === 'expense' ? expSeries : incSeries, type === 'expense' ? 'var(--out)' : 'var(--in)')}
      <div class="bud-foot"><span>วันที่ 1</span><span>วันที่ ${days}</span></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>ใช้เงินวันไหนมากสุด</h3></div>
      ${['อา','จ','อ','พ','พฤ','ศ','ส'].map((d, i) => `
        <div class="bud">
          <div class="bud-top"><span class="bud-name">${d}</span><span>${MJ.fmtBaht(weekday[i])}</span></div>
          <div class="bar"><i style="width:${(weekday[i] / wkMax) * 100}%;background:var(--honey)"></i></div>
        </div>`).join('')}
    </div>

    ${topPayees.length ? `<div class="card">
      <div class="card-head"><h3>จ่ายให้ใครบ่อยสุด</h3></div>
      ${topPayees.map(([n, v]) => `<div class="list-item"><span class="ic">🏪</span>
        <span class="tx2"><b>${MJ.esc(n)}</b></span>
        <span class="tx-amt out">${MJ.fmtBaht(v)}</span></div>`).join('')}
    </div>` : ''}

    <div class="card">
      <div class="card-head"><h3>เทียบกับเดือนก่อน</h3></div>
      <div id="cmpBox"><div class="empty tiny">กำลังคำนวณ…</div></div>
    </div>
    <div style="height:10px"></div>`;

  MJ.segInit(MJ.$('#anType', view), (b) => {
    MJ.analysis.type = b.dataset.type; MJ.render();
  });

  renderCompare(MJ.$('#cmpBox', view));
};

async function renderCompare(box) {
  const cur = MJ.data.summary();
  const prevMonth = new Date(MJ.state.month.getFullYear(), MJ.state.month.getMonth() - 1, 1);
  const key = MJ.isoDate(prevMonth).slice(0, 7);
  let prev = MJ.analysis.prevCache[key];

  if (!prev) {
    const { data } = await MJ.sb.from('transactions').select('amount, type')
      .gte('transaction_date', MJ.startOfMonth(prevMonth).toISOString())
      .lte('transaction_date', MJ.endOfMonth(prevMonth).toISOString());
    prev = { income: 0, expense: 0 };
    (data || []).forEach((t) => { prev[t.type] += Number(t.amount); });
    MJ.analysis.prevCache[key] = prev;
  }

  const diff = cur.expense - prev.expense;
  const pct = prev.expense ? Math.round((diff / prev.expense) * 100) : null;
  box.innerHTML = `
    <div class="stat-grid mb">
      <div class="stat"><div class="k">${MJ.monthLabel(prevMonth)} จ่าย</div><div class="v">${MJ.fmtBaht(prev.expense)}</div></div>
      <div class="stat"><div class="k">${MJ.monthLabel(MJ.state.month)} จ่าย</div><div class="v">${MJ.fmtBaht(cur.expense)}</div></div>
    </div>
    <p class="center ${diff > 0 ? 'tx-amt out' : 'tx-amt in'}" style="font-size:15px">
      ${prev.expense === 0 ? 'เดือนก่อนยังไม่มีข้อมูลให้เทียบ 🐻'
        : (diff > 0 ? `ใช้มากขึ้น ${MJ.fmtBaht(diff)}${pct !== null ? ` (+${pct}%)` : ''} 🫣`
                    : `ประหยัดขึ้น ${MJ.fmtBaht(-diff)}${pct !== null ? ` (${pct}%)` : ''} เก่งมาก! 🎉`)}
    </p>`;
}

</script>
<script>
/* ===== 64-budget.js ===== */
/* ===================================================================
   64-budget.js — จัดการหมวดหมู่และงบประมาณ
   =================================================================== */
MJ.budget = { type: 'expense' };

const ICON_CHOICES = ['🍜','☕','🍔','🛒','🚕','⛽','🚌','🏠','💡','💧','📱','💊','🏥','👕','🎮','🎬','✈️','🐶','🎁','📚','💰','💼','🏦','🍯','🐻','🧾','🎓','💇','🏋️','🍺'];
const COLOR_CHOICES = ['#F2724A','#F2B23E','#3EA96B','#4A9DF2','#B36AE2','#E2607A','#5BC0A5','#8B5E3C','#2E8B9E','#C6A15B','#7FB93E','#9AA0A6'];

MJ.routes.budget = (view) => {
  const type = MJ.budget.type;
  const stats = MJ.data.byCategory(type);
  const cats = MJ.state.categories.filter((c) => c.type === type);
  const statOf = (id) => stats.find((s) => s.id === id) || { total: 0, count: 0 };
  const totalBudget = cats.reduce((a, c) => a + (Number(c.budget_limit) || 0), 0);
  const totalUsed = stats.reduce((a, s) => a + s.total, 0);

  view.innerHTML = `
    <div class="seg" id="budType">
      <button class="seg-btn ${type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> หมวดรายจ่าย</button>
      <button class="seg-btn ${type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> หมวดรายรับ</button>
    </div>

    ${type === 'expense' ? `<div class="card">
      <div class="card-head"><h3>งบรวมเดือนนี้</h3><span class="badge">${MJ.monthLabel(MJ.state.month)}</span></div>
      <div class="bud">
        <div class="bud-top"><span class="bud-name">🍯 ทั้งหมด</span>
          <span>${MJ.fmtBaht(totalUsed)} <span class="muted tiny">/ ${MJ.fmtMoney(totalBudget)}</span></span></div>
        <div class="bar"><i style="width:${totalBudget ? Math.min(100, (totalUsed / totalBudget) * 100) : 0}%;
          background:${totalUsed > totalBudget && totalBudget ? 'var(--out)' : 'linear-gradient(90deg,var(--honey),var(--honey-d))'}"></i></div>
        <div class="bud-foot"><span>${totalBudget ? (totalUsed > totalBudget
          ? `เกินงบ ${MJ.fmtBaht(totalUsed - totalBudget)}` : `เหลือ ${MJ.fmtBaht(totalBudget - totalUsed)}`) : 'ยังไม่ตั้งงบ'}</span>
          <span>${cats.length} หมวด</span></div>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-head"><h3>หมวดหมู่</h3><button class="link" id="addCat">+ เพิ่มหมวด</button></div>
      ${cats.length ? cats.map((c) => {
        const st = statOf(c.id);
        return `<div class="list-item" data-cat="${c.id}">
          <span class="ic" style="background:${MJ.hex2rgba(c.color, .18)}">${c.icon}</span>
          <span class="tx2"><b>${MJ.esc(c.name)}</b>
            <small>${c.budget_limit ? `งบ ${MJ.fmtBaht(c.budget_limit)} • ใช้ไป ${MJ.fmtBaht(st.total)}` : `ใช้ไป ${MJ.fmtBaht(st.total)} • ยังไม่ตั้งงบ`}</small></span>
          <span class="tiny muted">แก้ไข ›</span>
        </div>`;
      }).join('') : '<div class="empty tiny">ยังไม่มีหมวดในกลุ่มนี้</div>'}
    </div>

    ${type === 'expense' && stats.some((s) => s.budget) ? `<div class="card">
      <div class="card-head"><h3>ความคืบหน้ารายหมวด</h3></div>
      ${stats.filter((s) => s.budget).map((s) => MJ.charts.budgetBar(s)).join('')}
    </div>` : ''}
    <div style="height:10px"></div>`;

  MJ.segInit(MJ.$('#budType', view), (b) => { MJ.budget.type = b.dataset.type; MJ.render(); });
  MJ.$('#addCat', view).onclick = () => MJ.budget.openEditor(null);
  view.querySelectorAll('[data-cat]').forEach((el) => el.onclick = () => {
    MJ.budget.openEditor(MJ.data.catById(el.dataset.cat));
  });
};

MJ.budget.openEditor = function (cat) {
  const isNew = !cat;
  const c = cat || { name: '', type: MJ.budget.type, icon: '🐻', color: '#F2B23E', budget_limit: '', keywords: [] };

  MJ.sheet.open(isNew ? 'เพิ่มหมวดใหม่' : 'แก้ไขหมวด', `
    <label class="field"><span>ชื่อหมวด</span>
      <input type="text" id="cName" value="${MJ.esc(c.name)}" placeholder="เช่น ค่ากาแฟ"></label>
    <div class="seg" id="cType">
      <button class="seg-btn ${c.type === 'expense' ? 'active' : ''}" data-type="expense">รายจ่าย</button>
      <button class="seg-btn ${c.type === 'income' ? 'active' : ''}" data-type="income">รายรับ</button>
    </div>
    <div class="field"><span>ไอคอน</span>
      <div class="chips" id="cIcons">${ICON_CHOICES.map((i) => `
        <button class="chip ${i === c.icon ? 'active' : ''}" data-icon="${i}" style="font-size:19px;padding:7px 11px">${i}</button>`).join('')}</div>
    </div>
    <div class="field"><span>สี</span>
      <div class="chips" id="cColors">${COLOR_CHOICES.map((col) => `
        <button class="chip" data-color="${col}" style="background:${col};width:34px;height:34px;padding:0;border-radius:12px;
          ${col === c.color ? 'outline:3px solid var(--ink);outline-offset:2px' : ''}"></button>`).join('')}</div>
    </div>
    <label class="field"><span>งบต่อเดือน (บาท) — เว้นว่างถ้าไม่ตั้ง</span>
      <input type="number" step="1" inputmode="decimal" id="cBudget" value="${c.budget_limit ?? ''}" placeholder="เช่น 3000"></label>
    <label class="field"><span>คำที่ใช้จับหมวดอัตโนมัติ (คั่นด้วยจุลภาค)</span>
      <input type="text" id="cKeywords" value="${MJ.esc((c.keywords || []).join(', '))}" placeholder="กาแฟ, cafe, ลาเต้"></label>
    <button class="btn btn-primary btn-block" id="cSave">${isNew ? 'เพิ่มหมวด' : 'บันทึก'}</button>
    ${isNew ? '' : '<button class="btn btn-danger btn-block mt" id="cDel">ลบหมวดนี้</button>'}
  `, (body) => {
    let type = c.type, icon = c.icon, color = c.color;
    MJ.segInit(MJ.$('#cType', body), (b) => {
      type = b.dataset.type;
      body.querySelectorAll('#cType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
    });
    body.querySelectorAll('#cIcons .chip').forEach((b) => b.onclick = () => {
      icon = b.dataset.icon;
      body.querySelectorAll('#cIcons .chip').forEach((x) => x.classList.toggle('active', x === b));
    });
    body.querySelectorAll('#cColors .chip').forEach((b) => b.onclick = () => {
      color = b.dataset.color;
      body.querySelectorAll('#cColors .chip').forEach((x) => x.style.outline = x === b ? '3px solid var(--ink)' : '');
    });

    MJ.$('#cSave', body).onclick = async () => {
      const name = MJ.$('#cName', body).value.trim();
      if (!name) { MJ.toast('ตั้งชื่อหมวดก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.data.saveCategory({
          id: c.id, name, type, icon, color,
          budget_limit: MJ.$('#cBudget', body).value,
          keywords: MJ.$('#cKeywords', body).value.split(',').map((s) => s.trim()).filter(Boolean),
        });
        MJ.sheet.close(); MJ.toast('บันทึกแล้ว 🐻', 'ok'); MJ.render();
      } catch (e) {
        MJ.toast(/duplicate/i.test(e.message) ? 'มีหมวดชื่อนี้อยู่แล้ว' : 'บันทึกไม่สำเร็จ', 'err');
      } finally { MJ.loading(false); }
    };

    if (MJ.$('#cDel', body)) MJ.$('#cDel', body).onclick = async () => {
      if (!(await MJ.confirm('ลบหมวด', 'รายการเดิมจะยังอยู่แต่จะไม่มีหมวด ยืนยันไหม?', 'ลบหมวด'))) return;
      MJ.loading(true, 'กำลังลบ…');
      try { await MJ.data.archiveCategory(c.id); MJ.sheet.close(); MJ.toast('ลบแล้ว', 'ok'); MJ.render(); }
      catch (e) { MJ.toast('ลบไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
  });
};

</script>
<script>
/* ===== 65-settings.js ===== */
/* ===================================================================
   65-settings.js — โปรไฟล์ ธีม แจ้งเตือน รายการประจำ OCR ส่งออกข้อมูล
   =================================================================== */
MJ.routes.settings = (view) => {
  const p = MJ.state.profile || {};
  const notifState = ('Notification' in window) ? Notification.permission : 'unsupported';

  view.innerHTML = `
    <div class="card">
      <div class="list-item">
        <span class="ic" style="font-size:22px">🐻</span>
        <span class="tx2"><b>${MJ.esc(p.display_name || 'หมีน้อย')}</b><small>${MJ.esc(MJ.state.user.email || '')}</small></span>
        <button class="btn btn-soft btn-sm" id="editProfile">แก้ไข</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>การแสดงผล</h3></div>
      <div class="list-item"><span class="ic"><i class="fa fa-palette"></i></span>
        <span class="tx2"><b>ธีม</b><small>เลือกโหมดสว่าง/มืด</small></span>
        <select id="themeSel" style="width:auto;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)">
          <option value="auto" ${p.theme === 'auto' ? 'selected' : ''}>ตามเครื่อง</option>

          <option value="dark" ${p.theme === 'dark' ? 'selected' : ''}>มืด</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>แจ้งเตือนให้จด</h3></div>
      <div class="list-item"><span class="ic"><i class="fa fa-bell"></i></span>
        <span class="tx2"><b>เวลาเตือนประจำวัน</b><small>${notifState === 'granted' ? 'เปิดใช้งานแล้ว' : 'ต้องอนุญาตการแจ้งเตือนก่อน'}</small></span>
        <input type="time" id="reminderTime" value="${p.reminder_time ? String(p.reminder_time).slice(0, 5) : ''}"
          style="width:auto;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)">
      </div>
      <div class="list-item"><span class="ic"><i class="fa fa-mobile"></i></span>
        <span class="tx2"><b>แจ้งเตือนแม้ปิดแอป (Push)</b><small id="pushHint">กำลังตรวจสอบ…</small></span>
        <div class="switch" id="pushSwitch"><i></i></div>
      </div>
      <button class="btn btn-soft btn-block btn-sm mt" id="pushTest"><i class="fa fa-bell"></i> ทดสอบส่งแจ้งเตือน</button>
      <p class="tiny muted mt">บน iPhone ต้องเพิ่มแอปลงหน้าจอโฮมก่อน แล้วเปิดจากไอคอนแอปถึงจะแจ้งเตือนได้ (iOS 16.4+)</p>
    </div>

    <div class="card">
      <div class="card-head"><h3>รายการประจำ (Subscription)</h3><button class="link" id="addRecur">+ เพิ่ม</button></div>
      ${MJ.state.recurring.length ? MJ.state.recurring.map((r) => {
        const c = MJ.data.catById(r.category_id);
        const freq = { daily: 'ทุกวัน', weekly: 'ทุกสัปดาห์', monthly: 'ทุกเดือน', yearly: 'ทุกปี' }[r.frequency];
        return `<div class="list-item" data-recur="${r.id}">
          <span class="ic" style="background:${MJ.hex2rgba(c?.color || '#F2B23E', .18)}">${c?.icon || '<i class="fa fa-repeat"></i>'}</span>
          <span class="tx2"><b>${MJ.esc(r.note || c?.name || 'รายการประจำ')}</b>
            <small>${freq} • ครั้งถัดไป ${MJ.dayLabel(r.next_run_date)}</small></span>
          <span class="tx-amt ${r.type === 'income' ? 'in' : 'out'}">${MJ.fmtMoney(r.amount)}</span>
        </div>`;
      }).join('') : '<div class="empty tiny">ยังไม่มีรายการประจำ เช่น ค่าเน็ต Netflix ค่าเช่าห้อง</div>'}
    </div>

    <div class="card">
      <div class="card-head"><h3>อ่านสลิป (OCR)</h3></div>
      <div class="list-item"><span class="ic"><i class="fa fa-eye"></i></span>
        <span class="tx2"><b>${p.ocr_endpoint ? 'PaddleOCR (เซิร์ฟเวอร์ของคุณ)' : 'อ่านในเครื่อง (Tesseract.js)'}</b>
          <small>${p.ocr_endpoint ? MJ.esc(p.ocr_endpoint) : 'ฟรี ไม่ต้องตั้งค่าอะไร'}</small></span>
        <button class="btn btn-soft btn-sm" id="editOcr">ตั้งค่า</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>ข้อมูลของฉัน</h3></div>
      <div class="list-item" id="expMonth"><span class="ic"><i class="fa fa-excel"></i></span>
        <span class="tx2"><b>ส่งออกเดือนนี้เป็น Excel</b><small>${MJ.monthLabelFull(MJ.state.month)}</small></span><span class="tiny muted">›</span></div>
      <div class="list-item" id="expAll"><span class="ic"><i class="fa fa-boxes"></i></span>
        <span class="tx2"><b>ส่งออกทั้งหมด</b><small>ทุกรายการที่เคยบันทึก</small></span><span class="tiny muted">›</span></div>
      <div class="list-item" id="runRecur"><span class="ic"><i class="fa fa-rotate"></i></span>
        <span class="tx2"><b>ประมวลผลรายการประจำเดี๋ยวนี้</b><small>เผื่อรายการที่ถึงกำหนดแล้ว</small></span><span class="tiny muted">›</span></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>เกี่ยวกับ</h3></div>
      <div class="list-item" id="howInstall"><span class="ic"><i class="fa fa-mobile"></i></span>
        <span class="tx2"><b>ติดตั้งลงหน้าจอโฮม</b><small>ใช้เหมือนแอปจริง</small></span><span class="tiny muted">›</span></div>
      <div class="list-item"><span class="ic">🍯</span>
        <span class="tx2"><b>หมีจด MheeJod</b><small>เวอร์ชัน 1.0 • ข้อมูลเก็บใน Supabase ของคุณเอง</small></span></div>
    </div>

    <button class="btn btn-danger btn-block" id="signOut">ออกจากระบบ</button>
    <div style="height:16px"></div>`;

  MJ.$('#editProfile', view).onclick = () => openProfileSheet();
  MJ.$('#themeSel', view).onchange = async (e) => {
    const v = e.target.value;
    MJ.applyTheme(v);
    try { await MJ.data.saveProfile({ theme: v }); } catch (err) { MJ.toast('บันทึกธีมไม่สำเร็จ', 'err'); }
  };
  MJ.$('#reminderTime', view).onchange = async (e) => {
    const v = e.target.value || null;
    try {
      await MJ.data.saveProfile({ reminder_time: v });
      MJ.reminder.schedule();
      MJ.toast(v ? `จะเตือนทุกวันเวลา ${v} น.` : 'ปิดการเตือนแล้ว', 'ok');
    } catch (err) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
  };
  /* ---------- สวิตช์ Push ---------- */
  (async () => {
    const sw = MJ.$('#pushSwitch', view);
    const hint = MJ.$('#pushHint', view);
    if (!sw) return;
    const st = await MJ.push.status();
    const texts = {
      on: 'เปิดอยู่บนเครื่องนี้',
      off: MJ.push.needsInstall() ? 'ต้องเพิ่มลงหน้าจอโฮมก่อน' : 'ปิดอยู่ — แตะเพื่อเปิด',

      unsupported: 'เบราว์เซอร์นี้ไม่รองรับ',
    };
    hint.textContent = texts[st] || '';
    sw.classList.toggle('on', st === 'on');
    sw.onclick = async () => {
      const now = await MJ.push.status();
      const ok = now === 'on' ? await MJ.push.disable() : await MJ.push.enable();
      if (ok) MJ.render();
    };
  })();
  if (MJ.$('#pushTest', view)) MJ.$('#pushTest', view).onclick = () => MJ.push.test();
  MJ.$('#addRecur', view).onclick = () => openRecurSheet(null);
  view.querySelectorAll('[data-recur]').forEach((el) => el.onclick = () =>
    openRecurSheet(MJ.state.recurring.find((r) => r.id === el.dataset.recur)));
  MJ.$('#editOcr', view).onclick = () => openOcrSheet();
  MJ.$('#expMonth', view).onclick = () => MJ.tx.exportExcel(MJ.state.transactions);
  MJ.$('#expAll', view).onclick = async () => {
    MJ.loading(true, 'กำลังรวบรวมข้อมูล…');
    const { data } = await MJ.sb.from('transactions').select('*').order('transaction_date', { ascending: false }).limit(10000);
    MJ.loading(false);
    MJ.tx.exportExcel(data || [], 'หมีจด-ทั้งหมด.xlsx');
  };
  MJ.$('#runRecur', view).onclick = async () => {
    MJ.loading(true, 'กำลังประมวลผล…');
    const n = await MJ.data.runRecurring();
    MJ.loading(false);

        <option value="weekly" ${v.frequency === 'weekly' ? 'selected' : ''}>ทุกสัปดาห์</option>

    };

      await MJ.data.saveProfile({ ocr_endpoint: null });
      MJ.sheet.close(); MJ.toast('กลับไปใช้การอ่านในเครื่องแล้ว', 'ok'); MJ.render();

/* ---------------------- ตัวเตือนประจำวัน (ฝั่งเครื่อง) ---------------------- */
MJ.reminder = {
  timer: null,
  schedule() {
    clearTimeout(this.timer);
    const t = MJ.state.profile?.reminder_time;
    if (!t || !('Notification' in window) || Notification.permission !== 'granted') return;
    const [h, m] = String(t).split(':').map(Number);
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    this.timer = setTimeout(() => {
      const s = MJ.data.summary();
      new Notification('หมีจดเตือนแล้วนะ 🐻', {
        body: s.count ? `วันนี้จดไปแล้ว ${s.count} รายการ อย่าลืมจดที่เหลือน้า` : 'วันนี้ยังไม่ได้จดเลย มาจดกัน!',
        icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'mheejod-daily',
      });
      this.schedule();
    }, next - now);
  },
};

<script>
/* ===== 70-push.js ===== */
/* ===================================================================
   70-push.js — แจ้งเตือนแบบ Push (Web Push + VAPID)
   ทำงานแม้ปิดแอปอยู่ ต่างจากตัวเตือนเดิมที่ทำงานเฉพาะตอนเปิดแอปค้างไว้
   บน iPhone ต้อง "เพิ่มไปยังหน้าจอโฮม" ก่อน แล้วเปิดจากไอคอนแอป (iOS 16.4+)
   =================================================================== */
MJ.push = {
  VAPID_PUBLIC: 'BN4QfLrxWTUlBsqqhMMqY99IrqPZLFzx4GdRFhyMi15CNRgdxV-nYvrahxI10DCHZKeaqDNSnTESIP8eVt0e1ow',

  /** เบราว์เซอร์นี้รองรับ push ไหม */
  supported() {
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  },

  /** ต้องติดตั้งลงหน้าจอโฮมก่อนไหม (เฉพาะ iOS) */
  needsInstall() {
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    return iOS && !standalone;
  },

  async status() {
    if (!this.supported()) return 'unsupported';
    if (Notification.permission === 'denied') return 'denied';
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      return sub ? 'on' : 'off';
    } catch (e) { return 'off'; }
  },

  urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  },

  /** เปิดการแจ้งเตือน: ขอสิทธิ์ -> สมัครกับเบราว์เซอร์ -> เก็บลง Supabase */
  async enable() {
    if (!this.supported()) {
      MJ.toast('เบราว์เซอร์นี้ยังไม่รองรับการแจ้งเตือน', 'err');
      return false;
    }
    if (this.needsInstall()) {
      MJ.toast('บน iPhone ต้องเพิ่มลงหน้าจอโฮมก่อนนะ', 'err');
      return false;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      MJ.toast(perm === 'denied' ? 'ถูกปิดไว้ในตั้งค่าเบราว์เซอร์' : 'ยังไม่ได้รับอนุญาต', 'err');
      return false;
    }

    MJ.loading(true, 'กำลังเปิดการแจ้งเตือน…');
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: this.urlBase64ToUint8Array(this.VAPID_PUBLIC),
        });
      }
      const json = sub.toJSON();
      const { error } = await MJ.sb.from('push_subscriptions').upsert({
        user_id: MJ.state.user.id,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
        user_agent: navigator.userAgent.slice(0, 200),
        fail_count: 0,
      }, { onConflict: 'endpoint' });
      if (error) throw error;

      MJ.toast('เปิดแจ้งเตือนแล้ว 🔔', 'ok');
      return true;
    } catch (err) {
      MJ.toast('เปิดแจ้งเตือนไม่สำเร็จ: ' + (err.message || err), 'err');
      return false;
    } finally { MJ.loading(false); }
  },

  /** ปิดการแจ้งเตือนสำหรับอุปกรณ์นี้ */
  async disable() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await MJ.sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
        await sub.unsubscribe();
      }
      MJ.toast('ปิดแจ้งเตือนของเครื่องนี้แล้ว', 'ok');
      return true;
    } catch (err) {
      MJ.toast('ปิดไม่สำเร็จ: ' + (err.message || err), 'err');
      return false;
    }
  },

  /** ยิงแจ้งเตือนทดสอบมาที่เครื่องนี้ (ผ่าน Edge Function) */
  async test() {
    MJ.loading(true, 'กำลังส่งแจ้งเตือนทดสอบ…');
    try {
      const { data, error } = await MJ.sb.functions.invoke('notify', {
        body: { test_user_id: MJ.state.user.id },
      });
      if (error) throw error;
      MJ.toast(data?.sent ? 'ส่งแล้ว รอสัก 2-3 วินาที 🔔' : 'ยังไม่มีอุปกรณ์ที่เปิดแจ้งเตือน', data?.sent ? 'ok' : 'err');
    } catch (err) {
      MJ.toast('ส่งไม่สำเร็จ: ' + (err.message || err), 'err');
    } finally { MJ.loading(false); }
  },

  /** เช็กตอนเปิดแอป: ถ้าเคยเปิดไว้ ให้ sync ข้อมูล subscription ล่าสุดขึ้นฐานข้อมูล */
  async sync() {
    if (!this.supported() || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      const json = sub.toJSON();
      await MJ.sb.from('push_subscriptions').upsert({
        user_id: MJ.state.user.id,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
        user_agent: navigator.userAgent.slice(0, 200),
        fail_count: 0,
      }, { onConflict: 'endpoint' });
    } catch (e) { /* ไม่สำคัญพอที่จะรบกวนผู้ใช้ */ }
  },
};

</script>
<script>
/* ===== 99-boot.js ===== */
/* ===================================================================
   99-boot.js — เริ่มระบบ: ธีม, auth, การนำทาง, service worker, share target
   =================================================================== */
MJ.applyTheme = (mode) => {
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
  else root.removeAttribute('data-theme');
};

MJ.boot = async function () {
  MJ.applyTheme(localStorage.getItem('mj-theme') || 'auto');

  /* ---------- การนำทาง ---------- */
  document.querySelectorAll('.tab, .fab').forEach((el) => {
    el.onclick = () => { MJ.buzz(8); MJ.go(el.dataset.route); };
  });
  document.querySelectorAll('#sheet [data-close]').forEach((el) => el.onclick = () => MJ.sheet.close());
  window.addEventListener('hashchange', () => {
    const r = location.hash.replace('#', '') || 'dashboard';
    if (MJ.routes[r] && r !== MJ.state.route) { MJ.state.route = r; MJ.render(); }
  });

  /* ---------- เปลี่ยนเดือน ---------- */
  const shiftMonth = async (delta) => {
    MJ.state.month = new Date(MJ.state.month.getFullYear(), MJ.state.month.getMonth() + delta, 1);
    MJ.$('#btnMonth').textContent = MJ.monthLabel(MJ.state.month);
    MJ.loading(true, 'กำลังโหลดเดือน ' + MJ.monthLabel(MJ.state.month));
    await MJ.data.loadMonth();
    MJ.loading(false);
    MJ.render();
  };
  MJ.$('#btnMonthPrev').onclick = () => shiftMonth(-1);
  MJ.$('#btnMonthNext').onclick = () => shiftMonth(1);
  MJ.$('#btnMonth').onclick = () => MJ.openMonthPicker(shiftToMonth);

  /** ไปยังเดือนที่เลือกจากตัวเลือกเดือน */
  async function shiftToMonth(date) {
    MJ.state.month = new Date(date.getFullYear(), date.getMonth(), 1);
    MJ.$('#btnMonth').textContent = MJ.monthLabel(MJ.state.month);
    MJ.loading(true, 'กำลังโหลด ' + MJ.monthLabelFull(MJ.state.month));
    await MJ.data.loadMonth();
    MJ.loading(false);
    MJ.render();
  }

  /* ---------- Service worker + share target ---------- */
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js', { scope: './' });
    } catch (e) { /* ใช้งานต่อได้แม้ลงทะเบียนไม่สำเร็จ */ }
  }

  /* ---------- Auth ---------- */
  const { data: { session } } = await MJ.sb.auth.getSession();
  MJ.sb.auth.onAuthStateChange((event, sess) => {
    if (event === 'SIGNED_IN' && !MJ.state.user) MJ.start(sess.user);
    if (event === 'SIGNED_OUT') location.reload();
  });

  if (session?.user) await MJ.start(session.user);
  else {
    MJ.$('#authScreen').classList.remove('hidden');
    MJ.auth.mount();
  }
};

MJ.start = async function (user) {
  MJ.state.user = user;
  MJ.$('#authScreen').classList.add('hidden');
  MJ.loading(true, 'กำลังเตรียมข้อมูล…');
  try {
    await MJ.data.loadAll();
  } catch (e) {
    MJ.toast('โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e), 'err');
  }
  MJ.loading(false);

  const theme = MJ.state.profile?.theme || 'auto';
  localStorage.setItem('mj-theme', theme);
  MJ.applyTheme(theme);

  MJ.$('#app').classList.remove('hidden');
  MJ.$('#btnMonth').textContent = MJ.monthLabel(MJ.state.month);
  const hash = location.hash.replace('#', '');
  MJ.state.route = MJ.routes[hash] ? hash : 'dashboard';
  MJ.render();

  MJ.reminder.schedule();
  MJ.push.sync();
  MJ.data.runRecurring().then((n) => { if (n) MJ.render(); });
  handleSharedSlip();
};

/* ---------- รับรูปสลิปที่แชร์เข้ามาจากแอปอื่น (Web Share Target) ---------- */
async function handleSharedSlip() {
  const params = new URLSearchParams(location.search);
  if (!params.has('share')) return;
  history.replaceState({}, '', location.pathname + location.hash);
  try {
    const cache = await caches.open('mj-share');
    const res = await cache.match('shared-slip');
    if (!res) return;
    const blob = await res.blob();
    await cache.delete('shared-slip');
    const file = new File([blob], 'slip.jpg', { type: blob.type || 'image/jpeg' });
    MJ.go('add', { tab: 'slip' });
    MJ.add.processSlip(file);
  } catch (e) { /* ไม่มีไฟล์ก็ข้ามไป */ }
}

document.addEventListener('DOMContentLoaded', () => MJ.boot());

</script>
</body>
