    MJ.toast('ดาวน์โหลดไฟล์แล้ว 📄', 'ok');
  },
};

/** แท็บสลับ รายการ | ปฏิทิน (ใช้ร่วมกันสองหน้า) */
MJ.listTabs = (active) => `
  <div class="seg" id="listTabs">
    <button class="seg-btn ${active === 'transactions' ? 'active' : ''}" data-route="transactions"><i class="fa fa-list"></i> รายการ</button>
    <button class="seg-btn ${active === 'calendar' ? 'active' : ''}" data-route="calendar"><i class="fa fa-calendar"></i> ปฏิทิน</button>
  </div>`;
MJ.bindListTabs = (view) => MJ.segInit(MJ.$('#listTabs', view), (b) => MJ.go(b.dataset.route));

/* ============================ หน้าแสดงรายการ ============================ */
MJ.routes.transactions = (view) => {
  const f = MJ.tx.filter;
  const searching = f.scope === 'all' && MJ.tx.searchResults;
  const list = searching ? MJ.tx.searchResults : MJ.tx.filtered();
  const shown = list.slice(0, MJ.tx.limit);
  const s = MJ.data.summary(list);
  const groups = MJ.tx.groupByDay(shown);
  const cats = MJ.state.categories;
  const accounts = MJ.state.accounts || [];

  // ตัวกรองที่กำลังใช้อยู่ (แสดงเป็นชิปให้กดปิดได้ทีละอัน)
  const active = [];
  if (f.scope === 'all') active.push(['scope', 'ทุกเดือน']);
  if (f.type !== 'all') active.push(['type', f.type === 'expense' ? 'เฉพาะรายจ่าย' : 'เฉพาะรายรับ']);
  if (f.category !== 'all') active.push(['category', cats.find((c) => c.id === f.category)?.name || 'หมวด']);
  if (f.account !== 'all') active.push(['account', accounts.find((a) => a.id === f.account)?.name || 'กระเป๋า']);
  if (f.from) active.push(['from', 'ตั้งแต่ ' + f.from]);
  if (f.to) active.push(['to', 'ถึง ' + f.to]);

  view.innerHTML = `
    ${MJ.listTabs('transactions')}

    <div class="search">
      <i class="fa fa-search muted"></i>
      <input id="txSearch" placeholder="ค้นหารายการ ร้านค้า หรือจำนวนเงิน" value="${MJ.esc(f.q)}">
      ${f.q ? '<button class="icon-btn" id="clearQ"><i class="fa fa-xmark"></i></button>' : ''}
      <button class="icon-btn filter-btn ${active.length ? 'on' : ''}" id="btnFilter" title="ตัวกรอง">
        <i class="fa fa-filter"></i>${active.length ? `<em>${active.length}</em>` : ''}</button>
    </div>

    ${active.length ? `<div class="chips">
      ${active.map(([k, label]) => `<button class="chip mini active" data-clear="${k}">${MJ.esc(label)} ✕</button>`).join('')}
      <button class="chip mini" data-clear="reset">ล้างทั้งหมด</button>
    </div>` : ''}

    <div class="stat-grid">
      <div class="stat"><div class="k">รายรับ</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(s.income)}</div></div>
      <div class="stat"><div class="k">รายจ่าย</div><div class="v" style="color:var(--out)">${MJ.fmtBaht(s.expense)}</div></div>
    </div>

    <div class="tx-toolbar">
      <span class="tx-count">${searching ? `พบ ${list.length} รายการ (ทุกเดือน)` : `${list.length} รายการ · ${MJ.monthLabel(MJ.state.month)}`}</span>
      <button class="tool-btn ${MJ.tx.selectMode ? 'on' : ''}" id="btnMenu">
        ${MJ.tx.selectMode ? '<i class="fa fa-xmark"></i> ออกจากโหมดเลือก' : '<i class="fa fa-ellipsis"></i> เมนู'}</button>
    </div>

    <div class="card">
      ${groups.length ? groups.map(([day, items]) => {
        const dsum = items.filter((t) => t.kind !== 'transfer')
          .reduce((a, t) => a + (t.type === 'income' ? Number(t.amount) : -Number(t.amount)), 0);
        return `<div class="day-head"><span>${MJ.dayLabel(day)}</span>
          <span class="${dsum >= 0 ? 'tx-amt in' : 'tx-amt out'}">${dsum >= 0 ? '+' : '−'}${MJ.fmtMoney(Math.abs(dsum))}</span></div>
          ${items.map((t) => MJ.tx.row(t)).join('')}`;
      }).join('') : `<div class="empty"><span class="big">🔍</span>ไม่พบรายการ<br>
        <span class="tiny">ลองเปลี่ยนเดือนด้านบน หรือกดตัวกรองเพื่อค้นทุกเดือน</span></div>`}
    </div>

    ${list.length > MJ.tx.limit ? `<button class="btn btn-soft btn-block" id="btnMore">
      โหลดเพิ่ม (เหลืออีก ${list.length - MJ.tx.limit} รายการ)</button>` : ''}
    <div style="height:10px"></div>`;

  MJ.bindListTabs(view);

  /* ---------- ค้นหา ---------- */
  const input = MJ.$('#txSearch', view);
  let t0;
  input.oninput = () => {
    clearTimeout(t0);
    t0 = setTimeout(async () => {
      MJ.tx.filter.q = input.value;
      if (MJ.tx.filter.scope === 'all') await MJ.tx.runSearch();
      MJ.render();
      const el = MJ.$('#txSearch');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 380);
  };
  if (MJ.$('#clearQ', view)) MJ.$('#clearQ', view).onclick = async () => {
    MJ.tx.filter.q = '';
    if (MJ.tx.filter.scope === 'all') await MJ.tx.runSearch();
    MJ.render();
  };
  MJ.$('#btnFilter', view).onclick = () => MJ.tx.openFilterSheet();

  view.querySelectorAll('[data-clear]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.clear;
    if (k === 'reset') {
      Object.assign(f, { type: 'all', q: '', category: 'all', account: 'all', scope: 'month', from: '', to: '' });
      MJ.tx.searchResults = null;
    } else if (k === 'scope') {
      f.scope = 'month'; MJ.tx.searchResults = null;
    } else if (k === 'type') f.type = 'all';
    else if (k === 'category' || k === 'account') f[k] = 'all';
    else f[k] = '';
    MJ.tx.limit = 50;
    if (f.scope === 'all') { MJ.loading(true, 'กำลังค้น…'); await MJ.tx.runSearch(); MJ.loading(false); }
    MJ.render();
  });

  if (MJ.$('#btnMore', view)) MJ.$('#btnMore', view).onclick = () => { MJ.tx.limit += 50; MJ.render(); };

  /* ---------- เมนูเครื่องมือ ---------- */
  MJ.$('#btnMenu', view).onclick = () => {
    if (MJ.tx.selectMode) {          // อยู่ในโหมดเลือกอยู่แล้ว = กดเพื่อออก
      MJ.tx.selectMode = false;
      MJ.tx.selected.clear();
      const bar = MJ.$('#bulkBar'); if (bar) bar.remove();
      MJ.render();
      return;
    }
    MJ.sheet.open('เมนูรายการ', `
      <div class="list-item" id="mnSelect"><span class="ic"><i class="fa fa-check"></i></span>
        <span class="tx2"><b>เลือกหลายรายการ</b><small>ลบหรือย้ายหมวดทีเดียวหลายอัน</small></span>
        <span class="tiny muted"><i class="fa fa-angle-r"></i></span></div>
      <div class="list-item" id="mnExport"><span class="ic"><i class="fa fa-excel"></i></span>
        <span class="tx2"><b>ส่งออกเป็น Excel</b><small>${list.length} รายการที่เห็นอยู่ตอนนี้</small></span>
        <span class="tiny muted"><i class="fa fa-angle-r"></i></span></div>
      <div class="list-item" id="mnFilter"><span class="ic"><i class="fa fa-filter"></i></span>
        <span class="tx2"><b>ตัวกรอง</b><small>ประเภท หมวด กระเป๋า ช่วงวันที่</small></span>
        <span class="tiny muted"><i class="fa fa-angle-r"></i></span></div>
    `, (body) => {
      MJ.$('#mnSelect', body).onclick = () => {
        MJ.sheet.close();
        MJ.tx.selectMode = true; MJ.tx.selected.clear(); MJ.render();
        MJ.toast('แตะรายการที่ต้องการเลือก');
      };
      MJ.$('#mnExport', body).onclick = () => { MJ.sheet.close(); MJ.tx.exportExcel(list); };
      MJ.$('#mnFilter', body).onclick = () => { MJ.sheet.close(); MJ.tx.openFilterSheet(); };
    });
  };

  if (MJ.tx.selectMode) MJ.tx.bindSelect(view);
  else MJ.tx.bindRows(view);
};

/* ---------------------- ค้นหาข้ามเดือน ---------------------- */
MJ.tx.runSearch = async function () {
  const f = MJ.tx.filter;
  try {
    MJ.tx.searchResults = await MJ.data.searchAll(f.q.trim(), {
      type: f.type, category: f.category, account: f.account,
      from: f.from || null, to: f.to || null, limit: 500,
    });
  } catch (e) {
    MJ.toast('ค้นหาไม่สำเร็จ', 'err');
    MJ.tx.searchResults = [];
  }
};

/* ---------------------- ตัวกรองละเอียด ---------------------- */
MJ.tx.openFilterSheet = function () {
  const f = MJ.tx.filter;
  const cats = MJ.state.categories, accounts = MJ.state.accounts || [];
  MJ.sheet.open('ตัวกรอง', `
    <div class="field"><span>ประเภทรายการ</span>
      <div class="seg" id="ftType">
        <button class="seg-btn ${f.type === 'all' ? 'active' : ''}" data-t="all">ทั้งหมด</button>
        <button class="seg-btn ${f.type === 'expense' ? 'active' : ''}" data-t="expense">รายจ่าย</button>
        <button class="seg-btn ${f.type === 'income' ? 'active' : ''}" data-t="income">รายรับ</button>
      </div>
    </div>

    <div class="list-item"><span class="ic"><i class="fa fa-boxes"></i></span>
      <span class="tx2"><b>ค้นทุกเดือน</b><small>ปิดไว้ = ดูเฉพาะ ${MJ.monthLabel(MJ.state.month)}</small></span>
      <div class="switch ${f.scope === 'all' ? 'on' : ''}" id="ftScope"><i></i></div>
    </div>

    <label class="field mt"><span>หมวดหมู่</span><select id="ftCat">
      <option value="all">ทุกหมวด</option>
      ${cats.map((c) => `<option value="${c.id}" ${f.category === c.id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('')}
    </select></label>

    <label class="field"><span>กระเป๋าเงิน</span><select id="ftAcc">
      <option value="all">ทุกกระเป๋า</option>
      ${accounts.map((a) => `<option value="${a.id}" ${f.account === a.id ? 'selected' : ''}>${a.icon} ${MJ.esc(a.name)}</option>`).join('')}
    </select></label>

    <div class="row">
      <label class="field"><span>ตั้งแต่วันที่</span><input type="date" id="ftFrom" value="${f.from}"></label>
      <label class="field"><span>ถึงวันที่</span><input type="date" id="ftTo" value="${f.to}"></label>
    </div>
    <p class="tiny muted mb">ถ้าเลือกช่วงวันที่ ระบบจะค้นทุกเดือนให้อัตโนมัติ</p>

    <button class="btn btn-primary btn-block" id="ftApply">ดูผลลัพธ์</button>
    <button class="btn btn-ghost btn-block" id="ftReset">ล้างตัวกรองทั้งหมด</button>
  `, (body) => {
    let type = f.type, scope = f.scope;
    MJ.segInit(MJ.$('#ftType', body), (b) => { type = b.dataset.t; });
    MJ.$('#ftScope', body).onclick = (e) => {
      scope = scope === 'all' ? 'month' : 'all';
      e.currentTarget.classList.toggle('on', scope === 'all');
    };

    MJ.$('#ftApply', body).onclick = async () => {
      f.type = type;
      f.category = MJ.$('#ftCat', body).value;
      f.account = MJ.$('#ftAcc', body).value;
      f.from = MJ.$('#ftFrom', body).value;
      f.to = MJ.$('#ftTo', body).value;
      f.scope = (f.from || f.to) ? 'all' : scope;
      MJ.tx.limit = 50;
      MJ.loading(true, 'กำลังกรอง…');
      if (f.scope === 'all') await MJ.tx.runSearch(); else MJ.tx.searchResults = null;
      MJ.loading(false);
      MJ.sheet.close(); MJ.render();
    };
    MJ.$('#ftReset', body).onclick = () => {
      Object.assign(f, { type: 'all', q: '', category: 'all', account: 'all', scope: 'month', from: '', to: '' });
      MJ.tx.searchResults = null;
      MJ.sheet.close(); MJ.render();
    };
  });
};

/* ---------------------- เลือกหลายรายการ ---------------------- */
MJ.tx.bindSelect = function (view) {
  view.querySelectorAll('[data-tx]').forEach((el) => {
    el.classList.add('selectable');
    el.classList.toggle('picked', MJ.tx.selected.has(el.dataset.tx));
    el.onclick = () => {
      const id = el.dataset.tx;
      if (MJ.tx.selected.has(id)) MJ.tx.selected.delete(id); else MJ.tx.selected.add(id);
      el.classList.toggle('picked', MJ.tx.selected.has(id));
      MJ.buzz(6);
      drawBar();
    };
  });

  const drawBar = () => {
    let bar = MJ.$('#bulkBar');
    if (!MJ.tx.selected.size) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'bulkBar';
      bar.className = 'bulk-bar';
      document.body.appendChild(bar);
    }
    const sum = MJ.state.transactions.filter((t) => MJ.tx.selected.has(t.id))
      .reduce((a, t) => a + Number(t.amount), 0);
    bar.innerHTML = `
      <span>เลือก ${MJ.tx.selected.size} รายการ · ${MJ.fmtBaht(sum)}</span>
      <button class="btn btn-soft btn-sm" id="bulkCat"><i class="fa fa-tag"></i> เปลี่ยนหมวด</button>
      <button class="btn btn-danger btn-sm" id="bulkDel"><i class="fa fa-trash"></i> ลบ</button>`;

    MJ.$('#bulkCat', bar).onclick = () => {
      const cats = MJ.state.categories;
      MJ.sheet.open('เปลี่ยนหมวดของรายการที่เลือก', `
        <label class="field"><span>ย้ายไปหมวด</span><select id="bkCat">
          ${cats.map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)} (${c.type === 'income' ? 'รายรับ' : 'รายจ่าย'})</option>`).join('')}
        </select></label>
        <button class="btn btn-primary btn-block" id="bkOk">ย้าย ${MJ.tx.selected.size} รายการ</button>`, (b2) => {
        MJ.$('#bkOk', b2).onclick = async () => {
          MJ.loading(true, 'กำลังย้าย…');
          try {
            await MJ.data.setCategoryMany([...MJ.tx.selected], MJ.$('#bkCat', b2).value);
            MJ.tx.selected.clear();
            MJ.sheet.close(); MJ.toast('ย้ายหมวดแล้ว', 'ok'); MJ.render();
          } catch (e) { MJ.toast('ย้ายไม่สำเร็จ', 'err'); }
          finally { MJ.loading(false); }
        };
      });
    };
    MJ.$('#bulkDel', bar).onclick = async () => {
      const n = MJ.tx.selected.size;
      if (!(await MJ.confirm('ลบหลายรายการ', `ลบ ${n} รายการที่เลือกใช่ไหม?`, 'ลบทั้งหมด'))) return;
      MJ.loading(true, 'กำลังลบ…');
      try {
        const snaps = await MJ.data.deleteMany([...MJ.tx.selected]);
        MJ.tx.selected.clear();
        MJ.render();
        MJ.toastUndo(`ลบแล้ว ${n} รายการ`, async () => {
          for (const s of snaps) await MJ.data.restoreTransaction(s);
          MJ.toast('คืนรายการให้แล้ว', 'ok');
          MJ.render();
        });
      } catch (e) { MJ.toast('ลบไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
  };
  drawBar();
};

</script>
<script>
/* ===== 63-analysis.js ===== */
/* ===================================================================
   63-analysis.js — หน้าวิเคราะห์: กราฟหมวด รายวัน แนวโน้ม เทียบเดือนก่อน
   =================================================================== */
MJ.analysis = { type: 'expense', prevCache: {}, view: 'month', yearData: null, year: new Date().getFullYear() };

MJ.routes.analysis = (view) => {
  view.innerHTML = `
    <div class="seg" id="anView">
      <button class="seg-btn ${MJ.analysis.view === 'month' ? 'active' : ''}" data-v="month"><i class="fa fa-chart-pie"></i> รายเดือน</button>
      <button class="seg-btn ${MJ.analysis.view === 'year' ? 'active' : ''}" data-v="year"><i class="fa fa-chart-bar"></i> รายปี</button>
    </div>
    <div id="anBody"></div>`;
  MJ.segInit(MJ.$('#anView', view), (b) => { MJ.analysis.view = b.dataset.v; MJ.render(); });
  const body = MJ.$('#anBody', view);
  if (MJ.analysis.view === 'year') return renderYear(body);
  renderMonth(body);
};

function renderMonth(view) {
  const type = MJ.analysis.type;
  const s = MJ.data.summary();
  const cats = MJ.data.byCategory(type);
  const total = type === 'expense' ? s.expense : s.income;
  const expSeries = MJ.data.dailySeries('expense');
  const incSeries = MJ.data.dailySeries('income');
  const days = expSeries.length;

  // วันที่ใช้จ่ายหนักสุด
  let maxDay = 0, maxVal = 0;
  expSeries.forEach((v, i) => { if (v > maxVal) { maxVal = v; maxDay = i + 1; } });

  // แยกตามวันในสัปดาห์
  const weekday = new Array(7).fill(0);
  MJ.state.transactions.filter((t) => t.type === 'expense')
    .forEach((t) => { weekday[new Date(t.transaction_date).getDay()] += Number(t.amount); });
  const wkMax = Math.max(1, ...weekday);

  // ร้าน/ผู้รับเงินยอดฮิต
  const payees = new Map();
  MJ.state.transactions.filter((t) => t.type === 'expense' && t.payee_name).forEach((t) => {
    const k = MJ.fixThai(t.payee_name);
    payees.set(k, (payees.get(k) || 0) + Number(t.amount));
  });
  const topPayees = Array.from(payees.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);

  view.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h3>สัดส่วนตาม${type === 'expense' ? 'รายจ่าย' : 'รายรับ'}</h3>
        <div class="seg mini" id="anType">
          <button class="seg-btn ${type === 'expense' ? 'active' : ''}" data-type="expense">จ่าย</button>
          <button class="seg-btn ${type === 'income' ? 'active' : ''}" data-type="income">รับ</button>
        </div>
      </div>
      ${MJ.charts.donut(cats, { centerTop: type === 'expense' ? 'จ่ายไป' : 'รับมา', centerMain: MJ.fmtBaht(total) })}
      ${MJ.charts.legend(cats, total)}
    </div>

    <div class="card">
      <div class="card-head"><h3>รายวันตลอดเดือน</h3>
        <span class="tiny muted">🟥 จ่าย 🟩 รับ</span></div>
      ${MJ.charts.bars(expSeries, incSeries, { h: 140 })}
      <div class="stat-grid mt">
        <div class="stat"><div class="k">จ่ายหนักสุดวันที่</div><div class="v">${maxVal ? `${maxDay} (${MJ.fmtBaht(maxVal)})` : '-'}</div></div>
        <div class="stat"><div class="k">วันที่ไม่ได้ใช้เงิน</div><div class="v">${expSeries.filter((v) => v === 0).length} วัน</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>ยอดสะสม${type === 'expense' ? 'รายจ่าย' : 'รายรับ'}ทั้งเดือน</h3>
        <span class="badge">${cats.length} หมวด</span></div>
      ${MJ.charts.line(type === 'expense' ? expSeries : incSeries, type === 'expense' ? 'var(--out)' : 'var(--in)')}
      <div class="bud-foot"><span>วันที่ 1</span><span>วันที่ ${days}</span></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>ใช้เงินวันไหนมากสุด</h3></div>
      ${['อา','จ','อ','พ','พฤ','ศ','ส'].map((d, i) => `
        <div class="bud">
          <div class="bud-top"><span class="bud-name">${d}</span><span>${MJ.fmtBaht(weekday[i])}</span></div>
          <div class="bar"><i style="width:${(weekday[i] / wkMax) * 100}%;background:var(--honey)"></i></div>
        </div>`).join('')}
    </div>

    ${topPayees.length ? `<div class="card">
      <div class="card-head"><h3>จ่ายให้ใครบ่อยสุด</h3></div>
      ${topPayees.map(([n, v]) => `<div class="list-item"><span class="ic">🏪</span>
        <span class="tx2"><b>${MJ.esc(n)}</b></span>
        <span class="tx-amt out">${MJ.fmtBaht(v)}</span></div>`).join('')}
    </div>` : ''}

    <div class="card">
      <div class="card-head"><h3>เทียบกับเดือนก่อน</h3></div>
      <div id="cmpBox"><div class="empty tiny">กำลังคำนวณ…</div></div>
    </div>

    <button class="btn btn-primary btn-block" id="anShare">
      <i class="fa fa-send"></i> ทำรูปสรุปไว้แชร์อวดเพื่อน</button>
    <div style="height:10px"></div>`;

  MJ.segInit(MJ.$('#anType', view), (b) => {
    MJ.analysis.type = b.dataset.type; MJ.render();
  });

  MJ.$('#anShare', view).onclick = () => MJ.share.open();
  renderCompare(MJ.$('#cmpBox', view));
}

/* ============================ สรุปรายปี ============================ */
async function renderYear(view) {
  const year = MJ.analysis.year;
  view.innerHTML = `
    <div class="card">
      <div class="card-head">
        <button class="icon-btn" id="yPrev"><i class="fa fa-chev-l"></i></button>
        <h3>ปี ${year + 543}</h3>
        <button class="icon-btn" id="yNext" ${year >= new Date().getFullYear() ? 'style="opacity:.3"' : ''}>
          <i class="fa fa-chev-r"></i></button>
      </div>
      <div id="yBody"><div class="empty tiny">กำลังโหลด…</div></div>
    </div>`;
  MJ.$('#yPrev', view).onclick = () => { MJ.analysis.year--; MJ.render(); };
  MJ.$('#yNext', view).onclick = () => {
    if (MJ.analysis.year < new Date().getFullYear()) { MJ.analysis.year++; MJ.render(); }
  };

  const { data, error } = await MJ.sb.rpc('yearly_stats', { p_year: year });
  const box = MJ.$('#yBody', view);
  if (error || !data) { box.innerHTML = '<div class="empty tiny">โหลดข้อมูลไม่สำเร็จ</div>'; return; }

  const income = data.map((r) => Number(r.income));
  const expense = data.map((r) => Number(r.expense));
  const totalIn = income.reduce((a, b) => a + b, 0);
  const totalOut = expense.reduce((a, b) => a + b, 0);
  const maxV = Math.max(1, ...income, ...expense);
  const best = data.reduce((a, r) => (Number(r.expense) < Number(a.expense) && Number(r.tx_count) > 0 ? r : a),
    data.find((r) => Number(r.tx_count) > 0) || data[0]);
  const worst = data.reduce((a, r) => (Number(r.expense) > Number(a.expense) ? r : a), data[0]);

  box.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="k">รายรับทั้งปี</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(totalIn)}</div></div>
      <div class="stat"><div class="k">รายจ่ายทั้งปี</div><div class="v" style="color:var(--out)">${MJ.fmtBaht(totalOut)}</div></div>
    </div>
    <div class="year-chart">
      ${data.map((r, i) => {
        const hIn = (income[i] / maxV) * 100, hOut = (expense[i] / maxV) * 100;
        return `<div class="year-col" title="${MJ.TH_MONTHS[i]} รับ ${MJ.fmtBaht(income[i])} จ่าย ${MJ.fmtBaht(expense[i])}">
          <div class="year-bars">
            <i class="in" style="height:${hIn}%"></i>
            <i class="out" style="height:${hOut}%"></i>
          </div>
          <span>${MJ.TH_MONTHS[i].replace('.', '')}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="hr"></div>
    <div class="stat-grid">
      <div class="stat"><div class="k">คงเหลือทั้งปี</div>
        <div class="v" style="color:${totalIn - totalOut >= 0 ? 'var(--in)' : 'var(--out)'}">${MJ.fmtBaht(totalIn - totalOut)}</div></div>
      <div class="stat"><div class="k">เฉลี่ยจ่าย/เดือน</div><div class="v">${MJ.fmtBaht(totalOut / 12)}</div></div>
    </div>
    <div class="list-item"><span class="ic"><i class="fa fa-arrow-up"></i></span>
      <span class="tx2"><b>${MJ.TH_MONTHS_FULL[(worst?.m || 1) - 1]}</b><small>เดือนที่ใช้เยอะสุด</small></span>
      <span class="tx-amt out">${MJ.fmtBaht(worst?.expense || 0)}</span></div>
    <div class="list-item"><span class="ic"><i class="fa fa-arrow-down"></i></span>
      <span class="tx2"><b>${MJ.TH_MONTHS_FULL[(best?.m || 1) - 1]}</b><small>เดือนที่ประหยัดสุด</small></span>
      <span class="tx-amt in">${MJ.fmtBaht(best?.expense || 0)}</span></div>`;
}

async function renderCompare(box) {
  const cur = MJ.data.summary();
  const prevMonth = new Date(MJ.state.month.getFullYear(), MJ.state.month.getMonth() - 1, 1);
  const key = MJ.isoDate(prevMonth).slice(0, 7);
  let prev = MJ.analysis.prevCache[key];

  if (!prev) {
    const { data } = await MJ.sb.from('transactions').select('amount, type')
      .gte('transaction_date', MJ.startOfMonth(prevMonth).toISOString())
      .lte('transaction_date', MJ.endOfMonth(prevMonth).toISOString());
    prev = { income: 0, expense: 0 };
    (data || []).forEach((t) => { prev[t.type] += Number(t.amount); });
    MJ.analysis.prevCache[key] = prev;
  }

  const diff = cur.expense - prev.expense;
  const pct = prev.expense ? Math.round((diff / prev.expense) * 100) : null;
  box.innerHTML = `
    <div class="stat-grid mb">
      <div class="stat"><div class="k">${MJ.monthLabel(prevMonth)} จ่าย</div><div class="v">${MJ.fmtBaht(prev.expense)}</div></div>
      <div class="stat"><div class="k">${MJ.monthLabel(MJ.state.month)} จ่าย</div><div class="v">${MJ.fmtBaht(cur.expense)}</div></div>
    </div>
    <p class="center ${diff > 0 ? 'tx-amt out' : 'tx-amt in'}" style="font-size:15px">
      ${prev.expense === 0 ? 'เดือนก่อนยังไม่มีข้อมูลให้เทียบ 🐻'
        : (diff > 0 ? `ใช้มากขึ้น ${MJ.fmtBaht(diff)}${pct !== null ? ` (+${pct}%)` : ''} 🫣`
                    : `ประหยัดขึ้น ${MJ.fmtBaht(-diff)}${pct !== null ? ` (${pct}%)` : ''} เก่งมาก! 🎉`)}
    </p>`;
}

</script>
<script>
/* ===== 64-budget.js ===== */
/* ===================================================================
   64-budget.js — จัดการหมวดหมู่และงบประมาณ
   =================================================================== */
MJ.budget = { type: 'expense' };

const ICON_CHOICES = ['🍜','☕','🍔','🛒','🚕','⛽','🚌','🏠','💡','💧','📱','💊','🏥','👕','🎮','🎬','✈️','🐶','🎁','📚','💰','💼','🏦','🍯','🐻','🧾','🎓','💇','🏋️','🍺'];
const COLOR_CHOICES = ['#F2724A','#F2B23E','#3EA96B','#4A9DF2','#B36AE2','#E2607A','#5BC0A5','#8B5E3C','#2E8B9E','#C6A15B','#7FB93E','#9AA0A6'];

MJ.routes.budget = (view) => {
  const type = MJ.budget.type;
  const stats = MJ.data.byCategory(type);
  const cats = MJ.state.categories.filter((c) => c.type === type);
  const statOf = (id) => stats.find((s) => s.id === id) || { total: 0, count: 0 };
  const totalBudget = cats.reduce((a, c) => a + (Number(c.budget_limit) || 0), 0);
  const totalUsed = stats.reduce((a, s) => a + s.total, 0);

  view.innerHTML = `
    <div class="seg" id="budType">
      <button class="seg-btn ${type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> หมวดรายจ่าย</button>
      <button class="seg-btn ${type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> หมวดรายรับ</button>
    </div>

    ${type === 'expense' ? `<div class="card">
      <div class="card-head"><h3>งบรวมเดือนนี้</h3><span class="badge">${MJ.monthLabel(MJ.state.month)}</span></div>
      <div class="bud">
        <div class="bud-top"><span class="bud-name">🍯 ทั้งหมด</span>
          <span>${MJ.fmtBaht(totalUsed)} <span class="muted tiny">/ ${MJ.fmtMoney(totalBudget)}</span></span></div>
        <div class="bar"><i style="width:${totalBudget ? Math.min(100, (totalUsed / totalBudget) * 100) : 0}%;
          background:${totalUsed > totalBudget && totalBudget ? 'var(--out)' : 'linear-gradient(90deg,var(--honey),var(--honey-d))'}"></i></div>
        <div class="bud-foot"><span>${totalBudget ? (totalUsed > totalBudget
          ? `เกินงบ ${MJ.fmtBaht(totalUsed - totalBudget)}` : `เหลือ ${MJ.fmtBaht(totalBudget - totalUsed)}`) : 'ยังไม่ตั้งงบ'}</span>
          <span>${cats.length} หมวด</span></div>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-head"><h3>หมวดหมู่</h3>
        <span><button class="link" id="catTools"><i class="fa fa-ellipsis"></i> จัดการ</button>
        <button class="link" id="addCat">+ เพิ่มหมวด</button></span></div>
      ${cats.length ? cats.map((c) => {
        const st = statOf(c.id);
        return `<div class="list-item" data-cat="${c.id}">
          <span class="ic" style="background:${MJ.hex2rgba(c.color, .18)}">${c.icon}</span>
          <span class="tx2"><b>${MJ.esc(c.name)}</b>
            <small>${c.budget_limit ? `งบ ${MJ.fmtBaht(c.budget_limit)} • ใช้ไป ${MJ.fmtBaht(st.total)}` : `ใช้ไป ${MJ.fmtBaht(st.total)} • ยังไม่ตั้งงบ`}</small></span>
          <span class="tiny muted">แก้ไข ›</span>
        </div>`;
      }).join('') : '<div class="empty tiny">ยังไม่มีหมวดในกลุ่มนี้</div>'}
    </div>

    ${type === 'expense' && stats.some((s) => s.budget) ? `<div class="card">
      <div class="card-head"><h3>ความคืบหน้ารายหมวด</h3></div>
      ${stats.filter((s) => s.budget).map((s) => MJ.charts.budgetBar(s)).join('')}
    </div>` : ''}
    <div style="height:10px"></div>`;

  MJ.segInit(MJ.$('#budType', view), (b) => { MJ.budget.type = b.dataset.type; MJ.render(); });
  MJ.$('#addCat', view).onclick = () => MJ.budget.openEditor(null);
  if (MJ.$('#catTools', view)) MJ.$('#catTools', view).onclick = () => MJ.budget.openTools();
  view.querySelectorAll('[data-cat]').forEach((el) => el.onclick = () => {
    MJ.budget.openEditor(MJ.data.catById(el.dataset.cat));
  });
};

/* ---------------------- จัดเรียง / รวมหมวด ---------------------- */
MJ.budget.openTools = function () {
  const type = MJ.budget.type;
  const cats = MJ.state.categories.filter((c) => c.type === type);
  MJ.sheet.open('จัดการหมวดหมู่', `
    <p class="tiny muted mb">ลากปุ่มลูกศรเพื่อสลับลำดับ หรือรวมหมวดที่ซ้ำกันให้เหลือหมวดเดียว</p>
    <div class="card" id="orderList">
      ${cats.map((c, i) => `<div class="list-item" data-idx="${i}" data-id="${c.id}">
        <span class="ic" style="background:${MJ.hex2rgba(c.color, .18)}">${c.icon}</span>
        <span class="tx2"><b>${MJ.esc(c.name)}</b></span>
        <button class="icon-btn" data-up="${i}" ${i === 0 ? 'style="opacity:.25"' : ''}><i class="fa fa-arrow-up"></i></button>
        <button class="icon-btn" data-down="${i}" ${i === cats.length - 1 ? 'style="opacity:.25"' : ''}><i class="fa fa-arrow-down"></i></button>
      </div>`).join('')}
    </div>
    <button class="btn btn-soft btn-block" id="mergeBtn"><i class="fa fa-rightleft"></i> รวมสองหมวดเข้าด้วยกัน</button>
  `, (body) => {
    const order = cats.slice();
    const swap = async (i, j) => {
      if (j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      MJ.loading(true, 'กำลังจัดเรียง…');
      try {
        for (let k = 0; k < order.length; k++) {
          await MJ.sb.from('categories').update({ sort_order: k + 1 }).eq('id', order[k].id);
        }
        const { data } = await MJ.sb.from('categories').select('*')
          .eq('user_id', MJ.state.user.id).eq('is_archived', false)
          .order('type').order('sort_order').order('name');
        MJ.state.categories = data || [];
        MJ.sheet.close(); MJ.budget.openTools(); MJ.render();
      } catch (e) { MJ.toast('จัดเรียงไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
    body.querySelectorAll('[data-up]').forEach((b) => b.onclick = () => swap(+b.dataset.up, +b.dataset.up - 1));
    body.querySelectorAll('[data-down]').forEach((b) => b.onclick = () => swap(+b.dataset.down, +b.dataset.down + 1));

    MJ.$('#mergeBtn', body).onclick = () => {
      MJ.sheet.open('รวมหมวดหมู่', `
        <label class="field"><span>ย้ายรายการจากหมวดนี้</span><select id="mgFrom">
          ${cats.map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('')}</select></label>
        <label class="field"><span>ไปรวมกับหมวดนี้</span><select id="mgTo">
          ${cats.map((c, i) => `<option value="${c.id}" ${i === 1 ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('')}</select></label>
        <p class="tiny muted mb">หมวดต้นทางจะถูกเก็บเข้าคลัง รายการทั้งหมดย้ายไปหมวดปลายทาง (ย้อนกลับไม่ได้)</p>
        <button class="btn btn-danger btn-block" id="mgOk">รวมหมวด</button>`, (b2) => {
        MJ.$('#mgOk', b2).onclick = async () => {
          const from = MJ.$('#mgFrom', b2).value, to = MJ.$('#mgTo', b2).value;
          if (from === to) { MJ.toast('เลือกคนละหมวดนะ', 'err'); return; }
          MJ.loading(true, 'กำลังรวม…');
          try {
            const { data, error } = await MJ.sb.rpc('merge_category', { p_from: from, p_to: to });
            if (error) throw error;
            MJ.state.categories = MJ.state.categories.filter((c) => c.id !== from);
            await MJ.data.loadMonth();
            MJ.sheet.close(); MJ.toast(`ย้าย ${data} รายการแล้ว`, 'ok'); MJ.render();
          } catch (e) { MJ.toast('รวมหมวดไม่สำเร็จ', 'err'); }
          finally { MJ.loading(false); }
        };
      });
    };
  });
};

MJ.budget.openEditor = function (cat) {
  const isNew = !cat;
  const c = cat || { name: '', type: MJ.budget.type, icon: '🐻', color: '#F2B23E', budget_limit: '', keywords: [] };

  MJ.sheet.open(isNew ? 'เพิ่มหมวดใหม่' : 'แก้ไขหมวด', `
    <label class="field"><span>ชื่อหมวด</span>
      <input type="text" id="cName" value="${MJ.esc(c.name)}" placeholder="เช่น ค่ากาแฟ"></label>
    <div class="seg" id="cType">
      <button class="seg-btn ${c.type === 'expense' ? 'active' : ''}" data-type="expense">รายจ่าย</button>
      <button class="seg-btn ${c.type === 'income' ? 'active' : ''}" data-type="income">รายรับ</button>
    </div>
    <div class="field"><span>ไอคอน</span>
      <div class="chips" id="cIcons">${ICON_CHOICES.map((i) => `
        <button class="chip ${i === c.icon ? 'active' : ''}" data-icon="${i}" style="font-size:19px;padding:7px 11px">${i}</button>`).join('')}</div>
    </div>
    <div class="field"><span>สี</span>
      <div class="chips" id="cColors">${COLOR_CHOICES.map((col) => `
        <button class="chip" data-color="${col}" style="background:${col};width:34px;height:34px;padding:0;border-radius:12px;
          ${col === c.color ? 'outline:3px solid var(--ink);outline-offset:2px' : ''}"></button>`).join('')}</div>
    </div>
    <label class="field"><span>งบต่อเดือน (บาท) — เว้นว่างถ้าไม่ตั้ง</span>
      <input type="number" step="1" inputmode="decimal" id="cBudget" value="${c.budget_limit ?? ''}" placeholder="เช่น 3000"></label>
    <label class="field"><span>คำที่ใช้จับหมวดอัตโนมัติ (คั่นด้วยจุลภาค)</span>
      <input type="text" id="cKeywords" value="${MJ.esc((c.keywords || []).join(', '))}" placeholder="กาแฟ, cafe, ลาเต้"></label>
    <button class="btn btn-primary btn-block" id="cSave">${isNew ? 'เพิ่มหมวด' : 'บันทึก'}</button>
    ${isNew ? '' : '<button class="btn btn-danger btn-block mt" id="cDel">ลบหมวดนี้</button>'}
  `, (body) => {
    let type = c.type, icon = c.icon, color = c.color;
    MJ.segInit(MJ.$('#cType', body), (b) => {
      type = b.dataset.type;
      body.querySelectorAll('#cType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
    });
    body.querySelectorAll('#cIcons .chip').forEach((b) => b.onclick = () => {
      icon = b.dataset.icon;
      body.querySelectorAll('#cIcons .chip').forEach((x) => x.classList.toggle('active', x === b));
    });
    body.querySelectorAll('#cColors .chip').forEach((b) => b.onclick = () => {
      color = b.dataset.color;
      body.querySelectorAll('#cColors .chip').forEach((x) => x.style.outline = x === b ? '3px solid var(--ink)' : '');
    });

    MJ.$('#cSave', body).onclick = async () => {
      const name = MJ.$('#cName', body).value.trim();
      if (!name) { MJ.toast('ตั้งชื่อหมวดก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        await MJ.data.saveCategory({
          id: c.id, name, type, icon, color,
          budget_limit: MJ.$('#cBudget', body).value,
          keywords: MJ.$('#cKeywords', body).value.split(',').map((s) => s.trim()).filter(Boolean),
        });
        MJ.sheet.close(); MJ.toast('บันทึกแล้ว 🐻', 'ok'); MJ.render();
      } catch (e) {
        MJ.toast(/duplicate/i.test(e.message) ? 'มีหมวดชื่อนี้อยู่แล้ว' : 'บันทึกไม่สำเร็จ', 'err');
      } finally { MJ.loading(false); }
    };

    if (MJ.$('#cDel', body)) MJ.$('#cDel', body).onclick = async () => {
      if (!(await MJ.confirm('ลบหมวด', 'รายการเดิมจะยังอยู่แต่จะไม่มีหมวด ยืนยันไหม?', 'ลบหมวด'))) return;
      MJ.loading(true, 'กำลังลบ…');
      try { await MJ.data.archiveCategory(c.id); MJ.sheet.close(); MJ.toast('ลบแล้ว', 'ok'); MJ.render(); }
      catch (e) { MJ.toast('ลบไม่สำเร็จ', 'err'); }
      finally { MJ.loading(false); }
    };
  });
};

</script>

      <p class="tiny muted mt">บน iPhone ต้องเพิ่มแอปลงหน้าจอโฮมก่อน แล้วเปิดจากไอคอนแอปถึงจะแจ้งเตือนได้ (iOS 16.4+)</p>

        <span class="tiny muted"><i class="fa fa-angle-r"></i></span></div>

        <span class="tiny muted"><i class="fa fa-angle-r"></i></span></div>

    <div class="card">
      <div class="card-head"><h3>ความปลอดภัย</h3></div>
      <div class="list-item"><span class="ic"><i class="fa fa-mobile"></i></span>
        <span class="tx2"><b>ล็อกแอปด้วย PIN</b><small id="pinHint">${MJ.lock.enabled() ? 'เปิดอยู่ — ถาม PIN ทุกครั้งที่เปิดแอป' : 'ปิดอยู่'}</small></span>
        <div class="switch ${MJ.lock.enabled() ? 'on' : ''}" id="pinSwitch"><i></i></div>
      </div>
      <div class="list-item" id="changePw"><span class="ic"><i class="fa fa-user"></i></span>
        <span class="tx2"><b>เปลี่ยนรหัสผ่าน</b><small>ตั้งรหัสใหม่สำหรับบัญชีนี้</small></span>
        <span class="tiny muted"><i class="fa fa-angle-r"></i></span></div>

        return `<div class="list-item" data-recur="${r.id}">
          <span class="ic" style="background:${MJ.hex2rgba(c?.color || '#F2B23E', .18)}">${c?.icon || '<i class="fa fa-repeat"></i>'}</span>

        <span class="tx2"><b>ส่งออกเดือนนี้เป็น Excel</b><small>${MJ.monthLabelFull(MJ.state.month)}</small></span><span class="tiny muted">›</span></div>
      <div class="list-item" id="expAll"><span class="ic"><i class="fa fa-boxes"></i></span>
        <span class="tx2"><b>ส่งออกทั้งหมด</b><small>ทุกรายการที่เคยบันทึก</small></span><span class="tiny muted">›</span></div>
      <div class="list-item" id="clearChat"><span class="ic"><i class="fa fa-comment"></i></span>
        <span class="tx2"><b>ล้างประวัติแชท</b><small>ลบข้อความในหน้าจดทั้งหมด (รายการที่บันทึกไว้ไม่หาย)</small></span>

    </div>

    <div class="card">
      <div class="card-head"><h3>เกี่ยวกับ</h3></div>
      <div class="list-item" id="howInstall"><span class="ic"><i class="fa fa-mobile"></i></span>
        <span class="tx2"><b>ติดตั้งลงหน้าจอโฮม</b><small>ใช้เหมือนแอปจริง</small></span><span class="tiny muted">›</span></div>
      <div class="list-item"><span class="ic">🍯</span>
        <span class="tx2"><b>หมีจด MheeJod</b><small>เวอร์ชัน 1.0 • ข้อมูลเก็บใน Supabase ของคุณเอง</small></span></div>

    <button class="btn btn-danger btn-block" id="signOut">ออกจากระบบ</button>
    <div style="height:16px"></div>`;

  MJ.$('#editProfile', view).onclick = () => openProfileSheet();
  MJ.$('#themeSel', view).onchange = async (e) => {
    const v = e.target.value;
    MJ.applyTheme(v);
    try { await MJ.data.saveProfile({ theme: v }); } catch (err) { MJ.toast('บันทึกธีมไม่สำเร็จ', 'err'); }
  };
  MJ.$('#reminderTime', view).onchange = async (e) => {
    const v = e.target.value || null;
    try {
      await MJ.data.saveProfile({ reminder_time: v });
      MJ.reminder.schedule();
      MJ.toast(v ? `จะเตือนทุกวันเวลา ${v} น.` : 'ปิดการเตือนแล้ว', 'ok');
    } catch (err) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
  };
  /* ---------- สวิตช์ Push ---------- */
  (async () => {
    const sw = MJ.$('#pushSwitch', view);
    const hint = MJ.$('#pushHint', view);
    if (!sw) return;
    const st = await MJ.push.status();
    const texts = {
      on: 'เปิดอยู่บนเครื่องนี้',
      off: MJ.push.needsInstall() ? 'ต้องเพิ่มลงหน้าจอโฮมก่อน' : 'ปิดอยู่ — แตะเพื่อเปิด',
      denied: 'ถูกปิดไว้ในตั้งค่าเบราว์เซอร์',
      unsupported: 'เบราว์เซอร์นี้ไม่รองรับ',
    };
    hint.textContent = texts[st] || '';
    sw.classList.toggle('on', st === 'on');
    sw.onclick = async () => {
      const now = await MJ.push.status();
      const ok = now === 'on' ? await MJ.push.disable() : await MJ.push.enable();
      if (ok) MJ.render();
    };
  })();
  if (MJ.$('#pushTest', view)) MJ.$('#pushTest', view).onclick = () => MJ.push.test();

  MJ.$('#goAccounts', view).onclick = () => MJ.go('accounts');
  MJ.$('#goPlans', view).onclick = () => MJ.go('plans');
  MJ.$('#goImport', view).onclick = () => MJ.importer.open();
  MJ.$('#changePw', view).onclick = () => MJ.auth.promptNewPassword();

  MJ.$('#alertPct', view).onchange = async (e) => {
    try {
      await MJ.data.saveProfile({ budget_alert_pct: Number(e.target.value) });
      MJ.toast(`จะเตือนเมื่อใช้ถึง ${e.target.value}% ของงบ`, 'ok');
    } catch (err) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
  };
  MJ.$('#weeklySw', view).onclick = async (e) => {
    const on = !e.currentTarget.classList.contains('on');
    e.currentTarget.classList.toggle('on', on);
    try { await MJ.data.saveProfile({ weekly_summary: on }); }
    catch (err) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
  };

  MJ.$('#runRecur', view).onclick = async () => {

    <p class="mb"><b>Android (Chrome)</b><br>1. แตะเมนู ⋮ มุมขวาบน<br>2. เลือก “ติดตั้งแอป” หรือ “เพิ่มไปยังหน้าจอหลัก”</p>
