<style>
/* ============================ ฟอนต์และไอคอน ============================ */
@font-face{
  font-family:"FC Iconic";src:url("font/FCIconic-Light.ttf") format("truetype");
  font-weight:300;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"FC Iconic";src:url("font/FCIconic-Regular.ttf") format("truetype");
  font-weight:400 500;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"FC Iconic";src:url("font/FCIconic-Bold.ttf") format("truetype");
  font-weight:600 800;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"FA Light";src:url("font/fa-light-300.woff") format("woff");
  font-weight:300;font-style:normal;font-display:block;
}

/* ไอคอนทั้งเว็บใช้ Font Awesome Light */
.fa{
  font-family:"FA Light";font-weight:300;font-style:normal;line-height:1;
  display:inline-block;text-rendering:auto;-webkit-font-smoothing:antialiased
}
.fa-home::before{content:"\f015"}
.fa-list::before{content:"\f03a"}
.fa-receipt::before{content:"\f543"}
.fa-chart-pie::before{content:"\f200"}

.fa-chev-r::before{content:"\f054"}
.fa-angle-r::before{content:"\f105"}

.fa-rotate::before{content:"\f2f1"}
.fa-signout::before{content:"\f2f5"}
.fa-download::before{content:"\f019"}
.fa-arrow-up::before{content:"\f062"}
.fa-arrow-down::before{content:"\f063"}
.fa-ellipsis::before{content:"\f141"}
.fa-filter::before{content:"\f0b0"}
.fa-eye::before{content:"\f06e"}
.fa-rightleft::before{content:"\f362"}
.fa-paperclip::before{content:"\f0c6"}

/* ===================================================================
   หมีจด MheeJod — Design system v2
   โทนเดิม: ครีม / น้ำผึ้ง / น้ำตาลหมี  •  มือถือมาก่อน  •  ใช้มือเดียวได้
   =================================================================== */
:root{
  /* สี */
  --honey:#F2B23E; --honey-l:#FFCB63; --honey-d:#E09A1E;
  --bear:#8B5E3C; --bear-d:#6B462B; --bear-l:#A87A55;
  --cream:#FFF9F2; --cream-2:#FDEFE0;
  --card:#FFFFFF; --card-2:#FFFDFA;
  --ink:#2C2622; --ink-2:#6E645C; --ink-3:#A2968C;
  --line:#F0E5D8; --line-2:#E6D8C6;
  --in:#2FA36B; --in-l:#5CC993; --out:#E3556F; --out-l:#F27D92; --warn:#E8952F;

  /* เงา (นุ่ม ซ้อนสองชั้นให้ดูลอย) */
  --sh-sm:0 1px 2px rgba(122,80,45,.06), 0 2px 8px rgba(122,80,45,.05);
  --sh:0 2px 4px rgba(122,80,45,.05), 0 8px 24px rgba(122,80,45,.09);
  --sh-lg:0 6px 12px rgba(122,80,45,.07), 0 20px 48px rgba(122,80,45,.16);
  --sh-honey:0 6px 18px rgba(242,178,62,.38);

  /* รูปทรง */
  --r-xs:10px; --r-sm:14px; --r:17px; --r-lg:22px; --r-xl:28px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  --tab-h:62px; --top-h:54px; --wrap:660px;

  /* จังหวะการเคลื่อนไหว */
  --ease:cubic-bezier(.22,.68,.32,1);
  --spring:cubic-bezier(.22,1.2,.36,1);
}
:root[data-theme="dark"]{
  --cream:#151210; --cream-2:#1C1714; --card:#221D19; --card-2:#282019;
  --ink:#F7F0E8; --ink-2:#C6B9AC; --ink-3:#8E8175;
  --line:#332920; --line-2:#3E3227;
  --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh:0 4px 18px rgba(0,0,0,.45);
  --sh-lg:0 12px 40px rgba(0,0,0,.6); --sh-honey:0 6px 18px rgba(242,178,62,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#151210; --cream-2:#1C1714; --card:#221D19; --card-2:#282019;
    --ink:#F7F0E8; --ink-2:#C6B9AC; --ink-3:#8E8175;
    --line:#332920; --line-2:#3E3227;
    --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh:0 4px 18px rgba(0,0,0,.45);
    --sh-lg:0 12px 40px rgba(0,0,0,.6); --sh-honey:0 6px 18px rgba(242,178,62,.28);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(760px 420px at 12% -8%, rgba(242,178,62,.16), transparent 62%),
    radial-gradient(680px 380px at 92% 4%, rgba(139,94,60,.10), transparent 60%),
    var(--cream);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"FC Iconic","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.01em;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:var(--bear)}
::-webkit-scrollbar{width:0;height:0}

/* ============================ อนิเมชันกลาง ============================ */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.9) translateY(6px)}60%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes wobble{0%,100%{transform:rotate(-9deg) scale(1)}50%{transform:rotate(9deg) scale(1.1)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(227,85,111,.55)}70%{box-shadow:0 0 0 14px rgba(227,85,111,0)}100%{box-shadow:0 0 0 0 rgba(227,85,111,0)}}
@keyframes shimmer{0%{background-position:-450px 0}100%{background-position:450px 0}}
@keyframes drawArc{from{stroke-dashoffset:var(--arc-len)}}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================ ปุ่ม ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 17px;border-radius:var(--r-sm);font-weight:650;font-size:14px;
  transition:transform .16s var(--spring), box-shadow .2s var(--ease), filter .2s;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.965)}
.btn-primary{background:linear-gradient(135deg,var(--honey-l),var(--honey-d));color:#3A2A10;box-shadow:var(--sh-honey)}
.btn-primary:active{box-shadow:0 3px 10px rgba(242,178,62,.34)}
.btn-dark{background:linear-gradient(135deg,var(--bear-l),var(--bear-d));color:#fff;box-shadow:var(--sh)}
.btn-soft{background:var(--cream-2);color:var(--ink);box-shadow:var(--sh-sm)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-danger{background:rgba(227,85,111,.12);color:var(--out)}
.btn-block{width:100%}
.btn-sm{padding:8px 13px;border-radius:var(--r-xs);font-size:13px}
.icon-btn{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  font-size:16px;color:var(--ink-2);transition:background .2s,transform .16s var(--spring)
}
.icon-btn:active{background:var(--line);transform:scale(.9)}
.pill{
  padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-weight:650;font-size:13px;box-shadow:var(--sh-sm);transition:transform .16s var(--spring)
}
.pill:active{transform:scale(.95)}

/* ============================ ฟอร์ม ============================ */
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:650;letter-spacing:.01em}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
/* ช่องวันที่/เวลาบน iOS มีความกว้างขั้นต่ำของตัวเอง ต้องบังคับให้อยู่ในกรอบ */
.field input[type="date"],
.field input[type="time"],
.field input[type="datetime-local"]{
  min-width:0;max-width:100%;font-size:14px;
  -webkit-appearance:none;appearance:none;text-align:left
}
.field input[type="datetime-local"]::-webkit-date-and-time-value,
.field input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.row>*{flex:1;min-width:0}
.batch-fields .field input{font-size:13.5px}

.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--honey);box-shadow:0 0 0 4px rgba(242,178,62,.16)
}
.field input:disabled{background:var(--cream-2);color:var(--ink-3)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* แถบสลับ (มีแถบเลื่อนตามปุ่มที่เลือก) */
.seg{
  position:relative;display:flex;background:var(--cream-2);border-radius:var(--r-sm);
  padding:4px;margin-bottom:14px;box-shadow:inset 0 1px 3px rgba(122,80,45,.07);
  --seg-i:0; --seg-n:2;
}
.seg::before{
  content:"";position:absolute;top:4px;bottom:4px;left:4px;
  width:calc((100% - 8px)/var(--seg-n));
  border-radius:calc(var(--r-sm) - 4px);background:var(--card);box-shadow:var(--sh-sm);
  transform:translateX(calc(var(--seg-i) * 100%));
  transition:transform .38s var(--spring);
}
.seg-btn{
  position:relative;z-index:1;flex:1;padding:9px 4px;border-radius:calc(var(--r-sm) - 4px);
  font-weight:650;font-size:13.5px;color:var(--ink-3);transition:color .25s
}
.seg-btn.active{color:var(--ink)}

/* ============================ หน้าเข้าสู่ระบบ ============================ */
.auth-screen{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px calc(24px + var(--safe-b));animation:fadeIn .4s var(--ease)
}
.auth-card{
  width:100%;max-width:420px;background:var(--card);border-radius:var(--r-xl);
  padding:30px 24px;box-shadow:var(--sh-lg);border:1px solid var(--line);
  animation:popIn .5s var(--spring)
}
.auth-logo{font-size:60px;text-align:center;line-height:1;animation:bob 3.4s ease-in-out infinite}
.auth-title{text-align:center;font-size:29px;margin:10px 0 2px}
.auth-title span{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.32em;font-weight:700;margin-top:4px}
.auth-sub{text-align:center;color:var(--ink-2);font-size:14px;margin:10px 0 22px}
.auth-note{font-size:13px;color:var(--ink-2);text-align:center;margin:12px 0 0;min-height:20px}
.auth-note.err{color:var(--out)} .auth-note.ok{color:var(--in)}
.auth-footer{color:var(--ink-3);font-size:12px;margin-top:20px}
.auth-form .btn{margin-top:8px}

/* ============================ โครงแอป ============================ */
.app{
  min-height:100dvh;
  padding-top:calc(var(--top-h) + var(--safe-t));
  padding-bottom:calc(var(--tab-h) + var(--safe-b) + 14px);
}
body.chat-open .app{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 118px)}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  height:calc(var(--top-h) + var(--safe-t));padding-top:var(--safe-t);
  background:color-mix(in srgb,var(--cream) 82%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
}
.topbar-inner{
  max-width:var(--wrap);height:var(--top-h);margin:0 auto;padding:0 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.topbar-left{display:flex;align-items:center;gap:9px;min-width:0}
.topbar-logo{font-size:22px;animation:floaty 4s ease-in-out infinite}
.topbar-title{font-weight:700;font-size:15.5px;line-height:1.2}
.topbar-sub{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.topbar-right{display:flex;align-items:center;gap:1px}

.view{padding:13px 12px 6px;max-width:var(--wrap);margin:0 auto}
/* ลูกของ view โผล่ขึ้นมาไล่กันทีละชิ้น */
.view>*{animation:fadeUp .42s var(--ease) both}
.view>*:nth-child(1){animation-delay:.02s}
.view>*:nth-child(2){animation-delay:.06s}
.view>*:nth-child(3){animation-delay:.1s}
.view>*:nth-child(4){animation-delay:.14s}
.view>*:nth-child(5){animation-delay:.18s}
.view>*:nth-child(n+6){animation-delay:.22s}

/* แถบล่าง */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);
}
.tabbar-inner{
  max-width:var(--wrap);height:var(--tab-h);margin:0 auto;padding:0 6px;
  display:flex;align-items:center;justify-content:space-between
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);padding:7px 0 5px;position:relative;transition:color .25s
}
.tab span{font-size:17px;line-height:1;transition:transform .32s var(--spring)}
.tab em{font-style:normal;font-size:10px;font-weight:650}
.tab::after{
  content:"";position:absolute;top:2px;width:5px;height:5px;border-radius:99px;
  background:var(--honey-d);opacity:0;transform:scale(.4);transition:.3s var(--spring)
}
.tab.active{color:var(--bear)}
.tab.active span{transform:translateY(-2px) scale(1.16)}
.tab.active::after{opacity:1;transform:none}
:root[data-theme="dark"] .tab.active{color:var(--honey)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.active{color:var(--honey)}}
.fab{
  width:52px;height:52px;border-radius:19px;margin-top:-22px;flex:none;
  font-size:19px;font-weight:300;color:#3A2A10;
  background:linear-gradient(135deg,var(--honey-l),var(--honey-d));
  box-shadow:0 10px 26px rgba(242,178,62,.5);
  display:grid;place-items:center;transition:transform .2s var(--spring),box-shadow .2s
}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab.active{transform:rotate(45deg)}

/* ============================ การ์ด ============================ */
.card{
  background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:var(--sh);margin-bottom:11px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  transition:box-shadow .25s,transform .25s var(--ease)
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:8px}
.card-head h3{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head .link{font-size:12.5px;color:var(--ink-2);font-weight:650;transition:color .2s}
.card-head .link:active{color:var(--honey-d)}
.muted{color:var(--ink-2)}
.tiny{font-size:11.5px}
.empty{text-align:center;color:var(--ink-3);padding:22px 12px;font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;animation:bob 3.4s ease-in-out infinite}

/* การ์ดยอดคงเหลือ */
.balance{
  position:relative;overflow:hidden;color:#FFF6E9;border-radius:var(--r-lg);padding:17px;
  background:linear-gradient(145deg,var(--bear-l),var(--bear-d) 70%);
  box-shadow:var(--sh-lg);margin-bottom:14px
}
.balance::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 200px at 88% -20%, rgba(255,203,99,.34), transparent 70%);
}
.balance::after{
  content:"🍯";position:absolute;right:-8px;bottom:-18px;font-size:96px;opacity:.14;transform:rotate(-12deg)
}
.balance>*{position:relative}
.balance .lbl{font-size:11.5px;opacity:.82;letter-spacing:.02em}
.balance .amt{font-size:clamp(25px,7.4vw,32px);font-weight:800;letter-spacing:-.03em;margin:2px 0 13px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.balance .box b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balance .grid{display:flex;gap:10px}
.balance .box{
  flex:1;background:rgba(255,255,255,.15);border-radius:var(--r-xs);padding:9px 11px;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.13)
}
.balance .box b{display:block;font-size:15px;margin-top:1px;font-variant-numeric:tabular-nums}
.balance .box.in b{color:#B9F5D2} .balance .box.out b{color:#FFC7D2}

/* ============================ รายการ ============================ */
.tx{
  display:flex;align-items:center;gap:10px;padding:8px 3px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  transition:background .2s,transform .18s var(--ease);border-radius:10px
}
.tx:last-child{border-bottom:none}
.tx:active{background:var(--cream-2);transform:scale(.99)}
.tx-ico{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  font-size:16px;flex:none;transition:transform .25s var(--spring)
}
.tx:active .tx-ico{transform:scale(1.08) rotate(-6deg)}
.tx-main{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.tx-time{font-size:10.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.tx-badge{
  font-size:10px;font-weight:650;padding:2px 7px;border-radius:999px;flex:none;
  max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.tx-marks{display:inline-flex;gap:5px;align-items:center;color:var(--ink-3);font-size:10px;flex:none}
.tx-title{font-weight:600;font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx-sub{font-size:10.5px;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;
  display:flex;align-items:center;gap:6px;min-width:0}
.tx-amt{font-weight:700;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;margin-left:auto}
.tx-amt.in{color:var(--in)} .tx-amt.out{color:var(--out)}
.day-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:11px 3px 3px;font-size:11.5px;color:var(--ink-3);font-weight:650
}

/* ============================ งบประมาณ ============================ */
.bud{margin-bottom:12px}
.bud:last-child{margin-bottom:0}
.bud-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:5px;gap:8px}
.bud-top>span:last-child{white-space:nowrap;flex:none}
.bud-name{display:flex;align-items:center;gap:8px;font-weight:650;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{height:8px;border-radius:999px;background:var(--cream-2);overflow:hidden;position:relative}
.bar>i{
  display:block;height:100%;border-radius:999px;
  transition:width .9s var(--ease);position:relative;overflow:hidden
}
.bar>i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.45) 50%,transparent 80%);
  background-size:450px 100%;animation:shimmer 2.6s infinite linear
}
.bud-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:4px}

/* แถบสลับแชท/กรอกเอง — ตรึงไว้ใต้แถบบนตลอดเวลาเลื่อน */
.tabs-dock{
  position:sticky;top:calc(var(--top-h) + var(--safe-t));z-index:20;
  margin:-13px -12px 11px;padding:10px 12px 8px;
  background:color-mix(in srgb,var(--cream) 88%,transparent);
  backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
}
.tabs-dock .seg{margin-bottom:0}

/* ============================ แชท ============================ */
.chat{
  display:flex;flex-direction:column;gap:10px;
  min-height:calc(100dvh - var(--top-h) - var(--tab-h) - 210px);
  padding-bottom:6px
}
.bubble{
  max-width:84%;padding:10px 13px;border-radius:17px;font-size:13.5px;line-height:1.45;
  box-shadow:var(--sh-sm);white-space:pre-wrap;word-break:break-word;
  animation:popIn .34s var(--spring) both
}
.bubble.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:7px;align-self:flex-start}
.bubble.me{
  background:linear-gradient(135deg,var(--honey-l),var(--honey-d));color:#3A2A10;
  border-bottom-right-radius:7px;align-self:flex-end;box-shadow:var(--sh-honey)
}
.bubble img{display:block;border-radius:14px;max-width:100%}
.bubble.has-img{max-width:74%;padding:7px}
/* อัลบั้มรูปในบับเบิลเดียว (ส่งสลิปทีละหลายใบ) */
.img-grid{display:grid;gap:4px}
.img-grid img{
  width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--cream-2);
  animation:popIn .3s var(--spring) both
}
.img-grid img:nth-child(2){animation-delay:.04s}
.img-grid img:nth-child(3){animation-delay:.08s}
.img-grid img:nth-child(n+4){animation-delay:.12s}
.bubble.has-img .img-grid+*{margin-top:7px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:floaty .9s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* แถวปุ่มลัดแบบเลื่อนแนวนอน ไม่มีแถบเลื่อนให้เกะกะ */
.chips.scroll{
  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  padding:2px 0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
}
/* แถวปุ่มลัดในหน้าแชท จัดขอบซ้าย-ขวาให้ตรงกับกล่องพิมพ์ */
.composer-dock .chips.scroll{
  max-width:var(--wrap);margin:0 auto 8px;
  padding-left:2px;padding-right:2px;scroll-padding-inline:2px;
}
.composer-dock .chips.scroll::after{content:"";flex:none;width:2px}
.chips.scroll::-webkit-scrollbar{display:none;width:0;height:0}
.chips.scroll .chip{flex:none;scroll-snap-align:start}
.chip.mini{
  padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px
}
.chip.mini b{font-weight:750}
.chip.mini .ic{font-size:13px;opacity:.85}
.chip{
  padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:650;box-shadow:var(--sh-sm);
  transition:transform .16s var(--spring),background .2s,color .2s,border-color .2s
}
.chip:active{transform:scale(.94)}
.chip.active{background:var(--bear);color:#fff;border-color:var(--bear)}

/* แถบพิมพ์ — ตรึงติดด้านล่างเหนือแถบเมนู เหมือนแอปแชท */
.composer-dock{
  position:fixed;left:0;right:0;z-index:29;
  bottom:calc(var(--tab-h) + var(--safe-b));
  padding:7px 12px 8px;
  background:linear-gradient(to top,var(--cream) 62%,color-mix(in srgb,var(--cream) 0%,transparent));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.composer{
  max-width:var(--wrap);margin:0 auto;
  display:flex;gap:8px;align-items:flex-end;
  background:var(--card);border:1px solid var(--line);border-radius:26px;
  padding:6px 6px 6px 7px;box-shadow:var(--sh-lg);
  transition:border-color .2s,box-shadow .2s
}
.composer:focus-within{border-color:var(--honey);box-shadow:var(--sh-lg),0 0 0 4px rgba(242,178,62,.14)}
.composer textarea{
  flex:1;border:none;background:none;resize:none;max-height:104px;
  padding:9px 2px;outline:none;line-height:1.4
}
.composer .rnd{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:16px;flex:none;
  background:var(--cream-2);transition:transform .18s var(--spring),background .2s,box-shadow .2s
}
.composer .rnd:active{transform:scale(.88)}
.composer .rnd.send{background:linear-gradient(135deg,var(--honey-l),var(--honey-d));color:#3A2A10;box-shadow:var(--sh-honey)}
.composer .rnd.rec{background:var(--out);color:#fff;animation:pulseRing 1.3s infinite}
.chat-hint{max-width:var(--wrap);margin:7px auto 0;text-align:center;font-size:11px;color:var(--ink-3)}

/* ============================ ตัวเลือกหมวด / แป้นตัวเลข ============================ */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat-pick{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;
  border-radius:var(--r-sm);background:var(--card);border:1.5px solid var(--line);
  font-size:11.5px;text-align:center;line-height:1.25;
  transition:transform .18s var(--spring),border-color .2s,background .2s
}
.cat-pick:active{transform:scale(.94)}
.cat-pick .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;transition:transform .25s var(--spring)}
.cat-pick.active{border-color:var(--honey);background:rgba(242,178,62,.12)}
.cat-pick.active .ic{transform:scale(1.12)}

.amount-display{text-align:center;padding:6px 0 13px}
.amount-display b{font-size:clamp(28px,9.5vw,40px);font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.amount-display span{font-size:16px;color:var(--ink-3);margin-left:5px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{
  padding:13px 0;border-radius:var(--r-sm);background:var(--card-2);font-size:20px;font-weight:650;
  box-shadow:var(--sh-sm);transition:transform .14s var(--spring),background .15s
}
.keypad button:active{background:var(--cream-2);transform:scale(.93)}

/* ============================ Sheet ============================ */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-backdrop{position:absolute;inset:0;background:rgba(38,26,16,.5);backdrop-filter:blur(3px);animation:fadeIn .25s}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;
  background:var(--cream);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:6px 16px calc(22px + var(--safe-b));box-shadow:var(--sh-lg);
  animation:slideUp .42s var(--spring);max-width:var(--wrap);margin:0 auto
}
.sheet-handle{width:46px;height:5px;border-radius:99px;background:var(--line-2);margin:9px auto 4px}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px;
  position:sticky;top:0;background:var(--cream);z-index:2
}
.sheet-head h3{font-size:16px}
.sheet-body>*{animation:fadeUp .3s var(--ease) both}
.sheet-body>*:nth-child(2){animation-delay:.04s}
.sheet-body>*:nth-child(3){animation-delay:.07s}
.sheet-body>*:nth-child(n+4){animation-delay:.1s}

/* ============================ Toast / loading ============================ */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 24px);transform:translateX(-50%);
  background:var(--bear-d);color:#fff;padding:12px 20px;border-radius:var(--r-sm);z-index:80;
  font-size:14px;font-weight:650;box-shadow:var(--sh-lg);max-width:90vw;text-align:center;
  animation:popIn .32s var(--spring)
}
.toast.err{background:var(--out)} .toast.ok{background:var(--in)}
.loading{
  position:fixed;inset:0;z-index:90;display:grid;place-items:center;align-content:center;gap:12px;
  background:color-mix(in srgb,var(--cream) 78%,transparent);backdrop-filter:blur(4px);
  color:var(--ink-2);font-size:14px;animation:fadeIn .2s
}
.bear-spin{font-size:50px;animation:wobble 1.3s ease-in-out infinite}
.skeleton{
  border-radius:var(--r-xs);background:linear-gradient(100deg,var(--cream-2) 30%,var(--line) 50%,var(--cream-2) 70%);
  background-size:450px 100%;animation:shimmer 1.4s infinite linear
}

/* ============================ กราฟ ============================ */
.chart-donut{display:block;margin:0 auto}
.chart-scroll{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.chart-bars{display:block;min-width:280px}
.chart-donut circle.seg{animation:drawArc 1s var(--ease) both}
.chart-bars rect{transform-origin:bottom;animation:growBar .6s var(--ease) both}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;animation:fadeUp .35s var(--ease) both}
.legend-row:nth-child(2){animation-delay:.05s}
.legend-row:nth-child(3){animation-delay:.1s}
.legend-row:nth-child(n+4){animation-delay:.15s}
.legend-dot{width:11px;height:11px;border-radius:4px;flex:none}
.legend-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-row .vl{font-weight:700;font-variant-numeric:tabular-nums}
.legend-row .pc{color:var(--ink-3);font-size:12px;width:42px;text-align:right}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.stat{
  background:var(--card);border-radius:var(--r-sm);padding:11px 12px;box-shadow:var(--sh-sm);
  border:1px solid color-mix(in srgb,var(--line) 55%,transparent)
}
.stat .k{font-size:11px;color:var(--ink-3)}
.stat .v{font-size:16.5px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ รายการตั้งค่า ============================ */
.list-item{
  display:flex;align-items:center;gap:11px;padding:10px 3px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  transition:background .2s;border-radius:10px
}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--cream-2)}
.list-item .ic{
  width:32px;height:32px;border-radius:10px;background:var(--cream-2);
  display:grid;place-items:center;font-size:14px;flex:none
}
.list-item .tx2{flex:1;min-width:0;overflow:hidden}
.list-item .tx2 b{display:block;font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .tx2 small{color:var(--ink-3);font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{
  width:46px;height:27px;border-radius:99px;background:var(--line-2);position:relative;
  transition:background .28s var(--ease);flex:none
}
.switch i{
  position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:transform .3s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.22)
}
.switch.on{background:var(--in)}
.switch.on i{transform:translateX(19px)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--cream-2);color:var(--ink-2)}
.badge.in{background:rgba(47,163,107,.15);color:var(--in)}
.badge.out{background:rgba(227,85,111,.15);color:var(--out)}
/* แถบสลับขนาดเล็กที่ฝังในหัวการ์ด (คุมเฉพาะการ์ดนั้น) */
.seg.mini{width:auto;flex:none;padding:3px;margin:0;border-radius:999px}
.seg.mini::before{border-radius:999px;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--seg-n))}
.seg.mini .seg-btn{padding:5px 13px;font-size:11.5px;border-radius:999px}

/* ============================ แถบเครื่องมือรายการ ============================ */
/* ปุ่มตัวกรองในช่องค้นหา มีตัวเลขบอกว่ากรองอยู่กี่เงื่อนไข */
.filter-btn{position:relative;color:var(--ink-2)}
.filter-btn.on{color:var(--bear);background:rgba(242,178,62,.16)}
.filter-btn em{
  position:absolute;top:1px;right:1px;min-width:15px;height:15px;padding:0 3px;
  border-radius:99px;background:var(--honey-d);color:#3A2A10;
  font-style:normal;font-size:9.5px;font-weight:750;display:grid;place-items:center
}

.tx-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 2px 10px;padding-top:2px
}
.tx-count{font-size:11.5px;color:var(--ink-3);font-weight:650}
.tx-actions{display:flex;gap:7px}
.tool-btn{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;
  padding:7px 12px;border-radius:999px;color:var(--ink-2);
  background:transparent;border:1.5px dashed var(--line-2);
  transition:transform .16s var(--spring),background .2s,color .2s,border-color .2s
}
.tool-btn:active{transform:scale(.94)}
.tool-btn.on{background:var(--bear);color:#fff;border-style:solid;border-color:var(--bear)}
.tool-btn .fa{font-size:11px}

/* ============================ กระเป๋าเงิน ============================ */
.acc-strip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.acc-strip::-webkit-scrollbar{display:none}
.acc-chip{
  flex:none;min-width:132px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  padding:11px 12px;border-radius:var(--r-sm);background:var(--cream-2);
  border:1.5px solid transparent;transition:transform .16s var(--spring),border-color .2s
}
.acc-chip:active{transform:scale(.95)}
.acc-chip .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px}
.acc-chip b{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.acc-chip em{font-style:normal;font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}
.acc-chip em.out{color:var(--out)}

/* ============================ เลือกหลายรายการ ============================ */
.tx.selectable{padding-left:8px}
.tx.selectable::before{
  content:"";width:19px;height:19px;border-radius:7px;border:2px solid var(--line-2);
  flex:none;margin-right:2px;transition:background .2s,border-color .2s
}
.tx.picked::before{background:var(--honey-d);border-color:var(--honey-d);box-shadow:inset 0 0 0 3px var(--card)}
.tx.picked{background:rgba(242,178,62,.1)}
.bulk-bar{
  position:fixed;left:50%;transform:translateX(-50%);z-index:70;
  bottom:calc(var(--tab-h) + var(--safe-b) + 14px);
  display:flex;align-items:center;gap:9px;padding:9px 12px;
  background:var(--bear-d);color:#fff;border-radius:var(--r);box-shadow:var(--sh-lg);
  font-size:12.5px;font-weight:650;max-width:94vw;animation:popIn .3s var(--spring)
}
.bulk-bar .btn{padding:7px 11px;font-size:12px}

/* ============================ Toast มีปุ่ม ============================ */
.toast.has-action{display:flex;align-items:center;gap:12px}
.toast.has-action button{
  background:rgba(255,255,255,.22);color:#fff;padding:5px 11px;border-radius:10px;
  font-size:12.5px;font-weight:700
}

/* ============================ กราฟรายปี ============================ */
.year-chart{display:flex;gap:5px;align-items:flex-end;height:170px;margin-top:6px}
.year-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.year-bars{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center}
.year-bars i{width:44%;border-radius:4px 4px 0 0;animation:growBar .6s var(--ease) both;transform-origin:bottom}
.year-bars i.in{background:var(--in)}
.year-bars i.out{background:var(--out)}
.year-col span{font-size:9px;color:var(--ink-3);font-weight:600}

/* ============================ หน้าล็อกด้วย PIN ============================ */
.lock-screen{
  position:fixed;inset:0;z-index:120;display:grid;place-items:center;
  background:radial-gradient(700px 400px at 50% 0%, rgba(242,178,62,.2), transparent 60%), var(--cream);
  animation:fadeIn .25s
}
.lock-screen.unlocked{animation:fadeIn .2s reverse}
.lock-box{width:min(340px,86vw);text-align:center}
.lock-box h2{font-size:17px;margin:10px 0 16px;font-weight:650}
.lock-bear{font-size:56px;animation:bob 3.4s ease-in-out infinite}
.lock-dots{display:flex;gap:14px;justify-content:center;margin-bottom:22px}
.lock-dots i{width:14px;height:14px;border-radius:50%;background:var(--line-2);transition:.25s var(--spring)}
.lock-dots i.on{background:var(--honey-d);transform:scale(1.2)}
.lock-pad{max-width:280px;margin:0 auto 14px}
.lock-pad span{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* ============================ ตัวคั่นในหน้าเข้าสู่ระบบ ============================ */
.auth-divider{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--ink-3);font-size:11.5px}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============================ ปฏิทิน ============================ */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-week span{text-align:center;font-size:10.5px;font-weight:650;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{
  position:relative;aspect-ratio:1/1.05;border-radius:11px;background:var(--cream-2);
  display:flex;align-items:flex-start;justify-content:center;padding-top:5px;overflow:hidden;
  border:1.5px solid transparent;transition:transform .16s var(--spring),border-color .2s
}
.cal-cell:active{transform:scale(.92)}
.cal-cell.empty{background:transparent;pointer-events:none}
.cal-cell.today{border-color:var(--honey)}
.cal-cell.sel{border-color:var(--bear)}
.cal-num{font-size:12px;font-weight:650;color:var(--ink-2);position:relative;z-index:1}
.cal-bar{position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--out);border-radius:0 0 9px 9px}
.cal-dot{position:absolute;bottom:5px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--in);z-index:1}
.cal-plan{

<!-- ============================ โค้ดแอป ============================ -->
<script>
/* ===== 00-core.js ===== */
/* ===================================================================
   00-core.js — ค่าคงที่ สถานะกลาง ตัวช่วย และ router
   =================================================================== */
window.MJ = window.MJ || {};

MJ.CONFIG = {
  SUPABASE_URL: 'https://ksfytoazukimilrvxcea.supabase.co',
  SUPABASE_KEY: 'sb_publishable_nBHEErfeiPQKhRivP_h2uQ_seyPJeoK',
};

MJ.sb = window.supabase.createClient(MJ.CONFIG.SUPABASE_URL, MJ.CONFIG.SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

/* ------------------------------ สถานะกลาง ------------------------------ */
MJ.state = {
  user: null,
  profile: null,
  categories: [],
  transactions: [],   // ของเดือนที่เลือก
  recurring: [],
  month: new Date(),  // วันที่ใดก็ได้ในเดือนที่กำลังดู
  route: 'dashboard',
  draft: null,        // ร่างรายการที่รอยืนยัน
};

/* ------------------------------ วันที่/ตัวเลข ------------------------------ */
MJ.TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
MJ.TH_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
MJ.TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

MJ.fmtMoney = (n, digits) => {
  const v = Number(n || 0);
  const d = digits === undefined ? (Math.abs(v) % 1 === 0 ? 0 : 2) : digits;
  return v.toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
};
MJ.fmtBaht = (n, digits) => '฿' + MJ.fmtMoney(n, digits);
MJ.monthLabel = (d) => `${MJ.TH_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
MJ.monthLabelFull = (d) => `${MJ.TH_MONTHS_FULL[d.getMonth()]} ${d.getFullYear() + 543}`;

MJ.startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0);
MJ.endOfMonth   = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
MJ.isoDate = (d) => {
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
MJ.isoLocal = (d) => `${MJ.isoDate(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
MJ.sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

MJ.dayLabel = (dateStr) => {
  const d = new Date(dateStr), now = new Date();
  const yst = new Date(now); yst.setDate(now.getDate() - 1);
  if (MJ.sameDay(d, now)) return 'วันนี้';
  if (MJ.sameDay(d, yst)) return 'เมื่อวาน';
  return `${MJ.TH_DAYS[d.getDay()]} ${d.getDate()} ${MJ.TH_MONTHS[d.getMonth()]}`;
};
MJ.timeLabel = (dateStr) => {
  const d = new Date(dateStr);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
};

/* ------------------------------ DOM ------------------------------ */
MJ.$  = (sel, root) => (root || document).querySelector(sel);
MJ.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
/**
 * แก้ข้อความไทยที่ OCR ทำพัง 2 แบบ
 *   1) สระลอย  — มีช่องว่างหน้าสระ/วรรณยุกต์  "ล ิสซ ิ่ง" -> "ลิสซิ่ง"
 *   2) คำแตก   — มีช่องว่างแทรกกลางคำ        "บ ริษัท" -> "บริษัท", "น . ส . ป ระ ภ าพ ร" -> "น.ส. ประภาพร"
 * จะรวมคำเฉพาะเมื่อพบชิ้นส่วนไทยสั้น ๆ (1-2 ตัว) ซึ่งเป็นสัญญาณว่าคำถูกตัด
 * ชื่อที่พิมพ์มาถูกอยู่แล้ว เช่น "นาย นุติกุล อินทะโนรัตน์" จะไม่ถูกยุ่ง
 */
MJ.fixThai = (input) => {
  let t = String(input == null ? '' : input)
    .replace(/[\s\u200b]+([\u0E31\u0E33-\u0E3A\u0E47-\u0E4E])/g, '$1')
    .replace(/([\u0E00-\u0E7F])\s*\.\s*(?=[\u0E00-\u0E7F])/g, '$1.')
    .replace(/^[\u0E31\u0E33-\u0E3A\u0E47-\u0E4E]+/, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
  if (!/[\u0E00-\u0E7F]/.test(t) || !t.includes(' ')) return t;

  const isThai = (w) => /^[\u0E00-\u0E7F.]+$/.test(w);
  const baseLen = (w) => w.replace(/[\u0E31\u0E33-\u0E3A\u0E47-\u0E4E.]/g, '').length;
  const PREFIX = /^(นาย|นาง|นางสาว|น\.ส\.|ด\.ช\.|ด\.ญ\.|บจก\.|บมจ\.|หจก\.|ร้าน|บริษัท|โอนให้|ให้|จาก|ถึง|ไปยัง)$/;

  const words = t.split(' ');
  const broken = words.some((w) => isThai(w) && baseLen(w) > 0 && baseLen(w) <= 2 && !PREFIX.test(w));
  if (!broken) return t;

  const out = [];
  for (const w of words) {
    const prev = out[out.length - 1];
    if (prev && isThai(prev) && isThai(w) && !PREFIX.test(prev)) out[out.length - 1] = prev + w;
    else out.push(w);
  }
  return out.join(' ');
};

MJ.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
MJ.hex2rgba = (hex, a) => {
  const h = String(hex || '#F2B23E').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

/* ---------------------- แถบสลับที่มีตัวชี้เลื่อนตาม ---------------------- */
MJ.segInit = (segEl, onPick) => {
  if (!segEl) return;
  const btns = MJ.$$('.seg-btn', segEl);
  segEl.style.setProperty('--seg-n', btns.length);
  const move = (i) => segEl.style.setProperty('--seg-i', i);
  btns.forEach((b, i) => {
    if (b.classList.contains('active')) move(i);
    b.addEventListener('click', () => {
      btns.forEach((x) => x.classList.toggle('active', x === b));
      move(i);
      MJ.buzz(8);
      if (onPick) onPick(b, i);
    });
  });
};

/* ---------------------- ตัวเลขวิ่งขึ้น (ใช้กับยอดเงิน) ---------------------- */
MJ.countUp = (el, to, opts) => {
  if (!el) return;
  const o = Object.assign({ ms: 850, prefix: '฿', digits: undefined }, opts || {});
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = o.prefix + MJ.fmtMoney(to, o.digits); return;
  }
  const from = 0, start = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - start) / o.ms);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = o.prefix + MJ.fmtMoney(from + (to - from) * eased, t < 1 ? 0 : o.digits);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

/* ------------------------------ Feedback ------------------------------ */
let toastTimer;
MJ.toast = (msg, kind) => {
  const el = MJ.$('#toast');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
};
MJ.loading = (on, text) => {
  const el = MJ.$('#loading');
  MJ.$('#loadingText').textContent = text || 'กำลังโหลด…';
  el.classList.toggle('hidden', !on);
};
MJ.buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms || 12); } catch (e) {} };

/* ------------------------------ Bottom sheet ------------------------------ */
MJ.sheet = {
  open(title, html, onMount) {
    MJ.$('#sheetTitle').textContent = title;
    MJ.$('#sheetBody').innerHTML = html;
    MJ.$('#sheet').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if (onMount) onMount(MJ.$('#sheetBody'));
  },
  close() {
    MJ.$('#sheet').classList.add('hidden');
    MJ.$('#sheetBody').innerHTML = '';
    document.body.style.overflow = '';
  },
};

MJ.confirm = (title, message, okLabel) => new Promise((resolve) => {
  MJ.sheet.open(title, `
    <p class="muted mb">${MJ.esc(message)}</p>
    <button class="btn btn-danger btn-block" id="cfmOk">${MJ.esc(okLabel || 'ยืนยัน')}</button>
    <button class="btn btn-ghost btn-block" id="cfmNo">ยกเลิก</button>`, (body) => {
    MJ.$('#cfmOk', body).onclick = () => { MJ.sheet.close(); resolve(true); };
    MJ.$('#cfmNo', body).onclick = () => { MJ.sheet.close(); resolve(false); };
  });
});

/* ---------------------- ตัวเลือกเดือน (แผงปฏิทินย่อ) ---------------------- */
MJ.openMonthPicker = (onPick) => {
  let year = MJ.state.month.getFullYear();
  const now = new Date();

  const draw = (body) => {
    const grid = MJ.TH_MONTHS.map((m, i) => {
      const isSel = i === MJ.state.month.getMonth() && year === MJ.state.month.getFullYear();
      const isNow = i === now.getMonth() && year === now.getFullYear();
      const future = new Date(year, i, 1) > new Date(now.getFullYear(), now.getMonth(), 1);
      return `<button class="mp-cell ${isSel ? 'sel' : ''} ${isNow ? 'now' : ''}" data-m="${i}" ${future ? 'disabled' : ''}>
        ${m.replace('.', '')}</button>`;
    }).join('');
    body.innerHTML = `
      <div class="mp-year">
        <button class="icon-btn" data-y="-1"><i class="fa fa-chev-l"></i></button>
        <b>${year + 543}</b>
        <button class="icon-btn" data-y="1" ${year >= now.getFullYear() ? 'disabled style="opacity:.3"' : ''}>
          <i class="fa fa-chev-r"></i></button>
      </div>
      <div class="mp-grid">${grid}</div>
      <button class="btn btn-soft btn-block mt" id="mpNow"><i class="fa fa-calendar"></i> เดือนนี้</button>`;

    MJ.$$('[data-y]', body).forEach((b) => b.onclick = () => {
      const next = year + Number(b.dataset.y);
      if (next > now.getFullYear()) return;
      year = next; draw(body);
    });
    MJ.$$('.mp-cell', body).forEach((b) => b.onclick = () => {
      if (b.disabled) return;
      MJ.sheet.close();
      onPick(new Date(year, Number(b.dataset.m), 1));
    });
    MJ.$('#mpNow', body).onclick = () => { MJ.sheet.close(); onPick(new Date()); };
  };

  MJ.sheet.open('เลือกเดือน', '<div id="mpBody"></div>', (body) => draw(MJ.$('#mpBody', body)));
};

/* ------------------------------ Router ------------------------------ */
MJ.routes = {};
MJ.go = (route, params) => {
  MJ.state.route = route;
  MJ.state.routeParams = params || {};
  location.hash = '#' + route;
  MJ.render();
};
MJ.render = () => {
  const r = MJ.routes[MJ.state.route] || MJ.routes.dashboard;
  const view = MJ.$('#view');
  view.innerHTML = '';
  const titles = {
    dashboard: ['ภาพรวม', 'สรุปเงินเดือนนี้'],
    transactions: ['รายการ', 'ประวัติทั้งหมด'],
    calendar: ['ปฏิทิน', 'ดูทั้งเดือน + นัดล่วงหน้า'],
    accounts: ['กระเป๋าเงิน', 'ยอดคงเหลือแต่ละกระเป๋า'],
    plans: ['แผนการเงิน', 'เป้าหมายเก็บเงิน & หนี้'],
    add: ['จดรายการ', 'พิมพ์ พูด หรือถ่ายสลิป'],
    analysis: ['วิเคราะห์', 'เงินหายไปไหนบ้าง'],
    budget: ['หมวดหมู่และงบ', 'ตั้งงบรายเดือน'],
    settings: ['ตั้งค่า', MJ.state.profile?.display_name || ''],
  };
  const t = titles[MJ.state.route] || ['หมีจด', ''];
  MJ.$('#topTitle').textContent = t[0];
  MJ.$('#topSub').textContent = t[1];
  MJ.$$('.tab, .fab').forEach((el) => el.classList.toggle('active',
    el.dataset.route === MJ.state.route || (el.dataset.route === 'transactions' && MJ.state.route === 'calendar')));
  // หน้าแชทมีแถบพิมพ์ตรึงล่าง ต้องเผื่อที่ว่างให้เนื้อหา
  const inChat = MJ.state.route === 'add' && MJ.add?.tab === 'chat';
  document.body.classList.toggle('chat-open', inChat);
  const dock = MJ.$('#composerDock');
  if (dock && !inChat) { dock.classList.add('hidden'); dock.innerHTML = ''; }
  // กันหน้าเดี้ยงทั้งหน้าเพราะพลาดจุดเดียว
  try {
    r(view);
  } catch (err) {
    console.error('render error', MJ.state.route, err);
    MJ.toast('หน้านี้มีบางส่วนโหลดไม่สำเร็จ', 'err');
  }
  if (window.scrollTo) window.scrollTo({ top: 0 });
};

</script>
<script>
/* ===== 05-queue.js ===== */
/* ===================================================================
   05-queue.js — คิวออฟไลน์ + ปุ่มเลิกทำ + ล็อกแอปด้วย PIN
   เน็ตหลุดก็ยังจดได้ เก็บไว้ในเครื่องแล้วส่งขึ้นให้เองเมื่อกลับมาออนไลน์
   =================================================================== */
MJ.queue = {
  KEY: 'mj-queue',

  all() {
    try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); }
    catch (e) { return []; }
  },
  save(list) {
    try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch (e) { /* เต็มก็ข้าม */ }
  },

  /** เก็บรายการที่บันทึกไม่ได้ไว้ก่อน แล้วคืนรายการชั่วคราวให้แสดงผลทันที */
  push(op, payload) {
    const list = this.all();
    const local = Object.assign({}, payload, {
      id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      pending: true,
      created_at: new Date().toISOString(),
    });
    list.push({ op, payload, local_id: local.id, at: Date.now() });
    this.save(list);

    MJ.state.transactions.unshift(local);
    MJ.state.transactions.sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
    MJ.toast('ออฟไลน์อยู่ — เก็บไว้ให้แล้ว จะส่งขึ้นให้เองเมื่อเน็ตกลับมา', 'err');
    return local;
  },

  count() { return this.all().length; },

  /** ส่งของในคิวขึ้นเซิร์ฟเวอร์ */
  async flush() {
    if (!navigator.onLine || !MJ.state.user) return 0;
    const list = this.all();
    if (!list.length) return 0;

    let done = 0;
    const left = [];
    for (const job of list) {
      try {
        if (job.op === 'insert') {
          const { error } = await MJ.sb.from('transactions').insert(job.payload);
          if (error && !/duplicate key/i.test(error.message)) throw error;
        }
        done++;
      } catch (e) {
        left.push(job);
      }
    }
    this.save(left);
    if (done) {
      MJ.state.transactions = MJ.state.transactions.filter((t) => !t.pending);
      await MJ.data.loadMonth();
      MJ.toast(`ส่งรายการที่ค้างไว้ขึ้นแล้ว ${done} รายการ 🐻`, 'ok');
      MJ.render();
    }
    return done;
  },

  init() {
    window.addEventListener('online', () => this.flush());
    window.addEventListener('offline', () => MJ.toast('ออฟไลน์อยู่ — ยังจดได้ เดี๋ยวส่งให้ทีหลัง'));
  },
};

/* ------------------------ Toast แบบมีปุ่มเลิกทำ ------------------------ */
MJ.toastUndo = (msg, onUndo) => {
  const el = MJ.$('#toast');
  el.className = 'toast has-action';
  el.innerHTML = `<span>${MJ.esc(msg)}</span><button id="toastUndo">เลิกทำ</button>`;
  el.classList.remove('hidden');
  const timer = setTimeout(() => el.classList.add('hidden'), 6000);
  MJ.$('#toastUndo', el).onclick = async () => {
    clearTimeout(timer);
    el.classList.add('hidden');
    await onUndo();
  };
};

/* ------------------------ ล็อกแอปด้วย PIN ------------------------ */
MJ.lock = {
  KEY: 'mj-pin',

  enabled() { return !!localStorage.getItem(this.KEY); },

  async hash(pin) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mheejod:' + pin));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  },

  async set(pin) { localStorage.setItem(this.KEY, await this.hash(pin)); },
  clear() { localStorage.removeItem(this.KEY); },
  async verify(pin) { return localStorage.getItem(this.KEY) === await this.hash(pin); },

  /** แสดงหน้าจอล็อก คืน Promise เมื่อปลดล็อกสำเร็จ */
  ask() {
    return new Promise((resolve) => {
      const wrap = document.createElement('div');
      wrap.className = 'lock-screen';
      wrap.innerHTML = `
        <div class="lock-box">
          <div class="lock-bear">🐻</div>
          <h2>ใส่ PIN เพื่อเข้าใช้งาน</h2>
          <div class="lock-dots" id="lockDots">${'<i></i>'.repeat(4)}</div>
          <div class="keypad lock-pad">
            ${['1','2','3','4','5','6','7','8','9','','0','⌫'].map((k) =>
              k ? `<button data-k="${k}">${k}</button>` : '<span></span>').join('')}
          </div>
          <p class="tiny muted" id="lockHint">แตะตัวเลข 4 หลัก</p>
        </div>`;
      document.body.appendChild(wrap);

      let pin = '';
      const dots = () => MJ.$$('#lockDots i', wrap).forEach((d, i) => d.classList.toggle('on', i < pin.length));
      wrap.querySelectorAll('[data-k]').forEach((b) => b.onclick = async () => {
        MJ.buzz(8);
        if (b.dataset.k === '⌫') pin = pin.slice(0, -1);
        else if (pin.length < 4) pin += b.dataset.k;
        dots();
        if (pin.length === 4) {
          if (await MJ.lock.verify(pin)) {
            wrap.classList.add('unlocked');
            setTimeout(() => { wrap.remove(); resolve(true); }, 220);
          } else {
            MJ.$('#lockHint', wrap).textContent = 'PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง';
            wrap.querySelector('.lock-box').classList.add('shake');
            setTimeout(() => wrap.querySelector('.lock-box').classList.remove('shake'), 400);
            pin = ''; dots();
          }
        }
      });
    });
  },
};

</script>
<script>
/* ===== 10-auth.js ===== */
/* ===================================================================
   10-auth.js — สมัคร / เข้าสู่ระบบ / ลิงก์เวทมนตร์
   =================================================================== */
MJ.auth = {
  mode: 'signin',

  mount() {
    const note = MJ.$('#authNote');

    MJ.segInit(MJ.$('#authTabs'), (btn) => {
      {
        MJ.auth.mode = btn.dataset.mode;
        const up = MJ.auth.mode === 'signup';
        MJ.$('#nameField').hidden = !up;
        MJ.$('#authSubmit').textContent = up ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
        MJ.$('#authPassword').autocomplete = up ? 'new-password' : 'current-password';
        note.textContent = '';
      };
    });

    MJ.$('#authForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = MJ.$('#authEmail').value.trim();
      const password = MJ.$('#authPassword').value;
      const name = MJ.$('#authName').value.trim();
      note.className = 'auth-note';
      note.textContent = '';
      MJ.loading(true, MJ.auth.mode === 'signup' ? 'กำลังสมัคร…' : 'กำลังเข้าสู่ระบบ…');
      try {
        if (MJ.auth.mode === 'signup') {
          const { data, error } = await MJ.sb.auth.signUp({
            email, password,
            options: { data: { display_name: name || email.split('@')[0] } },
          });
          if (error) throw error;
          if (!data.session) {
            note.className = 'auth-note ok';
            note.textContent = 'สมัครเรียบร้อย! เช็กอีเมลเพื่อยืนยันก่อนเข้าใช้งานนะ 🐻';
          }
        } else {
          const { error } = await MJ.sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
      } catch (err) {
        note.className = 'auth-note err';
        note.textContent = MJ.auth.thaiError(err);
      } finally {
        MJ.loading(false);
      }
    };

    if (MJ.$('#authForgot')) MJ.$('#authForgot').onclick = async () => {
      const email = MJ.$('#authEmail').value.trim();
      if (!email) { note.className = 'auth-note err'; note.textContent = 'ใส่อีเมลก่อนนะ'; return; }
      MJ.loading(true, 'กำลังส่งลิงก์ตั้งรหัสใหม่…');
      const { error } = await MJ.sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.href.split('#')[0] + '#reset',
      });
      MJ.loading(false);
      note.className = 'auth-note ' + (error ? 'err' : 'ok');
      note.textContent = error ? MJ.auth.thaiError(error)
        : 'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว เปิดจากเครื่องนี้ได้เลย 🔑';
    };

    MJ.$$('[data-oauth]').forEach((btn) => btn.onclick = async () => {
      const provider = btn.dataset.oauth;
      const { error } = await MJ.sb.auth.signInWithOAuth({
        provider,
        options: { redirectTo: location.href.split('#')[0] },
      });
      if (error) {
        note.className = 'auth-note err';
        note.textContent = /provider is not enabled/i.test(error.message)
          ? `ยังไม่ได้เปิดใช้ ${provider === 'google' ? 'Google' : 'Apple'} ใน Supabase (Authentication → Providers)`
          : MJ.auth.thaiError(error);
      }
    });

    MJ.$('#authMagic').onclick = async () => {
      const email = MJ.$('#authEmail').value.trim();
      if (!email) { note.className = 'auth-note err'; note.textContent = 'ใส่อีเมลก่อนนะ'; return; }
      MJ.loading(true, 'กำลังส่งลิงก์…');
      const { error } = await MJ.sb.auth.signInWithOtp({
        email, options: { emailRedirectTo: location.href.split('#')[0] },
      });
      MJ.loading(false);
      note.className = 'auth-note ' + (error ? 'err' : 'ok');
      note.textContent = error ? MJ.auth.thaiError(error) : 'ส่งลิงก์ไปที่อีเมลแล้ว เปิดจากมือถือเครื่องนี้ได้เลย ✉️';
    };
  },

  thaiError(err) {
    const m = String(err?.message || err || '');
    if (/Invalid login credentials/i.test(m)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
    if (/already registered|User already/i.test(m)) return 'อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบดู';
    if (/Email not confirmed/i.test(m)) return 'ยังไม่ได้ยืนยันอีเมล เช็กกล่องจดหมายก่อนนะ';
    if (/Password should be at least/i.test(m)) return 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร';
    if (/rate limit|too many/i.test(m)) return 'ลองบ่อยเกินไป พักสักครู่แล้วลองใหม่';
    if (/Failed to fetch|network/i.test(m)) return 'เชื่อมต่อไม่ได้ เช็กอินเทอร์เน็ตก่อนนะ';
    return m || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
  },

  /** ตั้งรหัสผ่านใหม่ (เข้ามาจากลิงก์ในอีเมล) */
  async promptNewPassword() {
    MJ.sheet.open('ตั้งรหัสผ่านใหม่', `
      <label class="field"><span>รหัสผ่านใหม่</span>
        <input type="password" id="npPass" minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร"></label>
      <label class="field"><span>ยืนยันรหัสผ่านใหม่</span>
        <input type="password" id="npPass2" minlength="6"></label>
      <button class="btn btn-primary btn-block" id="npSave">บันทึกรหัสผ่านใหม่</button>`, (body) => {
      MJ.$('#npSave', body).onclick = async () => {
        const a = MJ.$('#npPass', body).value, b = MJ.$('#npPass2', body).value;
        if (a.length < 6) { MJ.toast('รหัสผ่านสั้นเกินไป', 'err'); return; }
        if (a !== b) { MJ.toast('รหัสผ่านสองช่องไม่ตรงกัน', 'err'); return; }
        MJ.loading(true, 'กำลังบันทึก…');
        const { error } = await MJ.sb.auth.updateUser({ password: a });
        MJ.loading(false);
        if (error) { MJ.toast(MJ.auth.thaiError(error), 'err'); return; }
        MJ.sheet.close();
        MJ.toast('เปลี่ยนรหัสผ่านแล้ว 🔑', 'ok');
      };
    });
  },

  async signOut() {
    if (!(await MJ.confirm('ออกจากระบบ', 'ต้องการออกจากระบบใช่ไหม?', 'ออกจากระบบ'))) return;
    await MJ.sb.auth.signOut();
    location.reload();
  },
};

</script>
<script>
/* ===== 20-data.js ===== */
/* ===================================================================
   20-data.js — ชั้นข้อมูล: โหลด/บันทึก/ลบ + สรุปยอด + อัปโหลดสลิป
   =================================================================== */
MJ.data = {
  /* ---------------------- โหลดข้อมูลทั้งหมดของเดือน ---------------------- */
  async loadAll() {
    const uid = MJ.state.user.id;

    const [profile, cats, accounts] = await Promise.all([
      MJ.sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      MJ.sb.from('categories').select('*').eq('user_id', uid).eq('is_archived', false)
        .order('type').order('sort_order').order('name'),
      MJ.sb.from('accounts').select('*').eq('user_id', uid).eq('is_archived', false)
        .order('sort_order').order('name'),
    ]);

    if (profile.data) MJ.state.profile = profile.data;
    else {
      // เผื่อ trigger ไม่ทำงาน (เช่นผู้ใช้ที่มีอยู่ก่อน) สร้าง profile ให้เอง
      const { data } = await MJ.sb.from('profiles')
        .insert({ id: uid, email: MJ.state.user.email, display_name: MJ.state.user.email.split('@')[0] })
        .select().maybeSingle();
      MJ.state.profile = data || { id: uid, display_name: 'หมีน้อย', theme: 'auto' };
    }
    MJ.state.categories = cats.data || [];
    MJ.state.accounts = accounts.data || [];
    if (!MJ.state.accounts.length) {
      // ผู้ใช้เก่าที่ยังไม่มีกระเป๋า สร้างให้อัตโนมัติ
      await MJ.sb.from('accounts').insert([
        { user_id: uid, name: 'เงินสด', type: 'cash', icon: '👛', color: '#F2B23E', is_default: true, sort_order: 1 },
        { user_id: uid, name: 'ธนาคาร', type: 'bank', icon: '🏦', color: '#4A9DF2', sort_order: 2 },
      ]);
      const { data } = await MJ.sb.from('accounts').select('*').eq('user_id', uid).order('sort_order');
      MJ.state.accounts = data || [];
    }

    await Promise.all([this.loadMonth(), this.loadRecurring(), this.loadBalances()]);
  },

  async loadMonth() {
    const from = MJ.startOfMonth(MJ.state.month), to = MJ.endOfMonth(MJ.state.month);
    const { data, error } = await MJ.sb.from('transactions')
      .select('*')
      .gte('transaction_date', from.toISOString())
      .lte('transaction_date', to.toISOString())
      .order('transaction_date', { ascending: false })
      .order('created_at', { ascending: false });
    if (error) { MJ.toast('โหลดรายการไม่สำเร็จ', 'err'); return; }
    MJ.state.transactions = data || [];
    if (MJ.plan) await MJ.plan.load();
  },

  async loadAllAccounts() {
    const { data } = await MJ.sb.from('accounts').select('*')
      .eq('user_id', MJ.state.user.id).eq('is_archived', false).order('sort_order').order('name');
    MJ.state.accounts = data || [];
    await this.loadBalances();
    return MJ.state.accounts;
  },

  async loadBalances() {
    const { data } = await MJ.sb.rpc('account_balances');
    MJ.state.balances = {};
    (data || []).forEach((r) => { MJ.state.balances[r.account_id] = Number(r.balance); });
    return MJ.state.balances;
  },

  accountById(id) { return (MJ.state.accounts || []).find((a) => a.id === id) || null; },
  defaultAccount() {
    const list = MJ.state.accounts || [];
    return list.find((a) => a.is_default) || list[0] || null;
  },

  async loadRecurring() {
    const { data } = await MJ.sb.from('recurring_transactions').select('*').order('next_run_date');
    MJ.state.recurring = data || [];
  },

  /* ---------------------- ประมวลผลรายการประจำ ---------------------- */
  async runRecurring() {
    try {
      const { data, error } = await MJ.sb.rpc('process_recurring', { p_user: MJ.state.user.id });
      if (error) return 0;
      if (data > 0) {
        await this.loadMonth();
        MJ.toast(`บันทึกรายการประจำให้แล้ว ${data} รายการ 🐻`, 'ok');
      }
      return data || 0;
    } catch (e) { return 0; }
  },

  /* ---------------------- CRUD transactions ---------------------- */
  async addTransaction(tx) {
    const payload = {
      user_id: MJ.state.user.id,
      category_id: tx.category_id || null,
      account_id: tx.account_id !== undefined ? tx.account_id : (this.defaultAccount()?.id || null),
      to_account_id: tx.to_account_id || null,
      kind: tx.kind || 'normal',
      tags: tx.tags || [],
      amount: Number(tx.amount),
      type: tx.type,
      note: tx.note ? MJ.fixThai(tx.note) : null,
      transaction_date: (tx.transaction_date instanceof Date ? tx.transaction_date : new Date(tx.transaction_date || Date.now())).toISOString(),
      receipt_image_url: tx.receipt_image_url || null,
      slip_reference: tx.slip_reference || null,
      payee_name: tx.payee_name ? MJ.fixThai(tx.payee_name) : null,
      source: tx.source || 'manual',
      raw_input: tx.raw_input || null,
    };
    let data, error;
    if (!navigator.onLine) {
      // ออฟไลน์: เก็บเข้าคิวไว้ก่อน แล้วแสดงผลทันที
      return MJ.queue.push('insert', payload);
    }
    ({ data, error } = await MJ.sb.from('transactions').insert(payload).select().maybeSingle());
    if (error) {
      if (/duplicate key|transactions_user_slip_key/i.test(error.message)) {
        const e = new Error('สลิปนี้ถูกบันทึกไปแล้ว');
        e.duplicate = true; throw e;
      }
      if (/fetch|network|Failed to send/i.test(error.message || '')) return MJ.queue.push('insert', payload);
      throw error;
    }
    // จำร้าน/ผู้รับโอน เพื่อเดาหมวดครั้งหน้า
    if (tx.payee_name && tx.category_id) this.rememberMerchant(tx.payee_name, tx.category_id);
    const d = new Date(data.transaction_date);
    if (d >= MJ.startOfMonth(MJ.state.month) && d <= MJ.endOfMonth(MJ.state.month)) {
      MJ.state.transactions.unshift(data);
      MJ.state.transactions.sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
    }
    return data;
  },

  async updateTransaction(id, patch) {
    const { data, error } = await MJ.sb.from('transactions').update(patch).eq('id', id).select().maybeSingle();
    if (error) throw error;
    const i = MJ.state.transactions.findIndex((t) => t.id === id);
    if (i > -1) MJ.state.transactions[i] = data;
    return data;
  },

  async deleteTransaction(id, opts) {
    const snapshot = MJ.state.transactions.find((t) => t.id === id) || null;
    const { error } = await MJ.sb.from('transactions').delete().eq('id', id);
    if (error) throw error;
    MJ.state.transactions = MJ.state.transactions.filter((t) => t.id !== id);

    // ลบไฟล์สลิปทิ้งด้วย ไม่ให้ค้างกินพื้นที่ (เว้นตอนที่ยังอาจกดเลิกทำ)
    if (snapshot?.receipt_image_url && !opts?.keepFile) {
      MJ.sb.storage.from('receipts').remove([snapshot.receipt_image_url]).catch(() => {});
    }
    return snapshot;
  },

  /** เอารายการที่เพิ่งลบกลับคืน (ใช้กับปุ่มเลิกทำ) */
  async restoreTransaction(snap) {
    if (!snap) return null;
    const { id, created_at, updated_at, ...rest } = snap;
    const { data, error } = await MJ.sb.from('transactions').insert(rest).select().maybeSingle();
    if (error) throw error;
    MJ.state.transactions.push(data);
    MJ.state.transactions.sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
    return data;
  },

  /** ลบหลายรายการพร้อมกัน */
  async deleteMany(ids) {
    const snaps = MJ.state.transactions.filter((t) => ids.includes(t.id));
    const { error } = await MJ.sb.from('transactions').delete().in('id', ids);
    if (error) throw error;
    MJ.state.transactions = MJ.state.transactions.filter((t) => !ids.includes(t.id));
    const files = snaps.map((t) => t.receipt_image_url).filter(Boolean);
    if (files.length) MJ.sb.storage.from('receipts').remove(files).catch(() => {});
    return snaps;
  },

  /** เปลี่ยนหมวดหลายรายการพร้อมกัน */
  async setCategoryMany(ids, categoryId) {
    const { error } = await MJ.sb.from('transactions').update({ category_id: categoryId }).in('id', ids);
    if (error) throw error;
    MJ.state.transactions.forEach((t) => { if (ids.includes(t.id)) t.category_id = categoryId; });
  },

  /** ค้นหาข้ามทุกเดือน */
  async searchAll(q, opts) {
    const o = Object.assign({ limit: 200 }, opts || {});
    let query = MJ.sb.from('transactions').select('*')
      .order('transaction_date', { ascending: false }).limit(o.limit);
    if (o.from) query = query.gte('transaction_date', new Date(o.from).toISOString());
    if (o.to) query = query.lte('transaction_date', new Date(o.to + 'T23:59:59').toISOString());
    if (o.type && o.type !== 'all') query = query.eq('type', o.type);
    if (o.category && o.category !== 'all') query = query.eq('category_id', o.category);
    if (o.account && o.account !== 'all') query = query.eq('account_id', o.account);
    if (q) {
      const like = `%${q}%`;
      query = query.or(`note.ilike.${like},payee_name.ilike.${like}`);
    }
    const { data, error } = await query;
    if (error) throw error;
    return data || [];
  },

  /* ---------------------- CRUD categories ---------------------- */
  async saveCategory(cat) {
    const payload = {
      user_id: MJ.state.user.id,
      name: cat.name.trim(),
      type: cat.type,
      icon: cat.icon || '🐻',
      color: cat.color || '#F2B23E',
      budget_limit: cat.budget_limit === '' || cat.budget_limit == null ? null : Number(cat.budget_limit),
      keywords: cat.keywords || [],
    };
    const q = cat.id
      ? MJ.sb.from('categories').update(payload).eq('id', cat.id)
      : MJ.sb.from('categories').insert(payload);
    const { data, error } = await q.select().maybeSingle();
    if (error) throw error;
    const i = MJ.state.categories.findIndex((c) => c.id === data.id);
    if (i > -1) MJ.state.categories[i] = data; else MJ.state.categories.push(data);
    return data;
  },

  async archiveCategory(id) {
    const { error } = await MJ.sb.from('categories').update({ is_archived: true }).eq('id', id);
    if (error) throw error;
    MJ.state.categories = MJ.state.categories.filter((c) => c.id !== id);
  },

  /* ---------------------- CRUD recurring ---------------------- */
  async saveRecurring(r) {
    const payload = {
      user_id: MJ.state.user.id,
      category_id: r.category_id || null,
      amount: Number(r.amount),
      type: r.type,
      note: r.note || null,
      frequency: r.frequency,
      next_run_date: r.next_run_date,
      is_active: r.is_active !== false,
    };
    const q = r.id
      ? MJ.sb.from('recurring_transactions').update(payload).eq('id', r.id)
      : MJ.sb.from('recurring_transactions').insert(payload);
    const { error } = await q;
    if (error) throw error;
    await this.loadRecurring();
  },

  async deleteRecurring(id) {
    await MJ.sb.from('recurring_transactions').delete().eq('id', id);
    await this.loadRecurring();
  },

  /* ---------------------- profile ---------------------- */
  async saveProfile(patch) {
    const { data, error } = await MJ.sb.from('profiles').update(patch).eq('id', MJ.state.user.id).select().maybeSingle();
    if (error) throw error;
    MJ.state.profile = data;
    return data;
  },

  /* ---------------------- merchant rules ---------------------- */
  async rememberMerchant(payee, categoryId) {
    const key = String(payee).trim().toLowerCase().slice(0, 60);
    if (!key) return;
    try {
      await MJ.sb.from('merchant_rules')
        .upsert({ user_id: MJ.state.user.id, keyword: key, category_id: categoryId },
                { onConflict: 'user_id,keyword' });
    } catch (e) { /* ไม่สำคัญพอที่จะรบกวนผู้ใช้ */ }
  },

  async matchMerchant(payee) {
    if (!payee) return null;
    const key = String(payee).trim().toLowerCase();
    const { data } = await MJ.sb.from('merchant_rules').select('keyword, category_id');
    if (!data) return null;
    const hit = data.find((r) => key.includes(r.keyword) || r.keyword.includes(key));
    return hit ? hit.category_id : null;
  },

  /* ---------------------- ย่อรูปก่อนอัปโหลด ---------------------- */
  /**
   * อ่านสลิปเสร็จแล้วไม่ต้องเก็บภาพความละเอียดเต็ม — ย่อเหลือด้านยาว 1080px
   * คุณภาพ 0.72 พออ่านตัวเลขด้วยตาได้ ไฟล์เล็กลงราว 5-10 เท่า ประหยัดพื้นที่และเน็ต
   */
  async compressImage(file, maxSide, quality) {
    if (!file || !/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return file;
    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      URL.revokeObjectURL(url);

      const side = maxSide || 1080;
      const scale = Math.min(1, side / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 400 * 1024) return file;   // เล็กอยู่แล้ว

      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, cv.width, cv.height);

      const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', quality || 0.72));
      if (!blob || blob.size >= file.size) return file;
      return new File([blob], (file.name || 'slip').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (e) {
      return file;   // ย่อไม่ได้ก็อัปโหลดต้นฉบับ
    }
  },

  /** ย่อรูปเป็น data URL ขนาดเล็กไว้โชว์ในแชท (อยู่รอดแม้ re-render หรือปิดแอป) */
  async thumbnail(file, maxSide, quality) {
    try {
      const small = await this.compressImage(file, maxSide || 260, quality || 0.6);
      return await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(small);
      });
    } catch (e) { return null; }
  },

  /* ---------------------- อัปโหลดสลิปขึ้น Storage ---------------------- */
  async uploadReceipt(rawFile) {
    const file = await this.compressImage(rawFile);
    const ext = (file.name?.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${MJ.state.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await MJ.sb.storage.from('receipts').upload(path, file, {
      contentType: file.type || 'image/jpeg', upsert: false,
    });
    if (error) throw error;
    return path;
  },

  async receiptUrl(path) {
    if (!path) return null;
    const { data } = await MJ.sb.storage.from('receipts').createSignedUrl(path, 3600);
    return data?.signedUrl || null;
  },

  /* ---------------------- สรุปยอด ---------------------- */
  summary(list) {
    const txs = (list || MJ.state.transactions).filter((t) => t.kind !== 'transfer');
    let income = 0, expense = 0;
    txs.forEach((t) => { if (t.type === 'income') income += Number(t.amount); else expense += Number(t.amount); });
    return { income, expense, balance: income - expense, count: txs.length };
  },

  byCategory(type, list) {
    const txs = (list || MJ.state.transactions).filter((t) => t.type === type && t.kind !== 'transfer');
    const map = new Map();
    txs.forEach((t) => {
      const key = t.category_id || 'none';
      const cur = map.get(key) || { total: 0, count: 0 };
      cur.total += Number(t.amount); cur.count++;
      map.set(key, cur);
    });
    return Array.from(map.entries()).map(([id, v]) => {
      const c = MJ.state.categories.find((x) => x.id === id);
      return {
        id, total: v.total, count: v.count,
        name: c?.name || 'ไม่ระบุหมวด', icon: c?.icon || '❓', color: c?.color || '#9AA0A6',
        budget: c?.budget_limit ? Number(c.budget_limit) : null,
      };
    }).sort((a, b) => b.total - a.total);
  },

  dailySeries(type) {
    const days = MJ.endOfMonth(MJ.state.month).getDate();
    const arr = new Array(days).fill(0);
    MJ.state.transactions.filter((t) => t.type === type && t.kind !== 'transfer').forEach((t) => {
      const d = new Date(t.transaction_date);
      if (d.getMonth() === MJ.state.month.getMonth()) arr[d.getDate() - 1] += Number(t.amount);
    });
    return arr;
  },

  catById(id) { return MJ.state.categories.find((c) => c.id === id) || null; },
};

</script>
<script>
/* ===== 30-nlp.js ===== */
/* ===================================================================
   30-nlp.js — ตัวแยกข้อความภาษาไทยแบบ rule-based (ทำงานในเครื่อง ไม่ต้องมี API key)
   ตัวอย่างที่รองรับ:
     "กินกาแฟ 80"                  -> จ่าย 80 หมวดอาหาร
     "รับค่าขนม 100"                -> รับ 100 หมวดได้รับโอน
     "เมื่อวาน ค่าไฟ 1,250 บาท"      -> จ่าย 1250 เมื่อวาน หมวดบิล
     "เงินเดือนเข้า 25000"           -> รับ 25000 หมวดเงินเดือน
     "ค่าแท็กซี่ สองร้อยห้าสิบ"       -> จ่าย 250 หมวดเดินทาง
   =================================================================== */
MJ.nlp = (() => {
  const INCOME_WORDS = ['รับ','ได้รับ','ได้','เงินเข้า','โอนเข้า','เข้าบัญชี','เงินเดือน','salary','โบนัส','ขายได้','ขาย','รายรับ','คืนเงิน','refund','ดอกเบี้ย','ปันผล','อั่งเปา','ค่าจ้าง','ค่าคอม'];
  const EXPENSE_WORDS = ['จ่าย','ซื้อ','กิน','ค่า','เสีย','โอนให้','ผ่อน','เติม','ชอป','ช้อป','รายจ่าย','หมดไป','เติมเงิน'];

  const THAI_NUM = { 'ศูนย์':0,'หนึ่ง':1,'เอ็ด':1,'สอง':2,'ยี่':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9 };
  const THAI_UNIT = { 'สิบ':10,'ร้อย':100,'พัน':1000,'หมื่น':10000,'แสน':100000,'ล้าน':1000000 };

  /** แปลงเลขไทยเป็นตัวเลข เช่น "สองร้อยห้าสิบ" -> 250 */
  function thaiWordsToNumber(text) {
    const re = /(?:ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)+/g;
    const m = text.match(re);
    if (!m) return null;
    const chunk = m.sort((a, b) => b.length - a.length)[0];
    if (chunk.length < 3) return null;
    let total = 0, current = 0, i = 0;
    while (i < chunk.length) {
      let matched = false;
      for (const w of Object.keys(THAI_UNIT).sort((a, b) => b.length - a.length)) {
        if (chunk.startsWith(w, i)) {
          const u = THAI_UNIT[w];
          if (u === 1000000) { total = (total + (current || 1)) * u; current = 0; }
          else { current = (current || 1) * u; total += current; current = 0; }
          i += w.length; matched = true; break;
        }
      }
      if (matched) continue;
      for (const w of Object.keys(THAI_NUM).sort((a, b) => b.length - a.length)) {
        if (chunk.startsWith(w, i)) { current = THAI_NUM[w]; i += w.length; matched = true; break; }
      }
      if (!matched) { i++; continue; }
      // ถ้าตัวถัดไปไม่ใช่หน่วย ให้บวกทันที
      const rest = chunk.slice(i);
      const nextIsUnit = Object.keys(THAI_UNIT).some((u) => rest.startsWith(u));
      if (!nextIsUnit) { total += current; current = 0; }
    }
    total += current;
    return total > 0 ? total : null;
  }

  /** ดึงจำนวนเงิน */
  function extractAmount(text) {
    let t = text.replace(/,/g, '');
    // "50 บาท 25 สตางค์" / "1.5k" / "2พัน"
    const kMatch = t.match(/(\d+(?:\.\d+)?)\s*(k|K|พัน)\b/);
    if (kMatch) return { amount: parseFloat(kMatch[1]) * 1000, matched: kMatch[0] };
    const mMatch = t.match(/(\d+(?:\.\d+)?)\s*(หมื่น)/);
    if (mMatch) return { amount: parseFloat(mMatch[1]) * 10000, matched: mMatch[0] };
    const numbers = [...t.matchAll(/(\d+(?:\.\d{1,2})?)/g)];
    if (numbers.length) {
      // เลือกตัวที่ติดคำว่า "บาท" ก่อน ไม่งั้นเอาตัวที่ใหญ่สุด
      const withBaht = numbers.find((n) => /^\s*(บาท|฿|thb)/i.test(t.slice(n.index + n[0].length)));
      const pick = withBaht || numbers.sort((a, b) => parseFloat(b[1]) - parseFloat(a[1]))[0];
      return { amount: parseFloat(pick[1]), matched: pick[0] };
    }
    const th = thaiWordsToNumber(t);
    if (th) return { amount: th, matched: null };
    return { amount: null, matched: null };
  }

  /** เดาว่าเป็นรายรับหรือรายจ่าย */
  function detectType(text) {
    const t = text.toLowerCase();
    let score = 0;
    INCOME_WORDS.forEach((w) => { if (t.includes(w)) score += (w.length > 2 ? 2 : 1); });
    EXPENSE_WORDS.forEach((w) => { if (t.includes(w)) score -= (w.length > 2 ? 2 : 1); });
    // "รับ" นำหน้าประโยคน้ำหนักมาก, "ค่า..." มักเป็นรายจ่าย
    if (/^(รับ|ได้)/.test(text.trim())) score += 2;
    if (/^ค่า/.test(text.trim())) score -= 2;
    return score > 0 ? 'income' : 'expense';
  }

  /** เดาวันที่จากคำบอกเวลา */
  function detectDate(text) {
    const now = new Date();
    let d = new Date(now);
    let matched = null;

    if (/เมื่อวานซืน|วานซืน/.test(text)) { d.setDate(now.getDate() - 2); matched = 'เมื่อวานซืน'; }
    else if (/เมื่อวาน|มื้อวาน/.test(text)) { d.setDate(now.getDate() - 1); matched = 'เมื่อวาน'; }
    else if (/วันนี้/.test(text)) { matched = 'วันนี้'; }
    else if (/พรุ่งนี้/.test(text)) { d.setDate(now.getDate() + 1); matched = 'พรุ่งนี้'; }
    else {
      const ago = text.match(/(\d+)\s*วันก่อน/);
      if (ago) { d.setDate(now.getDate() - parseInt(ago[1], 10)); matched = ago[0]; }
      else {
        const dm = text.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
        if (dm) {
          let year = dm[3] ? parseInt(dm[3], 10) : now.getFullYear();
          if (year > 2400) year -= 543;
          if (year < 100) year += 2000;
          d = new Date(year, parseInt(dm[2], 10) - 1, parseInt(dm[1], 10), now.getHours(), now.getMinutes());
          matched = dm[0];
        }
      }
    }
    // เวลา เช่น "ตอน 18:30"
    const tm = text.match(/\b(\d{1,2})[:.](\d{2})\s*(น\.?)?/);
    if (tm && Number(tm[1]) < 24) { d.setHours(Number(tm[1]), Number(tm[2]), 0, 0); matched = (matched || '') + ' ' + tm[0]; }
    return { date: d, matched };
  }

  /** เดาหมวดจาก keywords ของหมวด + ชื่อหมวด */
  function detectCategory(text, type) {
    const t = text.toLowerCase();
    const cats = MJ.state.categories.filter((c) => c.type === type);
    let best = null, bestScore = 0;
    cats.forEach((c) => {
      let score = 0;
      if (t.includes(String(c.name).toLowerCase())) score += 5;
      (c.keywords || []).forEach((k) => {
        const kw = String(k).toLowerCase();
        if (kw && t.includes(kw)) score = Math.max(score, kw.length >= 4 ? 4 : 3);
      });
      if (score > bestScore) { bestScore = score; best = c; }
    });
    if (best) return best;
    return cats.find((c) => c.name === 'อื่น ๆ') || cats[0] || null;
  }

  /** ตัดคำที่ใช้แล้วออก เหลือเป็นโน้ต */
  function extractNote(text, amountMatched, dateMatched) {
    let s = ' ' + text + ' ';
    if (amountMatched) s = s.replace(amountMatched, ' ');
    if (dateMatched) dateMatched.split(' ').filter(Boolean).forEach((m) => { s = s.replace(m, ' '); });
