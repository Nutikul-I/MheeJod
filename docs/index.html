    s = s.replace(/[\d,]+(\.\d+)?/g, ' ')
         .replace(/บาท|฿|thb|ตอน|เมื่อ|จำนวน|ราคา|ทั้งหมด|รวม/gi, ' ')
         .replace(/\s+/g, ' ').trim();
    return s || null;
  }

  return {
    /** วิเคราะห์ข้อความ -> ร่างรายการ */
    parse(text) {
      const raw = String(text || '').trim();
      if (!raw) return null;
      const { amount, matched } = extractAmount(raw);
      const type = detectType(raw);
      const { date, matched: dateMatched } = detectDate(raw);
      const cat = detectCategory(raw, type);
      const note = extractNote(raw, matched, dateMatched);
      return {
        amount,
        type,
        category_id: cat?.id || null,
        category: cat,
        note: note || (cat ? cat.name : null),
        transaction_date: date,
        source: 'text',
        raw_input: raw,
        confidence: amount ? (cat ? 'high' : 'medium') : 'low',
      };
    },

    /** สรุปเป็นประโยคให้ผู้ใช้ยืนยัน */
    describe(d) {
      if (!d) return '';
      const kind = d.type === 'income' ? 'รายรับ' : 'รายจ่าย';
      const when = MJ.sameDay(new Date(d.transaction_date), new Date())
        ? 'วันนี้' : MJ.dayLabel(d.transaction_date);
      return `${kind} ${MJ.fmtBaht(d.amount)} • ${d.category?.icon || ''} ${d.category?.name || 'ไม่ระบุหมวด'} • ${when}\n"${d.note || '-'}"`;
    },
    thaiWordsToNumber,
  };
})();

</script>
<script>
/* ===== 40-slip.js ===== */
/* ===================================================================
   40-slip.js — อ่านสลิป: QR ในเครื่อง -> OCR (Tesseract.js / PaddleOCR) -> เดาหมวด
   ลำดับการทำงาน
     1) สแกน Mini QR บนสลิป (jsQR) เอา "รหัสอ้างอิง" ไว้กันบันทึกซ้ำ
     2) OCR ข้อความบนสลิปเพื่อหา ยอดเงิน / วันที่ / ชื่อผู้รับ
        - ค่าเริ่มต้น: Tesseract.js (ทำงานในเบราว์เซอร์ ฟรี ไม่ต้องมี key)
        - ถ้าตั้ง PaddleOCR endpoint ไว้ในหน้าตั้งค่า จะเรียกใช้ตัวนั้นแทน (แม่นกว่า)
     3) รวมผล -> ร่างรายการให้ผู้ใช้ยืนยัน
   =================================================================== */
MJ.slip = (() => {

  /* ------------------------- โหลดรูปเข้า canvas ------------------------- */
  async function toImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.decoding = 'async';
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      return img;
    } finally { setTimeout(() => URL.revokeObjectURL(url), 30000); }
  }

  function drawScaled(img, maxSide) {
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    return { canvas: cv, ctx, w, h };
  }

  /**
   * เพิ่มคอนทราสต์ + ทำเป็นขาวดำก่อนส่งเข้า OCR
   * สลิปหลายธนาคารมีลายน้ำ/พื้นหลังอ่อน ทำให้ตัวเลขจม — ขั้นนี้ช่วยให้อ่านยอดได้ขึ้นชัดเจน
   */
  function boostContrast(canvas, ctx) {
    const im = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const c = Math.max(0, Math.min(255, (v - 128) * 1.9 + 128));
      d[i] = d[i + 1] = d[i + 2] = c;
    }
    ctx.putImageData(im, 0, 0);
    return canvas;
  }

  /* ------------------------- 1) สแกน QR ------------------------- */
  async function scanQR(img) {
    const tries = [1400, 900, 2000];
    for (const size of tries) {
      const { ctx, w, h } = drawScaled(img, size);
      const data = ctx.getImageData(0, 0, w, h);
      const code = window.jsQR ? window.jsQR(data.data, w, h, { inversionAttempts: 'attemptBoth' }) : null;
      if (code?.data) return code.data;

      // ลองเฉพาะครึ่งล่าง (Mini QR มักอยู่มุมล่าง)
      const halfH = Math.floor(h / 2);
      const half = ctx.getImageData(0, halfH, w, h - halfH);
      const code2 = window.jsQR ? window.jsQR(half.data, w, h - halfH, { inversionAttempts: 'attemptBoth' }) : null;
      if (code2?.data) return code2.data;
    }
    return null;
  }

  /* ------------------------- ถอด EMVCo TLV ------------------------- */
  function parseTLV(payload) {
    const out = {};
    let i = 0;
    while (i + 4 <= payload.length) {
      const tag = payload.slice(i, i + 2);
      const len = parseInt(payload.slice(i + 2, i + 4), 10);
      if (!/^\d{2}$/.test(tag) || Number.isNaN(len)) break;
      const value = payload.slice(i + 4, i + 4 + len);
      if (value.length < len) break;
      out[tag] = value;
      i += 4 + len;
    }
    return out;
  }

  /**
   * ดึงข้อมูลจาก payload ของ Mini QR บนสลิปไทย
   * โครงสร้างจริง (EMVCo TLV ซ้อนกัน) เช่น
   *   0046 00[06]000001 01[03]014 02[25]202608012vWAeIOheGunNmdz2  51[02]TH  91[04]3E89
   *        └─ tag 00 = กลุ่มข้อมูลสลิป: 00=เวอร์ชัน, 01=รหัสธนาคารผู้ส่ง, 02=เลขอ้างอิงรายการ
   * ใช้เลขอ้างอิงเป็นกุญแจกันบันทึกซ้ำ ถ้าถอดไม่ได้ค่อยใช้ payload ดิบ
   */
  function parseSlipPayload(payload) {
    const raw = String(payload || '').trim();
    const res = { raw, reference: raw, fields: {}, inner: {}, bank: null, bankCode: null, version: null };
    if (!/^\d{4}/.test(raw)) return res;

    const tlv = parseTLV(raw);
    res.fields = tlv;

    const inner = parseTLV(tlv['00'] || '');
    res.inner = inner;
    res.version = inner['00'] || null;
    res.bankCode = inner['01'] || null;
    res.bank = res.bankCode ? (BANKS[res.bankCode] || null) : null;

    if (inner['02'] && /^[A-Za-z0-9]{6,}$/.test(inner['02'])) {
      res.reference = inner['02'];
    } else {
      const candidates = Object.values(tlv).concat(Object.values(inner))
        .filter((v) => /^[A-Za-z0-9]{12,40}$/.test(v));
      if (candidates.length) res.reference = candidates.sort((a, b) => b.length - a.length)[0];
    }
    return res;
  }

  const BANKS = {
    '002':'ธ.กรุงเทพ','004':'ธ.กสิกรไทย','006':'ธ.กรุงไทย','011':'ธ.ทหารไทยธนชาต','014':'ธ.ไทยพาณิชย์',
    '017':'ธ.ซิตี้แบงก์','018':'ธ.ซูมิโตโม','020':'ธ.สแตนดาร์ดชาร์เตอร์ด','022':'ธ.ซีไอเอ็มบี',
    '024':'ธ.ยูโอบี','025':'ธ.กรุงศรีอยุธยา','026':'ธ.เมกะสากลพาณิชย์','030':'ธ.ออมสิน',
    '031':'ธ.เอชเอสบีซี','032':'ธ.ดอยซ์แบงก์','033':'ธ.อาคารสงเคราะห์','034':'ธ.ก.ส.',
    '039':'ธ.มิซูโฮ','045':'ธ.บีเอ็นพี พารีบาส์','052':'ธ.แห่งประเทศจีน','066':'ธ.อิสลาม',
    '067':'ธ.ทิสโก้','069':'ธ.เกียรตินาคินภัทร','070':'ธ.ไอซีบีซี','071':'ธ.ไทยเครดิต',
    '073':'ธ.แลนด์ แอนด์ เฮ้าส์','098':'ธ.พัฒนาวิสาหกิจ','099':'ธ.เพื่อการส่งออกและนำเข้า',
  };

  /* ------------------------- 2) OCR ------------------------- */
  let tesseractWorker = null;

  async function ensureTesseract(onProgress) {
    if (tesseractWorker) return tesseractWorker;
    if (!window.Tesseract) {
      onProgress && onProgress('กำลังโหลดตัวอ่านข้อความ…');
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = res; s.onerror = () => rej(new Error('โหลดตัวอ่านข้อความไม่สำเร็จ'));
        document.head.appendChild(s);
      });
    }
    onProgress && onProgress('กำลังเตรียมภาษาไทย… (ครั้งแรกใช้เวลาสักครู่)');
    tesseractWorker = await window.Tesseract.createWorker(['tha', 'eng'], 1, {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0',
      langPath: 'https://tessdata.projectnaptha.com/4.0.0',
    });
    return tesseractWorker;
  }

  async function ocrLocal(img, onProgress, opts) {
    const worker = await ensureTesseract(onProgress);
    onProgress && onProgress(opts?.second ? 'กำลังอ่านซ้ำอีกรอบให้ชัวร์…' : 'กำลังอ่านตัวหนังสือบนสลิป…');
    const { canvas, ctx } = drawScaled(img, 1600);
    if (opts?.boost !== false) boostContrast(canvas, ctx);
    const { data } = await worker.recognize(canvas);
    return data?.text || '';
  }

  /**
   * ส่งรูปให้ PaddleOCR service
   * เซิร์ฟเวอร์ฟรี (เช่น Hugging Face Space) จะหลับเมื่อไม่มีคนใช้
   * ถ้าเจอ 502/503/504 จะรอแล้วลองใหม่ ระหว่างนั้นบอกผู้ใช้ว่ากำลังปลุกเซิร์ฟเวอร์
   */
  async function ocrRemote(endpoint, file, onProgress) {
    const url = endpoint.replace(/\/$/, '') + '/ocr';
    const attempts = 8;
    for (let i = 0; i < attempts; i++) {
      onProgress && onProgress(i === 0 ? 'กำลังส่งสลิปให้ PaddleOCR…'
        : `กำลังปลุกเซิร์ฟเวอร์ OCR… (${i}/${attempts - 1})`);
      let res;
      try {
        const fd = new FormData();
        fd.append('file', file, file.name || 'slip.jpg');
        res = await fetch(url, { method: 'POST', body: fd });
      } catch (err) {
        if (i === attempts - 1) throw new Error('ต่อเซิร์ฟเวอร์ OCR ไม่ได้');
        await new Promise((r) => setTimeout(r, 8000));
        continue;
      }
      if (res.ok) {
        const json = await res.json();
        if (typeof json.text === 'string') return json.text;
        if (Array.isArray(json.lines)) return json.lines.map((l) => (typeof l === 'string' ? l : l.text)).join('\n');
        return JSON.stringify(json);
      }
      // กำลังตื่น/บูตอยู่ — รอแล้วลองใหม่
      if ([408, 429, 500, 502, 503, 504].includes(res.status) && i < attempts - 1) {
        await new Promise((r) => setTimeout(r, 8000));
        continue;
      }
      throw new Error('PaddleOCR ตอบกลับผิดพลาด (' + res.status + ')');
    }
    throw new Error('เซิร์ฟเวอร์ OCR ไม่ตอบสนอง');
  }

  /* ------------------------- แกะข้อมูลจากข้อความ OCR ------------------------- */
  /* ---------- เดือนไทย/อังกฤษ ทั้งแบบย่อและเต็ม ---------- */
  const THAI_MONTHS = [
    ['มกราคม', 'มค'], ['กุมภาพันธ์', 'กพ'], ['มีนาคม', 'มีค'], ['เมษายน', 'เมย'],
    ['พฤษภาคม', 'พค'], ['มิถุนายน', 'มิย'], ['กรกฎาคม', 'กค'], ['สิงหาคม', 'สค'],
    ['กันยายน', 'กย'], ['ตุลาคม', 'ตค'], ['พฤศจิกายน', 'พย'], ['ธันวาคม', 'ธค'],
  ];
  const EN_MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

  /** แปลงปีให้เป็น ค.ศ. (รับได้ทั้ง 68 / 2568 / 25 / 2025) */
  function normalizeYear(y) {
    y = parseInt(y, 10);
    if (Number.isNaN(y)) return null;
    if (y < 100) y += (y >= 50 ? 2500 : 2000);   // 68 -> 2568, 25 -> 2025
    if (y > 2400) y -= 543;                       // พ.ศ. -> ค.ศ.
    return y;
  }

  /** หาเดือนจากคำ (ไทยเต็ม/ไทยย่อ/อังกฤษ) */
  function monthFromWord(word) {
    const w = String(word).replace(/[.\s]/g, '').toLowerCase();
    for (let i = 0; i < THAI_MONTHS.length; i++) {
      const [full, abbr] = THAI_MONTHS[i];
      if (w === full || w === abbr || full.startsWith(w) && w.length >= 3) return i;
    }
    const en = EN_MONTHS.indexOf(w.slice(0, 3));
    if (en > -1) return en;
    return null;
  }

  /**
   * อ่านวันที่จากข้อความสลิป รองรับ
   *   12 ส.ค. 68 / 12 สิงหาคม 2568 / 12 Aug 2025 / 12/08/2568 / 2025-08-12 / 12-08-68
   * และเวลา 14:35 / 14.35 น. / 14:35:02
   */
  function parseDateFromText(flat) {
    let d = null;

    // 1) วัน + ชื่อเดือน + ปี(อาจไม่มี)
    const named = flat.match(/(\d{1,2})\s*(ม\.?ค\.?|มกราคม|ก\.?พ\.?|กุมภาพันธ์|มี\.?ค\.?|มีนาคม|เม\.?ย\.?|เมษายน|พ\.?ค\.?|พฤษภาคม|มิ\.?ย\.?|มิถุนายน|ก\.?ค\.?|กรกฎาคม|ส\.?ค\.?|สิงหาคม|ก\.?ย\.?|กันยายน|ต\.?ค\.?|ตุลาคม|พ\.?ย\.?|พฤศจิกายน|ธ\.?ค\.?|ธันวาคม|jan\w*|feb\w*|mar\w*|apr\w*|may|jun\w*|jul\w*|aug\w*|sep\w*|oct\w*|nov\w*|dec\w*)\.?\s*(\d{2,4})?/i);
    if (named) {
      const mon = monthFromWord(named[2]);
      const year = named[3] ? normalizeYear(named[3]) : new Date().getFullYear();
      if (mon != null && year) d = new Date(year, mon, parseInt(named[1], 10));
    }

    // 2) รูปแบบ ปี-เดือน-วัน (2025-08-12 / 2568/08/12)
    if (!d) {
      const ymd = flat.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
      if (ymd) {
        const year = normalizeYear(ymd[1]);
        d = new Date(year, parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10));
      }
    }

    // 3) รูปแบบ วัน/เดือน/ปี (12/08/68, 12-08-2568)
    if (!d) {
      const dmy = flat.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
      if (dmy) {
        const year = normalizeYear(dmy[3]);
        let day = parseInt(dmy[1], 10), mon = parseInt(dmy[2], 10);
        if (mon > 12 && day <= 12) { const t = day; day = mon; mon = t; }  // เผื่อสลับ MM/DD
        d = new Date(year, mon - 1, day);
      }
    }

    if (!d || isNaN(d.getTime())) return null;
    // ถ้าวันที่ไม่มีจริง (เช่น 30 ก.พ.) JS จะเลื่อนเดือนให้ — ถือว่าอ่านผิด
    const dayWanted = parseInt((named || flat.match(/(\d{1,2})[\/\-.]/) || [])[1], 10);
    if (dayWanted && d.getDate() !== dayWanted && !flat.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)) return null;

    // เวลา: เอาตัวที่ติดคำว่า "น." ก่อน ไม่งั้นเอาแบบ hh:mm ทั่วไป
    const tWithNa = flat.match(/(\d{1,2})[:.](\d{2})(?::(\d{2}))?\s*น\.?/);
    const tPlain  = flat.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::(\d{2}))?(?=\s|$)/);
    const tm = tWithNa || tPlain;
    if (tm && Number(tm[1]) < 24 && Number(tm[2]) < 60) {
      d.setHours(Number(tm[1]), Number(tm[2]), Number(tm[3] || 0), 0);
    } else {
      d.setHours(12, 0, 0, 0);   // ไม่รู้เวลา ใช้เที่ยงกันเพี้ยนข้ามวันจาก timezone
    }

    // สลิปไม่ควรเป็นอนาคตเกิน 1 วัน — ถ้าเพี้ยนให้ถือว่าอ่านผิด
    if (d.getTime() > Date.now() + 86400000) return null;
    return d;
  }

  /**
   * ถอดวันที่จากรหัสอ้างอิงสลิป รองรับ 2 แบบที่เจอจริง
   *   ก) ฝังวันที่เต็ม   เช่น SCB "202608012vWAeIOheGunNmdz2" -> 2026-08-01
   *   ข) วันที่ N ของปี + เวลา เช่น กสิกร "016225114146BPM01937"
   *      016 | 225 (วันที่ 225 ของปี = 13 ส.ค.) | 114146 (11:41:46)
   */
  function parseDateFromRef(ref) {
    if (!ref) return null;
    const s = String(ref);

    // ก) YYYYMMDD
    const full = s.match(/(20\d{2}|2[45]\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])/);
    if (full) {
      const d = new Date(normalizeYear(full[1]), parseInt(full[2], 10) - 1, parseInt(full[3], 10), 12, 0, 0);
      if (!isNaN(d.getTime()) && d.getTime() <= Date.now() + 86400000) return d;
    }

    const now = new Date();
    const buildDoy = (day, hh, mm, ss) => {
      if (!(day >= 1 && day <= 366)) return null;
      let d = new Date(now.getFullYear(), 0, day, hh || 12, mm || 0, ss || 0);
      if (d.getTime() > now.getTime() + 86400000) d = new Date(now.getFullYear() - 1, 0, day, hh || 12, mm || 0, ss || 0);
      return isNaN(d.getTime()) ? null : d;
    };

    // ข) กสิกร K PLUS: 016 + DDD(วันที่ N ของปี) + HHMMSS + ตัวอักษร
    const doyTime = s.match(/^0\d{2}(\d{3})(\d{2})(\d{2})(\d{2})/);
    if (doyTime && +doyTime[2] < 24 && +doyTime[3] < 60 && +doyTime[4] < 60) {
      const d = buildDoy(+doyTime[1], +doyTime[2], +doyTime[3], +doyTime[4]);
      if (d) return d;
    }

    // ค) MAKE by KBank: 046 + DDD แล้วตามด้วยตัวอักษรผสม (ไม่มีเวลา)
    const doyOnly = s.match(/^0\d{2}(\d{3})(?=[A-Za-z0-9])/);
    if (doyOnly) {
      const d = buildDoy(+doyOnly[1]);
      if (d) return d;
    }
    return null;
  }

  /** ทำความสะอาดข้อความจาก OCR ให้เทียบง่ายขึ้น */
  function normalizeText(text) {
    return String(text || '')
      .replace(/ํา/g, 'ำ')                 // "จํานวน" -> "จำนวน"
      .replace(/[๐-๙]/g, (d) => String(d.charCodeAt(0) - 0x0E50))  // เลขไทย -> อารบิก
      .replace(/[​-‍﻿]/g, '')
      .replace(/[ \t]+/g, ' ');
  }

  const FEE_RE = /(ค่าธรรมเนียม|ธรรมเนียม|fee|charge|คงเหลือ|ยอดคงเหลือ|balance)/i;
  const AMOUNT_LABEL_RE = /(จำนวนเงิน|จำนวน|ยอดเงิน|ยอดชำระ|ยอดรวม|ยอด|รวมทั้งสิ้น|amount|total)\s*:?/i;
  const NOT_PAYEE_RE = /(รหัส|เลขที่|หมายเลข|อ้างอิง|บัญชี|account|ref|xxx|สแกน|ตรวจสอบ|ธนาคาร|ธ\.|จำนวน|ค่าธรรมเนียม|บาท|สำเร็จ)/i;

  /** ตัวเลขที่ "หน้าตาเป็นจำนวนเงิน" จริง ๆ คือมีทศนิยม 2 ตำแหน่ง เช่น 160.00 / 49,999.00
   *  OCR มักอ่านลูกน้ำเป็นช่องว่าง ("49 999.00") จึงรับตัวคั่นได้ทั้งสองแบบ */
  function decimalsIn(line) {
    return [...line.matchAll(/(?:^|[^\d.,])(\d{1,3}(?:[,\s]\d{3})+|\d{1,7})\.(\d{2})(?!\d)/g)]
      .map((m) => parseFloat((m[1] + '.' + m[2]).replace(/[,\s]/g, '')))
      .filter((n) => n > 0 && n < 10000000);
  }

  /** เลขจำนวนเต็มที่ตามด้วยหน่วยเงิน เช่น "500 บาท" */
  function bahtIntIn(line) {
    return [...line.matchAll(/(?:^|[^\d.,])(\d{1,3}(?:,\d{3})*|\d{1,7})\s*(?:บาท|THB|฿)/gi)]
      .map((m) => parseFloat(m[1].replace(/,/g, '')))
      .filter((n) => n > 0 && n < 10000000);
  }

  function extractFromText(rawText) {
    const out = { amount: null, date: null, payee: null, reference: null, lines: [] };
    if (!rawText) return out;

    const text = normalizeText(rawText);
    const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
    out.lines = lines;
    const flat = lines.join(' ');

    /* ---------- ยอดเงิน ----------
       1) บรรทัดที่มีคำว่า "จำนวน/ยอด" (แต่ไม่ใช่ค่าธรรมเนียม) — ตัวเลขอาจอยู่บรรทัดถัดไป
       2) ถ้าไม่เจอ ใช้ตัวเลขทศนิยม 2 ตำแหน่งที่มากที่สุด โดยข้ามบรรทัดค่าธรรมเนียม/ยอดคงเหลือ  */
    for (let i = 0; i < lines.length && !out.amount; i++) {
      if (FEE_RE.test(lines[i]) || !AMOUNT_LABEL_RE.test(lines[i])) continue;
      const after = lines[i].replace(/^.*?(จำนวนเงิน|จำนวน|ยอดเงิน|ยอดชำระ|ยอดรวม|ยอด|amount|total)\s*:?/i, '');
      const here = decimalsIn(after).concat(bahtIntIn(after));
      if (here.length) { out.amount = Math.max(...here); break; }
      // สลิปหลายแบบวางตัวเลขไว้บรรทัดถัดไป (มองลงไปได้ 3 บรรทัด)
      for (let k = 1; k <= 3 && i + k < lines.length; k++) {
        if (FEE_RE.test(lines[i + k])) break;
        const next = decimalsIn(lines[i + k]).concat(bahtIntIn(lines[i + k]));
        if (next.length) { out.amount = Math.max(...next); break; }
      }
    }
    if (!out.amount) {
      const cands = [];
      lines.forEach((l) => { if (!FEE_RE.test(l)) cands.push(...decimalsIn(l)); });
      if (cands.length) out.amount = Math.max(...cands);
    }
    if (!out.amount) {
      const cands = [];
      lines.forEach((l) => { if (!FEE_RE.test(l)) cands.push(...bahtIntIn(l)); });
      if (cands.length) out.amount = Math.max(...cands);
    }
    // ทางสุดท้าย: เลขจำนวนเต็มบนบรรทัดที่มีคำว่า "จำนวน/ยอด" (รับเฉพาะ >= 10 กันเศษขยะจาก OCR)
    if (!out.amount) {
      for (let i = 0; i < lines.length && !out.amount; i++) {
        if (FEE_RE.test(lines[i]) || !AMOUNT_LABEL_RE.test(lines[i])) continue;
        for (let k = 0; k <= 2 && i + k < lines.length; k++) {
          const l = lines[i + k];
          if (k && FEE_RE.test(l)) break;
          const ints = [...l.matchAll(/(?:^|[^\d.,\-])(\d{1,3}(?:,\d{3})*|\d{2,7})(?![\d.,])/g)]
            .map((m) => parseFloat(m[1].replace(/,/g, '')))
            .filter((n) => n >= 10 && n < 10000000);
          if (ints.length) { out.amount = Math.max(...ints); break; }
        }
      }
    }

    /* ---------- วันที่และเวลา ---------- */
    out.date = parseDateFromText(flat);

    /* ---------- ชื่อผู้รับเงิน/ร้านค้า ---------- */
    const idxTo = lines.findIndex((l) => /(ไปยัง|ถึง|ผู้รับ(เงิน)?|to\b|received)/i.test(l));
    if (idxTo > -1) {
      const same = lines[idxTo].replace(/.*?(ไปยัง|ถึง|ผู้รับเงิน|ผู้รับ|to|received)\s*:?\s*/i, '').trim();
      out.payee = cleanPayee(same) || cleanPayee(lines[idxTo + 1] || '');
    }
    if (!out.payee) {
      const biz = lines.find((l) => /(บจก|บมจ|บริษัท|ห้างหุ้นส่วน|ร้าน(?!ค้า)|จำกัด|co\.,?\s*ltd|company|merchant|shop)/i.test(l)
        && !/รหัสร้านค้า/.test(l));
      if (biz) out.payee = cleanPayee(biz);
    }
    if (!out.payee) {
      /* สลิปกสิกร/MAKE ไม่มีคำว่า "ไปยัง" แต่เรียงเป็น
         ชื่อผู้โอน → ธนาคาร → เลขบัญชีปิดบัง(XXX-X-X9382-X) → ชื่อผู้รับ
         จึงหยิบบรรทัดถัดจากเลขบัญชีปิดบังอันแรก */
      const maskIdx = lines.findIndex((l) => /[Xx%*]{3}[-\s][\dXx%*-]{3,}/.test(l));
      if (maskIdx > -1) {
        for (let i = maskIdx + 1; i < Math.min(lines.length, maskIdx + 4); i++) {
          if (/^(ธ\.|ธนาคาร|prompt|พร้อมเพย์|bank)/i.test(lines[i].trim())) continue;
          const cand = cleanPayee(lines[i]);
          if (cand) { out.payee = cand; break; }
        }
      }
    }
    if (!out.payee) {
      // ชื่อร้านแบบตัวพิมพ์ใหญ่ล้วน เช่น ZENITHLINK / LINE PAY MERCHANT
      const caps = lines.find((l) => /^[A-Z][A-Z\s&.'()\-]{3,34}$/.test(l.trim()) && !/^X+$/i.test(l.trim()));
      if (caps) out.payee = cleanPayee(caps);
    }

    /* ---------- เลขอ้างอิงในข้อความ ---------- */
    const ref = flat.match(/(?:เลขที่รายการ|เลขที่อ้างอิง|รหัสอ้างอิง|อ้างอิง|ref(?:erence)?(?:\s*no)?)\s*:?\s*([A-Za-z0-9]{8,40})/i);
    if (ref) out.reference = ref[1];
    return out;
  }

  function cleanPayee(s) {
    let v = String(s || '')
      .replace(/^\S{1,2}\s+(?=\S{3,})/, '')   // ตัดเศษตัวอักษร/ตัวเลขที่ OCR หลุดมาหน้าแถว
      .replace(/\s{2,}\S{1,3}$/, '')          // และเศษที่หลุดมาท้ายแถว
      .replace(/^[\s:@\-–|>.©®]+/, '')
      .replace(/^(นาย|นาง|นางสาว|น\.ส\.|บจก\.|บมจ\.)\s*/i, (m) => m)   // คงคำนำหน้าไว้
      .replace(/\s{2,}/g, ' ')
      .trim();
    v = (typeof MJ !== 'undefined' && MJ.fixThai) ? MJ.fixThai(v) : v;
    if (v.length < 3 || v.length > 80) return null;
    if (NOT_PAYEE_RE.test(v) && !/(บจก|บมจ|บริษัท|จำกัด|co\.,?\s*ltd|company)/i.test(v)) return null;
    if (/^[A-F0-9]{12,}$/i.test(v)) return null;   // ดูเป็นรหัส ไม่ใช่ชื่อ
    return v;
  }

  /* ------------------------- 3) รวมผลเป็นร่างรายการ ------------------------- */
  async function analyze(file, onProgress) {
    const img = await toImage(file);

    onProgress && onProgress('กำลังสแกน QR บนสลิป…');
    let qr = null, slipInfo = null;
    try { qr = await scanQR(img); } catch (e) { /* ไม่มี QR ก็ไม่เป็นไร */ }
    if (qr) slipInfo = parseSlipPayload(qr);

    let text = '';
    const endpoint = MJ.state.profile?.ocr_endpoint;
    try {
      if (endpoint) text = await ocrRemote(endpoint, file, onProgress);
      else text = await ocrLocal(img, onProgress);
    } catch (err) {
      if (endpoint) {
        MJ.toast('PaddleOCR ใช้ไม่ได้ สลับไปอ่านในเครื่อง', 'err');
        try { text = await ocrLocal(img, onProgress); } catch (e2) { text = ''; }
      }
    }

    let info = extractFromText(text);

    // ยังขาดข้อมูลสำคัญ -> อ่านซ้ำจากภาพต้นฉบับ (ไม่เพิ่มคอนทราสต์) แล้วเติมช่องที่ว่าง
    if (!endpoint && (!info.amount || !info.date || !info.payee)) {
      try {
        const text2 = await ocrLocal(img, onProgress, { boost: false, second: true });
        const info2 = extractFromText(text2);
        info = {
          amount: info.amount || info2.amount,
          date: info.date || info2.date,
          payee: info.payee || info2.payee,
          reference: info.reference || info2.reference,
          lines: info.lines.concat(info2.lines),
        };
        text = text + '\n' + text2;
      } catch (e) { /* รอบสองล้มเหลวก็ใช้ผลรอบแรก */ }
    }
    const payee = info.payee || slipInfo?.bank || null;

    // วันที่: รวมสองแหล่ง — รหัสอ้างอิง (แม่นเพราะเป็นโครงสร้าง) กับข้อความ OCR (มีเวลา)
    const refDate = parseDateFromRef(slipInfo?.reference) || parseDateFromRef(info.reference);
    let slipDate = null;
    if (refDate && info.date) {
      const sameDay = refDate.getFullYear() === info.date.getFullYear()
        && refDate.getMonth() === info.date.getMonth()
        && refDate.getDate() === info.date.getDate();
      slipDate = sameDay ? info.date : refDate;   // วันตรงกัน ใช้เวลาจาก OCR
    } else {
      slipDate = refDate || info.date || null;
    }

    // เดาหมวดจากชื่อร้าน + ข้อความทั้งหมด
    let categoryId = payee ? await MJ.data.matchMerchant(payee) : null;
    let category = categoryId ? MJ.data.catById(categoryId) : null;
    if (!category) {
      const guess = MJ.nlp.parse(((payee || '') + ' ' + (info.lines.slice(0, 6).join(' ') || '')) + ' ' + (info.amount || ''));
      category = guess?.category || null;
    }

    return {
      amount: info.amount,
      type: 'expense',
      category_id: category?.id || null,
      category,
      note: payee ? `โอนให้ ${payee}` : 'จ่ายผ่านสลิป',
      payee_name: payee,
      transaction_date: slipDate || new Date(),
      dateFromSlip: !!slipDate,
      slip_reference: slipInfo?.reference || info.reference || null,
      source: 'slip',
      raw_input: (qr ? 'QR: ' + qr + '\n' : '') + text.slice(0, 2000),
      hasQR: !!qr,
      ocrText: text,
    };
  }

  return { analyze, scanQR, parseSlipPayload, extractFromText, parseTLV, ensureTesseract,
           parseDateFromText, parseDateFromRef };
})();

</script>
<script>
/* ===== 50-charts.js ===== */
/* ===================================================================
   50-charts.js — กราฟ SVG เขียนเอง (ไม่พึ่งไลบรารีภายนอก)
   =================================================================== */
MJ.charts = {
  /** โดนัทสัดส่วนตามหมวด */
  donut(items, opts) {
    const o = Object.assign({ size: 190, thickness: 26, centerTop: '', centerMain: '' }, opts || {});
    const total = items.reduce((s, i) => s + i.total, 0);
    const r = (o.size - o.thickness) / 2, cx = o.size / 2, cy = o.size / 2;
    const C = 2 * Math.PI * r;
    if (!total) {
      return `<svg class="chart-donut" viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}"
        style="max-width:100%">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${o.thickness}"/>
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" fill="var(--ink-3)" font-size="13">ยังไม่มีข้อมูล</text></svg>`;
    }
    let offset = 0;
    const arcs = items.map((i) => {
      const frac = i.total / total;
      const dash = `${(frac * C).toFixed(2)} ${(C - frac * C).toFixed(2)}`;
      const seg = `<circle class="seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i.color}"
        stroke-width="${o.thickness}" stroke-dasharray="${dash}" stroke-dashoffset="${(-offset * C).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"
        style="--arc-len:${C.toFixed(0)};animation-delay:${(offset * .5).toFixed(2)}s"><title>${MJ.esc(i.name)} ${MJ.fmtBaht(i.total)}</title></circle>`;
      offset += frac;
      return seg;
    }).join('');
    return `<svg class="chart-donut" viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}" style="max-width:100%">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${o.thickness}"/>
      ${arcs}
      <text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="var(--ink-3)" font-size="12">${MJ.esc(o.centerTop)}</text>
      <text x="${cx}" y="${cy + 16}" text-anchor="middle" fill="var(--ink)" font-size="19" font-weight="700">${MJ.esc(o.centerMain)}</text>
    </svg>`;
  },

  /** แท่งรายวัน (จ่าย/รับ) — ใช้พิกัดจริง ไม่ยืดภาพให้เพี้ยน */
  bars(expense, income, opts) {
    const o = Object.assign({ h: 150 }, opts || {});
    const n = expense.length;
    const max = Math.max(1, ...expense, ...(income || []));
    const W = 8, GAP = 2;                       // ความกว้างช่องต่อวัน
    const vw = n * (W + GAP), vh = 100;         // พื้นที่กราฟ (หน่วยเดียวกันทั้งแกน x/y)
    const today = new Date();
    const isThisMonth = today.getMonth() === MJ.state.month.getMonth()
      && today.getFullYear() === MJ.state.month.getFullYear();

    let bars = '';
    for (let i = 0; i < n; i++) {
      const x = i * (W + GAP);
      const eh = (expense[i] / max) * (vh - 16);
      const ih = income ? (income[i] / max) * (vh - 16) : 0;
      const isToday = isThisMonth && today.getDate() === i + 1;
      const both = ih > 0 && eh > 0;
      const delay = `animation-delay:${(i * .012).toFixed(3)}s`;
      if (ih > 0) bars += `<rect style="${delay}" x="${x}" y="${vh - 16 - ih}" width="${both ? W / 2 - .4 : W}"
        height="${ih}" rx="1.6" fill="var(--in)" opacity=".9"><title>${i + 1}: รับ ${MJ.fmtBaht(income[i])}</title></rect>`;
      if (eh > 0) bars += `<rect style="${delay}" x="${both ? x + W / 2 + .4 : x}" y="${vh - 16 - eh}"
        width="${both ? W / 2 - .4 : W}" height="${eh}" rx="1.6"
        fill="${isToday ? 'var(--honey-d)' : 'var(--out)'}"><title>${i + 1}: จ่าย ${MJ.fmtBaht(expense[i])}</title></rect>`;
    }
    const ticks = [1, Math.ceil(n / 2), n].map((d) =>
      `<text x="${(d - 1) * (W + GAP) + W / 2}" y="${vh - 3}" text-anchor="middle"
        fill="var(--ink-3)" font-size="7">${d}</text>`).join('');

    return `<div class="chart-scroll"><svg class="chart-bars" viewBox="0 0 ${vw} ${vh}"
      width="100%" height="${o.h}" preserveAspectRatio="xMidYMax meet">
      ${bars}
      <line x1="0" y1="${vh - 16}" x2="${vw}" y2="${vh - 16}" stroke="var(--line)" stroke-width=".5"/>
      ${ticks}
    </svg></div>`;
  },

  /** เส้นแนวโน้มยอดสะสม */
  line(values, color) {
    const n = values.length;
    if (!n) return '';
    let acc = 0;
    const cum = values.map((v) => (acc += v));
    const max = Math.max(1, ...cum);
    const pts = cum.map((v, i) => `${(i / (n - 1 || 1)) * 100},${100 - (v / max) * 92}`).join(' ');
    const area = `0,100 ${pts} 100,100`;
    const c = color || 'var(--honey)';
    return `<svg viewBox="0 0 100 100" width="100%" height="120" preserveAspectRatio="none">
      <polygon points="${area}" fill="${c}" opacity=".14"/>
      <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  },

  legend(items, total) {
    if (!items.length) return '<p class="empty tiny">ยังไม่มีรายการในเดือนนี้</p>';
    return `<div class="legend">${items.map((i) => `
      <div class="legend-row">
        <span class="legend-dot" style="background:${i.color}"></span>
        <span class="nm">${i.icon || ''} ${MJ.esc(i.name)}</span>
        <span class="vl">${MJ.fmtBaht(i.total)}</span>
        <span class="pc">${total ? Math.round((i.total / total) * 100) : 0}%</span>
      </div>`).join('')}</div>`;
  },

  /** แถบงบประมาณ */
  budgetBar(item) {
    const used = item.total, limit = item.budget;
    const pct = limit ? Math.min(100, (used / limit) * 100) : 0;
    const over = limit && used > limit;
    const color = over ? 'var(--out)' : (pct > 80 ? 'var(--warn)' : item.color);
    return `<div class="bud">
      <div class="bud-top">
        <span class="bud-name">${item.icon || ''} ${MJ.esc(item.name)}</span>
        <span class="${over ? 'tx-amt out' : ''}">${MJ.fmtBaht(used)}${limit ? ` <span class="muted tiny">/ ${MJ.fmtMoney(limit)}</span>` : ''}</span>
      </div>
      <div class="bar"><i style="width:${limit ? pct : 0}%;background:${color}"></i></div>
      <div class="bud-foot">
        <span>${limit ? (over ? `เกินงบ ${MJ.fmtBaht(used - limit)} 🐻💦` : `เหลือ ${MJ.fmtBaht(limit - used)}`) : 'ยังไม่ตั้งงบ'}</span>
        <span>${item.count} รายการ</span>
      </div>
    </div>`;
  },
};

</script>
<script>
/* ===== 60-dashboard.js ===== */
/* ===================================================================
   60-dashboard.js — หน้าภาพรวม
   =================================================================== */
MJ.routes.dashboard = (view) => {
  const s = MJ.data.summary();
  const expenseCats = MJ.data.byCategory('expense');
  const withBudget = expenseCats.filter((c) => c.budget);
  const budgetTotal = withBudget.reduce((a, c) => a + c.budget, 0);
  const budgetUsed = withBudget.reduce((a, c) => a + c.total, 0);
  const recent = MJ.state.transactions.slice(0, 6);
  const now = new Date();
  const isCurrentMonth = now.getMonth() === MJ.state.month.getMonth() && now.getFullYear() === MJ.state.month.getFullYear();
  const daysLeft = isCurrentMonth ? MJ.endOfMonth(now).getDate() - now.getDate() : 0;
  const avgPerDay = s.expense / (isCurrentMonth ? now.getDate() : MJ.endOfMonth(MJ.state.month).getDate());

  const upcoming = MJ.state.recurring
    .filter((r) => r.is_active)
    .sort((a, b) => new Date(a.next_run_date) - new Date(b.next_run_date))
    .slice(0, 2);

  view.innerHTML = `
    <div class="balance">
      <div class="lbl">คงเหลือใน ${MJ.monthLabelFull(MJ.state.month)}</div>
      <div class="amt" id="balAmt">${MJ.fmtBaht(s.balance)}</div>
      <div class="grid">
        <div class="box in"><span class="tiny">รายรับ</span><b>${MJ.fmtBaht(s.income)}</b></div>
        <div class="box out"><span class="tiny">รายจ่าย</span><b>${MJ.fmtBaht(s.expense)}</b></div>
      </div>
    </div>

    <div class="chips">
      <button class="chip" data-quick="พิมพ์"><i class="fa fa-comment"></i> จดเร็ว</button>
      <button class="chip" data-quick="เสียง"><i class="fa fa-mic"></i> พูดจด</button>
      <button class="chip" data-quick="สลิป"><i class="fa fa-images"></i> สลิป</button>
      <button class="chip" data-quick="ฟอร์ม"><i class="fa fa-keyboard"></i> กรอกเอง</button>
      <button class="chip" id="chipShare"><i class="fa fa-send"></i> แชร์สรุป</button>
    </div>

    ${isCurrentMonth ? `
    <div class="stat-grid mb">
      <div class="stat"><div class="k">จ่ายเฉลี่ยต่อวัน</div><div class="v">${MJ.fmtBaht(avgPerDay)}</div></div>
      <div class="stat"><div class="k">เหลืออีก</div><div class="v">${daysLeft} วัน</div></div>
    </div>` : ''}

    <div class="card">
      <div class="card-head"><h3>กระเป๋าเงิน</h3><button class="link" data-go="accounts">จัดการ ›</button></div>
      ${(MJ.state.accounts || []).length ? `
        <div class="acc-strip">
          ${(MJ.state.accounts || []).slice(0, 4).map((a) => {
            const b = (MJ.state.balances || {})[a.id] ?? Number(a.opening_balance);
            return `<button class="acc-chip" data-go="accounts">
              <span class="ic" style="background:${MJ.hex2rgba(a.color, .18)}">${a.icon}</span>
              <b>${MJ.esc(a.name)}</b>
              <em class="${b < 0 ? 'out' : ''}">${MJ.fmtBaht(b)}</em>
            </button>`;
          }).join('')}
        </div>` : '<div class="empty tiny">ยังไม่มีกระเป๋า</div>'}
    </div>

    ${(() => {
      const goals = (MJ.goals?.list || []).filter((g) => !g.is_done).slice(0, 2);
      const debts = (MJ.debts?.list || []).filter((d) => !d.is_settled);
      const owed = debts.filter((d) => d.direction === 'owed_to_me').reduce((a, d) => a + (Number(d.amount) - Number(d.paid_amount)), 0);
      const owe = debts.filter((d) => d.direction === 'i_owe').reduce((a, d) => a + (Number(d.amount) - Number(d.paid_amount)), 0);
      if (!goals.length && !debts.length) return '';
      return `<div class="card">
        <div class="card-head"><h3>แผนการเงิน</h3><button class="link" data-go="plans">ดูทั้งหมด ›</button></div>
        ${goals.map((g) => {
          const pct = Math.min(100, (Number(g.saved_amount) / Number(g.target_amount)) * 100);
          return `<div class="bud">
            <div class="bud-top"><span class="bud-name">${g.icon} ${MJ.esc(g.title)}</span>
              <span>${MJ.fmtBaht(g.saved_amount)} <span class="muted tiny">/ ${MJ.fmtMoney(g.target_amount)}</span></span></div>
            <div class="bar"><i style="width:${pct}%;background:${g.color}"></i></div>
          </div>`;
        }).join('')}
        ${debts.length ? `<div class="stat-grid mt">
          <div class="stat"><div class="k">คนอื่นติดเรา</div><div class="v" style="color:var(--in)">${MJ.fmtBaht(owed)}</div></div>
          <div class="stat"><div class="k">เราติดคนอื่น</div><div class="v" style="color:var(--out)">${MJ.fmtBaht(owe)}</div></div>
        </div>` : ''}
      </div>`;
    })()}

    <div class="card">
      <div class="card-head">
        <h3>งบประมาณเดือนนี้</h3>
        <button class="link" data-go="budget">ตั้งงบ ›</button>
      </div>
      ${budgetTotal ? `
        <div class="bud">
          <div class="bud-top"><span class="bud-name">🍯 งบรวม</span>
            <span>${MJ.fmtBaht(budgetUsed)} <span class="muted tiny">/ ${MJ.fmtMoney(budgetTotal)}</span></span></div>
          <div class="bar"><i style="width:${Math.min(100, (budgetUsed / budgetTotal) * 100)}%;
            background:${budgetUsed > budgetTotal ? 'var(--out)' : 'linear-gradient(90deg,var(--honey),var(--honey-d))'}"></i></div>
          <div class="bud-foot"><span>${budgetUsed > budgetTotal
            ? `เกินงบ ${MJ.fmtBaht(budgetUsed - budgetTotal)}`
            : `ใช้ได้อีก ${MJ.fmtBaht(budgetTotal - budgetUsed)}`}</span>
            <span>${Math.round((budgetUsed / budgetTotal) * 100)}%</span></div>
        </div>
        <div class="hr"></div>
        ${withBudget.slice(0, 4).map((c) => MJ.charts.budgetBar(c)).join('')}
      ` : `<div class="empty"><span class="big">🍯</span>ยังไม่ได้ตั้งงบเลย<br>
            <button class="btn btn-soft btn-sm mt" data-go="budget">ตั้งงบรายหมวด</button></div>`}
    </div>

    <div class="card">
      <div class="card-head">
        <h3>รายจ่ายตามหมวด</h3>
        <button class="link" data-go="analysis">ดูกราฟ ›</button>
      </div>
      ${expenseCats.length ? `
        ${MJ.charts.donut(expenseCats.slice(0, 8), {
          centerTop: 'จ่ายไป', centerMain: MJ.fmtBaht(s.expense),
        })}
        ${MJ.charts.legend(expenseCats.slice(0, 5), s.expense)}
      ` : `<div class="empty"><span class="big">🐻</span>เดือนนี้ยังไม่มีรายจ่าย</div>`}
    </div>

    ${upcoming.length ? `
    <div class="card">
      <div class="card-head"><h3>รายการประจำที่จะถึง</h3><button class="link" data-go="settings">จัดการ ›</button></div>
      ${upcoming.map((r) => {
        const c = MJ.data.catById(r.category_id);
        return `<div class="list-item">
          <span class="ic">${c?.icon || '🔁'}</span>
          <span class="tx2"><b>${MJ.esc(r.note || c?.name || 'รายการประจำ')}</b>
            <small>ครั้งถัดไป ${MJ.dayLabel(r.next_run_date)}</small></span>
          <span class="tx-amt ${r.type === 'income' ? 'in' : 'out'}">${r.type === 'income' ? '+' : '−'}${MJ.fmtMoney(r.amount)}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div class="card">
      <div class="card-head"><h3>รายการล่าสุด</h3><button class="link" data-go="transactions">ดูทั้งหมด ›</button></div>
      ${recent.length ? recent.map((t) => MJ.tx.row(t)).join('')
        : `<div class="empty"><span class="big">📒</span>ยังไม่มีรายการในเดือนนี้<br>
           <button class="btn btn-primary btn-sm mt" data-go="add">เริ่มจดเลย</button></div>`}
    </div>
  `;

  MJ.countUp(MJ.$('#balAmt', view), s.balance);
  const share = MJ.$('#chipShare', view);
  if (share) share.onclick = () => MJ.share.open();
  view.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => MJ.go(b.dataset.go));
  view.querySelectorAll('[data-quick]').forEach((b) => b.onclick = () => {
    const map = {
      'พิมพ์': { tab: 'chat' },
      'เสียง': { tab: 'chat', action: 'voice' },
      'สลิป': { tab: 'chat', action: 'slip' },
      'ฟอร์ม': { tab: 'form' },
    };
    MJ.go('add', map[b.dataset.quick]);
  });
  MJ.tx.bindRows(view);
};

</script>
<script>
/* ===== 61-add.js ===== */
/* ===================================================================
   61-add.js — หน้าจดรายการ 2 แท็บ
     1) แชท    — พิมพ์ + พูด + ส่งรูปสลิป รวมอยู่ในช่องเดียว
     2) กรอกเอง — แป้นตัวเลข + เลือกหมวด
   =================================================================== */
MJ.add = {
  tab: 'chat',
  chat: [],          // {who:'bot'|'me', text, img, imgs}
  recognizer: null,
  recording: false,
  form: { amount: '', type: 'expense', category_id: null, date: null, note: '' },
};

/* ---------------------- ประวัติแชท: เก็บในฐานข้อมูล + สำรองในเครื่อง ----------------------
   • บันทึกขึ้น Supabase ทุกข้อความ -> เปิดเครื่องไหนก็เห็นแชทเดิม
   • เก็บสำเนาในเครื่องไว้ด้วย เผื่อออฟไลน์หรือโหลดยังไม่เสร็จ
   • รูปสลิปเก็บเป็นภาพย่อ (จำกัดขนาด) ถ้าใหญ่เกินจะเก็บเป็นข้อความแทน
   ------------------------------------------------------------------- */
MJ.add.CHAT_KEY = 'mj-chat';
MJ.add.MAX_IMG_BYTES = 40000;     // ~40KB ต่อรูป
MJ.add.chatLoaded = false;

MJ.add.localKey = () => MJ.add.CHAT_KEY + ':' + (MJ.state.user?.id || 'guest');

MJ.add.loadChat = function () {
  try {
    const raw = localStorage.getItem(MJ.add.localKey());
    if (raw) MJ.add.chat = JSON.parse(raw).slice(-60);
  } catch (e) { /* อ่านไม่ได้ก็เริ่มใหม่ */ }
};

/** ดึงประวัติแชทจากฐานข้อมูล (เรียกตอนเข้าแอป) */
MJ.add.syncChat = async function () {
  if (!MJ.state.user) return;
  try {
    const { data, error } = await MJ.sb.from('chat_messages')
      .select('who, text, imgs, created_at')
      .order('created_at', { ascending: false })
      .limit(80);
    if (error) throw error;

    const fromDb = (data || []).reverse().map((m) => ({
      who: m.who,
      text: m.text || '',
      imgs: (m.imgs && m.imgs.length) ? m.imgs : null,
      at: new Date(m.created_at).getTime(),
      saved: true,
    }));

    if (fromDb.length) {
      // ข้อความในเครื่องที่ยังไม่ได้ขึ้นฐานข้อมูล ให้ต่อท้ายไว้
      const pending = MJ.add.chat.filter((m) => !m.saved && m.at && m.at > (fromDb[fromDb.length - 1].at || 0));
      MJ.add.chat = fromDb.concat(pending);
      MJ.add.saveLocal();
      MJ.add.chatLoaded = true;
      if (MJ.state.route === 'add' && MJ.add.tab === 'chat') MJ.render();
    }
  } catch (e) { /* ใช้สำเนาในเครื่องต่อไป */ }
};

/** บันทึกข้อความหนึ่งข้อความขึ้นฐานข้อมูล */
MJ.add.persist = async function (msg) {
  MJ.add.saveLocal();
  if (!MJ.state.user || !navigator.onLine) return;
  const imgs = (msg.imgs || (msg.img ? [msg.img] : []))
    .filter((u) => typeof u === 'string' && u.startsWith('data:') && u.length <= MJ.add.MAX_IMG_BYTES)
    .slice(0, 4);
  const text = msg.text || (msg.imgs?.length ? `🧾 ส่งสลิป ${msg.imgs.length} ใบ` : (msg.img ? '🧾 ส่งสลิป' : ''));
  if (!text && !imgs.length) return;
  try {
    const { error } = await MJ.sb.from('chat_messages')
      .insert({ user_id: MJ.state.user.id, who: msg.who, text, imgs });
    if (!error) msg.saved = true;
  } catch (e) { /* ค่อยลองใหม่รอบหน้า */ }
};

/** สำเนาในเครื่อง (เก็บรูปย่อได้ไม่เกิน 6 รูปล่าสุด) */
MJ.add.saveLocal = function () {
  try {
    let imgBudget = 6;
    const keep = MJ.add.chat.slice(-60).reverse().map((m) => {
      const smallImgs = (m.imgs || []).filter((u) => String(u).startsWith('data:'));
      const smallImg = String(m.img || '').startsWith('data:') ? m.img : null;
      const item = { who: m.who, text: m.text || '', at: m.at || Date.now(), saved: !!m.saved };
      if (smallImgs.length && imgBudget > 0) {
        item.imgs = smallImgs.slice(0, imgBudget);
        imgBudget -= item.imgs.length;
      } else if (smallImg && imgBudget > 0) {
        item.img = smallImg; imgBudget--;
      } else if (!item.text) {
        item.text = m.imgs?.length ? `🧾 ส่งสลิป ${m.imgs.length} ใบ` : '🧾 ส่งสลิป';
      }
      return item;
    }).reverse().filter((m) => m.text || m.img || m.imgs);
    localStorage.setItem(MJ.add.localKey(), JSON.stringify(keep));
  } catch (e) { /* เต็มก็ข้ามไป */ }
};

// ชื่อเดิมที่โค้ดส่วนอื่นเรียกใช้
MJ.add.saveChat = function (msg) {
  if (msg) return MJ.add.persist(msg);
  MJ.add.saveLocal();
  // บันทึกข้อความที่ยังไม่ได้ขึ้นฐานข้อมูลย้อนหลัง
  const unsaved = MJ.add.chat.filter((m) => !m.saved).slice(-5);
  unsaved.forEach((m) => MJ.add.persist(m));
};

/** ล้างประวัติแชททั้งหมด */
MJ.add.clearChat = async function () {
  MJ.add.chat = [];
  try { localStorage.removeItem(MJ.add.localKey()); } catch (e) {}
  try { await MJ.sb.from('chat_messages').delete().eq('user_id', MJ.state.user.id); } catch (e) {}
};

MJ.routes.add = (view) => {
  const p = MJ.state.routeParams || {};
  if (p.tab) MJ.add.tab = (p.tab === 'form' ? 'form' : 'chat');
  const action = p.action || null;      // 'voice' | 'slip'
  MJ.state.routeParams = {};

  if (!MJ.add.chat.length) MJ.add.loadChat();
  if (!MJ.add.chat.length) {
    MJ.add.chat = [{ who: 'bot', text: 'สวัสดี! บอกหมีได้เลย 🐻\n• พิมพ์ “กินกาแฟ 80”\n• กดไมค์แล้วพูด\n• หรือส่งรูปสลิปมาให้หมีอ่าน' }];
  }

  view.innerHTML = `
    <div class="tabs-dock">
      <div class="seg" id="addTabs">
        <button class="seg-btn" data-tab="chat"><i class="fa fa-comment"></i> แชท</button>
        <button class="seg-btn" data-tab="form"><i class="fa fa-keyboard"></i> กรอกเอง</button>
      </div>
    </div>
    <div id="addBody"></div>`;

  view.querySelectorAll('#addTabs .seg-btn').forEach((b) =>
    b.classList.toggle('active', b.dataset.tab === MJ.add.tab));
  MJ.segInit(MJ.$('#addTabs', view), (b) => { MJ.add.tab = b.dataset.tab; MJ.render(); });

  const body = MJ.$('#addBody', view);
  document.body.classList.toggle('chat-open', MJ.add.tab === 'chat');
  if (MJ.add.tab === 'form') {
    const dock = MJ.$('#composerDock');
    dock.classList.add('hidden'); dock.innerHTML = '';
    renderForm(body);
  } else {
    renderChat(body, action);
  }
};

/**
 * ปุ่มลัดในหน้าแชท — สร้างจากรายการที่ผู้ใช้จดบ่อยที่สุด (ชื่อ+ยอดเดิม)
 * ถ้ายังไม่มีข้อมูลพอ ค่อยเติมตัวอย่างมาตรฐาน
 */
MJ.add.quickChips = function () {
  const freq = new Map();
  MJ.state.transactions.forEach((t) => {
    const note = MJ.fixThai(t.note || MJ.data.catById(t.category_id)?.name || '');
    if (!note || note.length > 22) return;
    const amt = Math.round(Number(t.amount));
    if (!amt) return;
    const key = `${t.type}|${note}|${amt}`;
    const cur = freq.get(key) || { note, amt, type: t.type, n: 0, last: 0,
      icon: MJ.data.catById(t.category_id)?.icon || '' };
    cur.n++;
    cur.last = Math.max(cur.last, new Date(t.transaction_date).getTime());
    freq.set(key, cur);
  });

  const top = Array.from(freq.values())
    .sort((a, b) => (b.n - a.n) || (b.last - a.last))
    .slice(0, 8)
    .map((x) => ({
      icon: x.icon,
      label: `${x.note} ${MJ.fmtMoney(x.amt)}`,
      text: `${x.type === 'income' ? 'รับ ' : ''}${x.note} ${x.amt}`,
    }));

  if (top.length >= 4) return top;
  const defaults = [
    { icon: '🍜', label: 'ข้าวเที่ยง 60', text: 'ข้าวเที่ยง 60' },
    { icon: '☕', label: 'กาแฟ 60', text: 'กาแฟ 60' },
    { icon: '🚕', label: 'ค่าแท็กซี่ 120', text: 'ค่าแท็กซี่ 120' },
    { icon: '🛒', label: 'ของใช้ 200', text: 'ซื้อของใช้ 200' },
    { icon: '💰', label: 'รับเงินเดือน', text: 'รับเงินเดือน 25000' },
  ];
  const firstWord = (x) => x.label.split(' ')[0];
  return top.concat(defaults.filter((d) => !top.some((t) => firstWord(t) === firstWord(d)))).slice(0, 8);
};

/* ============================ แท็บแชท ============================ */
function renderChat(body, action) {
  // ข้อความอยู่ในหน้า ส่วนแถบพิมพ์ตรึงติดด้านล่างเหมือนแอปแชท
  body.innerHTML = `
    <div class="chat" id="chatBox">
      ${MJ.add.chat.map(bubbleHTML).join('')}
    </div>`;

  const dock = MJ.$('#composerDock');
  dock.classList.remove('hidden');
  dock.innerHTML = `
    <div class="chips scroll" id="samples">
      ${MJ.add.quickChips().map((c) => `<button class="chip mini" data-s="${MJ.esc(c.text)}">
        ${c.icon ? `<span class="ic">${c.icon}</span>` : ''}${MJ.esc(c.label)}</button>`).join('')}
    </div>
    <div class="composer">
      <button class="rnd" id="btnSlip" title="ส่งรูปสลิป"><i class="fa fa-images"></i></button>
      <textarea id="chatInput" rows="1" placeholder="พิมพ์ พูด หรือส่งสลิป…"></textarea>
      <button class="rnd" id="btnMic" title="พูด"><i class="fa fa-mic"></i></button>
      <button class="rnd send" id="btnSend" title="ส่ง"><i class="fa fa-send"></i></button>
    </div>
    <input type="file" id="slipFile" accept="image/*" hidden multiple>`;

  const box = MJ.$('#chatBox', body);
  const input = MJ.$('#chatInput', dock);
  const fileInput = MJ.$('#slipFile', dock);
  body = dock;   // ปุ่มทั้งหมดอยู่ใน dock

  input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(110, input.scrollHeight) + 'px'; };
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); } };
  MJ.$('#btnSend', body).onclick = submitText;
  MJ.$('#btnMic', body).onclick = () => MJ.add.toggleVoice(input);
  MJ.$('#btnSlip', body).onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length) MJ.add.processSlips(files);
  };
  body.querySelectorAll('#samples .chip').forEach((c) => c.onclick = () => { input.value = c.dataset.s; submitText(); });

  scrollChat(box);
  MJ.add.pushBubble = pushBubble;   // ให้ processSlip เรียกใช้ได้

  if (action === 'voice') setTimeout(() => MJ.add.toggleVoice(input), 350);
  if (action === 'slip') setTimeout(() => fileInput.click(), 250);

  function pushBubble(who, text, img, imgs) {
    const msg = { who, text, img: img || null, imgs: imgs || null, at: Date.now() };
    MJ.add.chat.push(msg);
    if (MJ.add.chat.length > 60) MJ.add.chat.splice(0, MJ.add.chat.length - 60);
    box.insertAdjacentHTML('beforeend', bubbleHTML(msg));
    scrollChat(box);
    MJ.add.persist(msg);
    return msg;
  }

  function submitText() {
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';
    pushBubble('me', text);
    const draft = MJ.nlp.parse(text);
    if (!draft || !draft.amount) {
      pushBubble('bot', 'หมีหาจำนวนเงินไม่เจอ ลองใส่ตัวเลขด้วยนะ เช่น “กินข้าว 80” 🐻');
      return;
    }
    pushBubble('bot', 'เข้าใจแล้ว!\n' + MJ.nlp.describe(draft));
    MJ.add.openDraftSheet(draft);
  }
}

function bubbleHTML(m) {
  // รูปหลายใบ -> เรียงเป็นตารางในบับเบิลเดียว เหมือนส่งอัลบั้มในแชท
  if (m.imgs && m.imgs.length) {
    const cols = m.imgs.length === 1 ? 1 : (m.imgs.length === 2 ? 2 : 3);
    const grid = `<div class="img-grid" style="grid-template-columns:repeat(${cols},1fr)">
      ${m.imgs.map((u, i) => `<img src="${u}" alt="สลิปใบที่ ${i + 1}" loading="lazy">`).join('')}</div>`;
    return `<div class="bubble ${m.who} has-img">${grid}${m.text ? MJ.esc(m.text) : ''}</div>`;
  }
  const img = m.img ? `<img src="${m.img}" alt="สลิป" style="width:100%;border-radius:14px;margin-bottom:${m.text ? '7px' : '0'}">` : '';
  return `<div class="bubble ${m.who} ${m.img ? 'has-img' : ''}">${img}${m.text ? MJ.esc(m.text) : ''}</div>`;
}

function scrollChat(box) {
  box.scrollTop = box.scrollHeight;
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
}

/* ============================ พูด (ใช้ในแท็บแชท) ============================ */
MJ.add.toggleVoice = function (input) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { MJ.toast('เบราว์เซอร์นี้ยังไม่รองรับการพูด ลองพิมพ์แทนนะ', 'err'); return; }
  if (MJ.add.recording) { try { MJ.add.recognizer.stop(); } catch (e) {} return; }

  const rec = new SR();
  rec.lang = 'th-TH';
  rec.interimResults = true;
  rec.continuous = false;
  MJ.add.recognizer = rec;
  MJ.add.recording = true;
  MJ.buzz(20);
  MJ.$$('#btnMic').forEach((b) => b.classList.add('rec'));
  if (input) input.placeholder = 'กำลังฟัง… พูดได้เลย';

  rec.onresult = (e) => {
    const txt = Array.from(e.results).map((r) => r[0].transcript).join('');
    if (input) { input.value = txt; input.dispatchEvent(new Event('input')); }
  };
  rec.onerror = (e) => {
    MJ.toast(e.error === 'not-allowed' ? 'ไม่ได้รับอนุญาตให้ใช้ไมค์' : 'ฟังไม่ชัด ลองใหม่อีกที', 'err');
  };
  rec.onend = () => {
    MJ.add.recording = false;
    MJ.$$('#btnMic').forEach((b) => b.classList.remove('rec'));
    if (input) input.placeholder = 'พิมพ์ พูด หรือส่งสลิป…';
    const txt = input?.value.trim();
    if (!txt) return;
    input.value = ''; input.style.height = 'auto';
    MJ.add.pushBubble && MJ.add.pushBubble('me', '🎤 ' + txt);
    const draft = MJ.nlp.parse(txt);
    if (draft) draft.source = 'voice';
    if (draft?.amount) {
      MJ.add.pushBubble && MJ.add.pushBubble('bot', 'เข้าใจแล้ว!\n' + MJ.nlp.describe(draft));
      MJ.add.openDraftSheet(draft);
    } else {
      MJ.add.pushBubble && MJ.add.pushBubble('bot', 'ไม่เจอจำนวนเงิน ลองพูดใหม่พร้อมตัวเลขนะ 🐻');
    }
  };
  try { rec.start(); } catch (e) { MJ.add.recording = false; }
};

/* ============================ สลิปหลายใบพร้อมกัน ============================ */
/**
 * เลือกรูปได้ทีละหลายใบเหมือนแชท:
 *   - รูปขึ้นในแชททันทีทุกใบ
 *   - อ่านทีละใบพร้อมบอกความคืบหน้า
 *   - ใบเดียว -> เปิดหน้ายืนยันแบบเดิม, หลายใบ -> เปิดหน้ารวมให้ตรวจทีเดียวแล้วบันทึกรวด
 */
MJ.add.processSlips = async function (files) {
  if (files.length === 1) return MJ.add.processSlip(files[0]);

  const items = files.map((file) => ({ file, url: URL.createObjectURL(file) }));
  // ใช้ภาพย่อแบบ data URL ในแชท (blob URL จะพังเมื่อ re-render/ปิดแอป)
  const thumbs = [];
  for (const it of items) {
    const th = await MJ.data.thumbnail(it.file);
    it.thumb = th || it.url;
    thumbs.push(it.thumb);
  }
  MJ.add.pushBubble && MJ.add.pushBubble('me', '', null, thumbs);
  MJ.add.pushBubble && MJ.add.pushBubble('bot', `ได้รับสลิป ${files.length} ใบ กำลังอ่านให้นะ… 🐻`);

  const drafts = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    MJ.loading(true, `กำลังอ่านสลิปใบที่ ${i + 1}/${items.length}…`);
    try {
      const draft = await MJ.slip.analyze(it.file, (msg) => MJ.loading(true, `(${i + 1}/${items.length}) ${msg}`));
      draft.file = it.file;
      draft.previewUrl = it.thumb || it.url;
      drafts.push(draft);
    } catch (err) {
      drafts.push({ file: it.file, previewUrl: it.url, error: err.message || String(err),
        amount: null, type: 'expense', transaction_date: new Date(), source: 'slip' });
    }
  }
  MJ.loading(false);

  // เช็กสลิปซ้ำทีเดียวทั้งชุด (รวมทั้งซ้ำกันเองในชุดนี้)
  const refs = drafts.map((d) => d.slip_reference).filter(Boolean);
  let existing = new Set();
  if (refs.length) {
    const { data } = await MJ.sb.from('transactions').select('slip_reference').in('slip_reference', refs);
    existing = new Set((data || []).map((r) => r.slip_reference));
  }
  const seen = new Set();
  drafts.forEach((d) => {
    d.duplicate = !!(d.slip_reference && (existing.has(d.slip_reference) || seen.has(d.slip_reference)));
    if (d.slip_reference) seen.add(d.slip_reference);
    d.include = !d.duplicate;
  });

  const dupCount = drafts.filter((d) => d.duplicate).length;
  const readOk = drafts.filter((d) => d.amount).length;
  MJ.add.pushBubble && MJ.add.pushBubble('bot',
    `อ่านเสร็จแล้ว! อ่านยอดได้ ${readOk}/${drafts.length} ใบ`
    + (dupCount ? `\n⚠️ มี ${dupCount} ใบที่เคยบันทึกแล้ว หมีติ๊กออกให้` : '')
    + '\nตรวจดูแล้วกดบันทึกรวดเดียวได้เลย');

  MJ.add.openBatchSheet(drafts, items);
};

MJ.add.openBatchSheet = function (drafts, items) {
  const cats = MJ.state.categories;
  const catOptions = (type, selected) => cats.filter((c) => c.type === type)
    .map((c) => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('');

  const rows = drafts.map((d, i) => `
    <div class="batch-row ${d.include ? '' : 'off'}" data-i="${i}">
      <div class="batch-head">
        <img src="${d.previewUrl}" alt="สลิป ${i + 1}">
        <div class="batch-sum">
          <b>ใบที่ ${i + 1}${d.payee_name ? ' • ' + MJ.esc(MJ.fixThai(d.payee_name)) : ''}</b>
          <small>${d.duplicate ? '⚠️ เคยบันทึกแล้ว'
            : (d.error ? '⚠️ อ่านไม่สำเร็จ'
            : `${d.hasQR ? '✅ มี QR' : '⚠️ ไม่พบ QR'} • ${d.dateFromSlip ? 'วันที่จากสลิป' : 'ใช้วันนี้'}`)}</small>
        </div>
        <div class="switch ${d.include ? 'on' : ''}" data-toggle="${i}"><i></i></div>
      </div>
      <div class="batch-fields">
        <div class="row">
          <label class="field"><span>จำนวนเงิน</span>
            <input type="number" step="0.01" inputmode="decimal" data-f="amount" value="${d.amount ?? ''}" placeholder="0.00"></label>
          <label class="field"><span>หมวดหมู่</span>
            <select data-f="category">${catOptions(d.type || 'expense', d.category_id)}</select></label>
        </div>
        <label class="field"><span>วันและเวลา</span>
          <input type="datetime-local" data-f="date" value="${MJ.isoLocal(new Date(d.transaction_date))}"></label>
      </div>
    </div>`).join('');

  MJ.sheet.open(`ตรวจสลิป ${drafts.length} ใบ`, `
    <div id="batchList">${rows}</div>
    <label class="field"><span>ลงกระเป๋า (ใช้กับทุกใบ)</span><select id="batchAcc">
      ${(MJ.state.accounts || []).map((a) => `<option value="${a.id}" ${a.id === MJ.data.defaultAccount()?.id ? 'selected' : ''}>${a.icon} ${MJ.esc(a.name)}</option>`).join('')}
    </select></label>
    <div class="batch-total card">
      <div class="card-head" style="margin:0">
        <h3>รวมที่จะบันทึก</h3>
        <span class="tx-amt out" id="batchTotal">฿0</span>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="batchSave">บันทึกทั้งหมด</button>
    <button class="btn btn-ghost btn-block" id="batchCancel">ยกเลิก</button>
  `, (body) => {
    const recalc = () => {
      let sum = 0, n = 0;
      drafts.forEach((d, i) => {
        const row = body.querySelector(`.batch-row[data-i="${i}"]`);
        const amt = parseFloat(MJ.$('[data-f="amount"]', row).value);
        if (d.include && amt > 0) { sum += amt; n++; }
      });
      MJ.$('#batchTotal', body).textContent = MJ.fmtBaht(sum);
      MJ.$('#batchSave', body).textContent = n ? `บันทึก ${n} รายการ • ${MJ.fmtBaht(sum)}` : 'ยังไม่ได้เลือกรายการ';
      MJ.$('#batchSave', body).disabled = !n;
      MJ.$('#batchSave', body).style.opacity = n ? '1' : '.5';
    };

    body.querySelectorAll('[data-toggle]').forEach((sw) => sw.onclick = () => {
      const i = +sw.dataset.toggle;
      drafts[i].include = !drafts[i].include;
      sw.classList.toggle('on', drafts[i].include);
      body.querySelector(`.batch-row[data-i="${i}"]`).classList.toggle('off', !drafts[i].include);
      MJ.buzz(8);
      recalc();
    });
    body.querySelectorAll('[data-f="amount"]').forEach((el) => el.oninput = recalc);
    recalc();

    MJ.$('#batchCancel', body).onclick = () => MJ.sheet.close();
    MJ.$('#batchSave', body).onclick = async () => {
      const chosen = drafts.map((d, i) => ({ d, i })).filter(({ d }) => d.include);
      let saved = 0, failed = 0, total = 0;
      for (let k = 0; k < chosen.length; k++) {
        const { d, i } = chosen[k];
        const row = body.querySelector(`.batch-row[data-i="${i}"]`);
        const amount = parseFloat(MJ.$('[data-f="amount"]', row).value);
        if (!amount || amount <= 0) { failed++; continue; }
        MJ.loading(true, `กำลังบันทึก ${k + 1}/${chosen.length}…`);
        try {
          let receiptPath = null;
          try { receiptPath = await MJ.data.uploadReceipt(d.file); } catch (e) { /* ไม่มีรูปก็ยังบันทึกได้ */ }
          await MJ.data.addTransaction({
            amount,
            type: d.type || 'expense',
            category_id: MJ.$('[data-f="category"]', row).value || null,
            account_id: MJ.$('#batchAcc', body)?.value || null,
            note: d.note || (d.payee_name ? `โอนให้ ${d.payee_name}` : 'จ่ายผ่านสลิป'),
            payee_name: d.payee_name || null,
            transaction_date: new Date(MJ.$('[data-f="date"]', row).value),
            slip_reference: d.slip_reference || null,
            receipt_image_url: receiptPath,
            source: 'slip',
            raw_input: d.raw_input || null,
          });
          saved++; total += amount;
        } catch (err) { failed++; }
      }
      MJ.loading(false);
      MJ.sheet.close();
      MJ.buzz(30);
      (items || []).forEach((it) => { try { URL.revokeObjectURL(it.url); } catch (e) {} });
      MJ.toast(`บันทึกแล้ว ${saved} รายการ 🐻`, saved ? 'ok' : 'err');
      MJ.add.persist(MJ.add.chat[MJ.add.chat.push({ who: 'bot', at: Date.now(),
        text: `บันทึกให้แล้ว ${saved} รายการ รวม ${MJ.fmtBaht(total)} 🍯` + (failed ? `\n(ข้าม ${failed} ใบที่ยอดยังว่างหรือบันทึกไม่สำเร็จ)` : '') }) - 1]);
      MJ.render();
    };
  });
};

/* ============================ สลิปใบเดียว ============================ */
MJ.add.processSlip = async function (file) {
  const thumb = await MJ.data.thumbnail(file);
  if (MJ.add.pushBubble) MJ.add.pushBubble('me', '', thumb || URL.createObjectURL(file));
  MJ.loading(true, 'กำลังเปิดสลิป…');
  try {
    const draft = await MJ.slip.analyze(file, (msg) => MJ.loading(true, msg));
    draft.file = file;
    MJ.loading(false);

    if (draft.slip_reference) {
      const { data: dup } = await MJ.sb.from('transactions').select('id, amount, transaction_date')
        .eq('slip_reference', draft.slip_reference).maybeSingle();
      if (dup) {
        const msg = `สลิปนี้บันทึกไปแล้วเมื่อ ${MJ.dayLabel(dup.transaction_date)} (${MJ.fmtBaht(dup.amount)}) 🐻`;
        MJ.add.pushBubble && MJ.add.pushBubble('bot', msg);
        MJ.toast('สลิปซ้ำ ไม่บันทึกซ้ำให้นะ', 'err');
        return;
      }
    }

    const when = draft.dateFromSlip
      ? `${MJ.dayLabel(draft.transaction_date)} ${MJ.timeLabel(draft.transaction_date)} (จากสลิป)`
      : 'อ่านวันที่ไม่ได้ ใช้วันนี้ไปก่อน';
    const summary = draft.amount
      ? `อ่านสลิปได้แล้ว!\n${draft.hasQR ? '✅ มี QR — กันบันทึกซ้ำให้' : '⚠️ ไม่พบ QR บนสลิป'}\n`
        + `${draft.type === 'income' ? 'รายรับ' : 'รายจ่าย'} ${MJ.fmtBaht(draft.amount)}`
        + `${draft.payee_name ? ' • ' + draft.payee_name : ''}\n📅 ${when}`
      : `อ่านยอดเงินไม่ชัด ใส่เองได้เลยนะ 🐻\n📅 ${when}`;
    MJ.add.pushBubble && MJ.add.pushBubble('bot', summary);

    MJ.add.openDraftSheet(draft, { slip: true });
  } catch (err) {
    MJ.loading(false);
    MJ.add.pushBubble && MJ.add.pushBubble('bot', 'อ่านสลิปไม่สำเร็จ: ' + (err.message || err));
    MJ.toast('อ่านสลิปไม่สำเร็จ', 'err');
  }
};

/* ============================ แท็บกรอกเอง ============================ */
function renderForm(body) {
  const f = MJ.add.form;
  if (!f.date) f.date = new Date();
  if (!f.category_id) {
    const first = MJ.state.categories.find((c) => c.type === f.type);
    f.category_id = first?.id || null;
  }
  const cats = MJ.state.categories.filter((c) => c.type === f.type);

  body.innerHTML = `
    <div class="seg" id="typeSeg">
      <button class="seg-btn ${f.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
      <button class="seg-btn ${f.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
    </div>
    <div class="card">
      <div class="amount-display"><b id="amtView">${f.amount || '0'}</b><span>บาท</span></div>
      <div class="keypad" id="keypad">
        ${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map((k) => `<button data-k="${k}">${k}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>หมวดหมู่</h3><button class="link" data-go="budget">จัดการ ›</button></div>
      <div class="cat-grid" id="catGrid">
        ${cats.map((c) => `<button class="cat-pick ${c.id === f.category_id ? 'active' : ''}" data-cat="${c.id}">
          <span class="ic" style="background:${MJ.hex2rgba(c.color, .18)}">${c.icon}</span>${MJ.esc(c.name)}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <label class="field"><span>กระเป๋าเงิน</span><select id="fAcc">
        ${(MJ.state.accounts || []).map((a) => `<option value="${a.id}" ${a.id === (f.account_id || MJ.data.defaultAccount()?.id) ? 'selected' : ''}>${a.icon} ${MJ.esc(a.name)}</option>`).join('')}
      </select></label>
      <label class="field"><span>บันทึกช่วยจำ</span>
        <input type="text" id="fNote" value="${MJ.esc(f.note)}" placeholder="เช่น กาแฟร้านประจำ"></label>
      <label class="field"><span>วันและเวลา</span>
        <input type="datetime-local" id="fDate" value="${MJ.isoLocal(f.date)}"></label>
    </div>
    <button class="btn btn-primary btn-block" id="fSave">บันทึกรายการ</button>
    <div style="height:14px"></div>`;

  MJ.segInit(MJ.$('#typeSeg', body), (b) => {
    f.type = b.dataset.type; f.category_id = null; renderForm(body);
  });
  body.querySelectorAll('#keypad button').forEach((b) => b.onclick = () => {
    const k = b.dataset.k;
    MJ.buzz(8);
    if (k === '⌫') f.amount = f.amount.slice(0, -1);
    else if (k === '.') { if (!f.amount.includes('.')) f.amount = (f.amount || '0') + '.'; }
    else if (/\.\d\d$/.test(f.amount)) return;
    else f.amount = (f.amount === '0' ? '' : f.amount) + k;
    MJ.$('#amtView', body).textContent = f.amount || '0';
  });
  body.querySelectorAll('#catGrid .cat-pick').forEach((b) => b.onclick = () => {
    f.category_id = b.dataset.cat;
    body.querySelectorAll('#catGrid .cat-pick').forEach((x) => x.classList.toggle('active', x === b));
  });
  body.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => MJ.go(b.dataset.go));

  MJ.$('#fSave', body).onclick = async () => {
    const amount = parseFloat(f.amount);
    if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
    MJ.loading(true, 'กำลังบันทึก…');
    try {
      await MJ.data.addTransaction({
        amount, type: f.type, category_id: f.category_id,
        account_id: MJ.$('#fAcc', body)?.value || null,
        note: MJ.$('#fNote', body).value.trim() || null,
        transaction_date: new Date(MJ.$('#fDate', body).value),
        source: 'manual',
      });
      await MJ.data.loadBalances();
      MJ.add.form = { amount: '', type: f.type, category_id: f.category_id, date: new Date(), note: '' };
      MJ.buzz(30);
      MJ.toast('บันทึกแล้ว 🐻', 'ok');
      MJ.go('dashboard');
    } catch (err) {
      MJ.toast('บันทึกไม่สำเร็จ: ' + (err.message || err), 'err');
    } finally { MJ.loading(false); }
  };
}

/* ============================ Sheet ยืนยันร่างรายการ ============================ */
MJ.add.openDraftSheet = function (draft, opts) {
  opts = opts || {};
  const cats = MJ.state.categories;
  const catOptions = (type) => cats.filter((c) => c.type === type)
    .map((c) => `<option value="${c.id}" ${c.id === draft.category_id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('');

  MJ.sheet.open(opts.slip ? 'ตรวจสอบสลิป' : 'ยืนยันรายการ', `
    ${draft.file ? '<img class="slip-preview" id="slipImg" alt="สลิป">' : ''}
    ${opts.slip ? `<p class="tiny muted mb">${draft.hasQR ? '✅ อ่าน QR สำเร็จ — กันบันทึกซ้ำให้แล้ว' : '⚠️ ไม่พบ QR บนสลิป ตรวจตัวเลขอีกครั้งนะ'}</p>` : ''}
    <div class="seg" id="dType">
      <button class="seg-btn ${draft.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
      <button class="seg-btn ${draft.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
    </div>
    <label class="field"><span>จำนวนเงิน (บาท)</span>
      <input type="number" inputmode="decimal" step="0.01" id="dAmount" value="${draft.amount ?? ''}" placeholder="0.00"></label>
    <label class="field"><span>หมวดหมู่</span>
      <select id="dCat">${catOptions(draft.type)}</select></label>
    <label class="field"><span>บันทึกช่วยจำ</span>
      <input type="text" id="dNote" value="${MJ.esc(draft.note || '')}"></label>
    ${draft.payee_name ? `<label class="field"><span>ผู้รับเงิน / ร้านค้า</span>
      <input type="text" id="dPayee" value="${MJ.esc(draft.payee_name)}"></label>` : ''}
    <label class="field"><span>กระเป๋าเงิน</span><select id="dAcc">
      ${(MJ.state.accounts || []).map((a) => `<option value="${a.id}" ${a.id === MJ.data.defaultAccount()?.id ? 'selected' : ''}>${a.icon} ${MJ.esc(a.name)}</option>`).join('')}
    </select></label>
    <label class="field"><span>วันและเวลา${opts.slip ? (draft.dateFromSlip ? ' <span class="badge in">อ่านจากสลิป</span>' : ' <span class="badge out">อ่านไม่ได้ ใช้วันนี้</span>') : ''}</span>
      <input type="datetime-local" id="dDate" value="${MJ.isoLocal(new Date(draft.transaction_date))}"></label>
    ${draft.ocrText ? `<details class="mb"><summary class="tiny muted">ดูข้อความที่อ่านได้จากสลิป</summary>
      <pre class="tiny muted" style="white-space:pre-wrap;max-height:150px;overflow:auto">${MJ.esc(draft.ocrText.slice(0, 1200))}</pre></details>` : ''}
    <button class="btn btn-primary btn-block" id="dSave">บันทึกเลย</button>
    <button class="btn btn-ghost btn-block" id="dCancel">ยกเลิก</button>
  `, (bodyEl) => {
    if (draft.file) MJ.$('#slipImg', bodyEl).src = URL.createObjectURL(draft.file);

    MJ.segInit(MJ.$('#dType', bodyEl), (b) => {
      draft.type = b.dataset.type;
      bodyEl.querySelectorAll('#dType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
      draft.category_id = null;
      MJ.$('#dCat', bodyEl).innerHTML = cats.filter((c) => c.type === draft.type)
        .map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('');
    });

    MJ.$('#dCancel', bodyEl).onclick = () => MJ.sheet.close();
    MJ.$('#dSave', bodyEl).onclick = async () => {
      const amount = parseFloat(MJ.$('#dAmount', bodyEl).value);
      if (!amount || amount <= 0) { MJ.toast('ใส่จำนวนเงินก่อนนะ', 'err'); return; }
      MJ.loading(true, 'กำลังบันทึก…');
      try {
        let receiptPath = null;
        if (draft.file) {
          try { receiptPath = await MJ.data.uploadReceipt(draft.file); }
          catch (e) { MJ.toast('อัปโหลดรูปสลิปไม่สำเร็จ แต่บันทึกรายการให้แล้ว', 'err'); }
        }
        await MJ.data.addTransaction({
          amount,
          type: draft.type,
          category_id: MJ.$('#dCat', bodyEl).value || null,
          account_id: MJ.$('#dAcc', bodyEl)?.value || null,
          note: MJ.$('#dNote', bodyEl).value.trim() || null,
          payee_name: MJ.$('#dPayee', bodyEl)?.value.trim() || draft.payee_name || null,
          transaction_date: new Date(MJ.$('#dDate', bodyEl).value),
          slip_reference: draft.slip_reference || null,
          receipt_image_url: receiptPath,
          source: draft.source || 'text',
          raw_input: draft.raw_input || null,
        });
        MJ.buzz(30);
        MJ.sheet.close();
        MJ.toast('บันทึกแล้ว 🐻', 'ok');
        MJ.add.persist(MJ.add.chat[MJ.add.chat.push({ who: 'bot', text: 'บันทึกให้แล้วนะ! 🍯 จดต่อได้เลย', at: Date.now() }) - 1]);
        MJ.render();
      } catch (err) {
        MJ.toast(err.duplicate ? 'สลิปนี้ถูกบันทึกไปแล้ว' : ('บันทึกไม่สำเร็จ: ' + (err.message || err)), 'err');
      } finally { MJ.loading(false); }
    };
  });
};

</script>
<script>
/* ===== 62-transactions.js ===== */
/* ===================================================================
   62-transactions.js — รายการย้อนหลัง ค้นหา แก้ไข ลบ และส่งออก Excel
   =================================================================== */
MJ.tx = {
  filter: { type: 'all', q: '', category: 'all', account: 'all', scope: 'month', from: '', to: '' },
  limit: 50,              // แสดงทีละ 50 รายการ กดโหลดเพิ่มได้
  selectMode: false,
  selected: new Set(),
  searchResults: null,    // ผลค้นหาข้ามเดือน

  /** แถวรายการ — 2 บรรทัดเสมอ
   *  บรรทัดบน: ชื่อรายการ
   *  บรรทัดล่าง: เวลา + ป้ายหมวดหมู่ + ไอคอนสลิป (เฉพาะที่มีไฟล์แนบ)  */
  row(t) {
    const c = MJ.data.catById(t.category_id);
    const color = c?.color || '#9AA0A6';
    const marks = [
      t.receipt_image_url ? '<i class="fa fa-receipt" title="มีรูปสลิปแนบ"></i>' : '',
      t.source === 'voice' ? '<i class="fa fa-mic" title="จดด้วยเสียง"></i>' : '',
      t.source === 'recurring' ? '<i class="fa fa-repeat" title="รายการประจำ"></i>' : '',
    ].filter(Boolean).join('');
    return `<div class="tx" data-tx="${t.id}">
      <span class="tx-ico" style="background:${MJ.hex2rgba(color, .18)}">${c?.icon || '❓'}</span>
      <span class="tx-main">
        <span class="tx-title">${MJ.esc(MJ.fixThai(t.note || c?.name || 'รายการ'))}</span>
        <span class="tx-sub">
          <span class="tx-time">${MJ.timeLabel(t.transaction_date)}</span>
          <span class="tx-badge" style="background:${MJ.hex2rgba(color, .16)};color:${color}">${MJ.esc(c?.name || 'ไม่ระบุหมวด')}</span>
          ${marks ? `<span class="tx-marks">${marks}</span>` : ''}
        </span>
      </span>
      <span class="tx-amt ${t.type === 'income' ? 'in' : 'out'}">${t.type === 'income' ? '+' : '−'}${MJ.fmtMoney(t.amount)}</span>
    </div>`;
  },

  bindRows(root) {
    root.querySelectorAll('[data-tx]').forEach((el) => {
      el.onclick = () => {
        const t = MJ.state.transactions.find((x) => x.id === el.dataset.tx);
        if (t) MJ.tx.openDetail(t);
      };
    });
  },

  /** จัดกลุ่มตามวัน */
  groupByDay(list) {
    const groups = new Map();
    list.forEach((t) => {
      const key = MJ.isoDate(new Date(t.transaction_date));
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });
    return Array.from(groups.entries());
  },

  filtered() {
    const f = MJ.tx.filter;
    const q = f.q.trim().toLowerCase();
    return MJ.state.transactions.filter((t) => {
      if (f.type !== 'all' && t.type !== f.type) return false;
      if (f.category !== 'all' && t.category_id !== f.category) return false;
      if (q) {
        const c = MJ.data.catById(t.category_id);
        const hay = MJ.fixThai(`${t.note || ''} ${t.payee_name || ''} ${c?.name || ''} ${t.amount}`).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  },

  /* ---------------------- Sheet รายละเอียด/แก้ไข ---------------------- */
  openDetail(t) {
    const c = MJ.data.catById(t.category_id);
    MJ.sheet.open('รายละเอียด', `
      <div class="center mb">
        <div class="tx-ico" style="margin:0 auto 8px;width:56px;height:56px;font-size:26px;border-radius:20px;background:${MJ.hex2rgba(c?.color || '#9AA0A6', .18)}">${c?.icon || '❓'}</div>
        <div class="tx-amt ${t.type === 'income' ? 'in' : 'out'}" style="font-size:30px">
          ${t.type === 'income' ? '+' : '−'}${MJ.fmtBaht(t.amount)}</div>
        <div class="muted tiny">${MJ.dayLabel(t.transaction_date)} ${MJ.timeLabel(t.transaction_date)}</div>
      </div>
      <div id="receiptBox"></div>
      <div class="card">
        <div class="list-item"><span class="ic"><i class="fa fa-tag"></i></span><span class="tx2"><b>${MJ.esc(c?.name || 'ไม่ระบุหมวด')}</b><small>หมวดหมู่</small></span></div>
        ${(() => { const a = MJ.data.accountById(t.account_id); return a ? `<div class="list-item"><span class="ic">${a.icon}</span>
          <span class="tx2"><b>${MJ.esc(a.name)}</b><small>กระเป๋าเงิน</small></span></div>` : ''; })()}
        <div class="list-item"><span class="ic"><i class="fa fa-pen"></i></span><span class="tx2"><b>${MJ.esc(MJ.fixThai(t.note || '-'))}</b><small>บันทึกช่วยจำ</small></span></div>
        ${t.payee_name ? `<div class="list-item"><span class="ic"><i class="fa fa-store"></i></span><span class="tx2"><b>${MJ.esc(MJ.fixThai(t.payee_name))}</b><small>ผู้รับเงิน</small></span></div>` : ''}
        ${t.slip_reference ? `<div class="list-item"><span class="ic"><i class="fa fa-tag"></i></span><span class="tx2"><b style="word-break:break-all;font-size:12px">${MJ.esc(t.slip_reference.slice(0, 60))}</b><small>รหัสอ้างอิงสลิป</small></span></div>` : ''}
        <div class="list-item"><span class="ic"><i class="fa fa-download"></i></span><span class="tx2"><b>${({ manual:'กรอกเอง', text:'พิมพ์จด', voice:'พูดจด', slip:'สลิป', recurring:'รายการประจำ', import:'นำเข้า' })[t.source] || t.source}</b><small>ที่มา</small></span></div>
      </div>
      <button class="btn btn-soft btn-block" id="txEdit">แก้ไขรายการ</button>
      <button class="btn btn-danger btn-block mt" id="txDel">ลบรายการนี้</button>
    `, async (body) => {
      MJ.$('#txEdit', body).onclick = () => MJ.tx.openEdit(t);
      MJ.$('#txDel', body).onclick = async () => {
        if (!(await MJ.confirm('ลบรายการ', 'ลบรายการนี้ใช่ไหม? (กดเลิกทำได้ทันทีหลังลบ)', 'ลบเลย'))) return;
        MJ.loading(true, 'กำลังลบ…');
        try {
          const snap = await MJ.data.deleteTransaction(t.id, { keepFile: true });
          MJ.sheet.close();
          MJ.render();
          MJ.toastUndo('ลบแล้ว', async () => {
            await MJ.data.restoreTransaction(snap);
            MJ.toast('คืนรายการให้แล้ว 🐻', 'ok');
            MJ.render();
          });
          // ครบเวลาเลิกทำแล้วค่อยลบไฟล์สลิปจริง
          if (snap?.receipt_image_url) {
            setTimeout(async () => {
              const still = MJ.state.transactions.some((x) => x.receipt_image_url === snap.receipt_image_url);
              if (!still) MJ.sb.storage.from('receipts').remove([snap.receipt_image_url]).catch(() => {});
            }, 8000);
          }
        } catch (e) { MJ.toast('ลบไม่สำเร็จ', 'err'); }
        finally { MJ.loading(false); }
      };
      if (t.receipt_image_url) {
        const url = await MJ.data.receiptUrl(t.receipt_image_url);
        if (url) MJ.$('#receiptBox', body).innerHTML = `<img class="slip-preview" src="${url}" alt="สลิป">`;
      }
    });
  },

  openEdit(t) {
    const cats = MJ.state.categories;
    MJ.sheet.open('แก้ไขรายการ', `
      <div class="seg" id="eType">
        <button class="seg-btn ${t.type === 'expense' ? 'active' : ''}" data-type="expense"><i class="fa fa-arrow-up"></i> รายจ่าย</button>
        <button class="seg-btn ${t.type === 'income' ? 'active' : ''}" data-type="income"><i class="fa fa-arrow-down"></i> รายรับ</button>
      </div>
      <label class="field"><span>จำนวนเงิน</span>
        <input type="number" step="0.01" inputmode="decimal" id="eAmount" value="${t.amount}"></label>
      <label class="field"><span>หมวดหมู่</span><select id="eCat">
        ${cats.filter((c) => c.type === t.type).map((c) => `<option value="${c.id}" ${c.id === t.category_id ? 'selected' : ''}>${c.icon} ${MJ.esc(c.name)}</option>`).join('')}
      </select></label>
      <label class="field"><span>บันทึกช่วยจำ</span><input type="text" id="eNote" value="${MJ.esc(t.note || '')}"></label>
      <label class="field"><span>วันและเวลา</span><input type="datetime-local" id="eDate" value="${MJ.isoLocal(new Date(t.transaction_date))}"></label>
      <button class="btn btn-primary btn-block" id="eSave">บันทึกการแก้ไข</button>
    `, (body) => {
      let type = t.type;
      MJ.segInit(MJ.$('#eType', body), (b) => {
        type = b.dataset.type;
        body.querySelectorAll('#eType .seg-btn').forEach((x) => x.classList.toggle('active', x === b));
        MJ.$('#eCat', body).innerHTML = cats.filter((c) => c.type === type)
          .map((c) => `<option value="${c.id}">${c.icon} ${MJ.esc(c.name)}</option>`).join('');
      });
      MJ.$('#eSave', body).onclick = async () => {
        MJ.loading(true, 'กำลังบันทึก…');
        try {
          await MJ.data.updateTransaction(t.id, {
            amount: parseFloat(MJ.$('#eAmount', body).value),
            type,
            category_id: MJ.$('#eCat', body).value || null,
            note: MJ.$('#eNote', body).value.trim() || null,
            transaction_date: new Date(MJ.$('#eDate', body).value).toISOString(),
          });
          MJ.sheet.close(); MJ.toast('แก้ไขแล้ว', 'ok'); MJ.render();
        } catch (e) { MJ.toast('บันทึกไม่สำเร็จ', 'err'); }
        finally { MJ.loading(false); }
      };
    });
  },

  /* ---------------------- ส่งออก Excel ---------------------- */
  exportExcel(list, filename) {
    const rows = list.map((t) => {
      const c = MJ.data.catById(t.category_id);
      const d = new Date(t.transaction_date);
      return {
        'วันที่': MJ.isoDate(d),
        'เวลา': MJ.timeLabel(d).replace(' น.', ''),
        'ประเภท': t.type === 'income' ? 'รายรับ' : 'รายจ่าย',
        'หมวดหมู่': c?.name || 'ไม่ระบุ',
        'กระเป๋าเงิน': MJ.data.accountById(t.account_id)?.name || '',
        'รายละเอียด': MJ.fixThai(t.note || ''),
        'ผู้รับเงิน/ร้านค้า': MJ.fixThai(t.payee_name || ''),
        'จำนวนเงิน': Number(t.amount),
        'ที่มา': ({ manual:'กรอกเอง', text:'พิมพ์', voice:'เสียง', slip:'สลิป', recurring:'รายการประจำ' })[t.source] || t.source,
        'รหัสอ้างอิงสลิป': t.slip_reference || '',
      };
    });
    const s = MJ.data.summary(list);
    rows.push({}, {
      'วันที่': 'สรุป', 'ประเภท': 'รายรับรวม', 'จำนวนเงิน': s.income,
    }, { 'ประเภท': 'รายจ่ายรวม', 'จำนวนเงิน': s.expense },
       { 'ประเภท': 'คงเหลือ', 'จำนวนเงิน': s.balance });

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 9 }, { wch: 18 }, { wch: 30 }, { wch: 24 }, { wch: 13 }, { wch: 12 }, { wch: 26 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'รายการ');
    XLSX.writeFile(wb, filename || `หมีจด-${MJ.isoDate(MJ.state.month).slice(0, 7)}.xlsx`);
